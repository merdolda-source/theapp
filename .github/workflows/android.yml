name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek (Checkout)
      uses: actions/checkout@v3

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle İzinlerini Ayarla
      run: chmod +x gradlew || true

    # Eğer projede Gradle Wrapper yoksa bu adım onu indirir ve kurar
    - name: Gradle ile APK Derle (Release)
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.0 # Gradle sürümü
        arguments: assembleRelease

    - name: APK'yı Yükle (Artifact)
      uses: actions/upload-artifact@v3
      with:
        name: erdin-player-release
        path: app/build/outputs/apk/release/app-release.apk
