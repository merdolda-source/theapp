name: Build ErdinXtream APK

on:
  # Kod 'main' veya 'master' dalına gönderildiğinde çalışır
  push:
    branches: [ "main", "master" ]
  # GitHub arayüzünden manuel olarak 'Run Workflow' diyebilmek için
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    # 1. Adım: Kodları GitHub deposundan sanal makineye çeker
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Adım: Java 17 Kurulumu (AGP 8.0 ve üstü için ZORUNLUDUR)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Adım: Gradle Wrapper'a çalışma izni ver (Linux ortamı için kritik)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Adım: Projeyi Derle (Debug APK)
    # --stacktrace: Hata olursa detay gösterir
    # --no-daemon: GitHub sunucusunda RAM şişmesini engeller
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    # 5. Adım: Oluşan APK'yı bul ve indirilebilir yap
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: ErdinXtream-Debug-APK
        # Gradle standart çıktı yolu burasıdır:
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7 # Dosya 7 gün boyunca indirilebilir kalır
