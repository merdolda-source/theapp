name: Build ErdinXtream APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    # 1. Kodları Çek (v4 Sürümü)
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Java 17 Kurulumu (v4 Sürümü)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Gradle İzinlerini Ver
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Derleme (Build)
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    # 5. APK Yükleme (v4 Sürümü - Hata Veren Kısım Düzeltildi)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ErdinXtream-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
