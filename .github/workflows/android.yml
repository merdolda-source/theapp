name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Proje ERDINXPLAYER alt klasöründe ise hashFiles'i oraya yönlendiriyoruz
          key: ${{ runner.os }}-gradle-${{ hashFiles('ERDINXPLAYER/**/build.gradle*', 'ERDINXPLAYER/**/settings.gradle*', 'ERDINXPLAYER/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle (uses wrapper if present, otherwise downloads Gradle)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
          gradle-version: '8.1.1'
        # Önemli: çalışma dizinini proje klasörüne ayarlıyoruz
        working-directory: ERDINXPLAYER

      - name: Upload artifact (APK)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ERDINXPLAYER-debug-apk
          path: ERDINXPLAYER/app/build/outputs/apk/debug/*.apk
