name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek (Checkout)
      uses: actions/checkout@v4  # v3 -> v4 yaptık (Güncel)

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4 # v3 -> v4 yaptık (Güncel)
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Gradle İzinlerini Ayarla
      run: chmod +x gradlew || true

    - name: Gradle Kur ve Derle
      uses: gradle/gradle-build-action@v3 # v2 -> v3 yaptık (Güncel)
      with:
        gradle-version: 8.0 # Wrapper dosyası yoksa bu sürümü indirir
        arguments: assembleRelease

    - name: APK'yı Yükle (Artifact)
      uses: actions/upload-artifact@v4 # HATA VEREN KISIM BURASIYDI (v3 -> v4 yaptık)
      with:
        name: erdin-player-release
        path: app/build/outputs/apk/release/app-release.apk
