name: ErdinPlayer Pro Ultra Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Depo Çekme
      uses: actions/checkout@v4
    
    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. ErdinPlayer Pro Proje Üretimi (Xtream + Kategorili + Drawer + BottomNav + Renkler)
      run: |
        set -e
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        PASS="erdin123"
        
        echo "🚀 ErdinPlayer Pro Projesi Üretiliyor..."

        # Klasör Yapısı
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/models
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/adapters
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/utils
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        mkdir -p $APP_NAME/app/src/main/res/menu
        
        cd $APP_NAME

        # İKON ve KEYSTORE
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass $PASS -keypass $PASS -dname "CN=Erdin, O=ErdinMedia, C=TR"

        # --- GRADLE ROOT ---
        echo "include ':app'" > settings.gradle
        echo -e "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m" > gradle.properties

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # --- APP MODULE GRADLE ---
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33

            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.1.0"
            }

            signingConfigs {
                release {
                    storeFile file("keystore.jks")
                    storePassword "$PASS"
                    keyAlias "key0"
                    keyPassword "$PASS"
                }
            }

            buildTypes {
                release {
                    // Proguard kapalı: sürpriz siyah ekran yok
                    minifyEnabled false
                    signingConfig signingConfigs.release
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.0'

            // DrawerLayout
            implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

            // Media3 ExoPlayer
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'

            // Glide (istersen icon için kullanırsın)
            implementation 'com.github.bumptech.glide:glide:4.15.1'
        }
        EOF

        # --- COLORS / STYLES / STRINGS ---
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <!-- PALLET: koyu yeşil, en koyu gri, bordo, beyaz -->
            <color name="bg_dark">#050608</color>
            <color name="accent_green">#007A3D</color>
            <color name="bordo">#801336</color>
            <color name="white">#FFFFFF</color>
            <color name="black">#000000</color>
            <color name="gray_800">#1C1C1E</color>
            <color name="error_red">#FF5252</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.DayNight.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="android:textColor">@color/white</item>
                <item name="colorAccent">@color/accent_green</item>
            </style>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">ErdinPlayer Pro</string>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_input.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/white"/>
            <corners android:radius="10dp"/>
            <stroke android:width="2dp" android:color="@color/accent_green"/>
        </shape>
        EOF

        # --- BOTTOM NAV MENU ---
        cat <<EOF > app/src/main/res/menu/bottom_nav_menu.xml
        <menu xmlns:android="http://schemas.android.com/apk/res/android">
            <item
                android:id="@+id/nav_live"
                android:icon="@android:drawable/ic_media_play"
                android:title="Canlı TV" />
            <item
                android:id="@+id/nav_vod"
                android:icon="@android:drawable/ic_menu_slideshow"
                android:title="Filmler" />
            <item
                android:id="@+id/nav_series"
                android:icon="@android:drawable/ic_menu_agenda"
                android:title="Diziler" />
        </menu>
        EOF

        # --- NAV HEADER (Xtream bitiş süresi için) ---
        cat <<EOF > app/src/main/res/layout/nav_header.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="16dp"
            android:background="@color/gray_800">

            <TextView
                android:id="@+id/tvHeaderUser"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Kullanıcı: -"
                android:textColor="@color/white"
                android:textStyle="bold"
                android:textSize="16sp" />

            <TextView
                android:id="@+id/tvHeaderExpire"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Bitiş: -"
                android:textColor="@color/accent_green"
                android:textSize="14sp"
                android:layout_marginTop="4dp" />
        </LinearLayout>
        EOF

        # --- MODELLER (Kategori + Stream + Episode) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/models/Models.kt
        package $PACKAGE_NAME.models

        data class Category(
            val category_id: String,
            val category_name: String
        )

        data class StreamItem(
            val name: String,
            val stream_id: String?,
            val series_id: String?,
            val container_extension: String?,
            val category_id: String?
        )

        data class EpisodeItem(
            val id: String,
            val title: String,
            val seasonNumber: Int,
            val episodeNumber: Int,
            val container_extension: String?
        )
        EOF

        # --- UTILS (Prefs) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context

        class Prefs(ctx: Context) {
            private val p = ctx.getSharedPreferences("EP_Prefs", 0)

            fun save(dns: String, u: String, ps: String) {
                p.edit()
                    .putString("dns", dns)
                    .putString("u", u)
                    .putString("p", ps)
                    .apply()
            }

            fun getDns(): String = p.getString("dns", "") ?: ""
            fun getUser(): String = p.getString("u", "") ?: ""
            fun getPass(): String = p.getString("p", "") ?: ""
        }
        EOF

        # --- ADAPTER (TEK SÜTUN, ALT ALTA) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/GridAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.StreamItem

        class GridAdapter(
            private val list: List<StreamItem>,
            private val onClick: (StreamItem) -> Unit
        ) : RecyclerView.Adapter<GridAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtName)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_grid_pro, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val item = list[position]
                holder.txt.text = item.name
                holder.itemView.setOnClickListener { onClick(item) }
            }

            override fun getItemCount(): Int = list.size
        }
        EOF

        # --- LOGIN ACTIVITY ---
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.utils.Prefs

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)

                val prefs = Prefs(this)
                val eD = findViewById<EditText>(R.id.etDns)
                val eU = findViewById<EditText>(R.id.etUser)
                val eP = findViewById<EditText>(R.id.etPass)

                eD.setText(prefs.getDns())
                eU.setText(prefs.getUser())
                eP.setText(prefs.getPass())

                findViewById<Button>(R.id.btnLogin).setOnClickListener {
                    val d = eD.text.toString().trim()
                    val u = eU.text.toString().trim()
                    val p = eP.text.toString().trim()

                    if (d.isNotEmpty() && u.isNotEmpty()) {
                        prefs.save(d, u, p)
                        startActivity(Intent(this, ContentActivity::class.java))
                    } else {
                        Toast.makeText(this, "Bilgileri eksiksiz girin!", Toast.LENGTH_SHORT).show()
                    }
                }
            }
        }
        EOF

        # --- DASHBOARD ACTIVITY (dursun) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.utils.Prefs

        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)

                val prefs = Prefs(this)
                val tvInfo = findViewById<TextView>(R.id.tvInfo)
                tvInfo.text = "AKTİF KULLANICI: " + prefs.getUser()

                fun go(mode: String) {
                    val i = Intent(this, ContentActivity::class.java)
                    i.putExtra("MODE", mode)
                    startActivity(i)
                }

                findViewById<Button>(R.id.btnLive).setOnClickListener { go("LIVE") }
                findViewById<Button>(R.id.btnVod).setOnClickListener { go("VOD") }
                findViewById<Button>(R.id.btnSeries).setOnClickListener { go("SERIES") }
                findViewById<Button>(R.id.btnExit).setOnClickListener { finish() }
            }
        }
        EOF

        # --- CONTENT ACTIVITY (BOTTOM NAV + KATEGORİLER + DRAWER + HESAP BİTİŞ SÜRESİ) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/ContentActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.Menu
        import android.view.View
        import android.widget.ProgressBar
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.view.GravityCompat
        import androidx.drawerlayout.widget.DrawerLayout
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import com.google.android.material.bottomnavigation.BottomNavigationView
        import com.google.android.material.navigation.NavigationView
        import org.json.JSONArray
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.text.SimpleDateFormat
        import java.util.ArrayList
        import java.util.Date
        import java.util.Locale
        import $PACKAGE_NAME.adapters.GridAdapter
        import $PACKAGE_NAME.models.Category
        import $PACKAGE_NAME.models.StreamItem
        import $PACKAGE_NAME.utils.Prefs

        class ContentActivity : AppCompatActivity() {

            private lateinit var prefs: Prefs
            private lateinit var drawer: DrawerLayout
            private lateinit var navView: NavigationView
            private lateinit var bottomNav: BottomNavigationView
            private lateinit var rv: RecyclerView
            private lateinit var tvHeader: TextView
            private lateinit var tvStatus: TextView
            private lateinit var pb: ProgressBar

            private lateinit var headerUser: TextView
            private lateinit var headerExpire: TextView

            private var currentMode: String = "LIVE"
            private var categories: List<Category> = emptyList()
            private var streams: List<StreamItem> = emptyList()

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_content)

                prefs = Prefs(this)

                drawer = findViewById(R.id.drawerLayout)
                navView = findViewById(R.id.navView)
                bottomNav = findViewById(R.id.bottomNav)
                rv = findViewById(R.id.rvContent)
                tvHeader = findViewById(R.id.tvHeader)
                tvStatus = findViewById(R.id.tvStatus)
                pb = findViewById(R.id.pbLoading)

                // Liste: tek sütun, ALT ALTA (mobil uyumlu)
                rv.layoutManager = LinearLayoutManager(this)

                // Drawer header (kullanıcı + bitiş tarihi)
                val headerView = navView.getHeaderView(0)
                headerUser = headerView.findViewById(R.id.tvHeaderUser)
                headerExpire = headerView.findViewById(R.id.tvHeaderExpire)

                tvHeader.setOnClickListener {
                    drawer.openDrawer(GravityCompat.START)
                }

                navView.setNavigationItemSelectedListener { item ->
                    val idx = item.itemId
                    if (idx in categories.indices) {
                        val cat = categories[idx]
                        item.isChecked = true
                        filterAndShow(cat.category_id)
                        drawer.closeDrawer(GravityCompat.START)
                        true
                    } else {
                        false
                    }
                }

                bottomNav.setOnItemSelectedListener { item ->
                    when (item.itemId) {
                        R.id.nav_live -> { loadMode("LIVE"); true }
                        R.id.nav_vod -> { loadMode("VOD"); true }
                        R.id.nav_series -> { loadMode("SERIES"); true }
                        else -> false
                    }
                }

                // Açılışta LIVE seçili, ekran boş değil
                bottomNav.selectedItemId = R.id.nav_live
                loadMode("LIVE")
            }

            private fun loadMode(mode: String) {
                currentMode = mode
                tvHeader.text = when (mode) {
                    "VOD" -> "☰ Filmler"
                    "SERIES" -> "☰ Diziler"
                    else -> "☰ Canlı TV"
                }
                fetchCategoriesAndStreams()
            }

            private fun fetchCategoriesAndStreams() {
                val dnsRaw = prefs.getDns().trim()
                val user = prefs.getUser().trim()
                val pass = prefs.getPass().trim()

                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    tvStatus.text = "DNS / kullanıcı / şifre boş. Giriş ekranına dönün."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                val dns = if (dnsRaw.endsWith("/")) dnsRaw.substring(0, dnsRaw.length - 1) else dnsRaw
                val base = dns + "/player_api.php?username=" + user + "&password=" + pass

                val catAction = when (currentMode) {
                    "VOD" -> "get_vod_categories"
                    "SERIES" -> "get_series_categories"
                    else -> "get_live_categories"
                }

                val streamsAction = when (currentMode) {
                    "VOD" -> "get_vod_streams"
                    "SERIES" -> "get_series"
                    else -> "get_live_streams"
                }

                val catUrl = base + "&action=" + catAction
                val streamsUrl = base + "&action=" + streamsAction

                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE

                Thread {
                    try {
                        val acc = fetchAccountInfo(base)
                        val fetchedCategories = fetchCategories(catUrl)
                        val fetchedStreams = fetchStreams(streamsUrl)

                        runOnUiThread {
                            pb.visibility = View.GONE
                            categories = fetchedCategories
                            streams = fetchedStreams

                            val userName = acc.first ?: prefs.getUser()
                            val expText = formatExp(acc.second)
                            headerUser.text = "Kullanıcı: " + userName
                            headerExpire.text = "Bitiş: " + expText

                            populateDrawerCategories()
                            if (categories.isNotEmpty()) {
                                filterAndShow(categories[0].category_id)
                            } else {
                                filterAndShow(null)
                            }
                        }
                    } catch (e: Exception) {
                        e.printStackTrace()
                        runOnUiThread {
                            pb.visibility = View.GONE
                            tvStatus.text = "Veriler alınamadı: " + (e.message ?: "bilinmeyen hata")
                            tvStatus.visibility = View.VISIBLE
                        }
                    }
                }.start()
            }

            private fun fetchAccountInfo(baseUrl: String): Pair<String?, String?> {
                return try {
                    val url = URL(baseUrl)
                    val conn = url.openConnection() as HttpURLConnection
                    conn.connectTimeout = 8000
                    conn.readTimeout = 8000
                    conn.requestMethod = "GET"

                    val code = conn.responseCode
                    if (code != HttpURLConnection.HTTP_OK) {
                        Pair(null, null)
                    } else {
                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val userInfo = obj.optJSONObject("user_info")
                        if (userInfo != null) {
                            val uname = userInfo.optString("username", null)
                            val exp = userInfo.optString("exp_date", null)
                            Pair(uname, exp)
                        } else {
                            Pair(null, null)
                        }
                    }
                } catch (e: Exception) {
                    Pair(null, null)
                }
            }

            private fun formatExp(exp: String?): String {
                if (exp == null || exp == "" || exp == "0" || exp == "null") {
                    return "Sınırsız"
                }
                return try {
                    val seconds = exp.toLong()
                    val millis = seconds * 1000L
                    val date = Date(millis)
                    val sdf = SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault())
                    sdf.format(date)
                } catch (e: Exception) {
                    exp
                }
            }

            private fun fetchCategories(urlStr: String): List<Category> {
                val list = ArrayList<Category>()
                val url = URL(urlStr)
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000
                conn.readTimeout = 15000
                conn.requestMethod = "GET"

                val code = conn.responseCode
                if (code != HttpURLConnection.HTTP_OK) {
                    return list
                }

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    val id = obj.optString("category_id", "")
                    val name = obj.optString("category_name", "Kategori " + i)
                    list.add(Category(id, name))
                    i++
                }
                return list
            }

            private fun fetchStreams(urlStr: String): List<StreamItem> {
                val list = ArrayList<StreamItem>()
                val url = URL(urlStr)
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000
                conn.readTimeout = 20000
                conn.requestMethod = "GET"

                val code = conn.responseCode
                if (code != HttpURLConnection.HTTP_OK) {
                    return list
                }

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    val name = obj.optString("name", "Bilinmeyen")
                    val catId = obj.optString("category_id", "")
                    val streamId = obj.optString("stream_id", null)
                    val seriesId = obj.optString("series_id", null)
                    val ext = obj.optString("container_extension", null)
                    list.add(
                        StreamItem(
                            name = name,
                            stream_id = streamId,
                            series_id = seriesId,
                            container_extension = ext,
                            category_id = catId
                        )
                    )
                    i++
                }
                return list
            }

            private fun populateDrawerCategories() {
                val menu: Menu = navView.menu
                menu.clear()
                var index = 0
                for (cat in categories) {
                    val item = menu.add(0, index, 0, cat.category_name)
                    item.isCheckable = true
                    if (index == 0) {
                        item.isChecked = true
                    }
                    index++
                }
            }

            private fun filterAndShow(categoryId: String?) {
                val filtered = if (categoryId == null || categoryId.length == 0) {
                    streams
                } else {
                    streams.filter { it.category_id == categoryId }
                }

                val dnsRaw = prefs.getDns().trim()
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.substring(0, dnsRaw.length - 1) else dnsRaw
                val user = prefs.getUser().trim()
                val pass = prefs.getPass().trim()

                rv.adapter = GridAdapter(filtered) { item ->
                    if (currentMode == "SERIES") {
                        val itn = Intent(this, SeriesDetailActivity::class.java)
                        itn.putExtra("SERIES_ID", item.series_id ?: "")
                        itn.putExtra("SERIES_NAME", item.name)
                        startActivity(itn)
                    } else {
                        val path = if (currentMode == "LIVE") "live" else "movie"
                        val ext = if (currentMode == "LIVE") {
                            ".ts"
                        } else {
                            if (item.container_extension != null && item.container_extension.length > 0) {
                                "." + item.container_extension
                            } else {
                                ".mp4"
                            }
                        }
                        val id = item.stream_id ?: ""
                        val playUrl = dns + "/" + path + "/" + user + "/" + pass + "/" + id + ext

                        val itn = Intent(this, PlayerActivity::class.java)
                        itn.putExtra("URL", playUrl)
                        startActivity(itn)
                    }
                }
            }
        }
        EOF

        # --- SERIES DETAIL ACTIVITY (GERÇEK BÖLÜMLER, RENKLİ) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/SeriesDetailActivity.kt
        package $PACKAGE_NAME

        import android.os.Bundle
        import android.view.View
        import android.widget.AdapterView
        import android.widget.ArrayAdapter
        import android.widget.ListView
        import android.widget.ProgressBar
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.util.ArrayList
        import $PACKAGE_NAME.models.EpisodeItem
        import $PACKAGE_NAME.utils.Prefs

        class SeriesDetailActivity : AppCompatActivity() {

            private lateinit var prefs: Prefs
            private lateinit var tvTitle: TextView
            private lateinit var tvStatus: TextView
            private lateinit var pb: ProgressBar
            private lateinit var lv: ListView

            private val episodes = ArrayList<EpisodeItem>()

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_series_detail)

                prefs = Prefs(this)

                tvTitle = findViewById(R.id.tvSeriesTitle)
                tvStatus = findViewById(R.id.tvSeriesStatus)
                pb = findViewById(R.id.pbSeries)
                lv = findViewById(R.id.lvEpisodes)

                val seriesName = intent.getStringExtra("SERIES_NAME") ?: "Dizi"
                val seriesId = intent.getStringExtra("SERIES_ID") ?: ""

                tvTitle.text = seriesName

                if (seriesId.length == 0) {
                    tvStatus.text = "Geçersiz seri bilgisi."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                loadSeriesInfo(seriesId)
            }

            private fun loadSeriesInfo(seriesId: String) {
                val dnsRaw = prefs.getDns().trim()
                val user = prefs.getUser().trim()
                val pass = prefs.getPass().trim()

                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    tvStatus.text = "DNS / kullanıcı / şifre eksik."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                val dns = if (dnsRaw.endsWith("/")) dnsRaw.substring(0, dnsRaw.length - 1) else dnsRaw
                val urlStr = dns +
                        "/player_api.php?username=" + user +
                        "&password=" + pass +
                        "&action=get_series_info&series_id=" + seriesId

                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE

                Thread {
                    try {
                        val url = URL(urlStr)
                        val conn = url.openConnection() as HttpURLConnection
                        conn.connectTimeout = 10000
                        conn.readTimeout = 20000
                        conn.requestMethod = "GET"

                        val code = conn.responseCode
                        if (code != HttpURLConnection.HTTP_OK) {
                            showError("Sunucu yanıtı: " + code)
                            return@Thread
                        }

                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val episodesObj = obj.optJSONObject("episodes") ?: JSONObject()

                        episodes.clear()
                        val keys = episodesObj.keys()
                        while (keys.hasNext()) {
                            val seasonKey = keys.next()
                            val seasonNum = seasonKey.toIntOrNull() ?: 0
                            val arr = episodesObj.optJSONArray(seasonKey) ?: continue

                            var i = 0
                            while (i < arr.length()) {
                                val epObj = arr.getJSONObject(i)
                                val id = epObj.optString("id", "")
                                val title = epObj.optString("title", "Bölüm " + i)
                                val epNum = epObj.optInt("episode_num", i + 1)
                                val ext = epObj.optString("container_extension", "mp4")

                                episodes.add(
                                    EpisodeItem(
                                        id = id,
                                        title = title,
                                        seasonNumber = seasonNum,
                                        episodeNumber = epNum,
                                        container_extension = ext
                                    )
                                )
                                i++
                            }
                        }

                        runOnUiThread {
                            pb.visibility = View.GONE
                            if (episodes.isEmpty()) {
                                tvStatus.text = "Bu seri için bölüm bulunamadı."
                                tvStatus.visibility = View.VISIBLE
                            } else {
                                tvStatus.visibility = View.GONE
                                val labels = ArrayList<String>()
                                for (ep in episodes) {
                                    labels.add(
                                        "S" + ep.seasonNumber +
                                                "E" + ep.episodeNumber +
                                                " - " + ep.title
                                    )
                                }
                                val adapter = ArrayAdapter(
                                    this,
                                    android.R.layout.simple_list_item_1,
                                    labels
                                )
                                lv.adapter = adapter

                                lv.onItemClickListener =
                                    AdapterView.OnItemClickListener { _, _, position, _ ->
                                        playEpisode(episodes[position])
                                    }
                            }
                        }
                    } catch (e: Exception) {
                        e.printStackTrace()
                        showError("Seri bilgisi alınamadı: " + (e.message ?: "bilinmeyen hata"))
                    }
                }.start()
            }

            private fun playEpisode(ep: EpisodeItem) {
                val dnsRaw = prefs.getDns().trim()
                val user = prefs.getUser().trim()
                val pass = prefs.getPass().trim()

                val dns = if (dnsRaw.endsWith("/")) dnsRaw.substring(0, dnsRaw.length - 1) else dnsRaw
                val ext = if (ep.container_extension != null && ep.container_extension.length > 0)
                    ep.container_extension
                else
                    "mp4"

                val url = dns + "/series/" + user + "/" + pass + "/" + ep.id + "." + ext

                val itn = android.content.Intent(this, PlayerActivity::class.java)
                itn.putExtra("URL", url)
                startActivity(itn)
            }

            private fun showError(msg: String) {
                runOnUiThread {
                    pb.visibility = View.GONE
                    tvStatus.text = msg
                    tvStatus.visibility = View.VISIBLE
                }
            }
        }
        EOF

        # --- PLAYER ACTIVITY ---
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME

        import android.os.Bundle
        import android.view.WindowManager
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView

        class PlayerActivity : AppCompatActivity() {

            private var player: ExoPlayer? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                window.setFlags(
                    WindowManager.LayoutParams.FLAG_FULLSCREEN,
                    WindowManager.LayoutParams.FLAG_FULLSCREEN
                )

                setContentView(R.layout.activity_player_pro)

                val url = intent.getStringExtra("URL") ?: ""
                val pv = findViewById<PlayerView>(R.id.pvMain)

                player = ExoPlayer.Builder(this).build().also { exo ->
                    pv.player = exo
                    val item = MediaItem.fromUri(url)
                    exo.setMediaItem(item)
                    exo.prepare()
                    exo.play()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                player?.release()
                player = null
            }
        }
        EOF

