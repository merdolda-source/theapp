            private fun setupDrawerAccounts() {
                fun refreshAccountsList() {
                    val list = prefs.getAccounts().toMutableList()
                    if (accountsAdapter == null) {
                        accountsAdapter = AccountsAdapter(
                            this,
                            list,
                            onOpen = { acc ->
                                prefs.setActive(acc.id)
                                activeAcc = acc
                                accountType = acc.type
                                etSearch.setText("")
                                drawer.closeDrawer(GravityCompat.START)
                                // mode düzelt
                                val m = if (accountType == "M3U") "LIVE" else currentMode
                                bottomNav.selectedItemId = when (m) {
                                    "VOD" -> R.id.nav_vod
                                    "SERIES" -> R.id.nav_series
                                    else -> R.id.nav_live
                                }
                                switchMode(m)
                            },
                            onDelete = { acc ->
                                val dialog = AlertDialog.Builder(this)
                                    .setTitle("Hesabı Sil")
                                    .setMessage("Hesap silinsin mi? " + acc.name)
                                    .setPositiveButton("Evet") { _, _ ->
                                        prefs.deleteAccount(acc.id)
                                        refreshAccountsList()
                                        val newActive = prefs.getActive()
                                        activeAcc = newActive
                                        accountType = newActive?.type ?: "XTREAM"
                                        switchMode(if (accountType == "M3U") "LIVE" else currentMode)
                                    }
                                    .setNegativeButton("Hayır", null)
                                    .create()
                                dialog.show()
                            }
                        )
                        lvDrawerAccounts.adapter = accountsAdapter
                    } else {
                        accountsAdapter?.update(list)
