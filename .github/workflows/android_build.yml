package com.emin.xtream.player.adapters

import android.view.KeyEvent
import android.view.LayoutInflater
import android.view.View
import android.view.ViewGroup
import android.widget.ImageButton
import android.widget.ImageView
import android.widget.TextView
import androidx.recyclerview.widget.RecyclerView
import com.emin.xtream.player.R
import com.emin.xtream.player.models.Portal

class PortalAdapter(
    private var items: MutableList<Portal>,
    private var activeId: Int,
    private val onSelect: (Portal) -> Unit,
    private val onDelete: (Portal) -> Unit
) : RecyclerView.Adapter<PortalAdapter.VH>() {

    inner class VH(v: View) : RecyclerView.ViewHolder(v) {
        val root: View          = v.findViewById(R.id.portalRoot)
        val name: TextView      = v.findViewById(R.id.tvPortalName)
        val type: TextView      = v.findViewById(R.id.tvPortalType)
        val check: ImageView    = v.findViewById(R.id.ivActiveCheck)
        val del: ImageButton    = v.findViewById(R.id.btnDeletePortal)
    }

    override fun onCreateViewHolder(p: ViewGroup, vt: Int) =
        VH(LayoutInflater.from(p.context).inflate(R.layout.item_portal, p, false))

    override fun getItemCount() = items.size

    override fun onBindViewHolder(h: VH, pos: Int) {
        val p = items[pos]
        h.name.text = p.name
        h.type.text = if (p.type == "M3U") "M3U" else "Xtream Codes"
        h.check.visibility = if (p.id == activeId) View.VISIBLE else View.INVISIBLE
        h.root.isFocusable = true; h.root.isClickable = true
        h.root.setOnFocusChangeListener { v, f ->
            v.animate().scaleX(if (f) 1.03f else 1f).scaleY(if (f) 1.03f else 1f)
                .setDuration(130).start()
        }
        h.root.setOnClickListener { onSelect(p) }
        h.del.setOnClickListener { onDelete(p) }
        h.root.setOnKeyListener { _, code, ev ->
            if (ev.action == KeyEvent.ACTION_DOWN &&
                (code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER)) {
                onSelect(p); true
            } else false
        }
    }

    fun update(list: List<Portal>, active: Int) {
        items.clear(); items.addAll(list); activeId = active; notifyDataSetChanged()
    }
}
