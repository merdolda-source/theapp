                    tvStatus.visibility = View.VISIBLE
                    return
                }
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val urlStr = dns + "/player_api.php?username=" + user + "&password=" + pass + "&action=get_series_info&series_id=" + seriesId
                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE
                Thread {
                    try {
                        val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                            connectTimeout = 15000
                            readTimeout = 25000
                            requestMethod = "GET"
                            setRequestProperty("User-Agent", FAKE_USER_AGENT)
                        }
                        if (conn.responseCode != HttpURLConnection.HTTP_OK) {
                            runOnUiThread { tvStatus.text = "Sunucu yanıtı: " + conn.responseCode; tvStatus.visibility = View.VISIBLE; pb.visibility = View.GONE }
                            return@Thread
                        }
                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val episodesObj = obj.optJSONObject("episodes") ?: JSONObject()
                        allEpisodes.clear()
                        seasons.clear()
                        val keys = episodesObj.keys()
                        while (keys.hasNext()) {
                            val seasonKey = keys.next()
                            val seasonNum = seasonKey.toIntOrNull() ?: continue
                            if (!seasons.contains(seasonNum)) seasons.add(seasonNum)
                            val arr = episodesObj.optJSONArray(seasonKey) ?: continue
                            for (i in 0 until arr.length()) {
                                val epObj = arr.getJSONObject(i)
                                val id = epObj.optString("id", "")
                                val title = epObj.optString("title", "Bölüm")
                                val epNum = epObj.optInt("episode_num", 1)
                                val ext = epObj.optString("container_extension", "mp4")
                                allEpisodes.add(EpisodeItem(id, title, seasonNum, epNum, ext))
                            }
                        }
                        seasons.sort()
                        runOnUiThread {
                            pb.visibility = View.GONE
                            if (seasons.isEmpty()) {
                                tvStatus.text = "Bu seri için bölüm bulunamadı."
                                tvStatus.visibility = View.VISIBLE
                            } else {
                                showSeasons()
                            }
                        }
                    } catch (e: Exception) {
                        runOnUiThread {
                            pb.visibility = View.GONE
                            tvStatus.text = "Seri bilgisi alınamadı: " + (e.message ?: "bilinmeyen hata")
                            tvStatus.visibility = View.VISIBLE
                        }
                    }
                }.start()
            }
        }
