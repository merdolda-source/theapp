    - name: 4. Gradle Derleme
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon

    - name: 6. APK'yi GitHub Artifact Olarak Yükle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Ultra
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk

    - name: 7. Artifact URL'ini Göster
      run: |
        echo "====================================="
        echo " 📦 APK Artifact URL (GitHub):"
        echo "${{ steps.upload_apk.outputs.artifact-url }}"
        echo "====================================="

        echo "### ErdinPlayer Pro APK" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [APK'yi buradan indir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
