package com.emin.xtream.player.utils

import android.util.Log
import com.emin.xtream.player.models.Category
import com.emin.xtream.player.models.EpisodeItem
import com.emin.xtream.player.models.MediaItem
import org.json.JSONArray
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL
import java.net.URLEncoder

/**
 * Xtream Codes API yardımcısı.
 * StreamPort backend/server.py mantığının Android portu.
 */
object XtreamApi {
    private const val UA = "Mozilla/5.0 (Linux; Android 12; SM-G998B) AppleWebKit/537.36"
    private const val TIMEOUT_CONNECT = 20_000
    private const val TIMEOUT_READ = 35_000

    private fun get(url: String): String {
        val conn = (URL(url).openConnection() as HttpURLConnection).apply {
            connectTimeout = TIMEOUT_CONNECT; readTimeout = TIMEOUT_READ
            requestMethod = "GET"
            setRequestProperty("User-Agent", UA)
            setRequestProperty("Accept", "*/*")
        }
        if (conn.responseCode != HttpURLConnection.HTTP_OK)
            throw Exception("HTTP ${conn.responseCode}")
        return conn.inputStream.bufferedReader().use { it.readText() }
    }

    private fun encode(s: String) = URLEncoder.encode(s, "UTF-8")

    private fun base(server: String, user: String, pass: String) =
        "${server.trimEnd('/')}/player_api.php?username=${encode(user)}&password=${encode(pass)}"

    // ─── Auth ────────────────────────────────────────────────────────
    fun auth(server: String, user: String, pass: String): JSONObject {
        val obj = JSONObject(get(base(server, user, pass)))
        if (obj.optJSONObject("user_info")?.optString("auth") != "1")
            throw Exception("Auth hatası")
        return obj
    }

    // ─── Kategoriler ─────────────────────────────────────────────────
    fun liveCategories(server: String, user: String, pass: String): List<Category> =
        parseCategories(get(base(server, user, pass) + "&action=get_live_categories"))

    fun vodCategories(server: String, user: String, pass: String): List<Category> =
        parseCategories(get(base(server, user, pass) + "&action=get_vod_categories"))

    fun seriesCategories(server: String, user: String, pass: String): List<Category> =
        parseCategories(get(base(server, user, pass) + "&action=get_series_categories"))

    private fun parseCategories(body: String): List<Category> {
        val arr = JSONArray(body); val list = mutableListOf<Category>()
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            val name = o.optString("category_name", "Kategori $i")
            list.add(Category(o.optString("category_id"), name,
                o.optString("is_adult") == "1" ||
                name.contains("18", ignoreCase = true) ||
                name.contains("adult", ignoreCase = true)))
        }
        return list
    }

    // ─── Akışlar ─────────────────────────────────────────────────────
    fun liveStreams(server: String, user: String, pass: String, catId: String? = null): List<MediaItem> {
        val url = base(server, user, pass) + "&action=get_live_streams" +
            (if (!catId.isNullOrEmpty()) "&category_id=${encode(catId)}" else "")
        val arr = JSONArray(get(url)); val list = mutableListOf<MediaItem>()
        val srv = server.trimEnd('/')
        val u = encode(user); val p = encode(pass)
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            val sid = o.optString("stream_id", "")
            list.add(MediaItem(
                name = o.optString("name", "Kanal $i"),
                streamId = sid,
                seriesId = null,
                containerExtension = null,
                categoryId = o.optString("category_id"),
                // Primary: .ts, Fallback: .m3u8 — aynı URL farklı uzantı
                streamUrl = "$srv/live/$u/$p/$sid.ts",
                thumbnailUrl = o.optString("stream_icon").takeIf { it.isNotEmpty() },
                rating = null,
                referer = null, origin = null,
                epgId = o.optString("epg_channel_id").takeIf { it.isNotEmpty() }
            ))
        }
        return list
    }

    fun vodStreams(server: String, user: String, pass: String, catId: String? = null): List<MediaItem> {
        val url = base(server, user, pass) + "&action=get_vod_streams" +
            (if (!catId.isNullOrEmpty()) "&category_id=${encode(catId)}" else "")
        val arr = JSONArray(get(url)); val list = mutableListOf<MediaItem>()
        val srv = server.trimEnd('/'); val u = encode(user); val p = encode(pass)
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            val sid = o.optString("stream_id", "")
            val ext = o.optString("container_extension", "mp4").ifEmpty { "mp4" }
            val ratingStr = o.optString("rating", "")
            list.add(MediaItem(
                name = o.optString("name", "Film $i"),
                streamId = sid, seriesId = null, containerExtension = ext,
                categoryId = o.optString("category_id"),
                streamUrl = "$srv/movie/$u/$p/$sid.$ext",
                thumbnailUrl = o.optString("stream_icon").takeIf { it.isNotEmpty() },
                rating = ratingStr.toFloatOrNull(),
                referer = null, origin = null, epgId = null
            ))
        }
        return list
    }

    fun seriesList(server: String, user: String, pass: String, catId: String? = null): List<MediaItem> {
        val url = base(server, user, pass) + "&action=get_series" +
            (if (!catId.isNullOrEmpty()) "&category_id=${encode(catId)}" else "")
        val arr = JSONArray(get(url)); val list = mutableListOf<MediaItem>()
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            val ratingStr = o.optString("rating", "")
            list.add(MediaItem(
                name = o.optString("name", "Dizi $i"),
                streamId = null, seriesId = o.optString("series_id"),
                containerExtension = null,
                categoryId = o.optString("category_id"),
                streamUrl = null,
                thumbnailUrl = o.optString("cover").takeIf { it.isNotEmpty() },
                rating = ratingStr.toFloatOrNull(),
                referer = null, origin = null, epgId = null
            ))
        }
        return list
    }

    // ─── Dizi bölümleri ──────────────────────────────────────────────
    fun seriesInfo(server: String, user: String, pass: String, seriesId: String):
        Pair<JSONObject, Map<Int, List<EpisodeItem>>> {
        val url = base(server, user, pass) + "&action=get_series_info&series_id=${encode(seriesId)}"
        val root = JSONObject(get(url))
        val info = root.optJSONObject("info") ?: JSONObject()
        val episodesObj = root.optJSONObject("episodes") ?: JSONObject()
        val srv = server.trimEnd('/'); val u = encode(user); val p = encode(pass)
        val seasons = mutableMapOf<Int, MutableList<EpisodeItem>>()
        val keys = episodesObj.keys()
        while (keys.hasNext()) {
            val key = keys.next()
            val seasonNum = key.toIntOrNull() ?: continue
            val arr = episodesObj.optJSONArray(key) ?: continue
            val epList = mutableListOf<EpisodeItem>()
            for (i in 0 until arr.length()) {
                val ep = arr.optJSONObject(i) ?: continue
                val eid = ep.optString("id", "")
                val ext = ep.optString("container_extension", "mp4").ifEmpty { "mp4" }
                epList.add(EpisodeItem(
                    id = eid,
                    title = ep.optString("title", "Bölüm"),
                    seasonNumber = seasonNum,
                    episodeNumber = ep.optInt("episode_num", i + 1),
                    containerExtension = ext,
                    thumbnailUrl = ep.optJSONObject("info")?.optString("movie_image")?.takeIf { it.isNotEmpty() },
                    plot = ep.optJSONObject("info")?.optString("plot")?.takeIf { it.isNotEmpty() },
                    streamUrl = "$srv/series/$u/$p/$eid.$ext"
                ))
            }
            seasons[seasonNum] = epList
        }
        return Pair(info, seasons)
    }

    // ─── VOD detay ───────────────────────────────────────────────────
    fun vodInfo(server: String, user: String, pass: String, vodId: String): JSONObject {
        val url = base(server, user, pass) + "&action=get_vod_info&vod_id=${encode(vodId)}"
        return JSONObject(get(url))
    }

    // ─── M3U parse ───────────────────────────────────────────────────
    fun parseM3u(url: String): Pair<List<Category>, List<MediaItem>> {
        val body = (URL(url).openConnection() as HttpURLConnection).apply {
            connectTimeout = TIMEOUT_CONNECT; readTimeout = TIMEOUT_READ
            requestMethod = "GET"; setRequestProperty("User-Agent", UA)
        }.inputStream.bufferedReader().use { it.readText() }

        val cats = mutableMapOf<String, Category>()
        val items = mutableListOf<MediaItem>()
        var name = ""; var group = "Genel"; var logo = ""; var ref: String? = null; var org: String? = null

        body.lines().forEach { raw ->
            val line = raw.trim()
            when {
                line.startsWith("#EXTM3U", ignoreCase = true) -> {}
                line.startsWith("#EXTINF", ignoreCase = true) -> {
                    name = line.substringAfterLast(',').trim().ifEmpty { "Kanal" }
                    group = Regex("""group-title="([^"]*)"""").find(line)?.groupValues?.get(1)?.ifEmpty { "Genel" } ?: "Genel"
                    logo = Regex("""tvg-logo="([^"]*)"""").find(line)?.groupValues?.get(1) ?: ""
                    ref = null; org = null
                }
                line.startsWith("#EXTVLCOPT:http-referrer=", ignoreCase = true) -> ref = line.substringAfter('=').trim()
                line.startsWith("#EXTVLCOPT:http-origin=", ignoreCase = true) -> org = line.substringAfter('=').trim()
                !line.startsWith('#') && line.isNotEmpty() -> {
                    cats.getOrPut(group) { Category(group, group) }
                    items.add(MediaItem(
                        name = name, streamId = null, seriesId = null,
                        containerExtension = null, categoryId = group,
                        streamUrl = line,
                        thumbnailUrl = logo.takeIf { it.isNotEmpty() },
                        rating = null, referer = ref, origin = org, epgId = null
                    ))
                    ref = null; org = null
                }
            }
        }
        return Pair(cats.values.toList(), items)
    }
}
