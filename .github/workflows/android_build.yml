name: ErdinPlayer Advanced Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Hazırlık
      uses: actions/checkout@v4
    
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 2. Tüm Sistemi Sıfırdan İnşa Et
      run: |
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        PASS="erdin123"
        
        echo "🚀 Gelişmiş IPTV Sistemi (Dashboard + Listeler) oluşturuluyor..."

        # Klasör yapısı
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # İkon ve İmza
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass $PASS -keypass $PASS -dname "CN=Erdin, O=ErdinMedia, C=TR"

        # --- Gradle Konfigürasyonu ---
        echo "include ':app'" > settings.gradle
        echo -e "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m" > gradle.properties

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.0.0'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0" }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33
            defaultConfig { applicationId "$PACKAGE_NAME"; minSdk 24; targetSdk 33; versionCode 1; versionName "1.0" }
            signingConfigs { release { storeFile file("keystore.jks"); storePassword "$PASS"; keyAlias "key0"; keyPassword "$PASS" } }
            buildTypes { release { minifyEnabled true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
        }
        EOF

        # --- Tasarım Kaynakları (Koyu Gri & Spor Yeşil) ---
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <color name="bg_dark">#121212</color>
            <color name="sport_green">#00E676</color>
            <color name="white">#FFFFFF</color>
            <color name="black">#000000</color>
            <color name="gray_card">#1E1E1E</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_input.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#FFFFFF"/>
            <corners android:radius="10dp"/>
            <stroke android:width="2dp" android:color="#00E676"/>
        </shape>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_card.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#1E1E1E"/>
            <corners android:radius="15dp"/>
            <stroke android:width="1dp" android:color="#333333"/>
        </shape>
        EOF

        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="colorPrimary">@color/sport_green</item>
                <item name="android:textColor">@color/white</item>
            </style>
        </resources>
        EOF

        # --- Sayfa Tasarımları (XML) ---
        # 1. Login
        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="30dp" android:background="#121212">
            <ImageView android:src="@mipmap/ic_launcher" android:layout_width="100dp" android:layout_height="100dp" android:layout_marginBottom="20dp"/>
            <TextView android:text="XTREAM GİRİŞ" android:textColor="#00E676" android:textSize="24sp" android:textStyle="bold" android:layout_marginBottom="30dp"/>
            <EditText android:id="@+id/etUrl" android:hint="DNS: http://url:port" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="10dp" android:textColor="#000" android:textColorHint="#777"/>
            <EditText android:id="@+id/etUser" android:hint="Kullanıcı Adı" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="10dp" android:textColor="#000" android:textColorHint="#777"/>
            <EditText android:id="@+id/etPass" android:hint="Şifre" android:inputType="textPassword" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="25dp" android:textColor="#000" android:textColorHint="#777"/>
            <Button android:id="@+id/btnLogin" android:text="SİSTEME GİRİŞ" android:backgroundTint="#00E676" android:textColor="#000" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="60dp"/>
        </LinearLayout>
        EOF

        # 2. Dashboard (Ana Menü)
        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="20dp" android:background="#121212" android:gravity="center">
            <TextView android:id="@+id/tvUser" android:text="Hoşgeldiniz" android:textColor="#00E676" android:textSize="18sp" android:layout_marginBottom="30dp"/>
            <LinearLayout android:id="@+id/btnLive" android:background="@drawable/bg_card" android:padding="20dp" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginBottom="15dp" android:clickable="true" android:focusable="true">
                <TextView android:text="📺 CANLI TV" android:textColor="#FFF" android:textSize="20sp" android:textStyle="bold"/>
            </LinearLayout>
            <LinearLayout android:id="@+id/btnVod" android:background="@drawable/bg_card" android:padding="20dp" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginBottom="15dp" android:clickable="true" android:focusable="true">
                <TextView android:text="🎬 FİLMLER" android:textColor="#FFF" android:textSize="20sp" android:textStyle="bold"/>
            </LinearLayout>
            <LinearLayout android:id="@+id/btnSeries" android:background="@drawable/bg_card" android:padding="20dp" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:clickable="true" android:focusable="true">
                <TextView android:text="🍿 DİZİLER" android:textColor="#FFF" android:textSize="20sp" android:textStyle="bold"/>
            </LinearLayout>
        </LinearLayout>
        EOF

        # 3. Liste Sayfası (Kategoriler ve İçerikler için Ortak)
        cat <<EOF > app/src/main/res/layout/activity_list.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:background="#121212">
            <TextView android:id="@+id/tvTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#00E676" android:textSize="20sp" android:textStyle="bold" android:padding="20dp" android:background="#1E1E1E"/>
            <ListView android:id="@+id/listView" android:layout_width="match_parent" android:layout_height="match_parent" android:divider="#333" android:dividerHeight="1dp"/>
        </LinearLayout>
        EOF

        # 4. Oynatıcı (Player)
        cat <<EOF > app/src/main/res/layout/activity_player.xml
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
            <androidx.media3.ui.PlayerView android:id="@+id/player_view" android:layout_width="match_parent" android:layout_height="match_parent"/>
        </FrameLayout>
        EOF

        # 5. Liste Eleman Tasarımı (item_row.xml)
        echo "<TextView xmlns:android='http://schemas.android.com/apk/res/android' android:id='@android:id/text1' android:layout_width='match_parent' android:layout_height='wrap_content' android:textColor='#FFF' android:textSize='18sp' android:padding='15dp'/>" > app/src/main/res/layout/item_row.xml

        # --- Kotlin Kodları (Mantık) ---
        # 1. LoginActivity
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)
                findViewById<Button>(R.id.btnLogin).setOnClickListener {
                    val url = findViewById<EditText>(R.id.etUrl).text.toString()
                    val user = findViewById<EditText>(R.id.etUser).text.toString()
                    val pass = findViewById<EditText>(R.id.etPass).text.toString()
                    if(url.isNotEmpty() && user.isNotEmpty()) {
                        val i = Intent(this, DashboardActivity::class.java)
                        i.putExtra("u", url); i.putExtra("n", user); i.putExtra("p", pass)
                        startActivity(i)
                    } else { Toast.makeText(this, "Eksik bilgi!", Toast.LENGTH_SHORT).show() }
                }
            }
        }
        EOF

        # 2. DashboardActivity (Ana Menü)
        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity

        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)
                val n = intent.getStringExtra("n")
                findViewById<TextView>(R.id.tvUser).text = "Hoşgeldin, \$n"
                
                fun open(type: String) {
                    val i = Intent(this, ListActivity::class.java)
                    i.putExtras(intent.extras!!)
                    i.putExtra("type", type)
                    startActivity(i)
                }
                findViewById<LinearLayout>(R.id.btnLive).setOnClickListener { open("CANLI") }
                findViewById<LinearLayout>(R.id.btnVod).setOnClickListener { open("FİLM") }
                findViewById<LinearLayout>(R.id.btnSeries).setOnClickListener { open("DİZİ") }
            }
        }
        EOF

        # 3. ListActivity (Kategoriler ve Diziler/Bölümler için)
        cat <<EOF > app/src/main/java/$PATH_NAME/ListActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity

        class ListActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_list)
                val type = intent.getStringExtra("type") ?: "LİSTE"
                val dns = intent.getStringExtra("u"); val user = intent.getStringExtra("n"); val pass = intent.getStringExtra("p")
                
                findViewById<TextView>(R.id.tvTitle).text = "\$type LİSTESİ"
                
                // Örnek veriler (Gerçek API bağlantısı için Retrofit gerekir, bu şablon yapıyı kurar)
                val data = if(type == "DİZİ") listOf("Kurtlar Vadisi", "Ezel", "Dizi 3", "Dizi 4") 
                           else listOf("Kanal 1", "Kanal 2", "İçerik 3", "İçerik 4")

                val adapter = ArrayAdapter(this, R.layout.item_row, data)
                val lv = findViewById<ListView>(R.id.listView)
                lv.adapter = adapter
                
                lv.setOnItemClickListener { _, _, pos, _ ->
                    // Eğer diziyse bölüm listesine gidebilir, değilse player'a
                    if(type == "DİZİ" && !intent.hasExtra("is_episode")) {
                        val i = Intent(this, ListActivity::class.java)
                        i.putExtras(intent.extras!!)
                        i.putExtra("type", "BÖLÜMLER")
                        i.putExtra("is_episode", true)
                        startActivity(i)
                    } else {
                        val streamId = pos + 1
                        val finalUrl = "\$dns/\${if(type=="CANLI") "live" else "movie"}/\$user/\$pass/\$streamId.ts"
                        val i = Intent(this, PlayerActivity::class.java)
                        i.putExtra("url", finalUrl)
                        startActivity(i)
                    }
                }
            }
        }
        EOF

        # 4. PlayerActivity
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView

        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_player)
                val url = intent.getStringExtra("url") ?: ""
                player = ExoPlayer.Builder(this).build()
                findViewById<PlayerView>(R.id.player_view).player = player
                player?.setMediaItem(MediaItem.fromUri(url))
                player?.prepare(); player?.play()
            }
            override fun onStop() { super.onStop(); player?.release(); player = null }
        }
        EOF

        # --- Manifest ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/Theme.ErdinPlayer" android:icon="@mipmap/ic_launcher" android:label="ErdinPlayer" android:usesCleartextTraffic="true">
                <activity android:name=".LoginActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
                <activity android:name=".DashboardActivity"/><activity android:name=".ListActivity"/><activity android:name=".PlayerActivity"/>
            </application>
        </manifest>
        EOF

    - name: 3. Gradle ve Derleme
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 4. APK Oluştur
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon

    - name: 5. APK'yı Sun (Download)
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Advanced-v3
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk
