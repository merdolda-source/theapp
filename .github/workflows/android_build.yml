package com.emin.xtream.player.adapters

import android.view.KeyEvent
import android.view.LayoutInflater
import android.view.View
import android.view.ViewGroup
import android.widget.LinearLayout
import android.widget.TextView
import androidx.recyclerview.widget.RecyclerView
import com.google.android.gms.ads.AdView
import com.emin.xtream.player.R
import com.emin.xtream.player.utils.AdsHelper

class GridAdapter(
    private var titles: List<String>,
    private var subtitles: List<String>,
    private var badges: List<String> = emptyList(), // "LIVE","VOD","SERIES",""
    private val onClick: (Int) -> Unit
) : RecyclerView.Adapter<GridAdapter.VH>() {

    companion object {
        const val AD_MARKER = "###AD###"
    }

    class VH(v: View) : RecyclerView.ViewHolder(v) {
        val cardLayout: LinearLayout = v.findViewById(R.id.cardLayout)
        val txt: TextView = v.findViewById(R.id.txtName)
        val sub: TextView = v.findViewById(R.id.txtSub)
        val tvBadge: TextView = v.findViewById(R.id.tvBadge)
        val adContainer: LinearLayout = v.findViewById(R.id.adContainer)
        val adView: AdView = v.findViewById(R.id.adViewItem)
    }

    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
        val v = LayoutInflater.from(parent.context).inflate(R.layout.item_grid_pro, parent, false)
        return VH(v)
    }

    override fun onBindViewHolder(holder: VH, position: Int) {
        val t = titles[position]
        if (t == AD_MARKER) {
            holder.cardLayout.visibility = View.GONE
            holder.adContainer.visibility = View.VISIBLE
            AdsHelper.loadBanner(holder.adView)
            holder.itemView.isFocusable = false
            holder.itemView.isClickable = false
            return
        }

        holder.adContainer.visibility = View.GONE
        holder.cardLayout.visibility = View.VISIBLE

        holder.txt.text = t
        val s = subtitles.getOrNull(position) ?: ""
        holder.sub.text = s
        holder.sub.visibility = if (s.isNotEmpty()) View.VISIBLE else View.GONE

        // Badge
        val badge = badges.getOrNull(position) ?: ""
        when (badge) {
            "LIVE" -> { holder.tvBadge.visibility = View.VISIBLE; holder.tvBadge.text = "CANLI"; holder.tvBadge.setBackgroundResource(R.drawable.bg_badge_live) }
            "VOD" -> { holder.tvBadge.visibility = View.VISIBLE; holder.tvBadge.text = "FİLM"; holder.tvBadge.setBackgroundResource(R.drawable.bg_badge_vod) }
            "SERIES" -> { holder.tvBadge.visibility = View.VISIBLE; holder.tvBadge.text = "DİZİ"; holder.tvBadge.setBackgroundResource(R.drawable.bg_badge_series) }
            else -> holder.tvBadge.visibility = View.GONE
        }

        holder.cardLayout.isFocusable = true
        holder.cardLayout.isClickable = true

        holder.cardLayout.setOnFocusChangeListener { v, hasFocus ->
            v.animate().scaleX(if (hasFocus) 1.04f else 1.0f)
                .scaleY(if (hasFocus) 1.04f else 1.0f)
                .setDuration(120).start()
            v.elevation = if (hasFocus) 12f else 2f
        }

        holder.cardLayout.setOnClickListener { onClick(position) }
        holder.cardLayout.setOnKeyListener { _, keyCode, event ->
            if (event.action == KeyEvent.ACTION_DOWN &&
                (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER)
            ) { onClick(position); true } else false
        }
    }

    override fun getItemCount() = titles.size

    fun update(newTitles: List<String>, newSubtitles: List<String>, newBadges: List<String> = emptyList()) {
        titles = newTitles
        subtitles = newSubtitles
        badges = newBadges
        notifyDataSetChanged()
    }
}
