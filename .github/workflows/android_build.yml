        # --- UTILS: RemoteConfig ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/RemoteConfig.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import android.util.Log
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import $PACKAGE_NAME.R

        object RemoteConfig {

            private const val TAG = "RemoteConfig"
            private const val CONFIG_URL = "https://creatorapp24.com/erdin/api/config.php"

            @Volatile
            private var initialized = false

            @Volatile
            private var admobAppId: String? = null

            @Volatile
            private var bannerId: String? = null

            @Volatile
            private var interstitialId: String? = null

            @Volatile
            private var channelInterval: Int = 4

            fun init(context: Context) {
                if (initialized) return
                synchronized(this) {
                    if (initialized) return
                    initialized = true

                    Thread {
                        try {
                            val url = URL(CONFIG_URL)
                            val conn = url.openConnection() as HttpURLConnection
                            conn.connectTimeout = 8000
                            conn.readTimeout = 8000
                            conn.requestMethod = "GET"

                            val code = conn.responseCode
                            if (code != HttpURLConnection.HTTP_OK) {
                                Log.w(TAG, "Config HTTP code: " + code)
                                return@Thread
                            }

                            val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                            val obj = JSONObject(body)

                            val ads = obj.optJSONObject("ads") ?: obj

                            admobAppId = ads.optString("admob_app_id", null)
                            bannerId = ads.optString("admob_banner_id", null)
                            interstitialId = ads.optString("admob_interstitial_id", null)

                            val interval = ads.optInt("channel_interval", 0)
                            if (interval > 0) {
                                channelInterval = interval
                            }

                        } catch (e: Exception) {
                            Log.w(TAG, "Config load failed: " + (e.message ?: ""))
                        }
                    }.start()
                }
            }

            fun getBannerId(context: Context): String {
                init(context)
                return bannerId ?: context.getString(R.string.admob_banner_test)
            }

            fun getInterstitialId(context: Context): String {
                init(context)
                return interstitialId ?: context.getString(R.string.admob_interstitial_test)
            }

            fun getChannelInterval(context: Context, defaultInterval: Int): Int {
                init(context)
                return if (channelInterval > 0) channelInterval else defaultInterval
            }
        }
        EOF

        # --- UTILS: RemoteLogger ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/RemoteLogger.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import android.os.Build
        import android.provider.Settings
        import android.util.Log
        import java.net.HttpURLConnection
        import java.net.URL
        import java.net.URLEncoder

        object RemoteLogger {

            private const val TAG = "RemoteLogger"
            private const val EVENT_URL = "https://creatorapp24.com/erdin/api/event.php"

            fun sendEvent(context: Context, type: String, data: Map<String, String>) {
                Thread {
                    try {
                        val appContext = context.applicationContext

                        val deviceId = Settings.Secure.getString(
                            appContext.contentResolver,
                            Settings.Secure.ANDROID_ID
                        ) ?: "unknown"

                        val pkg = appContext.packageName
                        val verName = try {
                            appContext.packageManager.getPackageInfo(pkg, 0).versionName ?: "1.0"
                        } catch (e: Exception) {
                            "1.0"
                        }

                        val baseData = HashMap<String, String>()
                        baseData["type"] = type
                        baseData["device_id"] = deviceId
                        baseData["package"] = pkg
                        baseData["version"] = verName
                        baseData["brand"] = Build.BRAND ?: ""
                        baseData["model"] = Build.MODEL ?: ""

                        baseData.putAll(data)

                        val bodyBuilder = StringBuilder()
                        var first = true
                        for ((k, v) in baseData) {
                            if (!first) bodyBuilder.append("&")
                            first = false
                            bodyBuilder.append(URLEncoder.encode(k, "UTF-8"))
                            bodyBuilder.append("=")
                            bodyBuilder.append(URLEncoder.encode(v, "UTF-8"))
                        }
                        val body = bodyBuilder.toString()

                        val url = URL(EVENT_URL)
                        val conn = url.openConnection() as HttpURLConnection
                        conn.connectTimeout = 8000
                        conn.readTimeout = 8000
                        conn.requestMethod = "POST"
                        conn.doOutput = true
                        conn.setRequestProperty("Content-Type", "application/x-www-form-urlencoded")

                        conn.outputStream.use { os ->
                            os.write(body.toByteArray(Charsets.UTF_8))
                        }

                        val code = conn.responseCode
                        if (code != HttpURLConnection.HTTP_OK) {
                            Log.w(TAG, "Event HTTP code: " + code)
                        }
                    } catch (e: Exception) {
                        Log.w(TAG, "sendEvent failed: " + (e.message ?: ""))
                    }
                }.start()
            }
        }
        EOF

        # --- UTILS: Prefs ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import $PACKAGE_NAME.models.AccountProfile
        import org.json.JSONArray
        import org.json.JSONObject

        class Prefs(ctx: Context) {
            private val appContext = ctx.applicationContext
            private val p = appContext.getSharedPreferences("EP_Prefs", 0)

            private fun loadArray(): JSONArray {
                val s = p.getString("accounts_json", "[]") ?: "[]"
                return JSONArray(s)
            }

            private fun saveArray(arr: JSONArray) {
                p.edit().putString("accounts_json", arr.toString()).apply()
            }

            fun createXtreamAccount(name: String, dns: String, u: String, ps: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "XTREAM")
                obj.put("dns", dns)
                obj.put("user", u)
                obj.put("pass", ps)
                obj.put("m3u", "")

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()

                return id
            }

            fun createM3uAccount(name: String, m3u: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "M3U")
                obj.put("dns", "")
                obj.put("user", "")
                obj.put("pass", "")
                obj.put("m3u", m3u)

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()

                return id
            }

            fun getAccounts(): List<AccountProfile> {
                val arr = loadArray()
                val list = ArrayList<AccountProfile>()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null) {
                        val id = o.optInt("id", 0)
                        val name = o.optString("name", "Hesap " + i)
                        val type = o.optString("type", "XTREAM")
                        val dns = o.optString("dns", null)
                        val user = o.optString("user", null)
                        val pass = o.optString("pass", null)
                        val m3u = o.optString("m3u", null)
                        list.add(AccountProfile(id, name, type, dns, user, pass, m3u))
                    }
                    i++
                }
                return list
            }

            fun deleteAccount(id: Int) {
                val arr = loadArray()
                val newArr = JSONArray()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null && o.optInt("id", 0) != id) {
                        newArr.put(o)
                    }
                    i++
                }
                saveArray(newArr)

                val activeId = p.getInt("active_id", -1)
                if (activeId == id) {
                    val remaining = getAccounts()
                    val newActive = if (remaining.isNotEmpty()) remaining[0].id else -1
                    p.edit().putInt("active_id", newActive).apply()
                }
            }

            fun setActive(id: Int) {
                p.edit().putInt("active_id", id).apply()
            }

            fun getActive(): AccountProfile? {
                val all = getAccounts()
                if (all.isEmpty()) return null
                val activeId = p.getInt("active_id", -1)
                if (activeId <= 0) return all[0]
                return all.find { it.id == activeId } ?: all[0]
            }

            fun save(dns: String, u: String, ps: String) {
                val name = if (u.isNotEmpty()) u else "Xtream"
                createXtreamAccount(name, dns, u, ps)
            }

            fun getDns(): String = getActive()?.dns ?: ""
            fun getUser(): String = getActive()?.user ?: ""
            fun getPass(): String = getActive()?.pass ?: ""
        }
        EOF

        # --- UTILS: AdsHelper ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/AdsHelper.kt
        package $PACKAGE_NAME.utils

        import android.app.Activity
        import android.content.Context
        import com.google.android.gms.ads.AdRequest
        import com.google.android.gms.ads.AdView
        import com.google.android.gms.ads.MobileAds
        import com.google.android.gms.ads.interstitial.InterstitialAd
        import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback
        import com.google.android.gms.ads.LoadAdError

        object AdsHelper {
            @Volatile
            private var initialized = false

            private var interstitial: InterstitialAd? = null
            private var clickCount = 0

            var CHANNEL_INTERVAL = 4

            fun init(context: Context) {
                if (!initialized) {
                    synchronized(this) {
                        if (!initialized) {
                            MobileAds.initialize(context.applicationContext) {}
                            initialized = true
                        }
                    }
                }
                RemoteConfig.init(context)
                CHANNEL_INTERVAL = RemoteConfig.getChannelInterval(context, CHANNEL_INTERVAL)
            }

            fun loadBanner(adView: AdView?) {
                if (adView == null) return
                val id = RemoteConfig.getBannerId(adView.context)
                try {
                    adView.adUnitId = id
                } catch (_: Exception) { }
                val request = AdRequest.Builder().build()
                adView.loadAd(request)
            }

            fun loadInterstitial(context: Context) {
                val adUnitId = RemoteConfig.getInterstitialId(context)
                val request = AdRequest.Builder().build()
                InterstitialAd.load(
                    context,
                    adUnitId,
                    request,
                    object : InterstitialAdLoadCallback() {
                        override fun onAdLoaded(ad: InterstitialAd) {
                            interstitial = ad
                        }
                        override fun onAdFailedToLoad(error: LoadAdError) {
                            interstitial = null
                        }
                    }
                )
            }

            fun maybeShowOnChannelClick(activity: Activity, onContinue: () -> Unit) {
                clickCount++
                val ad = interstitial
                if (ad != null && CHANNEL_INTERVAL > 0 && (clickCount % CHANNEL_INTERVAL == 0)) {
                    ad.show(activity)
                    interstitial = null
                    loadInterstitial(activity)
                    onContinue()
                } else {
                    onContinue()
                }
            }
        }
        EOF

        # --- ADAPTERLER ---
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/GridAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.StreamItem

        class GridAdapter(
            private val list: List<StreamItem>,
            private val onClick: (StreamItem) -> Unit
        ) : RecyclerView.Adapter<GridAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtName)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_grid_pro, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val item = list[position]
                holder.txt.text = item.name
                holder.itemView.setOnClickListener { onClick(item) }
            }

            override fun getItemCount(): Int = list.size
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/AccountsAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.content.Context
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.BaseAdapter
        import android.widget.ImageButton
        import android.widget.TextView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.AccountProfile

        class AccountsAdapter(
            private val ctx: Context,
            private val items: MutableList<AccountProfile>,
            private val onOpen: (AccountProfile) -> Unit,
            private val onDelete: (AccountProfile) -> Unit
        ) : BaseAdapter() {

            override fun getCount(): Int = items.size

            override fun getItem(position: Int): Any = items[position]

            override fun getItemId(position: Int): Long = items[position].id.toLong()

            override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                val v = convertView ?: LayoutInflater.from(ctx)
                    .inflate(R.layout.item_account, parent, false)

                val txtName = v.findViewById<TextView>(R.id.tvAccountName)
                val txtType = v.findViewById<TextView>(R.id.tvAccountType)
                val btnDelete = v.findViewById<ImageButton>(R.id.btnDeleteAccount)

                val item = items[position]
                txtName.text = item.name
                txtType.text = if (item.type == "M3U") "M3U" else "Xtream"

                v.setOnClickListener {
                    onOpen(item)
                }

                btnDelete.setOnClickListener {
                    onDelete(item)
                }

                return v
            }

            fun update(newItems: List<AccountProfile>) {
                items.clear()
                items.addAll(newItems)
                notifyDataSetChanged()
            }
        }
