            private fun applySearchFilterWithFavs(qRaw: String, favSet: Set<String>) {
                val q = qRaw.trim().lowercase(Locale.getDefault())
                if (rv.visibility != View.VISIBLE) return
                val adInterval = RemoteConfig.getBannerListInterval(this)
                val tempTitles = ArrayList<String>(); val tempSubs = ArrayList<String>(); val tempIndexMap = ArrayList<Int>()
                if (screen == Screen.CATEGORIES) {
                    displayMapType = "CAT"
                    val cats = if (q.isEmpty()) categoriesAll else categoriesAll.filter { it.category_name.lowercase(Locale.getDefault()).contains(q) }
                    filteredCategoryIds = cats.map { it.category_id }
                    var count = 0
                    for (i in cats.indices) {
                        tempTitles.add(cats[i].category_name); tempSubs.add(""); tempIndexMap.add(i); count++
                        if (adInterval > 0 && count % adInterval == 0) { tempTitles.add("###AD###"); tempSubs.add(""); tempIndexMap.add(-1) }
                    }
                } else {
                    displayMapType = "STREAM"
                    val catId = selectedCategory?.category_id
                    val items = if (catId.isNullOrEmpty()) streamsAll else streamsAll.filter { it.category_id == catId }
                    val filtered = if (q.isEmpty()) items else items.filter { it.name.lowercase(Locale.getDefault()).contains(q) }
                    filteredStreamIdx = filtered.map { streamsAll.indexOf(it) }
                    var count = 0
                    for (i in filtered.indices) {
                        tempTitles.add(filtered[i].name); tempSubs.add(""); tempIndexMap.add(i); count++
                        if (adInterval > 0 && count % adInterval == 0) { tempTitles.add("###AD###"); tempSubs.add(""); tempIndexMap.add(-1) }
                    }
                }
                displayTitles = tempTitles; displaySubtitles = tempSubs; displayMapIndex = tempIndexMap
                val showFavBtn = (screen == Screen.ITEMS)
                val newAdapter = GridAdapter(displayTitles, displaySubtitles, { pos -> onGridClick(pos) },
                    if (showFavBtn) favSet else emptySet(),
                    if (showFavBtn) { pos -> toggleFav(pos) } else null
                )
                rv.adapter = newAdapter; gridAdapter = newAdapter
            }

            private fun toggleFav(position: Int) {
                val acc = activeAcc ?: return
                if (position < 0 || position >= displayMapIndex.size) return
                val realIndex = displayMapIndex[position]; if (realIndex == -1) return
                val name = if (position < displayTitles.size) displayTitles[position] else return
                val item: StreamItem? = if (displayMapType == "STREAM" && realIndex < filteredStreamIdx.size) {
                    val globalIdx = filteredStreamIdx[realIndex]
                    if (globalIdx in streamsAll.indices) streamsAll[globalIdx] else null
                } else null
                val url = item?.let { buildPlayUrl(it, acc) } ?: return
                val isNowFav = prefs.toggleFav(acc.id, url, name)
                Toast.makeText(this, if (isNowFav) "â­ Favorilere eklendi" else "Favorilerden kaldÄ±rÄ±ldÄ±", Toast.LENGTH_SHORT).show()
                buildFavSet { favSet -> gridAdapter?.update(displayTitles, displaySubtitles, favSet) }
            }

            private fun buildPlayUrl(item: StreamItem, acc: AccountProfile): String? {
                if (acc.type == "M3U") return item.full_url
                val dnsRaw = acc.dns?.trim() ?: ""; val user = (acc.user ?: "").trim(); val pass = acc.pass?.trim() ?: ""
                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) return null
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val path = if (currentMode == "LIVE") "live" else "movie"
                val ext = if (currentMode == "LIVE") ".ts" else if (!item.container_extension.isNullOrEmpty()) ".${'$'}{item.container_extension}" else ".mp4"
                return "${'$'}dns/${'$'}path/${'$'}user/${'$'}pass/${'$'}{item.stream_id ?: ""}${'$'}ext"
            }

            private fun onGridClick(position: Int) {
                if (position < 0 || position >= displayMapIndex.size) return
                val realIndex = displayMapIndex[position]; if (realIndex == -1) return
                val acc = activeAcc ?: return
                if (screen == Screen.CATEGORIES) {
                    if (realIndex < filteredCategoryIds.size) {
                        val catId = filteredCategoryIds[realIndex]
                        val cat = categoriesAll.find { it.category_id == catId } ?: return
                        showItemsForCategory(cat)
                    }
                    return
                }
                if (realIndex < filteredStreamIdx.size) {
                    val globalIdx = filteredStreamIdx[realIndex]
                    if (globalIdx !in streamsAll.indices) return
                    val item = streamsAll[globalIdx]
                    if (currentMode == "SERIES" && item.series_id != null) {
                        val itn = Intent(this, SeriesDetailActivity::class.java)
                        itn.putExtra("SERIES_ID", item.series_id ?: ""); itn.putExtra("SERIES_NAME", item.name)
                        startActivity(itn); return
                    }
                    val url = buildPlayUrl(item, acc)
                    if (url.isNullOrEmpty()) { Toast.makeText(this, "GeÃ§ersiz URL.", Toast.LENGTH_SHORT).show(); return }
                    val itn = Intent(this, PlayerActivity::class.java)
                    itn.putExtra("URL", url)
                    itn.putExtra("REF", item.referer ?: ""); itn.putExtra("ORG", item.origin ?: "")
                    itn.putExtra("TYPE", if (currentMode == "LIVE") "LIVE" else "VOD")
                    itn.putExtra("TITLE", item.name)
                    prefs.addHistory(acc.id, item.name, url, if (currentMode == "LIVE") "LIVE" else "VOD")
                    AdsHelper.maybeShowOnChannelClick(this) {
                        RemoteLogger.sendEvent(this, "play_channel", mapOf("name" to item.name, "mode" to currentMode))
                        startActivity(itn)
                    }
                }
            }

            private fun fetchCategoriesAndStreams() {
                val acc = activeAcc ?: return
                pb.visibility = View.VISIBLE; tvStatus.visibility = View.GONE
                if (acc.type == "M3U") {
                    val m3uUrl = acc.m3u?.trim() ?: ""
                    if (m3uUrl.isEmpty()) { pb.visibility = View.GONE; tvStatus.text = "M3U linki yok."; tvStatus.visibility = View.VISIBLE; return }
                    Thread {
                        try {
                            val result = fetchM3u(m3uUrl)
                            runOnUiThread { pb.visibility = View.GONE; categoriesAll = result.first; streamsAll = result.second; tvDrawerExpire.text = "M3U Playlist"; showCategories() }
                        } catch (e: Exception) {
                            runOnUiThread { pb.visibility = View.GONE; tvStatus.text = "M3U okunamadÄ±: ${'$'}{e.message}"; tvStatus.visibility = View.VISIBLE }
                        }
                    }.start(); return
                }
                val dnsRaw = (acc.dns ?: "").trim(); val user = (acc.user ?: "").trim().replace("""\s+""".toRegex(), ""); val pass = (acc.pass ?: "").trim()
                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) { pb.visibility = View.GONE; tvStatus.text = "DNS/kullanÄ±cÄ±/ÅŸifre boÅŸ."; tvStatus.visibility = View.VISIBLE; return }
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val base = "${'$'}dns/player_api.php?username=${'$'}user&password=${'$'}pass"
                val catAction = when (currentMode) { "VOD" -> "get_vod_categories"; "SERIES" -> "get_series_categories"; else -> "get_live_categories" }
                val streamsAction = when (currentMode) { "VOD" -> "get_vod_streams"; "SERIES" -> "get_series"; else -> "get_live_streams" }
                Thread {
                    try {
                        val accInfo = fetchAccountInfo(base)
                        val cats = fetchCategories("${'$'}base&action=${'$'}catAction")
                        val streams = fetchStreams("${'$'}base&action=${'$'}streamsAction")
                        runOnUiThread {
                            pb.visibility = View.GONE; categoriesAll = cats; streamsAll = streams
                            tvDrawerExpire.text = "SÃ¼re: ${'$'}{formatExp(accInfo.second)}"
                            showCategories()
                        }
                    } catch (e: Exception) {
                        runOnUiThread { pb.visibility = View.GONE; tvStatus.text = "Veriler alÄ±namadÄ±: ${'$'}{e.message}"; tvStatus.visibility = View.VISIBLE }
                        RemoteLogger.sendEvent(this, "fetch_failed", mapOf("error" to (e.message ?: "")))
                    }
                }.start()
            }

            private fun fetchAccountInfo(base: String): Pair<String, String?> {
                val conn = (URL(base).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 12000; readTimeout = 20000; requestMethod = "GET"
                    setRequestProperty("User-Agent", FAKE_USER_AGENT)
                }
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return Pair("", null)
                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                return try {
                    val obj = JSONObject(body)
                    val ui = obj.optJSONObject("user_info")
                    val exp = ui?.optString("exp_date", null)
                    val user = ui?.optString("username", "") ?: ""
                    Pair(user, exp)
                } catch (e: Exception) { Pair("", null) }
            }

            private fun formatExp(expRaw: String?): String {
                if (expRaw == null) return "Bilinmiyor"
                return try {
                    val ts = expRaw.toLong() * 1000
                    SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(Date(ts))
                } catch (e: Exception) { expRaw }
            }

            private fun fetchCategories(url: String): List<Category> {
                val conn = (URL(url).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 15000; readTimeout = 25000; requestMethod = "GET"
                    setRequestProperty("User-Agent", FAKE_USER_AGENT)
                }
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return emptyList()
                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body); val list = ArrayList<Category>()
                for (i in 0 until arr.length()) {
                    val o = arr.optJSONObject(i) ?: continue
                    list.add(Category(o.optString("category_id", ""), o.optString("category_name", ""), false))
                }
                return list
            }

            private fun fetchStreams(url: String): List<StreamItem> {
                val conn = (URL(url).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 20000; readTimeout = 60000; requestMethod = "GET"
                    setRequestProperty("User-Agent", FAKE_USER_AGENT)
                }
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return emptyList()
                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body); val list = ArrayList<StreamItem>()
                for (i in 0 until arr.length()) {
                    val o = arr.optJSONObject(i) ?: continue
                    list.add(StreamItem(
                        o.optString("name", ""), o.optString("stream_id", null), o.optString("series_id", null),
                        o.optString("container_extension", null), o.optString("category_id", null), null, null, null
                    ))
                }
                return list
            }

            private fun fetchM3u(url: String): Pair<List<Category>, List<StreamItem>> {
                val conn = (URL(url).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 20000; readTimeout = 60000; requestMethod = "GET"
                    setRequestProperty("User-Agent", FAKE_USER_AGENT)
                }
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return Pair(emptyList(), emptyList())
                val lines = conn.inputStream.bufferedReader(Charsets.UTF_8).readLines()
                val catMap = LinkedHashMap<String, String>()
                val streams = ArrayList<StreamItem>()
                var currentName = ""; var currentGroup = "Genel"; var currentRef = ""; var currentOrg = ""
                for (line in lines) {
                    val l = line.trim()
                    if (l.startsWith("#EXTINF")) {
                        currentName = Regex(".*,(.+)${'$'}").find(l)?.groupValues?.get(1)?.trim() ?: "Kanal"
                        currentGroup = Regex("""group-title="([^"]*)"$""").find(l)?.groupValues?.get(1)?.trim()?.ifEmpty { "Genel" } ?: "Genel"
                        currentRef = Regex("""tvg-url="([^"]*)"$""").find(l)?.groupValues?.get(1) ?: ""
                        if (!catMap.containsKey(currentGroup)) catMap[currentGroup] = catMap.size.toString()
                    } else if (l.startsWith("http") || l.startsWith("rtmp") || l.startsWith("rtsp")) {
                        val catId = catMap[currentGroup] ?: "0"
                        streams.add(StreamItem(currentName, null, null, null, catId, l, currentRef, currentOrg))
                        currentName = ""; currentGroup = "Genel"; currentRef = ""; currentOrg = ""
                    }
                }
                val cats = catMap.entries.map { Category(it.value, it.key) }
                return Pair(cats, streams)
            }
        }
