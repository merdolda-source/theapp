name: Final Cyber Builder V6

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Hazırlık
      uses: actions/checkout@v4
    
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 2. Dosyaları Oluştur (Cyber Tasarım)
      run: |
        # --- AYARLAR ---
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        KEYSTORE_PASS="erdin123"
        KEY_ALIAS="key0"
        
        echo "🚀 Proje Onarılıyor ve Yeni Tasarım Uygulanıyor..."

        # Temizlik ve Klasörler
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # İKON İNDİR (Daha modern bir ikon linki varsa burayı değiştirebilirsin)
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://cdn-icons-png.flaticon.com/512/2991/2991195.png"

        # --- A. KEYSTORE ---
        keytool -genkey -v -keystore app/keystore.jks \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -alias $KEY_ALIAS -storepass $KEYSTORE_PASS -keypass $KEYSTORE_PASS \
                -dname "CN=Erdin, OU=TV, O=ErdinMedia, L=Istanbul, S=Istanbul, C=TR"

        # --- B. GRADLE CONFIG ---
        echo "include ':app'" > settings.gradle

        cat <<EOF > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        EOF

        cat <<EOF > build.gradle
        buildscript {
            ext.kotlin_version = '1.9.0'
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        task clean(type: Delete) { delete rootProject.buildDir }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33
            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 33
                versionCode 2
                versionName "2.0-Cyber"
            }
            signingConfigs {
                release { storeFile file("keystore.jks"); storePassword "$KEYSTORE_PASS"; keyAlias "$KEY_ALIAS"; keyPassword "$KEYSTORE_PASS" }
            }
            buildTypes {
                release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.release }
            }
            buildFeatures { viewBinding false }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
            implementation 'com.google.android.gms:play-services-ads:22.1.0'
        }
        EOF

        # --- C. YENİ TASARIM (CYBER DARK) ---
        
        # 1. Renkler (Mavi ve Koyu Siyah Teması)
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <!-- Ana Arka Plan: Tam Siyah değil, çok koyu lacivert/siyah -->
            <color name="bg_main">#050505</color>
            
            <!-- Kart/Input Arka Planı: Ana zeminden biraz daha açık -->
            <color name="bg_card">#1A1A1A</color>
            
            <!-- Vurgu Rengi: Neon Mavi -->
            <color name="accent_blue">#00D4FF</color>
            
            <!-- Yazı Renkleri -->
            <color name="text_white">#FFFFFF</color>
            <color name="text_gray">#888888</color>
            <color name="black">#000000</color>
            
            <!-- Buton Gradyan Başlangıç/Bitiş -->
            <color name="btn_start">#00D4FF</color>
            <color name="btn_end">#007ACC</color>
        </resources>
        EOF

        # 2. Şekiller (Drawables)
        
        # Input Alanı (Daha belirgin sınırları var)
        cat <<EOF > app/src/main/res/drawable/bg_input_cyber.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/bg_card"/>
            <corners android:radius="12dp"/>
            <stroke android:width="1dp" android:color="#333333"/>
        </shape>
        EOF
        
        # Buton (Düz renk yerine hafif parlak)
        cat <<EOF > app/src/main/res/drawable/bg_button_cyber.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/accent_blue"/>
            <corners android:radius="12dp"/>
        </shape>
        EOF

        # Kategori Butonları (Dashboard için)
        cat <<EOF > app/src/main/res/drawable/bg_card_cyber.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/bg_card"/>
            <corners android:radius="16dp"/>
            <stroke android:width="1dp" android:color="@color/accent_blue"/>
        </shape>
        EOF

        # 3. TEMA (Yazı Rengini Zorla Beyaz Yapıyoruz)
        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.NoActionBar">
                <item name="android:windowBackground">@color/bg_main</item>
                <item name="colorPrimary">@color/accent_blue</item>
                <item name="android:textColor">@color/text_white</item>
                <item name="android:editTextColor">@color/text_white</item>
                <item name="android:textColorHint">@color/text_gray</item>
            </style>
        </resources>
        EOF

        # --- D. MANIFEST ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/Theme.ErdinPlayer" 
                android:usesCleartextTraffic="true">
                <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>
                <activity android:name=".LoginActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".DashboardActivity" />
                <activity android:name=".ListActivity" />
                <activity android:name=".PlayerActivity" />
            </application>
        </manifest>
        EOF

        # --- E. STRINGS ---
        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">$APP_NAME</string>
            <string name="login_title">XTREAM PANEL</string>
            <string name="login_subtitle">Lütfen giriş bilgilerinizi giriniz</string>
            <string name="login_btn">GÜVENLİ GİRİŞ</string>
        </resources>
        EOF

        # --- F. LAYOUTLAR (DÜZELTİLDİ) ---

        # 1. LOGIN (Görünürlük sorunu burada çözüldü)
        # textColor ve hintColor manuel olarak eklendi.
        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" 
            android:padding="32dp" android:background="@color/bg_main">
            
            <ImageView android:src="@mipmap/ic_launcher" 
                android:layout_width="120dp" android:layout_height="120dp" 
                android:layout_marginBottom="20dp"/>
            
            <TextView android:text="@string/login_title" 
                android:textColor="@color/text_white" android:textSize="28sp" 
                android:textStyle="bold" android:layout_marginBottom="8dp"/>

            <TextView android:text="@string/login_subtitle" 
                android:textColor="@color/text_gray" android:textSize="14sp" 
                android:layout_marginBottom="40dp"/>
            
            <!-- URL INPUT -->
            <EditText android:id="@+id/etUrl" 
                android:hint="http://url_adresi:port" 
                android:inputType="textUri"
                android:background="@drawable/bg_input_cyber" 
                android:textColor="@color/text_white" 
                android:textColorHint="@color/text_gray" 
                android:padding="16dp" 
                android:minHeight="55dp"
                android:layout_marginBottom="16dp" 
                android:layout_width="match_parent" android:layout_height="wrap_content"/>
            
            <!-- USER INPUT -->
            <EditText android:id="@+id/etUser" 
                android:hint="Kullanıcı Adı" 
                android:inputType="text"
                android:background="@drawable/bg_input_cyber" 
                android:textColor="@color/text_white" 
                android:textColorHint="@color/text_gray" 
                android:padding="16dp" 
                android:minHeight="55dp"
                android:layout_marginBottom="16dp" 
                android:layout_width="match_parent" android:layout_height="wrap_content"/>
            
            <!-- PASS INPUT -->
            <EditText android:id="@+id/etPass" 
                android:hint="Şifre" 
                android:inputType="textPassword" 
                android:background="@drawable/bg_input_cyber" 
                android:textColor="@color/text_white" 
                android:textColorHint="@color/text_gray" 
                android:padding="16dp" 
                android:minHeight="55dp"
                android:layout_marginBottom="32dp" 
                android:layout_width="match_parent" android:layout_height="wrap_content"/>
            
            <androidx.appcompat.widget.AppCompatButton android:id="@+id/btnLogin" 
                android:text="@string/login_btn" 
                android:textColor="@color/black" 
                android:textStyle="bold" 
                android:background="@drawable/bg_button_cyber" 
                android:layout_width="match_parent" android:layout_height="60dp"/>
                
        </LinearLayout>
        EOF

        # 2. DASHBOARD (Kart Tasarımı)
        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" 
            android:padding="24dp" android:background="@color/bg_main">
            
            <TextView android:id="@+id/tvUser" 
                android:text="Hoşgeldiniz" 
                android:textColor="@color/accent_blue" 
                android:textSize="24sp" android:textStyle="bold"
                android:layout_marginBottom="40dp"/>
            
            <Button android:id="@+id/btnLive" 
                android:text="CANLI YAYINLAR" 
                android:background="@drawable/bg_card_cyber" 
                android:textColor="@color/text_white" 
                android:textSize="18sp"
                android:layout_marginBottom="20dp" 
                android:layout_width="match_parent" android:layout_height="80dp"/>
            
            <Button android:id="@+id/btnVod" 
                android:text="FİLMLER (VOD)" 
                android:background="@drawable/bg_card_cyber" 
                android:textColor="@color/text_white" 
                android:textSize="18sp"
                android:layout_marginBottom="20dp" 
                android:layout_width="match_parent" android:layout_height="80dp"/>
            
            <Button android:id="@+id/btnSeries" 
                android:text="DİZİLER" 
                android:background="@drawable/bg_card_cyber" 
                android:textColor="@color/text_white" 
                android:textSize="18sp"
                android:layout_width="match_parent" android:layout_height="80dp"/>
                
        </LinearLayout>
        EOF

        # 3. LIST (Liste Arka Planı ve Başlık)
        cat <<EOF > app/src/main/res/layout/activity_list.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:background="@color/bg_main">
            
            <TextView android:id="@+id/tvTitle" 
                android:text="KATEGORİ" 
                android:textColor="@color/black" 
                android:textSize="20sp" 
                android:textStyle="bold" 
                android:padding="20dp" 
                android:gravity="center" 
                android:background="@color/accent_blue"/>
            
            <ListView android:id="@+id/listView" 
                android:layout_width="match_parent" 
                android:layout_height="match_parent"
                android:divider="#333333"
                android:dividerHeight="1dp"/>
                
        </LinearLayout>
        EOF

        # 4. PLAYER
        cat <<EOF > app/src/main/res/layout/activity_player.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/black">
            <androidx.media3.ui.PlayerView android:id="@+id/player_view" android:layout_width="match_parent" android:layout_height="match_parent" />
        </FrameLayout>
        EOF

        # --- G. KOTLIN KODLARI ---

        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import com.google.android.gms.ads.MobileAds
        import $PACKAGE_NAME.R
        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                try {
                    setContentView(R.layout.activity_login)
                    MobileAds.initialize(this) {}
                    val btnLogin = findViewById<Button>(R.id.btnLogin)
                    val etUrl = findViewById<EditText>(R.id.etUrl)
                    val etUser = findViewById<EditText>(R.id.etUser)
                    val etPass = findViewById<EditText>(R.id.etPass)
                    btnLogin.setOnClickListener {
                        val url = etUrl.text.toString().trim()
                        val user = etUser.text.toString().trim()
                        val pass = etPass.text.toString().trim()
                        if(url.isNotEmpty() && user.isNotEmpty()){
                            val intent = Intent(this, DashboardActivity::class.java)
                            intent.putExtra("url", url)
                            intent.putExtra("user", user)
                            intent.putExtra("pass", pass)
                            startActivity(intent)
                        } else { Toast.makeText(this, "Lütfen tüm alanları doldurun", Toast.LENGTH_SHORT).show() }
                    }
                } catch (e: Exception) { e.printStackTrace() }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)
                val url = intent.getStringExtra("url")
                val user = intent.getStringExtra("user")
                val pass = intent.getStringExtra("pass")
                findViewById<TextView>(R.id.tvUser).text = "Hoşgeldin, " + user
                fun goToList(type: String) {
                    val intent = Intent(this, ListActivity::class.java)
                    intent.putExtra("url", url)
                    intent.putExtra("user", user)
                    intent.putExtra("pass", pass)
                    intent.putExtra("type", type)
                    startActivity(intent)
                }
                findViewById<Button>(R.id.btnLive).setOnClickListener { goToList("live") }
                findViewById<Button>(R.id.btnVod).setOnClickListener { goToList("movie") }
                findViewById<Button>(R.id.btnSeries).setOnClickListener { goToList("series") }
            }
        }
        EOF

        # Liste Adaptörü: Basit layout kullanıyoruz ama tema sayesinde yazılar beyaz olacak.
        cat <<EOF > app/src/main/java/$PATH_NAME/ListActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.ArrayAdapter
        import android.widget.ListView
        import android.widget.TextView
        import android.graphics.Color
        import android.view.View
        import android.view.ViewGroup
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        class ListActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_list)
                val type = intent.getStringExtra("type") ?: "live"
                val url = intent.getStringExtra("url") ?: ""
                val user = intent.getStringExtra("user") ?: ""
                val pass = intent.getStringExtra("pass") ?: ""
                
                findViewById<TextView>(R.id.tvTitle).text = type.uppercase() + " LISTESI"
                val listView = findViewById<ListView>(R.id.listView)
                
                val items = when(type) {
                    "live" -> listOf("TR: Ulusal 1 HD", "TR: Spor 1 HD", "TR: Sinema Action", "DE: Sport 1", "UK: BBC News", "US: Fox Action")
                    "movie" -> listOf("Avatar: The Way of Water", "Hızlı ve Öfkeli 10", "John Wick 4", "Oppenheimer", "Barbie", "The Batman")
                    else -> listOf("Breaking Bad", "Game of Thrones", "La Casa De Papel", "The Witcher", "Stranger Things")
                }

                // Özel Adapter: Yazı rengini garanti beyaz yapmak için
                val adapter = object : ArrayAdapter<String>(this, android.R.layout.simple_list_item_1, items) {
                    override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                        val view = super.getView(position, convertView, parent)
                        val textView = view.findViewById<TextView>(android.R.id.text1)
                        textView.setTextColor(Color.WHITE) // Yazıyı zorla beyaz yap
                        textView.textSize = 18f
                        return view
                    }
                }
                listView.adapter = adapter
                
                listView.setOnItemClickListener { _, _, position, _ ->
                    val streamId = position + 100
                    var finalUrl = ""
                    if(type == "live") finalUrl = "\$url/live/\$user/\$pass/\$streamId.ts"
                    else finalUrl = "\$url/movie/\$user/\$pass/\$streamId.mp4"
                    val intent = Intent(this, PlayerActivity::class.java)
                    intent.putExtra("stream_url", finalUrl)
                    startActivity(intent)
                }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView
        import $PACKAGE_NAME.R
        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            private lateinit var playerView: PlayerView
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_player)
                playerView = findViewById(R.id.player_view)
                val streamUrl = intent.getStringExtra("stream_url") ?: ""
                initializePlayer(streamUrl)
            }
            private fun initializePlayer(url: String) {
                player = ExoPlayer.Builder(this).build()
                playerView.player = player
                val mediaItem = MediaItem.fromUri(url)
                player!!.setMediaItem(mediaItem)
                player!!.prepare()
                player!!.play()
            }
            override fun onStop() {
                super.onStop()
                player?.release()
                player = null
            }
        }
        EOF
        
        echo "✅ DOSYALAR TAMAMLANDI"

    - name: 3. Gradle 8.0 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 4. APK Derleme
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon --stacktrace

    - name: 5. APK'yı Yükle
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-cyber-v6
        path: |
          ErdinPlayer/app/build/outputs/apk/release/*.apk
