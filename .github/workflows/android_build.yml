class PlayerActivity : AppCompatActivity() {

    private lateinit var prefs: Prefs
    private var player: ExoPlayer? = null
    private lateinit var pv: PlayerView
    private lateinit var controlsOverlay: View
    private lateinit var pbLoading: ProgressBar
    private lateinit var tvCenterInfo: TextView
    private lateinit var tvBrightness: TextView
    private lateinit var tvVolume: TextView
    private lateinit var tvPosition: TextView
    private lateinit var tvDuration: TextView
    private lateinit var tvTitle: TextView
    private lateinit var seekBar: SeekBar
    private lateinit var ivPlayPause: ImageView
    private lateinit var gestureLeft: View
    private lateinit var gestureRight: View
    private lateinit var liveBadge: View

    private var audio: AudioManager? = null
    private var maxVol = 15
    private var gestureVolStart = 0
    private var gestureBrightStart = 0.5f
    private var gestureY = 0f
    private var isGesture = false

    private var tapLeftLast = 0L; private var tapLeftCount = 0
    private var tapRightLast = 0L; private var tapRightCount = 0

    private var playUrl = ""; private var playTitle = ""; private var playType = "LIVE"
    private var thumbUrl = ""; private var referer = ""; private var origin = ""; private var itemId = ""
    private var seekBarDragging = false
    private var controlsVisible = true
    private var aspectMode = 0    // 0=FIT 1=FILL 2=ZOOM

    // StreamPort'taki gibi çoklu format denemesi
    private var candidates = listOf<String>()
    private var attempt = 0

    private val seekMs get() = prefs.getSeekSec() * 1000L
    private val UA = "Mozilla/5.0 (Linux; Android 12; SM-G998B) AppleWebKit/537.36"
    private val handler = Handler(Looper.getMainLooper())

    private val hideOverlay = Runnable {
        tvBrightness.visibility = View.GONE; tvVolume.visibility = View.GONE
        tvCenterInfo.visibility = View.GONE
    }
    private val hideControls = Runnable { hideCtrl() }
    private val progressTick = object : Runnable {
        override fun run() { tickProgress(); handler.postDelayed(this, 500) }
    }

    override fun onCreate(s: Bundle?) {
        super.onCreate(s)
        prefs = Prefs(this)
        window.run {
            addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
            setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
            decorView.systemUiVisibility =
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
        }
        setContentView(R.layout.activity_player)

        playUrl   = intent.getStringExtra("URL") ?: ""
        playTitle = intent.getStringExtra("TITLE") ?: ""
        playType  = intent.getStringExtra("TYPE") ?: "LIVE"
        thumbUrl  = intent.getStringExtra("THUMB") ?: ""
        referer   = intent.getStringExtra("REF") ?: ""
        origin    = intent.getStringExtra("ORIGIN") ?: ""
        itemId    = intent.getStringExtra("ITEM_ID") ?: ""

        if (playUrl.isEmpty()) { toast("Geçersiz URL"); finish(); return }

        // StreamPort buildCandidates mantığı
        candidates = buildCandidates(playUrl, playType)

        bindViews()
        audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
        maxVol = audio?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15
        val lp = window.attributes
        gestureBrightStart = if (lp.screenBrightness in 0f..1f) lp.screenBrightness else 0.5f

        pv.useController = false
        applyAspect()
        setupGestures()
        setupSeekBar()
        buildPlayer(candidates[attempt])
        handler.post(progressTick)
        scheduleHide()
    }

    // ─── Çoklu format deneme (StreamPort gibi) ────────────────────────
    private fun buildCandidates(url: String, type: String): List<String> {
        val set = linkedSetOf(url)
        if (type == "LIVE") {
            val base = url.replace(Regex("\\.(m3u8|ts|mp4)(\\?.*)?$", RegexOption.IGNORE_CASE), "")
            set.add("$base.ts"); set.add("$base.m3u8"); set.add(base)
        }
        return set.filter { it.isNotEmpty() }
    }

    private fun buildPlayer(url: String) {
        player?.release()
        val headers = mutableMapOf("User-Agent" to UA)
        if (referer.isNotEmpty()) headers["Referer"] = referer
        if (origin.isNotEmpty())  headers["Origin"]  = origin
        val factory = DefaultHttpDataSource.Factory()
            .setConnectTimeoutMs(20_000).setReadTimeoutMs(40_000)
            .setDefaultRequestProperties(headers)
        val exo = ExoPlayer.Builder(this)
            .setMediaSourceFactory(DefaultMediaSourceFactory(factory)).build()
        player = exo; pv.player = exo
        exo.setMediaItem(MediaItem.fromUri(url))
        exo.prepare(); exo.playWhenReady = true

        exo.addListener(object : Player.Listener {
            override fun onIsPlayingChanged(playing: Boolean) {
                ivPlayPause.setImageResource(
                    if (playing) R.drawable.ic_pause else R.drawable.ic_play)
                pbLoading.visibility = View.GONE
            }
            override fun onPlaybackStateChanged(state: Int) {
                pbLoading.visibility = if (state == Player.STATE_BUFFERING) View.VISIBLE else View.GONE
                if (state == Player.STATE_READY && playType != "LIVE") {
                    seekBar.visibility = View.VISIBLE
                    tvPosition.visibility = View.VISIBLE; tvDuration.visibility = View.VISIBLE
                }
            }
            override fun onPlayerError(err: PlaybackException) {
                // Bir sonraki formatı dene (StreamPort gibi)
                if (attempt + 1 < candidates.size) {
                    attempt++
                    center("Format ${attempt + 1}/${candidates.size}…")
                    buildPlayer(candidates[attempt])
                } else {
                    toast("Oynatma hatası: ${err.message}")
                    RemoteLogger.send(this@PlayerActivity, "player_error",
                        mapOf("url" to url, "err" to (err.message ?: "")))
                }
            }
        })
    }

    private fun bindViews() {
        pv             = findViewById(R.id.playerView)
        controlsOverlay= findViewById(R.id.controlsOverlay)
        pbLoading      = findViewById(R.id.pbPlayerLoading)
        tvCenterInfo   = findViewById(R.id.tvCenterInfo)
        tvBrightness   = findViewById(R.id.tvBrightness)
        tvVolume       = findViewById(R.id.tvVolume)
        tvPosition     = findViewById(R.id.tvPosition)
        tvDuration     = findViewById(R.id.tvDuration)
        tvTitle        = findViewById(R.id.tvPlayerTitle)
        seekBar        = findViewById(R.id.seekBar)
        ivPlayPause    = findViewById(R.id.ivPlayPause)
        gestureLeft    = findViewById(R.id.gestureLeft)
        gestureRight   = findViewById(R.id.gestureRight)
        liveBadge      = findViewById(R.id.liveBadge)

        tvTitle.text = playTitle

        if (playType == "LIVE") liveBadge.visibility = View.VISIBLE
        else { liveBadge.visibility = View.GONE }

        // Gizle canlı seek
        if (playType == "LIVE") {
            seekBar.visibility = View.GONE
            tvPosition.visibility = View.GONE; tvDuration.visibility = View.GONE
            val rw = findViewById<View>(R.id.btnRewind)
            val fw = findViewById<View>(R.id.btnForward)
            rw.alpha = 0.3f; fw.alpha = 0.3f
        }

        findViewById<View>(R.id.btnBack).setOnClickListener { finish() }
        findViewById<View>(R.id.btnPlayPause).setOnClickListener { togglePlay(); reHide() }
        findViewById<View>(R.id.btnRewind).setOnClickListener {
            if (playType != "LIVE") { seekBy(-seekMs); center("−${seekMs/1000}sn"); reHide() }
        }
        findViewById<View>(R.id.btnForward).setOnClickListener {
            if (playType != "LIVE") { seekBy(seekMs); center("+${seekMs/1000}sn"); reHide() }
        }
        findViewById<View>(R.id.btnAspect).setOnClickListener {
            aspectMode = (aspectMode + 1) % 3; applyAspect()
            center(listOf("Sığdır","Doldur","Zoom")[aspectMode]); reHide()
        }

        // Overlay tap: kontrolleri aç/kapat
        controlsOverlay.setOnClickListener {
            if (controlsVisible) hideCtrl() else showCtrl()
        }
        // Arka plan tıklaması ile de aç
        pv.setOnClickListener { if (!controlsVisible) showCtrl() else scheduleHide() }
    }

    private fun setupSeekBar() {
        seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
            override fun onProgressChanged(sb: SeekBar, p: Int, fromUser: Boolean) {
                if (fromUser) {
                    val dur = player?.duration ?: 0L
                    if (dur > 0) {
                        val t = p.toLong() * dur / 1000L
                        center("%02d:%02d".format(t/60000, (t/1000)%60))
                    }
                }
            }
            override fun onStartTrackingTouch(sb: SeekBar) {
                seekBarDragging = true; handler.removeCallbacks(hideControls)
            }
            override fun onStopTrackingTouch(sb: SeekBar) {
                seekBarDragging = false
                val dur = player?.duration ?: 0L
                if (dur > 0) player?.seekTo(sb.progress.toLong() * dur / 1000L)
                scheduleHide()
            }
        })
    }

    private fun setupGestures() {
        val gestureListener = { v: View, isLeft: Boolean ->
            v.setOnTouchListener { _, event ->
                when (event.action) {
                    MotionEvent.ACTION_DOWN -> {
                        gestureY = event.y; isGesture = false
                        gestureVolStart = audio?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: (maxVol/2)
                        gestureBrightStart = window.attributes.screenBrightness.let { if (it in 0f..1f) it else 0.5f }
                        showCtrl(); true
                    }
                    MotionEvent.ACTION_MOVE -> {
                        val dy = event.y - gestureY
                        if (abs(dy) > 30) {
                            isGesture = true
                            val pct = -dy / v.height.toFloat()
                            if (isLeft) adjustBrightness(pct) else adjustVolume(pct)
                        }; true
                    }
                    MotionEvent.ACTION_UP -> {
                        if (!isGesture) {
                            val now = System.currentTimeMillis()
                            if (isLeft) {
                                tapLeftCount = if (now - tapLeftLast < 350) tapLeftCount+1 else 1
                                tapLeftLast = now
                                if (tapLeftCount >= 2 && playType != "LIVE") {
                                    tapLeftCount = 0; seekBy(-seekMs); center("−${seekMs/1000}sn")
                                }
                            } else {
                                tapRightCount = if (now - tapRightLast < 350) tapRightCount+1 else 1
                                tapRightLast = now
                                if (tapRightCount >= 2 && playType != "LIVE") {
                                    tapRightCount = 0; seekBy(seekMs); center("+${seekMs/1000}sn")
                                }
                            }
                        }
                        handler.removeCallbacks(hideOverlay); handler.postDelayed(hideOverlay, 1500)
                        scheduleHide(); true
                    }
                    else -> false
                }
            }
        }
        gestureListener(gestureLeft, true)
        gestureListener(gestureRight, false)
    }

    private fun tickProgress() {
        val p = player ?: return
        val dur = p.duration; val pos = p.currentPosition
        if (dur <= 0 || playType == "LIVE" || seekBarDragging) return
        seekBar.progress = if (dur > 0) (pos * 1000 / dur).toInt() else 0
        tvPosition.text = "%02d:%02d".format(pos/60000, (pos/1000)%60)
        tvDuration.text = "%02d:%02d".format(dur/60000, (dur/1000)%60)

        // Resume kaydet (her 10 saniyede bir)
        if (itemId.isNotEmpty() && pos > 5000 && dur > 10000 && (pos/1000)%10 == 0L) {
            prefs.saveResume(ResumeItem(
                itemId, if (playType == "SERIES") "series" else "movie",
                playTitle, thumbUrl, playUrl, pos/1000, dur/1000, System.currentTimeMillis()
            ))
        }
    }

    private fun togglePlay() { player?.let { if (it.isPlaying) it.pause() else it.play() } }
    private fun seekBy(ms: Long) {
        val p = player ?: return
        p.seekTo((p.currentPosition + ms).coerceIn(0L, if (p.duration>0) p.duration else Long.MAX_VALUE))
    }
    private fun applyAspect() {
        pv.resizeMode = when(aspectMode) {
            0 -> AspectRatioFrameLayout.RESIZE_MODE_FIT
            1 -> AspectRatioFrameLayout.RESIZE_MODE_FILL
            else -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
        }
    }
    private fun adjustVolume(pct: Float) {
        val newV = (gestureVolStart + (pct * maxVol)).toInt().coerceIn(0, maxVol)
        audio?.setStreamVolume(AudioManager.STREAM_MUSIC, newV, 0)
        tvVolume.text = "🔊 ${newV*100/maxVol}%"; tvVolume.visibility = View.VISIBLE
    }
    private fun adjustBrightness(pct: Float) {
        val newB = (gestureBrightStart + pct).coerceIn(0.01f, 1f)
        window.attributes = window.attributes.also { it.screenBrightness = newB }
        gestureBrightStart = newB
        tvBrightness.text = "☀ ${(newB*100).toInt()}%"; tvBrightness.visibility = View.VISIBLE
    }
    private fun center(msg: String) {
        tvCenterInfo.text = msg; tvCenterInfo.visibility = View.VISIBLE
        handler.removeCallbacks(hideOverlay); handler.postDelayed(hideOverlay, 1500)
    }
    private fun showCtrl() {
        controlsVisible = true; controlsOverlay.visibility = View.VISIBLE; scheduleHide()
    }
    private fun hideCtrl() {
        controlsVisible = false; controlsOverlay.visibility = View.GONE
    }
    private fun scheduleHide() {
        handler.removeCallbacks(hideControls); handler.postDelayed(hideControls, 4000)
    }
    private fun reHide() { showCtrl() }

    override fun dispatchKeyEvent(ev: KeyEvent): Boolean {
        if (ev.action != KeyEvent.ACTION_DOWN) return super.dispatchKeyEvent(ev)
        showCtrl()
        return when (ev.keyCode) {
            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER,
            KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> { togglePlay(); true }
            KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_MEDIA_REWIND ->
                if (playType != "LIVE") { seekBy(-seekMs); center("−${seekMs/1000}sn"); true } else false
            KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_MEDIA_FAST_FORWARD ->
                if (playType != "LIVE") { seekBy(seekMs); center("+${seekMs/1000}sn"); true } else false
            KeyEvent.KEYCODE_DPAD_UP -> {
                val nv = ((audio?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: 0) + 1).coerceAtMost(maxVol)
                audio?.setStreamVolume(AudioManager.STREAM_MUSIC, nv, 0)
                center("🔊 ${nv*100/maxVol}%"); true
            }
            KeyEvent.KEYCODE_DPAD_DOWN -> {
                val nv = ((audio?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: 0) - 1).coerceAtLeast(0)
                audio?.setStreamVolume(AudioManager.STREAM_MUSIC, nv, 0)
                center("🔊 ${nv*100/maxVol}%"); true
            }
            KeyEvent.KEYCODE_BACK -> { finish(); true }
            else -> super.dispatchKeyEvent(ev)
        }
    }

    private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_LONG).show()
    override fun onPause()   { super.onPause();   player?.pause() }
    override fun onStop()    { super.onStop();    player?.pause() }
    override fun onDestroy() {
        super.onDestroy()
        handler.removeCallbacksAndMessages(null)
        player?.release(); player = null
    }
}
