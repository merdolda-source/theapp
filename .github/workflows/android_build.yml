package com.emin.xtream.player

import android.content.Intent
import android.os.Bundle
import android.view.View
import android.widget.*
import androidx.appcompat.app.AppCompatActivity
import androidx.recyclerview.widget.GridLayoutManager
import androidx.recyclerview.widget.RecyclerView
import com.emin.xtream.player.adapters.GridAdapter
import com.emin.xtream.player.models.EpisodeItem
import com.emin.xtream.player.utils.Prefs
import com.emin.xtream.player.utils.RemoteConfig
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL

class SeriesDetailActivity : AppCompatActivity() {
    private val FAKE_UA = "Mozilla/5.0 (Linux; Android 12; SM-G998B)"

    private lateinit var prefs: Prefs
    private lateinit var rv: RecyclerView
    private lateinit var pb: ProgressBar
    private lateinit var tvTitle: TextView
    private lateinit var tvStatus: TextView
    private lateinit var spinnerSeason: Spinner
    private lateinit var gridAdapter: GridAdapter

    private var seriesId = ""
    private var seriesName = ""
    private var allEpisodes = mutableListOf<EpisodeItem>()
    private var seasons = mutableListOf<Int>()
    private var displayMapIndex = ArrayList<Int>()

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_series_detail)

        prefs = Prefs(this)
        seriesId = intent.getStringExtra("SERIES_ID") ?: ""
        seriesName = intent.getStringExtra("SERIES_NAME") ?: "Seri"

        rv = findViewById(R.id.rvEpisodes)
        pb = findViewById(R.id.progressBar)
        tvTitle = findViewById(R.id.tvTitle)
        tvStatus = findViewById(R.id.tvStatus)
        spinnerSeason = findViewById(R.id.spinnerSeason)
        tvTitle.text = seriesName

        rv.layoutManager = GridLayoutManager(this, 2)
        gridAdapter = GridAdapter(emptyList(), emptyList()) { pos -> onEpisodeClick(pos) }
        rv.adapter = gridAdapter

        // Geri butonu
        findViewById<View>(R.id.btnBack).setOnClickListener { onBackPressed() }

        loadSeriesInfo(seriesId)
    }

    private fun onEpisodeClick(pos: Int) {
        if (pos < 0 || pos >= displayMapIndex.size) return
        val idx = displayMapIndex[pos]
        if (idx < 0 || idx >= allEpisodes.size) return
        playEpisode(allEpisodes[idx])
    }

    private fun playEpisode(ep: EpisodeItem) {
        val acc = prefs.getActive() ?: return
        val baseUrl = prefs.buildBaseUrl(acc)
        val user = (acc.user ?: "").trim()
        val pass = acc.pass?.trim() ?: ""
        val ext = ep.container_extension ?: "mp4"
        val url = "$baseUrl/series/$user/$pass/${ep.id}.$ext"
        startActivity(Intent(this, PlayerActivity::class.java).apply {
            putExtra("URL", url); putExtra("TITLE", "${seriesName} S${ep.seasonNumber}E${ep.episodeNumber}")
            putExtra("TYPE", "VOD"); putExtra("REF", ""); putExtra("ORG", "")
        })
    }

    private fun showSeason(season: Int) {
        val eps = allEpisodes.filter { it.seasonNumber == season }.sortedBy { it.episodeNumber }
        val adInterval = RemoteConfig.getBannerListInterval(this)
        val titles = ArrayList<String>()
        val subs = ArrayList<String>()
        displayMapIndex = ArrayList<Int>()
        var count = 0
        for (i in eps.indices) {
            titles.add("B${eps[i].episodeNumber}: ${eps[i].title}")
            subs.add("Sezon $season • Bölüm ${eps[i].episodeNumber}")
            val globalIdx = allEpisodes.indexOf(eps[i])
            displayMapIndex.add(globalIdx)
            count++
            if (adInterval > 0 && count % adInterval == 0) {
                titles.add("###AD###"); subs.add(""); displayMapIndex.add(-1)
            }
        }
        gridAdapter.update(titles, subs)
        tvTitle.text = "$seriesName • Sezon $season"
        (rv.layoutManager as? GridLayoutManager)?.scrollToPositionWithOffset(0, 0)
    }

    private fun loadSeriesInfo(seriesId: String) {
        val acc = prefs.getActive() ?: return
        val baseUrl = prefs.buildBaseUrl(acc)
        val user = (acc.user ?: "").trim()
        val pass = acc.pass?.trim() ?: ""
        val url = "$baseUrl/player_api.php?username=$user&password=$pass&action=get_series_info&series_id=$seriesId"
        pb.visibility = View.VISIBLE
        tvStatus.visibility = View.GONE

        Thread {
            try {
                val conn = (URL(url).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 15000; readTimeout = 25000
                    requestMethod = "GET"
                    setRequestProperty("User-Agent", FAKE_UA)
                }
                if (conn.responseCode != 200) {
                    runOnUiThread { showError("Sunucu yanıtı: ${conn.responseCode}") }
                    return@Thread
                }
                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val obj = JSONObject(body)
                val epObj = obj.optJSONObject("episodes") ?: JSONObject()
                allEpisodes.clear(); seasons.clear()

                val keys = epObj.keys()
                while (keys.hasNext()) {
                    val key = keys.next()
                    val num = key.toIntOrNull() ?: continue
                    if (num !in seasons) seasons.add(num)
                    val arr = epObj.optJSONArray(key) ?: continue
                    for (i in 0 until arr.length()) {
                        val ep = arr.getJSONObject(i)
                        allEpisodes.add(EpisodeItem(
                            id = ep.optString("id", ""),
                            title = ep.optString("title", "Bölüm"),
                            seasonNumber = num,
                            episodeNumber = ep.optInt("episode_num", 1),
                            container_extension = ep.optString("container_extension", "mp4")
                        ))
                    }
                }
                seasons.sort()

                runOnUiThread {
                    pb.visibility = View.GONE
                    if (seasons.isEmpty()) { showError("Bölüm bulunamadı"); return@runOnUiThread }

                    // Spinner kurulumu
                    val seasonLabels = seasons.map { "Sezon $it" }
                    val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_item, seasonLabels)
                    adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                    spinnerSeason.adapter = adapter
                    spinnerSeason.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                        override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                            showSeason(seasons[position])
                        }
                        override fun onNothingSelected(parent: AdapterView<*>?) {}
                    }
                    spinnerSeason.visibility = View.VISIBLE
                    showSeason(seasons[0])
                }
            } catch (e: Exception) {
                runOnUiThread { showError("Bilgi alınamadı: ${e.message}") }
            }
        }.start()
    }

    private fun showError(msg: String) {
        pb.visibility = View.GONE
        tvStatus.text = msg
        tvStatus.visibility = View.VISIBLE
    }

    override fun onBackPressed() {
        super.onBackPressed()
        overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
    }
}
