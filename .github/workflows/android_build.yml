            private fun applyGlobalSearch(qRaw: String) {
                 val q = qRaw.trim().lowercase(Locale.getDefault())
                 if (rv.visibility != View.VISIBLE) return
                 
                 screen = Screen.ITEMS 
                 displayMapType = "STREAM"
                 
                 val filtered = streamsAll.filter {
                        it.name.lowercase(Locale.getDefault()).contains(q)
                 }
                 filteredStreamIdx = filtered.map { streamsAll.indexOf(it) }
                 
                 val tempTitles = ArrayList<String>()
                 val tempSubs = ArrayList<String>()
                 val tempIndexMap = ArrayList<Int>()
                 
                 for (i in filtered.indices) {
                     tempTitles.add(filtered[i].name)
                     tempSubs.add("Kategori: " + (categoriesAll.find{ it.category_id == filtered[i].category_id }?.category_name ?: "-"))
                     tempIndexMap.add(i)
                 }
                 
                 displayTitles = tempTitles
                 displaySubtitles = tempSubs
                 displayMapIndex = tempIndexMap
                 gridAdapter?.update(displayTitles, displaySubtitles)
            }

            private fun applySearchFilter(qRaw: String) {
                val q = qRaw.trim().lowercase(Locale.getDefault())
                if (rv.visibility != View.VISIBLE) return
                
                val adInterval = RemoteConfig.getBannerListInterval(this)
                val tempTitles = ArrayList<String>()
                val tempSubs = ArrayList<String>()
                val tempIndexMap = ArrayList<Int>()
                
                if (screen == Screen.CATEGORIES) {
                    displayMapType = "CAT"
                    val cats = if (q.isEmpty()) categoriesAll else categoriesAll.filter {
                        it.category_name.lowercase(Locale.getDefault()).contains(q)
                    }
                    filteredCategoryIds = cats.map { it.category_id }
                    
                    var count = 0
                    for (i in cats.indices) {
                        tempTitles.add(cats[i].category_name)
                        tempSubs.add("")
                        tempIndexMap.add(i) 
                        
                        count++
                        if (adInterval > 0 && count % adInterval == 0) {
                            tempTitles.add("###AD###")
                            tempSubs.add("")
                            tempIndexMap.add(-1)
                        }
                    }
                    
                } else {
                    displayMapType = "STREAM"
                    val catId = selectedCategory?.category_id
                    val items = if (catId.isNullOrEmpty()) streamsAll else streamsAll.filter { it.category_id == catId }
                    val filtered = if (q.isEmpty()) items else items.filter {
                        it.name.lowercase(Locale.getDefault()).contains(q)
                    }
                    filteredStreamIdx = filtered.map { streamsAll.indexOf(it) }
                    
                    var count = 0
                    for (i in filtered.indices) {
                        tempTitles.add(filtered[i].name)
                        tempSubs.add("")
                        tempIndexMap.add(i)
                        
                        count++
                        if (adInterval > 0 && count % adInterval == 0) {
                            tempTitles.add("###AD###")
                            tempSubs.add("")
                            tempIndexMap.add(-1)
                        }
                    }
                }
                
                displayTitles = tempTitles
                displaySubtitles = tempSubs
                displayMapIndex = tempIndexMap
                
                gridAdapter?.update(displayTitles, displaySubtitles)
            }
            
            private fun onGridClick(position: Int) {
                if (position < 0 || position >= displayMapIndex.size) return
                
                val realIndex = displayMapIndex[position]
                if (realIndex == -1) return
                
                val acc = activeAcc ?: return
                
                if (screen == Screen.CATEGORIES) {
                    if (realIndex < filteredCategoryIds.size) {
                        val catId = filteredCategoryIds[realIndex]
                        val cat = categoriesAll.find { it.category_id == catId } ?: return
                        showItemsForCategory(cat)
                    }
                    return
                }
                
                if (realIndex < filteredStreamIdx.size) {
                    val globalIdx = filteredStreamIdx[realIndex]
                    if (globalIdx !in streamsAll.indices) return
                    val item = streamsAll[globalIdx]
                    
                    if (acc.type == "M3U") {
                        val url = item.full_url
                        if (url.isNullOrEmpty()) {
                            Toast.makeText(this, "Geçersiz M3U kanalı.", Toast.LENGTH_SHORT).show()
                            return
                        }
                        val itn = Intent(this, PlayerActivity::class.java)
                        itn.putExtra("URL", url)
                        itn.putExtra("REF", item.referer ?: "")
                        itn.putExtra("ORG", item.origin ?: "")
                        itn.putExtra("TYPE", "LIVE")
                        AdsHelper.maybeShowOnChannelClick(this) {
                            RemoteLogger.sendEvent(this, "play_m3u", mapOf("channel_name" to item.name))
                            startActivity(itn)
                        }
                        return
                    }
                    if (currentMode == "SERIES" && item.series_id != null) {
                        val itn = Intent(this, SeriesDetailActivity::class.java)
                        itn.putExtra("SERIES_ID", item.series_id ?: "")
                        itn.putExtra("SERIES_NAME", item.name)
                        startActivity(itn)
                        return
                    }
                    val dnsRaw = acc.dns?.trim() ?: ""
                    val user = (acc.user ?: "").trim().replace("""\s+""".toRegex(), "")
                    val pass = acc.pass?.trim() ?: ""
                    if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                        Toast.makeText(this, "DNS / kullanıcı / şifre boş.", Toast.LENGTH_SHORT).show()
                        return
                    }
                    val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                    val path = if (currentMode == "LIVE") "live" else "movie"
                    val ext = if (currentMode == "LIVE") ".ts" else {
                        if (!item.container_extension.isNullOrEmpty()) "." + item.container_extension else ".mp4"
                    }
                    val id = item.stream_id ?: ""
                    val playUrl = dns + "/" + path + "/" + user + "/" + pass + "/" + id + ext
                    val itn = Intent(this, PlayerActivity::class.java)
                    itn.putExtra("URL", playUrl)
                    itn.putExtra("REF", "")
                    itn.putExtra("ORG", "")
                    itn.putExtra("TYPE", if (currentMode == "LIVE") "LIVE" else "VOD")
                    AdsHelper.maybeShowOnChannelClick(this) {
                        RemoteLogger.sendEvent(this, "play_xtream", mapOf("channel_name" to item.name, "mode" to currentMode))
                        startActivity(itn)
                    }
                }
            }
            
            private fun fetchCategoriesAndStreams() {
                val acc = activeAcc ?: return
                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE
                if (acc.type == "M3U") {
                    var m3uUrl = acc.m3u?.trim() ?: ""
                    if (m3uUrl.isEmpty()) {
                        pb.visibility = View.GONE
                        tvStatus.text = "Bu M3U hesabında link yok."
                        tvStatus.visibility = View.VISIBLE
                        return
                    }
                    Thread {
                        try {
                            val result = fetchM3u(m3uUrl)
                            val cats = result.first
                            val streamsList = result.second
                            runOnUiThread {
                                pb.visibility = View.GONE
                                categoriesAll = cats
                                streamsAll = streamsList
                                tvDrawerExpire.text = "Süre: M3U Playlist"
                                showCategories()
                            }
                        } catch (e: Exception) {
                            runOnUiThread {
                                pb.visibility = View.GONE
                                tvStatus.text = "M3U okunamadı: " + (e.message ?: "bilinmeyen hata")
                                tvStatus.visibility = View.VISIBLE
                            }
                            RemoteLogger.sendEvent(this, "m3u_fetch_failed", mapOf("error" to (e.message ?: "")))
                        }
                    }.start()
                    return
                }
                var dnsRaw = (acc.dns ?: "").trim()
                val user = (acc.user ?: "").trim().replace("""\s+""".toRegex(), "")
                val pass = (acc.pass ?: "").trim()
                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    pb.visibility = View.GONE
                    tvStatus.text = "DNS / kullanıcı / şifre boş."
                    tvStatus.visibility = View.VISIBLE
                    return
                }
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val base = dns + "/player_api.php?username=" + user + "&password=" + pass
                val catAction = when (currentMode) {
                    "VOD" -> "get_vod_categories"
                    "SERIES" -> "get_series_categories"
                    else -> "get_live_categories"
                }
                val streamsAction = when (currentMode) {
                    "VOD" -> "get_vod_streams"
                    "SERIES" -> "get_series"
                    else -> "get_live_streams"
                }
                val catUrl = base + "&action=" + catAction
                val streamsUrl = base + "&action=" + streamsAction
                Thread {
                    try {
                        val accInfo = fetchAccountInfo(base)
                        val fetchedCategories = fetchCategories(catUrl)
                        val fetchedStreams = fetchStreams(streamsUrl)
                        runOnUiThread {
                            pb.visibility = View.GONE
                            categoriesAll = fetchedCategories
                            streamsAll = fetchedStreams
                            val expText = formatExp(accInfo.second)
                            tvDrawerExpire.text = "Süre: " + expText
                            showCategories()
                        }
                    } catch (e: Exception) {
                        runOnUiThread {
                            pb.visibility = View.GONE
                            tvStatus.text = "Veriler alınamadı: " + (e.message ?: "bilinmeyen hata")
                            tvStatus.visibility = View.VISIBLE
                        }
                        RemoteLogger.sendEvent(this, "xtream_fetch_failed", mapOf("error" to (e.message ?: "")))
                    }
                }.start()
            }
            private fun fetchM3u(urlStr: String): Pair<List<Category>, List<StreamItem>> {
                val categoriesMap = LinkedHashMap<String, Category>()
                val streamsList = ArrayList<StreamItem>()
                val body = httpGet(urlStr)
                val lines = body.split("\n")
                var currentName = ""
                var currentGroup = "Genel"
                var currentRef: String? = null
                var currentOrg: String? = null
                
                for (raw in lines) {
                    val line = raw.trim()
                    if (line.isEmpty()) continue
                    if (line.startsWith("#EXTM3U", ignoreCase = true)) continue
                    if (line.startsWith("#EXTINF", ignoreCase = true)) {
                        var name = ""
                        var group = "Genel"
                        val groupIndex = line.indexOf("group-title=\"")
                        if (groupIndex >= 0) {
                            val start = groupIndex + "group-title=\"".length
                            val end = line.indexOf("\"", startIndex = start)
                            if (end > start) group = line.substring(start, end)
                        }
                        val commaIndex = line.lastIndexOf(',')
                        if (commaIndex >= 0 && commaIndex < line.length - 1) {
                            name = line.substring(commaIndex + 1).trim()
                        }
                        currentName = if (name.isNotEmpty()) name else "Kanal"
                        currentGroup = if (group.isNotEmpty()) group else "Genel"
                        currentRef = null
                        currentOrg = null
                    } else if (line.startsWith("#EXTVLCOPT:http-referrer=", ignoreCase = true)) {
                        val idx = line.indexOf("=")
                        if (idx >= 0 && idx < line.length - 1) currentRef = line.substring(idx + 1).trim()
                    } else if (line.startsWith("#EXTVLCOPT:http-origin=", ignoreCase = true)) {
                        val idx = line.indexOf("=")
                        if (idx >= 0 && idx < line.length - 1) currentOrg = line.substring(idx + 1).trim()
                    } else if (!line.startsWith("#")) {
                        val urlPlay = line
                        
                        val groupId = if (currentGroup.isNotEmpty()) currentGroup else "Genel"
                        val cat = categoriesMap.getOrPut(groupId) {
                            Category(groupId, groupId, false)
                        }
                        streamsList.add(
                            StreamItem(
                                name = currentName,
                                stream_id = null,
                                series_id = null,
                                container_extension = null,
                                category_id = cat.category_id,
                                full_url = urlPlay,
                                referer = currentRef,
                                origin = currentOrg
                            )
                        )
                        currentRef = null
                        currentOrg = null
                    }
                }
                return Pair(categoriesMap.values.toList(), streamsList)
            }
            private fun fetchAccountInfo(baseUrl: String): Pair<String?, String?> {
                return try {
                    val body = httpGet(baseUrl)
                    val obj = JSONObject(body)
                    val userInfo = obj.optJSONObject("user_info")
                    if (userInfo != null) {
                        Pair(userInfo.optString("username", null), userInfo.optString("exp_date", null))
                    } else Pair(null, null)
                } catch (e: Exception) {
                    Pair(null, null)
                }
            }
            private fun formatExp(exp: String?): String {
                if (exp.isNullOrEmpty() || exp == "0" || exp == "null") return "Sınırsız"
                return try {
                    val seconds = exp.toLong()
                    val date = Date(seconds * 1000L)
                    SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(date)
                } catch (e: Exception) {
                    exp
                }
            }
            private fun fetchCategories(urlStr: String): List<Category> {
                val list = ArrayList<Category>()
                val body = httpGet(urlStr)
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    val id = obj.optString("category_id", "")
                    val name = obj.optString("category_name", "Kategori " + i)
                    val isAdult = false
                    list.add(Category(id, name, isAdult))
                    i++
                }
                return list
            }
            private fun fetchStreams(urlStr: String): List<StreamItem> {
                val list = ArrayList<StreamItem>()
                val body = httpGet(urlStr)
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    val name = obj.optString("name", "Bilinmeyen")
                    val catId = obj.optString("category_id", "")
                    val streamId = obj.optString("stream_id", null)
                    val seriesId = obj.optString("series_id", null)
                    val ext = obj.optString("container_extension", null)
                    list.add(StreamItem(name, streamId, seriesId, ext, catId, null, null, null))
                    i++
                }
                return list
            }
            private fun httpGet(urlStr: String): String {
                try {
                    return doHttpGet(urlStr, 5)
                } catch (e: Exception) {
                    if (urlStr.startsWith("https://")) {
                        val httpUrl = "http://" + urlStr.substringAfter("https://")
                        try {
                            return doHttpGet(httpUrl, 5)
                        } catch (e2: Exception) {
                            throw e2
                        }
                    } else if (urlStr.startsWith("http://")) {
                        val httpsUrl = "https://" + urlStr.substringAfter("http://")
                        try {
                            return doHttpGet(httpsUrl, 5)
                        } catch (e2: Exception) {
                            throw e2
                        }
                    }
                    throw e
                }
            }
            private fun doHttpGet(urlStr: String, redirectsLeft: Int): String {
                if (redirectsLeft <= 0) throw Exception("Çok fazla yönlendirme")
                val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                    instanceFollowRedirects = false
                    connectTimeout = 25000
                    readTimeout = 35000
                    requestMethod = "GET"
                    setRequestProperty("User-Agent", FAKE_USER_AGENT)
                    setRequestProperty("Accept", "application/json,text/plain,*/*")
                    setRequestProperty("Accept-Encoding", "gzip")
                    setRequestProperty("Connection", "close")
                }
                try {
                    val code = conn.responseCode
                    if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                        val locRaw = conn.getHeaderField("Location") ?: ""
                        if (locRaw.isNotEmpty()) {
                            val loc = if (locRaw.startsWith("//")) urlStr.substringBefore(":") + ":" + locRaw else locRaw
                            conn.disconnect()
                            return doHttpGet(loc, redirectsLeft - 1)
                        }
                    }
                    val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                    val encoding = (conn.contentEncoding ?: "").lowercase(Locale.getDefault())
                    val raw = stream ?: throw Exception("HTTP " + code + " boş response")
                    val input = if (encoding.contains("gzip")) java.util.zip.GZIPInputStream(raw) else raw
                    val body = input.bufferedReader(Charsets.UTF_8).use { it.readText() }
                    val trimmed = body.trimStart()
                    if (trimmed.startsWith("<!DOCTYPE", true) || trimmed.startsWith("<html", true)) {
                        throw Exception("JSON yerine HTML döndü (muhtemel engel/koruma). İlk 200: " + trimmed.take(200))
                    }
                    if (code !in 200..299) {
                        throw Exception("HTTP " + code + ": " + body.take(300))
                    }
                    return body
                } finally {
                    try { conn.disconnect() } catch (_: Exception) {}
                }
            }
        }
