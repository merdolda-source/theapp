        import $PACKAGE_NAME.utils.Prefs
        import $PACKAGE_NAME.utils.RemoteLogger
        import $PACKAGE_NAME.utils.LangManager

        class LoginActivity : AppCompatActivity() {

            private var isXtream = true

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)

                val prefs = Prefs(this)
                val activeStartup = prefs.getActive()

                if (activeStartup != null) {
                    val i = Intent(this, ContentActivity::class.java)
                    i.putExtra("MODE", "LIVE")
                    startActivity(i)
                    finish()
                    return
                }

                val lang = "tr"
                prefs.setLang(lang)
                LangManager.restoreFromPrefs(this, lang)
                LangManager.init(this, lang)

                RemoteLogger.sendEvent(this, "screen_login_open", emptyMap())

                AdsHelper.init(this)
                val adTop = findViewById<AdView>(R.id.adViewTopLogin)
                AdsHelper.loadBanner(adTop)
                AdsHelper.loadInterstitial(this)

                val tvTitle = findViewById<TextView>(R.id.tvTitle)
                val tvLoginType = findViewById<TextView>(R.id.tvLoginType)
                val tvAccountsTitle = findViewById<TextView>(R.id.tvAccountsTitle)
                val tvAccountsHint = findViewById<TextView>(R.id.tvAccountsHint)
                val btnLang = findViewById<ImageButton>(R.id.btnLangLogin)
                btnLang.visibility = View.GONE

                val etName = findViewById<EditText>(R.id.etName)
                val etDns = findViewById<EditText>(R.id.etDns)
                val etUser = findViewById<EditText>(R.id.etUser)
                val etPass = findViewById<EditText>(R.id.etPass)
                val etM3u = findViewById<EditText>(R.id.etM3u)
                val layoutXtream = findViewById<View>(R.id.layoutXtream)
                val layoutM3u = findViewById<View>(R.id.layoutM3u)
                val cardXtream = findViewById<View>(R.id.cardXtream)
                val cardM3u = findViewById<View>(R.id.cardM3u)
                val tvXtream = findViewById<TextView>(R.id.tvXtream)
                val tvM3u = findViewById<TextView>(R.id.tvM3u)
                val btnAdd = findViewById<Button>(R.id.btnAddAccount)
                val lvAccounts = findViewById<ListView>(R.id.lvAccounts)

                fun applyLanguageTexts() {
                    tvTitle.text = LangManager.t(this, "login_title", "ErdinPlayer Pro")
                    tvLoginType.text = LangManager.t(this, "login_type", "Giriş Tipi")
                    tvXtream.text = LangManager.t(this, "login_xtream", "Xtream")
                    tvM3u.text = LangManager.t(this, "login_m3u", "M3U")
                    etName.hint = LangManager.t(this, "login_name_hint", "Hesap adı")
                    etDns.hint = LangManager.t(this, "login_dns_hint", "Xtream URL girin")
                    etUser.hint = LangManager.t(this, "login_user_hint", "Kullanıcı adı")
                    etPass.hint = LangManager.t(this, "login_pass_hint", "Şifre")
                    etM3u.hint = LangManager.t(this, "login_m3u_hint", "M3U URL girin")
                    btnAdd.text = LangManager.t(this, "login_add_button", "Hesap Ekle")
                    tvAccountsTitle.text = LangManager.t(this, "login_saved_accounts", "Kayıtlı Hesaplar")
                    tvAccountsHint.text = LangManager.t(this, "login_saved_hint", "Devam etmek için alttan bir hesap seçin")
                }

                applyLanguageTexts()

                fun updateTypeUI() {
                    if (isXtream) {
                        layoutXtream.visibility = View.VISIBLE
                        layoutM3u.visibility = View.GONE
                        cardXtream.background = getDrawable(R.drawable.bg_header_card)
                        cardM3u.background = getDrawable(R.drawable.bg_input_dark)
                    } else {
                        layoutXtream.visibility = View.GONE
                        layoutM3u.visibility = View.VISIBLE
                        cardM3u.background = getDrawable(R.drawable.bg_header_card)
                        cardXtream.background = getDrawable(R.drawable.bg_input_dark)
                    }
                }

                cardXtream.setOnClickListener { isXtream = true; updateTypeUI() }
                cardM3u.setOnClickListener { isXtream = false; updateTypeUI() }
                updateTypeUI()

                fun refreshList() {
                    val accounts: MutableList<AccountProfile> = prefs.getAccounts().toMutableList()
                    val adapter = ArrayAdapter(
                        this,
                        android.R.layout.simple_list_item_1,
                        accounts.map { a ->
                            val t = if (a.type == "M3U") "M3U" else "Xtream"
                            a.name + " - " + t
                        }
                    )
                    lvAccounts.adapter = adapter

                    lvAccounts.setOnItemClickListener { _, _, position, _ ->
                        val acc = accounts[position]
                        prefs.setActive(acc.id)
                        val i = Intent(this, ContentActivity::class.java)
                        i.putExtra("MODE", "LIVE")
                        startActivity(i)
                        finish()
                    }

                    lvAccounts.setOnItemLongClickListener { _, _, position, _ ->
                        val acc = accounts[position]
                        val dialog = AlertDialog.Builder(this)
                            .setTitle("Hesabı Sil")
                            .setMessage("Hesap silinsin mi? " + acc.name)
                            .setPositiveButton("Evet") { _, _ ->
                                prefs.deleteAccount(acc.id)
                                refreshList()
                            }
                            .setNegativeButton("Hayır", null)
                            .create()
                        dialog.show()
                        true
                    }
                }

                refreshList()

                btnAdd.setOnClickListener {
                    val name = etName.text.toString().trim()
                    val finalName = if (name.isNotEmpty()) name else "Hesap"

                    if (isXtream) {
                        var d = etDns.text.toString().trim()
                        val u = etUser.text.toString().trim().replace("""\s+""".toRegex(), "")
                        val p = etPass.text.toString().trim()

                        if (d.isEmpty() || u.isEmpty() || p.isEmpty()) {
                            Toast.makeText(this, "Xtream URL / kullanıcı adı / şifre zorunlu.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        if (!d.startsWith("http://", true) && !d.startsWith("https://", true)) {
                            d = "http://" + d
                        }
                        if (d.endsWith("/")) d = d.dropLast(1)

                        prefs.createXtreamAccount(finalName, d, u, p)
                        RemoteLogger.sendEvent(this, "account_xtream_created", mapOf(
                            "name" to finalName, "dns" to d, "user" to u
                        ))
                        Toast.makeText(this, "Hesap eklendi. Canlı TV ile açılıyor...", Toast.LENGTH_SHORT).show()
                        val i = Intent(this, ContentActivity::class.java)
                        i.putExtra("MODE", "LIVE")
                        startActivity(i)
                        finish()
                    } else {
                        val m = etM3u.text.toString().trim()
                        if (m.isEmpty()) {
                            Toast.makeText(this, "M3U URL boş olamaz.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createM3uAccount(finalName, m)
                        RemoteLogger.sendEvent(this, "account_m3u_created", mapOf(
                            "name" to finalName, "m3u_prefix" to m.take(160)
                        ))
                        Toast.makeText(this, "Hesap eklendi. Canlı TV ile açılıyor...", Toast.LENGTH_SHORT).show()
                        val i = Intent(this, ContentActivity::class.java)
                        i.putExtra("MODE", "LIVE")
                        startActivity(i)
                        finish()
                    }
                }
            }
        }
