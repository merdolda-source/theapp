        # ============ PlayerActivity (ULTIMATE MODERN EDITION) ============
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.content.Context
        import android.media.AudioManager
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.view.GestureDetector
        import android.view.MotionEvent
        import android.view.View
        import android.view.WindowManager
        import android.widget.ImageButton
        import android.widget.SeekBar
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.constraintlayout.widget.ConstraintLayout
        import androidx.media3.common.C
        import androidx.media3.common.MediaItem
        import androidx.media3.common.PlaybackException
        import androidx.media3.common.Player
        import androidx.media3.common.TrackSelectionOverride
        import androidx.media3.datasource.DefaultHttpDataSource
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
        import androidx.media3.ui.AspectRatioFrameLayout
        import androidx.media3.ui.PlayerView
        import java.util.Formatter
        import java.util.Locale
        import kotlin.math.abs

        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            private lateinit var playerView: PlayerView
            
            // UI Components
            private lateinit var controlsRoot: ConstraintLayout
            private lateinit var topControls: View
            private lateinit var bottomControls: View
            private lateinit var centerControls: View
            private lateinit var btnPlayPause: ImageButton
            private lateinit var btnLock: ImageButton
            private lateinit var btnResize: ImageButton
            private lateinit var btnAudio: ImageButton
            private lateinit var btnSubs: ImageButton
            private lateinit var seekBar: SeekBar
            private lateinit var tvCurrent: TextView
            private lateinit var tvEnd: TextView
            private lateinit var tvInfo: TextView
            private lateinit var pbLoading: View
            
            // Logic Variables
            private var isLocked = false
            private var isControlsVisible = true
            private var resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
            private val handler = Handler(Looper.getMainLooper())
            private val hideRunnable = Runnable { hideControls() }
            private val updateProgressRunnable = object : Runnable {
                override fun run() {
                    updateProgress()
                    handler.postDelayed(this, 1000)
                }
            }
            
            // Gesture Variables
            private lateinit var gestureDetector: GestureDetector
            private var audioManager: AudioManager? = null
            private var maxVolume = 15
            private var startVolume = 0
            private var startBrightness = 0.5f
            private var screenWidth = 0
            private var isScrollGesture = false
            
            private val FAKE_USER_AGENT = "Mozilla/5.0 (Linux; Android 12; SM-G998B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/108.0.0.0 Mobile Safari/537.36"

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                // Fullscreen flags
                window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN
                        or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                        or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                        or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                        or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                        or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN)
                
                setContentView(R.layout.activity_player_pro)
                
                // Init Audio & Screen
                audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                maxVolume = audioManager?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15
                screenWidth = resources.displayMetrics.widthPixels
                
                initViews()
                setupGestures()
                setupPlayer()
            }
            
            private fun initViews() {
                playerView = findViewById(R.id.pvMain)
                controlsRoot = findViewById(R.id.controlsRoot)
                topControls = findViewById(R.id.topControls)
                bottomControls = findViewById(R.id.bottomControls)
                centerControls = findViewById(R.id.centerControls)
                
                btnPlayPause = findViewById(R.id.btnPlayPause)
                btnLock = findViewById(R.id.btnLock)
                btnResize = findViewById(R.id.btnResize)
                btnAudio = findViewById(R.id.btnAudio)
                btnSubs = findViewById(R.id.btnSubs)
                seekBar = findViewById(R.id.seekBar)
                tvCurrent = findViewById(R.id.tvCurrent)
                tvEnd = findViewById(R.id.tvEnd)
                tvInfo = findViewById(R.id.tvInfo)
                pbLoading = findViewById(R.id.pbLoading)
                
                btnPlayPause.setOnClickListener { togglePlay() }
                
                btnLock.setOnClickListener {
                    isLocked = !isLocked
                    updateLockState()
                    showControls()
                }
                
                btnResize.setOnClickListener {
                    resizeMode = when (resizeMode) {
                        AspectRatioFrameLayout.RESIZE_MODE_FIT -> AspectRatioFrameLayout.RESIZE_MODE_FILL
                        AspectRatioFrameLayout.RESIZE_MODE_FILL -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                        else -> AspectRatioFrameLayout.RESIZE_MODE_FIT
                    }
                    playerView.resizeMode = resizeMode
                    val modeName = when(resizeMode) {
                        AspectRatioFrameLayout.RESIZE_MODE_FILL -> "Tam Ekran"
                        AspectRatioFrameLayout.RESIZE_MODE_ZOOM -> "Yakınlaştır"
                        else -> "Sığdır"
                    }
                    showInfo(modeName)
                    showControls()
                }
                
                btnAudio.setOnClickListener { showTrackDialog(C.TRACK_TYPE_AUDIO) }
                btnSubs.setOnClickListener { showTrackDialog(C.TRACK_TYPE_TEXT) }
                
                findViewById<View>(R.id.btnBack).setOnClickListener { finish() }
                
                seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                        if (fromUser) tvCurrent.text = formatTime(progress.toLong())
                    }
                    override fun onStartTrackingTouch(seekBar: SeekBar?) { handler.removeCallbacks(hideRunnable) }
                    override fun onStopTrackingTouch(seekBar: SeekBar?) {
                        player?.seekTo(seekBar?.progress?.toLong() ?: 0)
                        showControls()
                    }
                })
                
                // Initial State
                updateLockState()
            }
            
            private fun setupGestures() {
                gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                    override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                        if (isControlsVisible) hideControls() else showControls()
                        return true
                    }
                    
                    override fun onDoubleTap(e: MotionEvent): Boolean {
                        if (isLocked) return true
                        val x = e.x
                        if (x > screenWidth / 2) {
                            seekBy(10000)
                            showInfo(">> 10 sn")
                        } else {
                            seekBy(-10000)
                            showInfo("<< 10 sn")
                        }
                        return true
                    }
                    
                    override fun onScroll(e1: MotionEvent?, e2: MotionEvent, distanceX: Float, distanceY: Float): Boolean {
                        if (isLocked || e1 == null) return false
                        
                        // Vertical Scroll Only
                        if (abs(distanceY) > abs(distanceX)) {
                            isScrollGesture = true
                            val delta = distanceY / resources.displayMetrics.heightPixels
                            
                            if (e1.x < screenWidth / 2) {
                                // Left: Brightness
                                changeBrightness(delta)
                            } else {
                                // Right: Volume
                                changeVolume(delta)
                            }
                            return true
                        }
                        return false
                    }
                    
                    override fun onDown(e: MotionEvent): Boolean {
                        startVolume = audioManager?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: 0
                        startBrightness = window.attributes.screenBrightness
                        if (startBrightness < 0) startBrightness = 0.5f
                        isScrollGesture = false
                        return true
                    }
                })
                
                controlsRoot.setOnTouchListener { _, event ->
                    gestureDetector.onTouchEvent(event)
                    if (event.action == MotionEvent.ACTION_UP && isScrollGesture) {
                        isScrollGesture = false
                        // Optional: Hide info after gesture ends
                    }
                    true
                }
            }
            
            private fun changeBrightness(delta: Float) {
                var new = startBrightness + delta
                if (new < 0.01f) new = 0.01f
                if (new > 1f) new = 1f
                val lp = window.attributes
                lp.screenBrightness = new
                window.attributes = lp
                startBrightness = new
                showInfo("Parlaklık: %" + (new * 100).toInt())
            }
            
            private fun changeVolume(delta: Float) {
                val am = audioManager ?: return
                val change = (delta * maxVolume).toInt()
                var newVol = startVolume + change
                if (newVol < 0) newVol = 0
                if (newVol > maxVolume) newVol = maxVolume
                am.setStreamVolume(AudioManager.STREAM_MUSIC, newVol, 0)
                startVolume = newVol
                val perc = (newVol.toFloat() / maxVolume * 100).toInt()
                showInfo("Ses: %$perc")
            }
            
            private fun setupPlayer() {
                val url = intent.getStringExtra("URL") ?: ""
                if (url.isEmpty()) { finish(); return }
                
                try {
                    val headers = mutableMapOf("User-Agent" to FAKE_USER_AGENT)
                    val factory = DefaultHttpDataSource.Factory().setDefaultRequestProperties(headers)
                    val mediaSource = DefaultMediaSourceFactory(factory)
                    
                    player = ExoPlayer.Builder(this).setMediaSourceFactory(mediaSource).build()
                    playerView.player = player
                    playerView.useController = false // We use our own
                    
                    val item = MediaItem.fromUri(url)
                    player?.setMediaItem(item)
                    player?.prepare()
                    player?.playWhenReady = true
                    
                    player?.addListener(object : Player.Listener {
                        override fun onIsPlayingChanged(isPlaying: Boolean) {
                            btnPlayPause.setImageResource(if (isPlaying) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play)
                            if (isPlaying) {
                                pbLoading.visibility = View.GONE
                                handler.post(updateProgressRunnable)
                                showControls() // Auto hide timer starts
                            } else {
                                handler.removeCallbacks(updateProgressRunnable)
                            }
                        }
                        override fun onPlaybackStateChanged(state: Int) {
                            if (state == Player.STATE_BUFFERING) pbLoading.visibility = View.VISIBLE
                            else if (state == Player.STATE_READY) {
                                pbLoading.visibility = View.GONE
                                val dur = player?.duration ?: 0
                                if (dur > 0) {
                                    seekBar.max = dur.toInt()
                                    tvEnd.text = formatTime(dur)
                                }
                            }
                        }
                        override fun onPlayerError(error: PlaybackException) {
                            Toast.makeText(this@PlayerActivity, "Hata: " + error.message, Toast.LENGTH_LONG).show()
                        }
                    })
                    
                } catch (e: Exception) {
                    Toast.makeText(this, "Player Error", Toast.LENGTH_SHORT).show()
                }
            }
            
            private fun togglePlay() {
                if (player?.isPlaying == true) player?.pause() else player?.play()
                showControls()
            }
            
            private fun seekBy(ms: Long) {
                val p = player ?: return
                var pos = p.currentPosition + ms
                if (pos < 0) pos = 0
                if (pos > p.duration) pos = p.duration
                p.seekTo(pos)
                showControls()
            }
            
            private fun showControls() {
                handler.removeCallbacks(hideRunnable)
                isControlsVisible = true
                
                if (isLocked) {
                    // Locked mode: Only show lock button
                    topControls.visibility = View.GONE
                    bottomControls.visibility = View.GONE
                    centerControls.visibility = View.GONE
                    btnLock.visibility = View.VISIBLE
                } else {
                    topControls.visibility = View.VISIBLE
                    bottomControls.visibility = View.VISIBLE
                    centerControls.visibility = View.VISIBLE
                    btnLock.visibility = View.VISIBLE
                }
                
                if (player?.isPlaying == true) {
                    handler.postDelayed(hideRunnable, 4000)
                }
            }
            
            private fun hideControls() {
                isControlsVisible = false
                topControls.visibility = View.GONE
                bottomControls.visibility = View.GONE
                centerControls.visibility = View.GONE
                btnLock.visibility = View.GONE
            }
            
            private fun updateLockState() {
                if (isLocked) {
                    btnLock.setImageResource(R.drawable.ic_lock_outline)
                    btnLock.setColorFilter(getColor(R.color.error_red))
                    showInfo("Ekran Kilitlendi")
                } else {
                    btnLock.setImageResource(R.drawable.ic_lock_open)
                    btnLock.setColorFilter(getColor(R.color.white))
                    showInfo("Kilit Açıldı")
                }
            }
            
            private fun updateProgress() {
                val p = player ?: return
                val pos = p.currentPosition
                val dur = p.duration
                if (dur > 0) {
                    seekBar.max = dur.toInt()
                    seekBar.progress = pos.toInt()
                    tvCurrent.text = formatTime(pos)
                    tvEnd.text = formatTime(dur)
                }
            }
            
            private fun formatTime(ms: Long): String {
                val totalSec = ms / 1000
                val h = totalSec / 3600
                val m = (totalSec % 3600) / 60
                val s = totalSec % 60
                return if (h > 0) String.format("%d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
            }
            
            private fun showInfo(text: String) {
                tvInfo.text = text
                tvInfo.visibility = View.VISIBLE
                tvInfo.alpha = 1f
                tvInfo.animate().alpha(0f).setDuration(1000).setStartDelay(1000).start()
            }
            
            private fun showTrackDialog(type: Int) {
                if (isLocked) return
                val p = player ?: return
                val tracks = p.currentTracks
                val groups = tracks.groups.filter { it.type == type }
                if (groups.isEmpty()) {
                    Toast.makeText(this, "Seçenek bulunamadı", Toast.LENGTH_SHORT).show()
                    return
                }
                
                val options = mutableListOf("Kapat / Varsayılan")
                val indices = mutableListOf<Pair<Int, Int>?>(null)
                
                groups.forEachIndexed { gi, group ->
                    for (ti in 0 until group.length) {
                        val fmt = group.getTrackFormat(ti)
                        options.add(fmt.label ?: fmt.language ?: "Track \${ti+1}")
                        indices.add(Pair(gi, ti))
                    }
                }
                
                AlertDialog.Builder(this, R.style.Theme_ErdinPlayer_Dialog)
                    .setTitle(if (type == C.TRACK_TYPE_AUDIO) "Ses Dili" else "Altyazı")
                    .setItems(options.toTypedArray()) { _, which ->
                        val idx = indices[which]
                        val params = p.trackSelectionParameters.buildUpon()
                        if (idx == null) {
                            params.clearOverridesOfType(type)
                        } else {
                            val group = groups[idx.first]
                            params.setOverrideForType(TrackSelectionOverride(group.mediaTrackGroup, idx.second))
                        }
                        p.trackSelectionParameters = params.build()
                        showControls()
                    }
                    .show()
            }

            override fun onDestroy() {
                super.onDestroy()
                player?.release()
                handler.removeCallbacksAndMessages(null)
            }
        }
