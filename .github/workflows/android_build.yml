name: High Contrast UI Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Hazırlık
      uses: actions/checkout@v4
    
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 2. Dosyaları Oluştur (Görünürlük Yaması)
      run: |
        # --- AYARLAR ---
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        KEYSTORE_PASS="erdin123"
        KEY_ALIAS="key0"
        
        echo "🚀 Yüksek Kontrastlı Proje Oluşturuluyor..."

        # Temizlik ve Klasörler
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # İKON İNDİR
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"

        # --- A. KEYSTORE ---
        keytool -genkey -v -keystore app/keystore.jks \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -alias $KEY_ALIAS -storepass $KEYSTORE_PASS -keypass $KEYSTORE_PASS \
                -dname "CN=Erdin, OU=TV, O=ErdinMedia, L=Istanbul, S=Istanbul, C=TR"

        # --- B. GRADLE CONFIG ---
        echo "include ':app'" > settings.gradle

        cat <<EOF > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        EOF

        cat <<EOF > build.gradle
        buildscript {
            ext.kotlin_version = '1.9.0'
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        task clean(type: Delete) { delete rootProject.buildDir }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33
            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            signingConfigs {
                release { storeFile file("keystore.jks"); storePassword "$KEYSTORE_PASS"; keyAlias "$KEY_ALIAS"; keyPassword "$KEYSTORE_PASS" }
            }
            buildTypes {
                release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.release }
            }
            buildFeatures { viewBinding false }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
            implementation 'com.google.android.gms:play-services-ads:22.1.0'
        }
        EOF

        # --- C. TASARIM (DÜZELTİLDİ) ---
        
        # 1. Renkler
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <color name="bg_dark">#121212</color>
            <color name="input_bg">#252525</color>
            <color name="sport_green">#00E676</color>
            <color name="text_white">#FFFFFF</color>
            <color name="text_hint">#BBBBBB</color>
            <color name="black">#000000</color>
        </resources>
        EOF

        # 2. DÜZELTME: Giriş Kutusu (Yeşil Çerçeveli)
        cat <<EOF > app/src/main/res/drawable/bg_input_border.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/input_bg"/>
            <corners android:radius="8dp"/>
            <stroke android:width="2dp" android:color="@color/sport_green"/>
        </shape>
        EOF
        
        # 3. Buton
        cat <<EOF > app/src/main/res/drawable/bg_button_green.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/sport_green"/>
            <corners android:radius="8dp"/>
        </shape>
        EOF

        # 4. Tema
        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="colorPrimary">@color/sport_green</item>
            </style>
        </resources>
        EOF

        # --- D. MANIFEST ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/Theme.ErdinPlayer" 
                android:usesCleartextTraffic="true">
                <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>
                <activity android:name=".LoginActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".DashboardActivity" />
                <activity android:name=".ListActivity" />
                <activity android:name=".PlayerActivity" />
            </application>
        </manifest>
        EOF

        # --- E. STRINGS ---
        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">$APP_NAME</string>
            <string name="login_title">XTREAM GİRİŞ</string>
            <string name="login_btn">GİRİŞ YAP</string>
        </resources>
        EOF

        # --- F. LAYOUTLAR (Görünürlük İçin Güncellendi) ---

        # 1. LOGIN LAYOUT (Kutular artık belirgin)
        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="30dp" android:background="@color/bg_dark">
            
            <ImageView android:src="@mipmap/ic_launcher" android:layout_width="100dp" android:layout_height="100dp" android:layout_marginBottom="30dp"/>
            
            <TextView android:text="@string/login_title" android:textColor="@color/sport_green" android:textSize="26sp" android:textStyle="bold" android:layout_marginBottom="30dp"/>
            
            <EditText android:id="@+id/etUrl" android:hint="http://url:port" 
                android:background="@drawable/bg_input_border" 
                android:textColor="@color/text_white" 
                android:textColorHint="@color/text_hint" 
                android:padding="18dp" android:layout_marginBottom="15dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            
            <EditText android:id="@+id/etUser" android:hint="Kullanıcı Adı" 
                android:background="@drawable/bg_input_border" 
                android:textColor="@color/text_white" 
                android:textColorHint="@color/text_hint" 
                android:padding="18dp" android:layout_marginBottom="15dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            
            <EditText android:id="@+id/etPass" android:hint="Şifre" android:inputType="textPassword" 
                android:background="@drawable/bg_input_border" 
                android:textColor="@color/text_white" 
                android:textColorHint="@color/text_hint" 
                android:padding="18dp" android:layout_marginBottom="30dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            
            <androidx.appcompat.widget.AppCompatButton
                android:id="@+id/btnLogin"
                android:text="@string/login_btn"
                android:textColor="@color/black"
                android:textStyle="bold"
                android:background="@drawable/bg_button_green"
                android:layout_width="match_parent" android:layout_height="60dp"/>
        </LinearLayout>
        EOF

        # 2. DASHBOARD (Aynı, sorunsuzdu)
        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="20dp" android:background="@color/bg_dark">
            <TextView android:id="@+id/tvUser" android:text="Kullanıcı" android:textColor="@color/sport_green" android:textSize="20sp" android:layout_marginBottom="30dp"/>
            <Button android:id="@+id/btnLive" android:text="CANLI TV" android:backgroundTint="#333" android:textColor="#FFF" android:layout_marginBottom="15dp" android:layout_width="match_parent" android:layout_height="70dp"/>
            <Button android:id="@+id/btnVod" android:text="FİLMLER" android:backgroundTint="#333" android:textColor="#FFF" android:layout_marginBottom="15dp" android:layout_width="match_parent" android:layout_height="70dp"/>
            <Button android:id="@+id/btnSeries" android:text="DİZİLER" android:backgroundTint="#333" android:textColor="#FFF" android:layout_width="match_parent" android:layout_height="70dp"/>
        </LinearLayout>
        EOF

        # 3. 🔥 YENİ: LİSTE ELEMANI TASARIMI (Yazılar Beyaz Olsun Diye)
        cat <<EOF > app/src/main/res/layout/item_channel.xml
        <?xml version="1.0" encoding="utf-8"?>
        <TextView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@android:id/text1"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:textColor="#FFFFFF"
            android:textSize="18sp"
            android:padding="15dp"
            android:gravity="center_vertical"
            android:minHeight="50dp"/>
        EOF

        # 4. LIST ACTIVITY LAYOUT
        cat <<EOF > app/src/main/res/layout/activity_list.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:background="@color/bg_dark">
            <TextView android:id="@+id/tvTitle" android:text="LİSTE" android:textColor="@color/sport_green" android:textSize="22sp" android:textStyle="bold" android:padding="20dp" android:gravity="center" android:background="#191919"/>
            <ListView android:id="@+id/listView" android:layout_width="match_parent" android:layout_height="match_parent"/>
        </LinearLayout>
        EOF

        # 5. PLAYER (Siyah)
        cat <<EOF > app/src/main/res/layout/activity_player.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/black">
            <androidx.media3.ui.PlayerView android:id="@+id/player_view" android:layout_width="match_parent" android:layout_height="match_parent" />
        </FrameLayout>
        EOF

        # --- G. JAVA KODLARI (Liste Adaptörü Güncellendi) ---

        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import com.google.android.gms.ads.MobileAds
        import $PACKAGE_NAME.R
        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                try {
                    setContentView(R.layout.activity_login)
                    MobileAds.initialize(this) {}
                    val btnLogin = findViewById<Button>(R.id.btnLogin)
                    val etUrl = findViewById<EditText>(R.id.etUrl)
                    val etUser = findViewById<EditText>(R.id.etUser)
                    val etPass = findViewById<EditText>(R.id.etPass)
                    btnLogin.setOnClickListener {
                        val url = etUrl.text.toString()
                        val user = etUser.text.toString()
                        val pass = etPass.text.toString()
                        if(url.isNotEmpty() && user.isNotEmpty()){
                            val intent = Intent(this, DashboardActivity::class.java)
                            intent.putExtra("url", url)
                            intent.putExtra("user", user)
                            intent.putExtra("pass", pass)
                            startActivity(intent)
                        } else { Toast.makeText(this, "Bilgileri Giriniz", Toast.LENGTH_SHORT).show() }
                    }
                } catch (e: Exception) { e.printStackTrace() }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)
                val url = intent.getStringExtra("url")
                val user = intent.getStringExtra("user")
                val pass = intent.getStringExtra("pass")
                findViewById<TextView>(R.id.tvUser).text = "Kullanıcı: " + user
                fun goToList(type: String) {
                    val intent = Intent(this, ListActivity::class.java)
                    intent.putExtra("url", url)
                    intent.putExtra("user", user)
                    intent.putExtra("pass", pass)
                    intent.putExtra("type", type)
                    startActivity(intent)
                }
                findViewById<Button>(R.id.btnLive).setOnClickListener { goToList("live") }
                findViewById<Button>(R.id.btnVod).setOnClickListener { goToList("movie") }
                findViewById<Button>(R.id.btnSeries).setOnClickListener { goToList("series") }
            }
        }
        EOF

        # 🔥 LİSTE ADAPTÖRÜ GÜNCELLENDİ (item_channel kullanacak)
        cat <<EOF > app/src/main/java/$PATH_NAME/ListActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.ArrayAdapter
        import android.widget.ListView
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        class ListActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_list)
                val type = intent.getStringExtra("type") ?: "live"
                val url = intent.getStringExtra("url") ?: ""
                val user = intent.getStringExtra("user") ?: ""
                val pass = intent.getStringExtra("pass") ?: ""
                
                findViewById<TextView>(R.id.tvTitle).text = type.uppercase() + " LISTESI"
                val listView = findViewById<ListView>(R.id.listView)
                
                var items = listOf<String>()
                if (type == "live") items = listOf("TR: Ulusal 1", "TR: Spor 1", "TR: Sinema 1", "DE: Sport 1", "UK: News", "US: Action")
                else if (type == "movie") items = listOf("Avatar 2", "Hızlı ve Öfkeli 10", "John Wick 4", "Oppenheimer", "Barbie")
                else items = listOf("Breaking Bad", "Game of Thrones", "La Casa De Papel", "The Witcher")

                # BURADA 'item_channel' XML'ini KULLANIYORUZ (Beyaz Yazı İçin)
                val adapter = ArrayAdapter(this, R.layout.item_channel, items)
                listView.adapter = adapter
                
                listView.setOnItemClickListener { _, _, position, _ ->
                    val streamId = position + 100
                    var finalUrl = ""
                    if(type == "live") finalUrl = "\$url/live/\$user/\$pass/\$streamId.ts"
                    else finalUrl = "\$url/movie/\$user/\$pass/\$streamId.mp4"
                    val intent = Intent(this, PlayerActivity::class.java)
                    intent.putExtra("stream_url", finalUrl)
                    startActivity(intent)
                }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView
        import $PACKAGE_NAME.R
        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            private lateinit var playerView: PlayerView
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_player)
                playerView = findViewById(R.id.player_view)
                val streamUrl = intent.getStringExtra("stream_url") ?: ""
                initializePlayer(streamUrl)
            }
            private fun initializePlayer(url: String) {
                player = ExoPlayer.Builder(this).build()
                playerView.player = player
                val mediaItem = MediaItem.fromUri(url)
                player!!.setMediaItem(mediaItem)
                player!!.prepare()
                player!!.play()
            }
            override fun onStop() {
                super.onStop()
                player?.release()
                player = null
            }
        }
        EOF
        
        echo "✅ DOSYALAR TAMAM (Yüksek Kontrast Modu)"

    - name: 3. Gradle 8.0 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 4. APK Derleme
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon --stacktrace

    - name: 5. APK'yı Yükle
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-v4
        path: |
          ErdinPlayer/app/build/outputs/apk/release/*.apk
