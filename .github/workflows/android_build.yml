name: Final Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🏗️ Uygulama Oluşturuluyor (Script Çalıştırılıyor)
      run: |
        echo "⚙️ Script aranıyor..."
        SCRIPT_FILE=$(find . -maxdepth 1 -name "*.sh" | head -n 1)
        
        if [ -z "$SCRIPT_FILE" ]; then
          echo "❌ Script bulunamadı!"
          exit 1
        fi
        
        chmod +x "$SCRIPT_FILE"
        bash "$SCRIPT_FILE"

    - name: 🚑 Acil Müdahale (Gradle ve AndroidX Onarımı)
      run: |
        # Proje klasörünü bul
        BUILD_FILE=$(find . -maxdepth 2 -name "build.gradle" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_FILE")
        
        echo "🔧 Ayarlar düzeltiliyor: $PROJECT_ROOT"
        
        # 1. ViewBinding HATASINI DÜZELT
        if [ -f "$PROJECT_ROOT/app/build.gradle" ]; then
            sed -i 's/viewBinding true/viewBinding false/g' "$PROJECT_ROOT/app/build.gradle"
            echo "✅ ViewBinding kapatıldı."
        fi

        # 2. Kotlin Sürümünü GÜNCELLE
        if [ -f "$PROJECT_ROOT/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = '1.8.0'/ext.kotlin_version = '1.9.0'/g" "$PROJECT_ROOT/build.gradle"
            echo "✅ Kotlin sürümü güncellendi."
        fi

        # 3. (YENİ) ANDROIDX AYARINI EKLE (Hatanın Çözümü Burası) 👇
        # gradle.properties dosyası yoksa oluşturur, varsa ekleme yapar.
        echo "android.useAndroidX=true" >> "$PROJECT_ROOT/gradle.properties"
        echo "android.enableJetifier=true" >> "$PROJECT_ROOT/gradle.properties"
        echo "✅ AndroidX ayarları gradle.properties dosyasına eklendi."

    - name: 🔧 Gradle 8.0 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 🛠️ Eksikleri Tamamla ve Derle
      run: |
        BUILD_FILE=$(find . -maxdepth 2 -name "build.gradle" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_FILE")
        
        # settings.gradle kontrolü
        if [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
           echo "include ':app'" > "$PROJECT_ROOT/settings.gradle"
        fi
        
        cd "$PROJECT_ROOT"
        echo "🚀 Derleme Başlıyor..."
        gradle assembleRelease --stacktrace

    - name: 📦 APK'yı Paketle ve Sun
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-release
        path: |
          **/build/outputs/apk/release/*.apk
          **/app-release.apk
