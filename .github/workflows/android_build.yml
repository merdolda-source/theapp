name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek (Checkout)
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle İzinlerini Ayarla
      # Eğer gradlew dosyası yoksa bu adım hata vermesin diye '|| true' ekledik
      run: chmod +x ErdinPlayer/gradlew || true 

    - name: Gradle Kur ve Derle
      uses: gradle/gradle-build-action@v3
      with:
        # HATA BURADAYDI: '8.0' yerine tırnak içinde '8.2' yaptık.
        gradle-version: '8.2' 
        arguments: assembleRelease
        # Senin proje klasörünün adı (Scriptte değiştirdiysen burayı da değiştir)
        build-root-directory: ErdinPlayer 

    - name: APK'yı Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-release
        path: ErdinPlayer/app/build/outputs/apk/release/app-release.apk
