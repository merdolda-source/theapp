        cat <<EOF > app/src/main/java/$PATH_NAME/AccountActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.View
        import android.widget.TextView
        import androidx.appcompat.app.AlertDialog
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale
        import $PACKAGE_NAME.adapters.RowAdapter
        import $PACKAGE_NAME.utils.Prefs

        class AccountActivity : BaseActivity() {

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_account)

                val prefs = Prefs(this)
                val acc = prefs.getActive()

                val tvTop = findViewById<TextView>(R.id.tvAccountTop)
                val tvInfo = findViewById<TextView>(R.id.tvAccountInfo)
                val rv = findViewById<RecyclerView>(R.id.rvAccount)

                rv.layoutManager = LinearLayoutManager(this)

                tvTop.setOnClickListener { finish() }

                fun formatExp(exp: String?): String {
                    if (exp.isNullOrEmpty() || exp == "0" || exp == "null") return "Unlimited"
                    return try {
                        val seconds = exp.toLong()
                        val millis = seconds * 1000L
                        val date = Date(millis)
                        SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(date)
                    } catch (_: Exception) { exp }
                }

                fun loadInfo() {
                    if (acc == null) {
                        tvInfo.text = "No active account"
                        return
                    }
                    if (acc.type == "M3U") {
                        tvInfo.text = getString(R.string.active_account) + ": " + acc.name + "\n" + getString(R.string.expire) + ": M3U"
                        return
                    }
                    val dnsRaw = acc.dns?.trim() ?: ""
                    val user = acc.user?.trim() ?: ""
                    val pass = acc.pass?.trim() ?: ""
                    if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                        tvInfo.text = getString(R.string.active_account) + ": " + acc.name
                        return
                    }
                    val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                    val base = dns + "/player_api.php?username=" + user + "&password=" + pass

                    Thread {
                        try {
                            val conn = (URL(base).openConnection() as HttpURLConnection)
                            conn.connectTimeout = 8000
                            conn.readTimeout = 8000
                            conn.requestMethod = "GET"
                            if (conn.responseCode == HttpURLConnection.HTTP_OK) {
                                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                                val obj = JSONObject(body)
                                val ui = obj.optJSONObject("user_info")
                                val uname = ui?.optString("username", user) ?: user
                                val exp = ui?.optString("exp_date", null)
                                runOnUiThread {
                                    tvInfo.text = getString(R.string.active_account) + ": " + uname + "\n" +
                                            getString(R.string.expire) + ": " + formatExp(exp)
                                }
                            } else {
                                runOnUiThread {
                                    tvInfo.text = getString(R.string.active_account) + ": " + acc.name
                                }
                            }
                        } catch (_: Exception) {
                            runOnUiThread { tvInfo.text = getString(R.string.active_account) + ": " + acc.name }
                        }
                    }.start()
                }

                loadInfo()

                val rows = listOf(
                    getString(R.string.switch_account),
                    getString(R.string.logout)
                )

                rv.adapter = RowAdapter(rows) { index ->
                    if (index == 0) {
                        prefs.setLastScreen("LOGIN")
                        val i = Intent(this, LoginActivity::class.java)
                        i.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_NEW_TASK)
                        startActivity(i)
                        finish()
                    } else {
                        AlertDialog.Builder(this)
                            .setTitle(getString(R.string.logout))
                            .setMessage(getString(R.string.logout) + "?")
                            .setPositiveButton("OK") { _, _ ->
                                prefs.setLastScreen("LOGIN")
                                val i = Intent(this, LoginActivity::class.java)
                                i.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_NEW_TASK)
                                startActivity(i)
                                finish()
                            }
                            .setNegativeButton("Cancel", null)
                            .show()
                    }
                }
            }
        }
