        cat <<EOF > app/src/main/java/$PATH_NAME/utils/RemoteConfig.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import android.util.Log
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import $PACKAGE_NAME.R

        object RemoteConfig {

            private const val TAG = "RemoteConfig"
            private const val CONFIG_URL = "https://creatorapp24.com/erdin/api/config.php"

            @Volatile private var initialized = false
            @Volatile private var bannerId: String? = null
            @Volatile private var interstitialId: String? = null
            @Volatile private var channelInterval: Int = 4

            fun init(context: Context) {
                if (initialized) return
                synchronized(this) {
                    if (initialized) return
                    initialized = true
                    Thread {
                        try {
                            val url = URL(CONFIG_URL)
                            val conn = url.openConnection() as HttpURLConnection
                            conn.connectTimeout = 8000
                            conn.readTimeout = 8000
                            conn.requestMethod = "GET"
                            if (conn.responseCode != HttpURLConnection.HTTP_OK) return@Thread

                            val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                            val obj = JSONObject(body)
                            val ads = obj.optJSONObject("ads") ?: obj

                            bannerId = ads.optString("admob_banner_id", null)
                            interstitialId = ads.optString("admob_interstitial_id", null)

                            val interval = ads.optInt("channel_interval", 0)
                            if (interval > 0) channelInterval = interval

                        } catch (e: Exception) {
                            Log.w(TAG, "Config load failed: " + (e.message ?: ""))
                        }
                    }.start()
                }
            }

            fun getBannerId(context: Context): String {
                init(context)
                return bannerId ?: context.getString(R.string.admob_banner_test)
            }

            fun getInterstitialId(context: Context): String {
                init(context)
                return interstitialId ?: context.getString(R.string.admob_interstitial_test)
            }

            fun getChannelInterval(context: Context, defaultInterval: Int): Int {
                init(context)
                return if (channelInterval > 0) channelInterval else defaultInterval
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/utils/RemoteLogger.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import android.os.Build
        import android.provider.Settings
        import android.util.Log
        import java.net.HttpURLConnection
        import java.net.URL
        import java.net.URLEncoder

        object RemoteLogger {

            private const val TAG = "RemoteLogger"
            private const val EVENT_URL = "https://creatorapp24.com/erdin/api/event.php"

            fun sendEvent(context: Context, type: String, data: Map<String, String>) {
                Thread {
                    try {
                        val appContext = context.applicationContext
                        val deviceId = Settings.Secure.getString(appContext.contentResolver, Settings.Secure.ANDROID_ID) ?: "unknown"
                        val pkg = appContext.packageName
                        val verName = try { appContext.packageManager.getPackageInfo(pkg, 0).versionName ?: "1.0" } catch (e: Exception) { "1.0" }

                        val baseData = HashMap<String, String>()
                        baseData["type"] = type
                        baseData["device_id"] = deviceId
                        baseData["package"] = pkg
                        baseData["version"] = verName
                        baseData["brand"] = Build.BRAND ?: ""
                        baseData["model"] = Build.MODEL ?: ""
                        baseData.putAll(data)

                        val bodyBuilder = StringBuilder()
                        var first = true
                        for ((k, v) in baseData) {
                            if (!first) bodyBuilder.append("&")
                            first = false
                            bodyBuilder.append(URLEncoder.encode(k, "UTF-8"))
                            bodyBuilder.append("=")
                            bodyBuilder.append(URLEncoder.encode(v, "UTF-8"))
                        }

                        val conn = (URL(EVENT_URL).openConnection() as HttpURLConnection).apply {
                            connectTimeout = 8000
                            readTimeout = 8000
                            requestMethod = "POST"
                            doOutput = true
                            setRequestProperty("Content-Type", "application/x-www-form-urlencoded")
                        }

                        conn.outputStream.use { os -> os.write(bodyBuilder.toString().toByteArray(Charsets.UTF_8)) }
                        if (conn.responseCode != HttpURLConnection.HTTP_OK) {
                            Log.w(TAG, "Event HTTP code: " + conn.responseCode)
                        }
                    } catch (e: Exception) {
                        Log.w(TAG, "sendEvent failed: " + (e.message ?: ""))
                    }
                }.start()
            }
        }
        EOF

        # PREFS
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import $PACKAGE_NAME.models.AccountProfile
        import org.json.JSONArray
        import org.json.JSONObject

        class Prefs(ctx: Context) {
            private val appContext = ctx.applicationContext
            private val p = appContext.getSharedPreferences("EP_Prefs", 0)

            private fun loadArray(): JSONArray {
                val s = p.getString("accounts_json", "[]") ?: "[]"
                return JSONArray(s)
            }

            private fun saveArray(arr: JSONArray) {
                p.edit().putString("accounts_json", arr.toString()).apply()
            }

            fun createXtreamAccount(name: String, dns: String, u: String, ps: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "XTREAM")
                obj.put("dns", dns)
                obj.put("user", u)
                obj.put("pass", ps)
                obj.put("m3u", "")

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun createM3uAccount(name: String, m3u: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "M3U")
                obj.put("dns", "")
                obj.put("user", "")
                obj.put("pass", "")
                obj.put("m3u", m3u)

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun getAccounts(): List<AccountProfile> {
                val arr = loadArray()
                val list = ArrayList<AccountProfile>()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null) {
                        val id = o.optInt("id", 0)
                        val name = o.optString("name", "Hesap " + i)
                        val type = o.optString("type", "XTREAM")
                        val dns = o.optString("dns", null)
                        val user = o.optString("user", null)
                        val pass = o.optString("pass", null)
                        val m3u = o.optString("m3u", null)
                        list.add(AccountProfile(id, name, type, dns, user, pass, m3u))
                    }
                    i++
                }
                return list
            }

            fun deleteAccount(id: Int) {
                val arr = loadArray()
                val newArr = JSONArray()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null && o.optInt("id", 0) != id) newArr.put(o)
                    i++
                }
                saveArray(newArr)

                val activeId = p.getInt("active_id", -1)
                if (activeId == id) {
                    p.edit().putInt("active_id", -1).apply()
                }
            }

            fun setActive(id: Int) { p.edit().putInt("active_id", id).apply() }
            fun clearActive() { p.edit().putInt("active_id", -1).apply() }

            fun getActive(): AccountProfile? {
                val all = getAccounts()
                if (all.isEmpty()) return null
                val activeId = p.getInt("active_id", -1)
                if (activeId <= 0) return null
                return all.find { it.id == activeId }
            }

            fun setLastScreen(screen: String) { p.edit().putString("last_screen", screen).apply() }
            fun getLastScreen(): String = p.getString("last_screen", "LOGIN") ?: "LOGIN"

            fun setLang(lang: String) { p.edit().putString("lang", lang).apply() }
            fun getLang(): String = p.getString("lang", "tr") ?: "tr"

            fun getDns(): String = getActive()?.dns ?: ""
            fun getUser(): String = getActive()?.user ?: ""
            fun getPass(): String = getActive()?.pass ?: ""
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/utils/LangManager.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import android.util.Log
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL

        object LangManager {

            private const val TAG = "LangManager"
            private const val URL_BASE =
                "https://creatorapp24.com/erdin/api/lang.php?app=erdinplayer&lang="

            @Volatile private var cache: JSONObject? = null

            fun restoreFromPrefs(context: Context, lang: String) {
                val p = context.applicationContext.getSharedPreferences("EP_Lang", 0)
                val savedCode = p.getString("lang_code", null)
                val savedJson = p.getString("lang_json", null)
                if (savedCode == lang && savedJson != null) {
                    try { cache = JSONObject(savedJson) } catch (_: Exception) {}
                }
            }

            fun init(context: Context, lang: String) {
                Thread {
                    try {
                        val conn = (URL(URL_BASE + lang).openConnection() as HttpURLConnection).apply {
                            connectTimeout = 8000
                            readTimeout = 8000
                            requestMethod = "GET"
                        }
                        if (conn.responseCode != HttpURLConnection.HTTP_OK) return@Thread

                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val strings = obj.optJSONObject("strings") ?: return@Thread
                        cache = strings

                        val p = context.applicationContext.getSharedPreferences("EP_Lang", 0)
                        p.edit().putString("lang_code", lang).putString("lang_json", strings.toString()).apply()
                    } catch (e: Exception) {
                        Log.w(TAG, "Lang load failed: " + (e.message ?: ""))
                    }
                }.start()
            }

            fun t(context: Context, key: String, fallback: String): String {
                val local = cache
                if (local != null) {
                    val v = local.optString(key, "")
                    if (v.isNotEmpty()) return v
                }
                val p = context.applicationContext.getSharedPreferences("EP_Lang", 0)
                val savedJson = p.getString("lang_json", null)
                if (savedJson != null) {
                    try {
                        val obj = JSONObject(savedJson)
                        val v2 = obj.optString(key, "")
                        if (v2.isNotEmpty()) return v2
                    } catch (_: Exception) {}
                }
                return fallback
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/utils/AdsHelper.kt
        package $PACKAGE_NAME.utils

        import android.app.Activity
        import android.content.Context
        import com.google.android.gms.ads.AdRequest
        import com.google.android.gms.ads.AdView
        import com.google.android.gms.ads.MobileAds
        import com.google.android.gms.ads.interstitial.InterstitialAd
        import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback
        import com.google.android.gms.ads.LoadAdError

        object AdsHelper {
            @Volatile private var initialized = false
            private var interstitial: InterstitialAd? = null
            private var clickCount = 0
            var CHANNEL_INTERVAL = 4

            fun init(context: Context) {
                if (!initialized) {
                    synchronized(this) {
                        if (!initialized) {
                            MobileAds.initialize(context.applicationContext) {}
                            initialized = true
                        }
                    }
                }
                RemoteConfig.init(context)
                CHANNEL_INTERVAL = RemoteConfig.getChannelInterval(context, CHANNEL_INTERVAL)
            }

            fun loadBanner(adView: AdView?) {
                if (adView == null) return
                val id = RemoteConfig.getBannerId(adView.context)
                try { adView.adUnitId = id } catch (_: Exception) {}
                adView.loadAd(AdRequest.Builder().build())
            }

            fun loadInterstitial(context: Context) {
                val adUnitId = RemoteConfig.getInterstitialId(context)
                InterstitialAd.load(
                    context,
                    adUnitId,
                    AdRequest.Builder().build(),
                    object : InterstitialAdLoadCallback() {
                        override fun onAdLoaded(ad: InterstitialAd) { interstitial = ad }
                        override fun onAdFailedToLoad(error: LoadAdError) { interstitial = null }
                    }
                )
            }

            fun maybeShowOnChannelClick(activity: Activity, onContinue: () -> Unit) {
                clickCount++
                val ad = interstitial
                if (ad != null && CHANNEL_INTERVAL > 0 && (clickCount % CHANNEL_INTERVAL == 0)) {
                    ad.show(activity)
                    interstitial = null
                    loadInterstitial(activity)
                    onContinue()
                } else {
                    onContinue()
                }
            }
        }
        EOF

        # GRID ADAPTER
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/GridAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R

        class GridAdapter(
            private var titles: List<String>,
            private var subtitles: List<String>,
            private val onClick: (Int) -> Unit
        ) : RecyclerView.Adapter<GridAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtName)
                val sub: TextView = v.findViewById(R.id.txtSub)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context).inflate(R.layout.item_grid_pro, parent, false)
                v.isFocusable = true
                v.isFocusableInTouchMode = true
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                holder.txt.text = titles[position]
                val s = subtitles[position]
                holder.sub.visibility = if (s.isNotEmpty()) View.VISIBLE else View.GONE
                holder.sub.text = s

                holder.itemView.setOnFocusChangeListener { v, hasFocus ->
                    val scale = if (hasFocus) 1.08f else 1.0f
                    v.animate().scaleX(scale).scaleY(scale).setDuration(120).start()
                }

                holder.itemView.setOnClickListener { onClick(position) }
            }

            override fun getItemCount(): Int = titles.size

            fun update(newTitles: List<String>, newSubtitles: List<String>) {
                titles = newTitles
                subtitles = newSubtitles
                notifyDataSetChanged()
            }
        }
