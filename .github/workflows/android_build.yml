    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. APK + AAB Build (Release / İmzalı)
      run: |
        cd EminXtream
        gradle assembleRelease --no-daemon --stacktrace
        gradle bundleRelease   --no-daemon

    - name: 6. APK Artifact
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: EminXtream-Ultra-v4-APK
        path: EminXtream/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: 7. AAB Artifact
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: EminXtream-Ultra-v4-AAB
        path: EminXtream/app/build/outputs/bundle/release/*.aab
        retention-days: 30

    - name: 8. Özet
      if: always()
      run: |
        echo "### 🚀 EminXtream Ultra Player v4.0 Build Özeti" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| | |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Run    | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Yeni Özellikler (v4.0)" >> $GITHUB_STEP_SUMMARY
        echo "- 🎨 StreamPort koyu-kırmızı tasarım dili" >> $GITHUB_STEP_SUMMARY
        echo "- 🖼 Glide ile thumbnail / poster yükleme" >> $GITHUB_STEP_SUMMARY
        echo "- 🔄 Çoklu format denemesi: .ts → .m3u8 → uzantısız" >> $GITHUB_STEP_SUMMARY
        echo "- ⏯ Resume: kaldığın yerden devam" >> $GITHUB_STEP_SUMMARY
        echo "- ⭐ Favoriler" >> $GITHUB_STEP_SUMMARY
        echo "- 📡 Canlı CANLI rozeti" >> $GITHUB_STEP_SUMMARY
        echo "- 🌟 Puan rozeti (VOD/Dizi)" >> $GITHUB_STEP_SUMMARY
        echo "- 🏷 Kategori chip filtresi" >> $GITHUB_STEP_SUMMARY
        echo "- 🔍 Global arama (3+ karakter)" >> $GITHUB_STEP_SUMMARY
        echo "- 📺 Çoklu portal yönetimi" >> $GITHUB_STEP_SUMMARY
        echo "- 🎮 TV kumanda desteği (Hybrid Focus/Touch)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [APK İndir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
