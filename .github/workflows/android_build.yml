    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. APK + AAB Build
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon --stacktrace
        gradle bundleRelease   --no-daemon

    - name: 6. APK Yukle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-SmartPlayer-APK
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: 7. AAB Yukle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-SmartPlayer-AAB
        path: ErdinPlayer/app/build/outputs/bundle/release/*.aab
        retention-days: 30

    - name: 8. Ozet
      if: always()
      run: |
        echo "### ErdinPlayer v3.1 - Akilli Player" >> $GITHUB_STEP_SUMMARY
        echo "| | |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Run    | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Yeni Player Ozellikleri" >> $GITHUB_STEP_SUMMARY
        echo "- Kaldigi yerden devam (resume dialog)" >> $GITHUB_STEP_SUMMARY
        echo "- Coklu format denemesi (.ts .m3u8 uzantisiz)" >> $GITHUB_STEP_SUMMARY
        echo "- Oynatma hizi 0.5x 1x 1.5x 2x" >> $GITHUB_STEP_SUMMARY
        echo "- Uyku zamanlayicisi 15/30/60 dk" >> $GITHUB_STEP_SUMMARY
        echo "- Ekran kilit modu" >> $GITHUB_STEP_SUMMARY
        echo "- Ses ve altyazi track secimi" >> $GITHUB_STEP_SUMMARY
        echo "- PiP (Picture in Picture)" >> $GITHUB_STEP_SUMMARY
        echo "- Seek gostergesi (sol/sag animasyon)" >> $GITHUB_STEP_SUMMARY
        echo "- Canli TV rozeti" >> $GITHUB_STEP_SUMMARY
        echo "- TV kumanda tam destegi" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "APK: ${{ steps.upload_apk.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
        echo "AAB: ${{ steps.upload_aab.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
