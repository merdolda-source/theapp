name: ErdinPlayer Pro Final Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Hazırlık
      uses: actions/checkout@v4
    
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 2. Profesyonel Proje İnşası (Çökme Korumalı)
      run: |
        echo "Goodbye"
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        PASS="erdin123"
        
        echo "🚀 Profesyonel ve Stabil Mimari İnşa Ediliyor..."

        # Klasör Yapısı (Profesyonel Katmanlar)
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/models
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/utils
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # İkon & Keystore
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass $PASS -keypass $PASS -dname "CN=Erdin, O=ErdinMedia, C=TR"

        # --- Gradle Yapılandırması ---
        echo "include ':app'" > settings.gradle
        echo -e "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m" > gradle.properties

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { 
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33
            defaultConfig { applicationId "$PACKAGE_NAME"; minSdk 24; targetSdk 33; versionCode 1; versionName "1.0" }
            signingConfigs { release { storeFile file("keystore.jks"); storePassword "$PASS"; keyAlias "key0"; keyPassword "$PASS" } }
            buildTypes { release { minifyEnabled true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
            implementation 'com.github.bumptech.glide:glide:4.15.1'
        }
        EOF

        # --- TASARIM (Renkler & Modern Şekiller) ---
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <color name="bg_dark">#121212</color>
            <color name="card_bg">#1E1E1E</color>
            <color name="sport_green">#00E676</color>
            <color name="white">#FFFFFF</color>
            <color name="gray_text">#A0A0A0</color>
            <color name="divider">#333333</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_input.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#FFFFFF"/><corners android:radius="10dp"/><stroke android:width="2dp" android:color="#00E676"/>
        </shape>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_card.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#1E1E1E"/><corners android:radius="15dp"/><stroke android:width="1dp" android:color="#333333"/>
        </shape>
        EOF

        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="colorPrimary">@color/sport_green</item>
                <item name="colorAccent">@color/sport_green</item>
            </style>
        </resources>
        EOF

        # --- MODELLER ---
        echo "package $PACKAGE_NAME.models; data class StreamItem(val id: String, val name: String, val icon: String? = null)" > app/src/main/java/$PATH_NAME/models/Models.kt

        # --- UTILS ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils
        import android.content.Context
        class Prefs(ctx: Context) {
            private val p = ctx.getSharedPreferences("erdin_p", 0)
            fun save(d: String, u: String, ps: String) = p.edit().putString("d", d).putString("u", u).putString("p", ps).apply()
            fun getD() = p.getString("d", "") ?: ""
            fun getU() = p.getString("u", "") ?: ""
            fun getP() = p.getString("p", "") ?: ""
        }
        EOF

        # --- KOTLIN AKTİVİTELER (CRASH FIX) ---
        
        # 1. LOGIN
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.utils.Prefs

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)
                val prefs = Prefs(this)
                val eD = findViewById<EditText>(R.id.etDns)
                val eU = findViewById<EditText>(R.id.etUser)
                val eP = findViewById<EditText>(R.id.etPass)
                
                eD.setText(prefs.getD()); eU.setText(prefs.getU()); eP.setText(prefs.getP())

                findViewById<Button>(R.id.btnLogin).setOnClickListener {
                    if(eD.text.isNotEmpty() && eU.text.isNotEmpty()){
                        prefs.save(eD.text.toString(), eU.text.toString(), eP.text.toString())
                        startActivity(Intent(this, DashboardActivity::class.java))
                    } else { Toast.makeText(this, "Eksik Bilgi!", Toast.LENGTH_SHORT).show() }
                }
            }
        }
        EOF

        # 2. DASHBOARD
        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.view.View
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.utils.Prefs

        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)
                findViewById<TextView>(R.id.tvHello).text = "Hoşgeldin, " + Prefs(this).getU()
                
                val go = { type: String -> 
                    val i = Intent(this, CategoryActivity::class.java)
                    i.putExtra("type", type)
                    startActivity(i)
                }
                findViewById<View>(R.id.btnLive).setOnClickListener { go("LIVE") }
                findViewById<View>(R.id.btnVod).setOnClickListener { go("VOD") }
                findViewById<View>(R.id.btnSeries).setOnClickListener { go("SERIES") }
                findViewById<View>(R.id.btnSettings).setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
            }
        }
        EOF

        # 3. CATEGORY / CONTENT / SETTINGS
        cat <<EOF > app/src/main/java/$PATH_NAME/CategoryActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R

        class CategoryActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_list)
                val t = intent.getStringExtra("type") ?: "LIVE"
                findViewById<TextView>(R.id.tvTitle).text = t + " KATEGORİLERİ"
                val lv = findViewById<ListView>(R.id.listView)
                val cats = listOf("Spor", "Sinema", "Belgesel", "Ulusal", "Haber", "Çocuk")
                lv.adapter = ArrayAdapter(this, R.layout.item_pro, cats)
                lv.setOnItemClickListener { _, _, _, _ -> 
                    val i = Intent(this, ContentActivity::class.java); i.putExtra("type", t); startActivity(i) 
                }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/ContentActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.utils.Prefs

        class ContentActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_list)
                val t = intent.getStringExtra("type") ?: "LIVE"
                findViewById<TextView>(R.id.tvTitle).text = t + " İÇERİKLERİ"
                val lv = findViewById<ListView>(R.id.listView)
                val items = (1..30).map { t + " İçerik #\$it" }
                lv.adapter = ArrayAdapter(this, R.layout.item_pro, items)
                lv.setOnItemClickListener { _, _, pos, _ ->
                    val p = Prefs(this)
                    val url = "\${p.getD()}/\$t/\${p.getU()}/\${p.getP()}/\${pos+100}.ts"
                    val i = Intent(this, PlayerActivity::class.java); i.putExtra("url", url); startActivity(i)
                }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/SettingsActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import android.widget.Button
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R

        class SettingsActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_settings)
                findViewById<Button>(R.id.btnBack).setOnClickListener { finish() }
            }
        }
        EOF

        # 4. PLAYER
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import android.view.View
        import android.view.WindowManager
        import android.widget.ProgressBar
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.common.Player
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView
        import $PACKAGE_NAME.R

        class PlayerActivity : AppCompatActivity() {
            private var p: ExoPlayer? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                setContentView(R.layout.activity_player)
                val url = intent.getStringExtra("url") ?: ""
                val pv = findViewById<PlayerView>(R.id.player_view)
                val loader = findViewById<ProgressBar>(R.id.loader)
                
                p = ExoPlayer.Builder(this).build()
                pv.player = p
                p?.setMediaItem(MediaItem.fromUri(url))
                p?.prepare()
                p?.play()
                
                p?.addListener(object : Player.Listener {
                    override fun onPlaybackStateChanged(s: Int) {
                        loader.visibility = if(s == Player.STATE_BUFFERING) View.VISIBLE else View.GONE
                    }
                })
            }
            override fun onDestroy() { super.onDestroy(); p?.release(); p = null }
        }
        EOF

        # --- LAYOUTLAR ---
        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="35dp" android:background="@color/bg_dark">
            <ImageView android:src="@mipmap/ic_launcher" android:layout_width="100dp" android:layout_height="100dp" android:layout_marginBottom="25dp"/>
            <TextView android:text="ERDIN PLAYER PRO" android:textColor="@color/sport_green" android:textSize="24sp" android:textStyle="bold" android:layout_marginBottom="40dp"/>
            <EditText android:id="@+id/etDns" android:hint="DNS (http://url:port)" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="12dp" android:textColor="#000" android:textColorHint="#888"/>
            <EditText android:id="@+id/etUser" android:hint="Kullanıcı Adı" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="12dp" android:textColor="#000" android:textColorHint="#888"/>
            <EditText android:id="@+id/etPass" android:hint="Şifre" android:inputType="textPassword" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="30dp" android:textColor="#000" android:textColorHint="#888"/>
            <Button android:id="@+id/btnLogin" android:text="SİSTEME GİRİŞ YAP" android:backgroundTint="@color/sport_green" android:textColor="#000" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="65dp"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="20dp" android:background="@color/bg_dark">
            <TextView android:id="@+id/tvHello" android:text="Hoşgeldin" android:textColor="@color/sport_green" android:textSize="20sp" android:textStyle="bold" android:layout_marginBottom="30dp"/>
            <GridLayout android:columnCount="2" android:layout_width="match_parent" android:layout_height="wrap_content">
                <LinearLayout android:id="@+id/btnLive" android:background="@drawable/bg_card" android:layout_margin="8dp" android:padding="30dp" android:gravity="center" android:orientation="vertical" android:layout_columnWeight="1">
                    <TextView android:text="📺\nCANLI" android:textColor="#FFF" android:textStyle="bold" android:gravity="center"/>
                </LinearLayout>
                <LinearLayout android:id="@+id/btnVod" android:background="@drawable/bg_card" android:layout_margin="8dp" android:padding="30dp" android:gravity="center" android:orientation="vertical" android:layout_columnWeight="1">
                    <TextView android:text="🎬\nFİLM" android:textColor="#FFF" android:textStyle="bold" android:gravity="center"/>
                </LinearLayout>
                <LinearLayout android:id="@+id/btnSeries" android:background="@drawable/bg_card" android:layout_margin="8dp" android:padding="30dp" android:gravity="center" android:orientation="vertical" android:layout_columnWeight="1">
                    <TextView android:text="🍿\nDİZİ" android:textColor="#FFF" android:textStyle="bold" android:gravity="center"/>
                </LinearLayout>
                <LinearLayout android:id="@+id/btnSettings" android:background="@drawable/bg_card" android:layout_margin="8dp" android:padding="30dp" android:gravity="center" android:orientation="vertical" android:layout_columnWeight="1">
                    <TextView android:text="⚙️\nAYARLAR" android:textColor="#FFF" android:textStyle="bold" android:gravity="center"/>
                </LinearLayout>
            </GridLayout>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_list.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:background="@color/bg_dark">
            <TextView android:id="@+id/tvTitle" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="@color/sport_green" android:textSize="18sp" android:textStyle="bold" android:padding="20dp" android:background="#1E1E1E"/>
            <ListView android:id="@+id/listView" android:layout_width="match_parent" android:layout_height="match_parent" android:divider="#333" android:dividerHeight="1dp"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_settings.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="25dp" android:background="@color/bg_dark">
            <TextView android:text="AYARLAR" android:textColor="@color/sport_green" android:textSize="22sp" android:layout_marginBottom="30dp"/>
            <TextView android:text="Versiyon: 1.0.4 PRO\nMotor: ExoPlayer 3\n\nBu uygulama Erdin Media tarafından geliştirilmiştir." android:textColor="#AAA" android:layout_marginBottom="40dp"/>
            <Button android:id="@+id/btnBack" android:text="GERİ DÖN" android:backgroundTint="@color/sport_green" android:textColor="#000" android:layout_width="match_parent" android:layout_height="60dp"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_player.xml
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
            <androidx.media3.ui.PlayerView android:id="@+id/player_view" android:layout_width="match_parent" android:layout_height="match_parent"/>
            <ProgressBar android:id="@+id/loader" android:layout_width="60dp" android:layout_height="60dp" android:layout_gravity="center" android:indeterminateTint="@color/sport_green"/>
        </FrameLayout>
        EOF

        echo -e "<TextView xmlns:android='http://schemas.android.com/apk/res/android' android:id='@android:id/text1' android:layout_width='match_parent' android:layout_height='wrap_content' android:textColor='#FFF' android:textSize='16sp' android:padding='18dp' android:background='#1A1A1A' android:layout_marginBottom='1dp'/>" > app/src/main/res/layout/item_pro.xml

        # --- MANIFEST ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/Theme.ErdinPlayer" android:icon="@mipmap/ic_launcher" android:label="ErdinPlayer Pro" android:usesCleartextTraffic="true">
                <activity android:name=".LoginActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
                <activity android:name=".DashboardActivity"/><activity android:name=".CategoryActivity"/><activity android:name=".ContentActivity"/><activity android:name=".SettingsActivity"/><activity android:name=".PlayerActivity"/>
            </application>
        </manifest>
        EOF

    - name: 3. Gradle ve Derleme
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 4. APK Oluştur
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon

    - name: 5. APK'yı Sun
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Stabil
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk
