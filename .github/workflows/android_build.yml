package $PACKAGE_NAME

import android.content.Context

object Prefs {
    private const val NAME = "xtream_prefs"
    private const val K_PORTAL = "portal"
    private const val K_USER = "user"
    private const val K_PASS = "pass"

    fun save(ctx: Context, portal: String, user: String, pass: String) {
        ctx.getSharedPreferences(NAME, Context.MODE_PRIVATE).edit()
            .putString(K_PORTAL, portal)
            .putString(K_USER, user)
            .putString(K_PASS, pass)
            .apply()
    }

    fun portal(ctx: Context): String = ctx.getSharedPreferences(NAME, Context.MODE_PRIVATE).getString(K_PORTAL, "") ?: ""
    fun user(ctx: Context): String = ctx.getSharedPreferences(NAME, Context.MODE_PRIVATE).getString(K_USER, "") ?: ""
    fun pass(ctx: Context): String = ctx.getSharedPreferences(NAME, Context.MODE_PRIVATE).getString(K_PASS, "") ?: ""
}
EOF

        # --- P. XTREAM SERVICE + CLIENT ---
