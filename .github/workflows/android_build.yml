name: Auto-Fix and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🏗️ Uygulama Oluşturuluyor (Script Çalıştırılıyor)
      run: |
        echo "⚙️ Script aranıyor..."
        SCRIPT_FILE=$(find . -maxdepth 1 -name "*.sh" | head -n 1)
        
        if [ -z "$SCRIPT_FILE" ]; then
          echo "❌ Script bulunamadı!"
          exit 1
        fi
        
        chmod +x "$SCRIPT_FILE"
        bash "$SCRIPT_FILE"

    - name: 🚑 Acil Müdahale (Build Dosyası Onarımı)
      run: |
        # build.gradle dosyasını nerede olursa olsun bul
        BUILD_FILE=$(find . -maxdepth 2 -name "build.gradle" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_FILE")
        
        echo "🔧 Hata veren ayarlar düzeltiliyor: $PROJECT_ROOT/app/build.gradle"
        
        # 1. ViewBinding'i KAPAT (Hatanın asıl sebebi bu)
        # Dosya içinde "viewBinding true" yazan yeri bulup "viewBinding false" yapar.
        if [ -f "$PROJECT_ROOT/app/build.gradle" ]; then
            sed -i 's/viewBinding true/viewBinding false/g' "$PROJECT_ROOT/app/build.gradle"
            echo "✅ ViewBinding kapatıldı (Çatışma engellendi)."
        fi

        # 2. Kotlin Sürümünü Yükselt (Gradle 8 ile daha uyumlu olsun)
        if [ -f "$PROJECT_ROOT/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = '1.8.0'/ext.kotlin_version = '1.9.0'/g" "$PROJECT_ROOT/build.gradle"
            echo "✅ Kotlin sürümü 1.9.0'a yükseltildi."
        fi

    - name: 🔧 Gradle 8.0 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 🛠️ Eksikleri Tamamla ve Derle
      run: |
        BUILD_FILE=$(find . -maxdepth 2 -name "build.gradle" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_FILE")
        
        # settings.gradle kontrolü
        if [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
           echo "include ':app'" > "$PROJECT_ROOT/settings.gradle"
        fi
        
        cd "$PROJECT_ROOT"
        # --stacktrace ile derleyelim ki hata varsa detaylı görelim
        gradle assembleRelease --stacktrace

    - name: 📦 APK'yı Paketle ve Sun
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-release
        path: |
          **/build/outputs/apk/release/*.apk
          **/app-release.apk
