        # ============ Player Layout (ULTIMATE MODERN EDITION) ============
        cat <<EOF > app/src/main/res/layout/activity_player_pro.xml
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout 
            xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:id="@+id/controlsRoot"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="@color/black"
            android:clickable="true"
            android:focusable="true">

            <androidx.media3.ui.PlayerView
                android:id="@+id/pvMain"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                app:use_controller="false"
                app:resize_mode="fit"
                app:layout_constraintTop_toTopOf="parent"
                app:layout_constraintBottom_toBottomOf="parent"/>

            <ProgressBar
                android:id="@+id/pbLoading"
                android:layout_width="60dp"
                android:layout_height="60dp"
                android:indeterminateTint="@color/primary_cyan"
                app:layout_constraintTop_toTopOf="parent"
                app:layout_constraintBottom_toBottomOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintEnd_toEndOf="parent"/>

            <!-- Center Info Text (Volume/Brightness/Seek) -->
            <TextView
                android:id="@+id/tvInfo"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:background="@drawable/bg_input_dark"
                android:padding="12dp"
                android:textColor="@color/white"
                android:textSize="20sp"
                android:textStyle="bold"
                android:visibility="gone"
                app:layout_constraintTop_toTopOf="parent"
                app:layout_constraintBottom_toBottomOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintEnd_toEndOf="parent"/>

            <!-- TOP CONTROLS -->
            <androidx.constraintlayout.widget.ConstraintLayout
                android:id="@+id/topControls"
                android:layout_width="match_parent"
                android:layout_height="80dp"
                android:background="@drawable/player_gradient_top"
                android:padding="16dp"
                app:layout_constraintTop_toTopOf="parent">

                <ImageButton
                    android:id="@+id/btnBack"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:src="@android:drawable/ic_menu_revert"
                    android:background="@drawable/bg_circle_button"
                    android:padding="8dp"
                    android:tint="@color/white"
                    app:layout_constraintStart_toStartOf="parent"
                    app:layout_constraintTop_toTopOf="parent"/>

                <ImageButton
                    android:id="@+id/btnAudio"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:src="@android:drawable/ic_lock_silent_mode_off"
                    android:background="@drawable/bg_circle_button"
                    android:padding="8dp"
                    android:tint="@color/white"
                    android:layout_marginEnd="12dp"
                    app:layout_constraintEnd_toStartOf="@+id/btnSubs"
                    app:layout_constraintTop_toTopOf="parent"/>

                <ImageButton
                    android:id="@+id/btnSubs"
                    android:layout_width="40dp"
                    android:layout_height="40dp"
                    android:src="@android:drawable/ic_menu_sort_by_size"
                    android:background="@drawable/bg_circle_button"
                    android:padding="8dp"
                    android:tint="@color/white"
                    app:layout_constraintEnd_toEndOf="parent"
                    app:layout_constraintTop_toTopOf="parent"/>
            </androidx.constraintlayout.widget.ConstraintLayout>

            <!-- CENTER PLAY BUTTON -->
            <LinearLayout
                android:id="@+id/centerControls"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                app:layout_constraintTop_toTopOf="parent"
                app:layout_constraintBottom_toBottomOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintEnd_toEndOf="parent">
                
                <ImageButton
                    android:id="@+id/btnPlayPause"
                    android:layout_width="80dp"
                    android:layout_height="80dp"
                    android:src="@android:drawable/ic_media_pause"
                    android:background="@drawable/bg_circle_button"
                    android:padding="20dp"
                    android:tint="@color/white"
                    android:scaleType="fitCenter"/>
            </LinearLayout>

            <!-- LOCK BUTTON (Floating) -->
            <ImageButton
                android:id="@+id/btnLock"
                android:layout_width="48dp"
                android:layout_height="48dp"
                android:src="@drawable/ic_lock_open"
                android:background="@drawable/bg_circle_button"
                android:padding="10dp"
                android:tint="@color/white"
                android:layout_marginEnd="20dp"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_centerY_toCenterY="parent"
                app:layout_constraintTop_toTopOf="parent"
                app:layout_constraintBottom_toBottomOf="parent"/>

            <!-- BOTTOM CONTROLS -->
            <androidx.constraintlayout.widget.ConstraintLayout
                android:id="@+id/bottomControls"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:background="@drawable/player_gradient_bottom"
                android:padding="16dp"
                app:layout_constraintBottom_toBottomOf="parent">

                <TextView
                    android:id="@+id/tvCurrent"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="00:00"
                    android:textColor="@color/white"
                    android:textStyle="bold"
                    app:layout_constraintStart_toStartOf="parent"
                    app:layout_constraintTop_toTopOf="parent"/>

                <TextView
                    android:id="@+id/tvEnd"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="00:00"
                    android:textColor="@color/white"
                    android:textStyle="bold"
                    app:layout_constraintEnd_toStartOf="@+id/btnResize"
                    app:layout_constraintTop_toTopOf="parent"
                    android:layout_marginEnd="16dp"/>

                <ImageButton
                    android:id="@+id/btnResize"
                    android:layout_width="32dp"
                    android:layout_height="32dp"
                    android:src="@android:drawable/ic_menu_crop"
                    android:background="@null"
                    android:tint="@color/white"
                    app:layout_constraintEnd_toEndOf="parent"
                    app:layout_constraintTop_toTopOf="parent"
                    app:layout_constraintBottom_toBottomOf="@+id/tvEnd"/>

                <SeekBar
                    android:id="@+id/seekBar"
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="8dp"
                    android:progressTint="@color/primary_cyan"
                    android:thumbTint="@color/primary_cyan"
                    app:layout_constraintTop_toBottomOf="@+id/tvCurrent"
                    app:layout_constraintStart_toStartOf="parent"
                    app:layout_constraintEnd_toEndOf="parent"/>

            </androidx.constraintlayout.widget.ConstraintLayout>

        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF


        # ============ MANIFEST ============
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <uses-feature
                android:name="android.software.leanback"
                android:required="false" />
            <uses-feature
                android:name="android.hardware.touchscreen"
                android:required="false" />

            <application
                android:theme="@style/Theme.ErdinPlayer"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:banner="@mipmap/ic_launcher"
                android:usesCleartextTraffic="true"
                android:networkSecurityConfig="@xml/network_security_config">

                <meta-data
                    android:name="com.google.android.gms.ads.APPLICATION_ID"
                    android:value="@string/admob_app_id_placeholder" />

                <activity
                    android:name=".LoginActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                    </intent-filter>
                </activity>

                <activity
                    android:name=".ContentActivity"
                    android:exported="false" />

                <activity
                    android:name=".SeriesDetailActivity"
                    android:exported="false" />

                <activity
                    android:name=".PlayerActivity"
                    android:screenOrientation="sensorLandscape"
                    android:configChanges="orientation|screenSize|keyboardHidden|layoutDirection|screenLayout|smallestScreenSize"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

        mkdir -p app/src/main/res/xml
        cat <<EOF > app/src/main/res/xml/network_security_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <network-security-config>
            <base-config cleartextTrafficPermitted="true">
                <trust-anchors>
                    <certificates src="system" />
                    <certificates src="user" />
                </trust-anchors>
            </base-config>
        </network-security-config>
        EOF

    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK + AAB (Release / Signed)
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon
        gradle bundleRelease --no-daemon

    - name: 6. APK'yi GitHub Artifact Olarak Yükle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Ultimate-APK
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk

    - name: 7. AAB'yi GitHub Artifact Olarak Yükle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Ultimate-AAB
        path: ErdinPlayer/app/build/outputs/bundle/release/*.aab

    - name: 8. Artifact URL'lerini Göster
      run: |
        echo "====================================="
        echo " 📦 APK Artifact URL (GitHub):"
        echo "${{ steps.upload_apk.outputs.artifact-url }}"
        echo "-------------------------------------"
        echo " 📦 AAB Artifact URL (GitHub):"
        echo "${{ steps.upload_aab.outputs.artifact-url }}"
        echo "====================================="

        echo "### ErdinPlayer Ultimate (Modern UI + Gestures) Çıktılar" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [APK'yi buradan indir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [AAB'yi buradan indir](${{ steps.upload_aab.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
