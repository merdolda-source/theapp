        echo '' | base64 -d > app/src/main/java/$PATH_NAME/adapters/GridAdapter.kt

        # ============ SPLASH ACTIVITY ============
        echo '' | base64 -d > app/src/main/java/$PATH_NAME/SplashActivity.kt

        # ============ LOGIN ACTIVITY ============
        echo '' | base64 -d > app/src/main/java/$PATH_NAME/LoginActivity.kt

        # ============ CONTENT ACTIVITY ============
        echo '' | base64 -d > app/src/main/java/$PATH_NAME/ContentActivity.kt

        # ============ PLAYER ACTIVITY ============
        echo '' | base64 -d > app/src/main/java/$PATH_NAME/PlayerActivity.kt

        # ============ SERIES DETAIL ACTIVITY ============
        echo '' | base64 -d > app/src/main/java/$PATH_NAME/SeriesDetailActivity.kt

        # ============ LAYOUTS ============

        # Splash Layout
        echo '' | base64 -d > app/src/main/res/layout/activity_splash.xml

        # Login Layout
        echo '' | base64 -d > app/src/main/res/layout/activity_login.xml

        # Item Account
        echo '' | base64 -d > app/src/main/res/layout/item_account.xml

        # Content Activity Layout
        echo '' | base64 -d > app/src/main/res/layout/activity_content.xml

        # Grid Item
        echo '' | base64 -d > app/src/main/res/layout/item_grid_pro.xml

        # Player Layout - GeliÅŸtirilmiÅŸ
        echo '' | base64 -d > app/src/main/res/layout/activity_player_pro.xml

        # Series Detail Layout
        echo '' | base64 -d > app/src/main/res/layout/activity_series_detail.xml

        # ============ MANIFEST ============
        echo '' | base64 -d > app/src/main/AndroidManifest.xml

        echo '' | base64 -d > app/src/main/res/xml/network_security_config.xml

    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK + AAB (Release)
      run: |
        cd EminXtreamPlayer
        gradle assembleRelease --no-daemon
        gradle bundleRelease --no-daemon

    - name: 6. APK YÃ¼kle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: EminXtream-Player-Pro-APK
        path: EminXtreamPlayer/app/build/outputs/apk/release/*.apk

    - name: 7. AAB YÃ¼kle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: EminXtream-Player-Pro-AAB
        path: EminXtreamPlayer/app/build/outputs/bundle/release/*.aab

    - name: 8. URL'leri GÃ¶ster
      run: |
        echo "====================================="
        echo " ğŸ“¦ APK: ${{ steps.upload_apk.outputs.artifact-url }}"
        echo " ğŸ“¦ AAB: ${{ steps.upload_aab.outputs.artifact-url }}"
        echo "====================================="
        echo "### EminXtream Player Pro v3.0 Ã‡Ä±ktÄ±lar" >> $GITHUB_STEP_SUMMARY
        echo "ğŸ”— [APK Ä°ndir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "ğŸ”— [AAB Ä°ndir](${{ steps.upload_aab.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
