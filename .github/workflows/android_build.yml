<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent" android:layout_height="wrap_content"
    android:orientation="vertical" android:padding="6dp">

    <LinearLayout
        android:id="@+id/cardRoot"
        android:layout_width="match_parent" android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:background="@drawable/bg_card"
        android:minHeight="76dp" android:padding="14dp"
        android:gravity="center_vertical"
        android:focusable="true" android:clickable="true">

        <!-- Thumbnail / Logo -->
        <FrameLayout android:layout_width="64dp" android:layout_height="64dp"
            android:layout_marginEnd="14dp">
            <ImageView android:id="@+id/ivThumb"
                android:layout_width="match_parent" android:layout_height="match_parent"
                android:scaleType="centerCrop"
                android:background="@drawable/bg_card_soft"/>
            <!-- Live badge -->
            <LinearLayout android:id="@+id/liveBadge"
                android:layout_width="wrap_content" android:layout_height="18dp"
                android:layout_gravity="bottom|start"
                android:background="@drawable/bg_live_badge"
                android:paddingHorizontal="6dp"
                android:orientation="horizontal" android:gravity="center"
                android:visibility="gone">
                <View android:layout_width="6dp" android:layout_height="6dp"
                    android:background="@drawable/bg_tab_active"
                    android:layout_marginEnd="4dp"/>
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:text="@string/live_badge"
                    android:textColor="@color/white" android:textSize="9sp"
                    android:textStyle="bold" android:letterSpacing="0.1"/>
            </LinearLayout>
            <!-- Rating badge -->
            <TextView android:id="@+id/tvRating"
                android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:layout_gravity="top|end"
                android:background="@drawable/bg_rating"
                android:paddingHorizontal="5dp" android:paddingVertical="2dp"
                android:textColor="@color/rating_gold" android:textSize="9sp"
                android:textStyle="bold" android:visibility="gone"/>
        </FrameLayout>

        <!-- Metin -->
        <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
            android:layout_weight="1" android:orientation="vertical">
            <TextView android:id="@+id/tvTitle"
                android:layout_width="match_parent" android:layout_height="wrap_content"
                android:textColor="@color/text_primary" android:textSize="15sp"
                android:textStyle="bold" android:maxLines="2" android:ellipsize="end"/>
            <TextView android:id="@+id/tvSubtitle"
                android:layout_width="match_parent" android:layout_height="wrap_content"
                android:textColor="@color/text_secondary" android:textSize="12sp"
                android:layout_marginTop="4dp" android:visibility="gone"
                android:maxLines="1" android:ellipsize="end"/>
        </LinearLayout>

        <!-- Play ikonu -->
        <ImageView
            android:layout_width="28dp" android:layout_height="28dp"
            android:src="@android:drawable/ic_media_play"
            android:tint="@color/primary"
            android:layout_marginStart="8dp"/>
    </LinearLayout>
</LinearLayout>
