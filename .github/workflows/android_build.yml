package com.emin.xtream.player

import android.content.Intent
import android.os.Bundle
import android.view.View
import android.widget.ProgressBar
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity
import androidx.recyclerview.widget.LinearLayoutManager
import androidx.recyclerview.widget.RecyclerView
import com.emin.xtream.player.adapters.MediaAdapter
import com.emin.xtream.player.models.EpisodeItem
import com.emin.xtream.player.utils.XtreamApi

class SeriesDetailActivity : AppCompatActivity() {

    private lateinit var tvTitle: TextView
    private lateinit var tvStatus: TextView
    private lateinit var pb: ProgressBar
    private lateinit var rv: RecyclerView
    private lateinit var adapter: MediaAdapter

    private var seriesName = ""
    private var allSeasons: List<Int> = emptyList()
    private var seasonMap: Map<Int, List<EpisodeItem>> = emptyMap()
    private var currentSeason = -1

    private data class Row(val realIndex: Int, val season: Int, val isAd: Boolean)
    private var rowMap: List<Row> = emptyList()
    private val AD_INTERVAL = 8

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_series_detail)

        tvTitle  = findViewById(R.id.tvSeriesTitle)
        tvStatus = findViewById(R.id.tvSeriesStatus)
        pb       = findViewById(R.id.pbSeries)
        rv       = findViewById(R.id.rvEpisodes)
        rv.layoutManager = LinearLayoutManager(this)
        adapter = MediaAdapter(emptyList(), emptyList(), emptyList(), emptyList(), emptyList()) { onRowClick(it) }
        rv.adapter = adapter

        seriesName = intent.getStringExtra("SERIES_NAME") ?: "Dizi"
        val seriesId = intent.getStringExtra("SERIES_ID") ?: ""
        val server   = intent.getStringExtra("SERVER") ?: ""
        val user     = intent.getStringExtra("USERNAME") ?: ""
        val pass     = intent.getStringExtra("PASSWORD") ?: ""
        tvTitle.text = seriesName
        findViewById<View>(R.id.tvBackBtn).setOnClickListener {
            if (currentSeason >= 0) { currentSeason = -1; showSeasons() } else finish()
        }

        if (seriesId.isEmpty()) { tvStatus.text = "Geçersiz seri bilgisi."; tvStatus.visibility = View.VISIBLE; return }
        pb.visibility = View.VISIBLE

        Thread {
            try {
                val (_, seasons) = XtreamApi.seriesInfo(server, user, pass, seriesId)
                runOnUiThread {
                    pb.visibility = View.GONE
                    allSeasons = seasons.keys.sorted()
                    seasonMap  = seasons
                    if (allSeasons.isEmpty()) { tvStatus.text = "Bölüm bulunamadı."; tvStatus.visibility = View.VISIBLE }
                    else showSeasons()
                }
            } catch (e: Exception) {
                runOnUiThread {
                    pb.visibility = View.GONE
                    tvStatus.text = "Hata: ${e.message}"; tvStatus.visibility = View.VISIBLE
                }
            }
        }.start()
    }

    private fun showSeasons() {
        currentSeason = -1
        tvTitle.text = seriesName
        val rows = mutableListOf<Row>(); val titles = mutableListOf<String>()
        val subs = mutableListOf<String>(); val thumbs = mutableListOf<String?>()
        allSeasons.forEachIndexed { i, s ->
            rows.add(Row(i, s, false)); titles.add("${getString(R.string.season_prefix)} $s")
            subs.add("${seasonMap[s]?.size ?: 0} bölüm"); thumbs.add(null)
            if ((i + 1) % AD_INTERVAL == 0) {
                rows.add(Row(-1, -1, true)); titles.add("###AD###"); subs.add(""); thumbs.add(null)
            }
        }
        rowMap = rows
        adapter.update(titles, subs, thumbs,
            List(titles.size) { false }, List(titles.size) { null })
    }

    private fun showEpisodes(season: Int) {
        currentSeason = season
        tvTitle.text = "$seriesName • ${getString(R.string.season_prefix)} $season"
        val eps = (seasonMap[season] ?: emptyList()).sortedBy { it.episodeNumber }
        val rows = mutableListOf<Row>(); val titles = mutableListOf<String>()
        val subs = mutableListOf<String>(); val thumbs = mutableListOf<String?>()
        eps.forEachIndexed { i, ep ->
            rows.add(Row(i, season, false))
            titles.add("${ep.episodeNumber.toString().padStart(2, '0')}${getString(R.string.episode_suffix)} — ${ep.title}")
            subs.add(ep.plot ?: ""); thumbs.add(ep.thumbnailUrl)
            if ((i + 1) % AD_INTERVAL == 0) {
                rows.add(Row(-1, -1, true)); titles.add("###AD###"); subs.add(""); thumbs.add(null)
            }
        }
        rowMap = rows
        adapter.update(titles, subs, thumbs,
            List(titles.size) { false }, List(titles.size) { null })
    }

    private fun onRowClick(pos: Int) {
        val row = rowMap.getOrNull(pos) ?: return
        if (row.isAd) return
        if (currentSeason < 0) {
            showEpisodes(row.season)
        } else {
            val eps = (seasonMap[currentSeason] ?: emptyList()).sortedBy { it.episodeNumber }
            val ep  = eps.getOrNull(row.realIndex) ?: return
            startActivity(Intent(this, PlayerActivity::class.java).apply {
                putExtra("URL",   ep.streamUrl ?: return)
                putExtra("TITLE", "${seriesName} — S${currentSeason}E${ep.episodeNumber}")
                putExtra("TYPE",  "VOD")
                putExtra("THUMB", ep.thumbnailUrl ?: "")
                putExtra("REF",   ""); putExtra("ORIGIN", "")
                putExtra("ITEM_ID", ep.id)
            })
        }
    }

    override fun onBackPressed() {
        if (currentSeason >= 0) { currentSeason = -1; showSeasons() } else super.onBackPressed()
    }
}
