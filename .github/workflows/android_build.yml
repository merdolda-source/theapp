name: ErdinPlayer Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Cekme
      uses: actions/checkout@v4

    - name: 2. Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Proje Uret
      shell: bash
      run: bash generate_erdinplayer.sh

    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 5. APK + AAB Build
      run: |
        cd EerdinPlayer
        gradle :app:assembleRelease --no-daemon --stacktrace
        gradle :app:bundleRelease --no-daemon

    - name: 6. APK Yukle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-APK
        path: EerdinPlayer/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: 7. AAB Yukle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-AAB
        path: EerdinPlayer/app/build/outputs/bundle/release/*.aab
        retention-days: 30

    - name: 8. Ozet
      if: always()
      run: |
        echo '### ErdinPlayer build' >> $GITHUB_STEP_SUMMARY
        echo "APK: ${{ steps.upload_apk.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
        echo "AAB: ${{ steps.upload_aab.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
