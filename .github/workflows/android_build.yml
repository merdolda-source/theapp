    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. APK + AAB Build
      run: |
        cd ErdinPlayer
        gradle :app:assembleRelease --no-daemon --stacktrace
        gradle :app:bundleRelease --no-daemon

    - name: 6. APK Yukle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-SmartPlayer-APK
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: 7. AAB Yukle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-SmartPlayer-AAB
        path: ErdinPlayer/app/build/outputs/bundle/release/*.aab
        retention-days: 30

    - name: 8. Ozet
      if: always()
      run: |
        echo '### ErdinPlayer v3.1 - Akilli Player' >> $GITHUB_STEP_SUMMARY
        echo '| Ozellik | Durum |' >> $GITHUB_STEP_SUMMARY
        echo '|---|---|' >> $GITHUB_STEP_SUMMARY
        echo '| Kaldigi yerden devam | OK |' >> $GITHUB_STEP_SUMMARY
        echo '| Coklu format denemesi | OK |' >> $GITHUB_STEP_SUMMARY
        echo '| Oynatma hizi 0.5x-2x | OK |' >> $GITHUB_STEP_SUMMARY
        echo '| Uyku zamanlayici | OK |' >> $GITHUB_STEP_SUMMARY
        echo '| Ekran kilidi | OK |' >> $GITHUB_STEP_SUMMARY
        echo '| Ses/Altyazi track | OK |' >> $GITHUB_STEP_SUMMARY
        echo '| PiP | OK |' >> $GITHUB_STEP_SUMMARY
        echo "APK: ${{ steps.upload_apk.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
        echo "AAB: ${{ steps.upload_aab.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
