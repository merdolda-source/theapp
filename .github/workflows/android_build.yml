name: ErdinPlayer Pro Ultra Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Depo Çekme
      uses: actions/checkout@v4
    
    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. ErdinPlayer Pro Proje Üretimi (Siyah Ekran FIX)
      run: |
        set -e
        echo "Goodbye"
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        PASS="erdin123"
        
        echo "🚀 ErdinPlayer Pro Projesi Üretiliyor..."

        # Klasör Yapısı
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/models
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/adapters
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/utils
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # İKON ve KEYSTORE
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass $PASS -keypass $PASS -dname "CN=Erdin, O=ErdinMedia, C=TR"

        # --- GRADLE ROOT ---
        echo "include ':app'" > settings.gradle
        echo -e "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m" > gradle.properties

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # --- APP MODULE GRADLE ---
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33

            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.1.0"
            }

            signingConfigs {
                release {
                    storeFile file("keystore.jks")
                    storePassword "$PASS"
                    keyAlias "key0"
                    keyPassword "$PASS"
                }
            }

            buildTypes {
                release {
                    // Şimdilik kapalı: shrink/proguard kaynaklı sürpriz siyah ekran olmasın
                    minifyEnabled false
                    signingConfig signingConfigs.release
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.0'

            // Media3 ExoPlayer
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'

            // Glide (şimdilik icon null ama hazır dursun)
            implementation 'com.github.bumptech.glide:glide:4.15.1'
        }
        EOF

        # --- COLORS / STYLES / STRINGS ---
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <color name="bg_dark">#0A0A0A</color>
            <color name="accent_green">#00E676</color>
            <color name="white">#FFFFFF</color>
            <color name="black">#000000</color>
            <color name="gray_800">#222222</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <!-- Daha stabil: AppCompat tabanlı tema -->
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.DayNight.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="android:textColor">@color/white</item>
                <item name="colorAccent">@color/accent_green</item>
            </style>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">ErdinPlayer Pro</string>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_input.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/white"/>
            <corners android:radius="10dp"/>
            <stroke android:width="2dp" android:color="@color/accent_green"/>
        </shape>
        EOF

        # --- MODELLER ---
        cat <<EOF > app/src/main/java/$PATH_NAME/models/Models.kt
        package $PACKAGE_NAME.models

        data class StreamItem(
            val name: String,
            val stream_id: String?,
            val series_id: String?
        )
        EOF

        # --- UTILS (Prefs) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context

        class Prefs(ctx: Context) {
            private val p = ctx.getSharedPreferences("EP_Prefs", 0)

            fun save(dns: String, u: String, ps: String) {
                p.edit()
                    .putString("dns", dns)
                    .putString("u", u)
                    .putString("p", ps)
                    .apply()
            }

            fun getDns(): String = p.getString("dns", "") ?: ""
            fun getUser(): String = p.getString("u", "") ?: ""
            fun getPass(): String = p.getString("p", "") ?: ""
        }
        EOF

        # --- ADAPTER (BASİT LİSTE) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/GridAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.StreamItem

        class GridAdapter(
            private val list: List<StreamItem>,
            private val onClick: (StreamItem) -> Unit
        ) : RecyclerView.Adapter<GridAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtName)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_grid_pro, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val item = list[position]
                holder.txt.text = item.name
                holder.itemView.setOnClickListener { onClick(item) }
            }

            override fun getItemCount(): Int = list.size
        }
        EOF

        # --- LOGIN ACTIVITY ---
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.utils.Prefs

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)

                val prefs = Prefs(this)
                val eD = findViewById<EditText>(R.id.etDns)
                val eU = findViewById<EditText>(R.id.etUser)
                val eP = findViewById<EditText>(R.id.etPass)

                eD.setText(prefs.getDns())
                eU.setText(prefs.getUser())
                eP.setText(prefs.getPass())

                findViewById<Button>(R.id.btnLogin).setOnClickListener {
                    val d = eD.text.toString().trim()
                    val u = eU.text.toString().trim()
                    val p = eP.text.toString().trim()

                    if (d.isNotEmpty() && u.isNotEmpty()) {
                        prefs.save(d, u, p)
                        startActivity(Intent(this, DashboardActivity::class.java))
                    } else {
                        Toast.makeText(this, "Bilgileri eksiksiz girin!", Toast.LENGTH_SHORT).show()
                    }
                }
            }
        }
        EOF

        # --- DASHBOARD ACTIVITY (SADE BUTTONLAR) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.utils.Prefs

        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)

                val prefs = Prefs(this)
                val tvInfo = findViewById<TextView>(R.id.tvInfo)
                tvInfo.text = "AKTİF KULLANICI: " + prefs.getUser()

                fun go(mode: String) {
                    val i = Intent(this, ContentActivity::class.java)
                    i.putExtra("MODE", mode)
                    startActivity(i)
                }

                findViewById<Button>(R.id.btnLive).setOnClickListener { go("LIVE") }
                findViewById<Button>(R.id.btnVod).setOnClickListener { go("VOD") }
                findViewById<Button>(R.id.btnSeries).setOnClickListener { go("SERIES") }
                findViewById<Button>(R.id.btnExit).setOnClickListener { finish() }
            }
        }
        EOF

        # --- CONTENT ACTIVITY (HER ZAMAN 30 KART) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/ContentActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import androidx.recyclerview.widget.GridLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.adapters.GridAdapter
        import $PACKAGE_NAME.models.StreamItem
        import $PACKAGE_NAME.utils.Prefs

        class ContentActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_content)

                val mode = intent.getStringExtra("MODE") ?: "LIVE"
                findViewById<TextView>(R.id.tvHeader).text = mode + " İÇERİKLERİ"

                val rv = findViewById<RecyclerView>(R.id.rvContent)
                rv.layoutManager = GridLayoutManager(this, 3)

                // HER ZAMAN GÖRÜNEN DEMO LİSTE (siyah boş ekran yok artık)
                val list = (1..30).map { i ->
                    StreamItem(
                        name = "$mode Kanal #$i",
                        stream_id = if (mode == "SERIES") null else i.toString(),
                        series_id = if (mode == "SERIES") i.toString() else null
                    )
                }

                val prefs = Prefs(this)

                rv.adapter = GridAdapter(list) { item ->
                    if (mode == "SERIES") {
                        val itn = Intent(this, SeriesDetailActivity::class.java)
                        itn.putExtra("S_NAME", item.name)
                        startActivity(itn)
                    } else {
                        val path = if (mode == "LIVE") "live" else "movie"
                        val dns = prefs.getDns()
                        val user = prefs.getUser()
                        val pass = prefs.getPass()
                        val id = item.stream_id ?: ""

                        val url = "$dns/$path/$user/$pass/$id.ts"

                        val itn = Intent(this, PlayerActivity::class.java)
                        itn.putExtra("URL", url)
                        startActivity(itn)
                    }
                }
            }
        }
        EOF

        # --- SERIES DETAIL ACTIVITY (BASİT) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/SeriesDetailActivity.kt
        package $PACKAGE_NAME

        import android.os.Bundle
        import android.widget.ArrayAdapter
        import android.widget.ListView
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity

        class SeriesDetailActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_series_detail)

                val name = intent.getStringExtra("S_NAME") ?: "Dizi"
                findViewById<TextView>(R.id.tvSeriesTitle).text = name

                val lv = findViewById<ListView>(R.id.lvEpisodes)
                val episodes = (1..10).map { "Sezon 1 - Bölüm $it" }
                lv.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, episodes)
            }
        }
        EOF

        # --- PLAYER ACTIVITY ---
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME

        import android.os.Bundle
        import android.view.WindowManager
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView

        class PlayerActivity : AppCompatActivity() {

            private var player: ExoPlayer? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                window.setFlags(
                    WindowManager.LayoutParams.FLAG_FULLSCREEN,
                    WindowManager.LayoutParams.FLAG_FULLSCREEN
                )

                setContentView(R.layout.activity_player_pro)

                val url = intent.getStringExtra("URL") ?: ""
                val pv = findViewById<PlayerView>(R.id.pvMain)

                player = ExoPlayer.Builder(this).build().also { exo ->
                    pv.player = exo
                    exo.setMediaItem(MediaItem.fromUri(url))
                    exo.prepare()
                    exo.play()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                player?.release()
                player = null
            }
        }
        EOF

        # --- LAYOUTLAR (HEPSİ BASİT, ÇÖKME ŞANSI YOK GİBİ) ---

        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:padding="24dp"
            android:background="@color/bg_dark">

            <TextView
                android:id="@+id/tvTitle"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="ERDINPLAYER PRO"
                android:textColor="@color/accent_green"
                android:textStyle="bold"
                android:textSize="24sp"
                android:layout_marginBottom="24dp"/>

            <EditText
                android:id="@+id/etDns"
                android:layout_width="match_parent"
                android:layout_height="48dp"
                android:hint="DNS: http://ip:port"
                android:background="@drawable/bg_input"
                android:padding="10dp"
                android:textColor="@color/black"
                android:textColorHint="@color/gray_800"
                android:layout_marginBottom="12dp"/>

            <EditText
                android:id="@+id/etUser"
                android:layout_width="match_parent"
                android:layout_height="48dp"
                android:hint="Kullanıcı"
                android:background="@drawable/bg_input"
                android:padding="10dp"
                android:textColor="@color/black"
                android:textColorHint="@color/gray_800"
                android:layout_marginBottom="12dp"/>

            <EditText
                android:id="@+id/etPass"
                android:layout_width="match_parent"
                android:layout_height="48dp"
                android:hint="Şifre"
                android:inputType="textPassword"
                android:background="@drawable/bg_input"
                android:padding="10dp"
                android:textColor="@color/black"
                android:textColorHint="@color/gray_800"
                android:layout_marginBottom="20dp"/>

            <Button
                android:id="@+id/btnLogin"
                android:layout_width="match_parent"
                android:layout_height="52dp"
                android:text="GİRİŞ YAP"
                android:textStyle="bold"
                android:textColor="@color/black"
                android:background="@color/accent_green"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="@color/bg_dark"
            android:padding="16dp">

            <TextView
                android:id="@+id/tvInfo"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="AKTİF KULLANICI:"
                android:textColor="@color/accent_green"
                android:textSize="18sp"
                android:textStyle="bold"
                android:layout_marginBottom="24dp"/>

            <Button
                android:id="@+id/btnLive"
                android:layout_width="match_parent"
                android:layout_height="52dp"
                android:text="📺 CANLI TV"
                android:layout_marginBottom="12dp"/>

            <Button
                android:id="@+id/btnVod"
                android:layout_width="match_parent"
                android:layout_height="52dp"
                android:text="🎬 FİLMLER"
                android:layout_marginBottom="12dp"/>

            <Button
                android:id="@+id/btnSeries"
                android:layout_width="match_parent"
                android:layout_height="52dp"
                android:text="🍿 DİZİLER"
                android:layout_marginBottom="12dp"/>

            <Button
                android:id="@+id/btnExit"
                android:layout_width="match_parent"
                android:layout_height="52dp"
                android:text="❌ ÇIKIŞ"
                android:layout_marginTop="12dp"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_content.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="@color/bg_dark">

            <TextView
                android:id="@+id/tvHeader"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textColor="@color/accent_green"
                android:textSize="18sp"
                android:textStyle="bold"
                android:padding="16dp"/>

            <androidx.recyclerview.widget.RecyclerView
                android:id="@+id/rvContent"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:padding="8dp"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/item_grid_pro.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="4dp">

            <TextView
                android:id="@+id/txtName"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textColor="@color/white"
                android:textSize="13sp"
                android:maxLines="2"
                android:gravity="center"
                android:padding="8dp"
                android:background="@color/gray_800"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_series_detail.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="@color/bg_dark">

            <TextView
                android:id="@+id/tvSeriesTitle"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textColor="@color/accent_green"
                android:textSize="20sp"
                android:textStyle="bold"
                android:padding="16dp"/>

            <ListView
                android:id="@+id/lvEpisodes"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:divider="@color/gray_800"
                android:dividerHeight="1dp"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_player_pro.xml
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="@color/black">

            <androidx.media3.ui.PlayerView
                android:id="@+id/pvMain"
                android:layout_width="match_parent"
                android:layout_height="match_parent"/>
        </FrameLayout>
        EOF

        # --- MANIFEST ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:theme="@style/Theme.ErdinPlayer"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:usesCleartextTraffic="true">

                <activity
                    android:name=".LoginActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>

                <activity android:name=".DashboardActivity" />
                <activity android:name=".ContentActivity" />
                <activity android:name=".SeriesDetailActivity" />
                <activity android:name=".PlayerActivity" />
            </application>
        </manifest>
        EOF

    - name: 4. Gradle Derleme
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon

    - name: 6. APK'yi GitHub Artifact Olarak Yükle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Ultra
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk

    - name: 7. Artifact URL'ini Göster
      run: |
        echo "====================================="
        echo " 📦 APK Artifact URL (GitHub):"
        echo "${{ steps.upload_apk.outputs.artifact-url }}"
        echo "====================================="

        echo "### ErdinPlayer Pro APK" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [APK'yi buradan indir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
