        EOF

        cat <<EOF > app/src/main/res/drawable/bg_input_dark.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/gray_800"/>
            <corners android:radius="12dp"/>
