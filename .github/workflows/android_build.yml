name: Fixed Version Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🏗️ Uygulama Oluşturuluyor (Script Çalıştırılıyor)
      run: |
        echo "⚙️ Script aranıyor..."
        SCRIPT_FILE=$(find . -maxdepth 1 -name "*.sh" | head -n 1)
        
        if [ -z "$SCRIPT_FILE" ]; then
          echo "❌ Script bulunamadı!"
          exit 1
        fi
        
        chmod +x "$SCRIPT_FILE"
        bash "$SCRIPT_FILE"

    - name: 🔧 Gradle 8.0 Kurulumu (Versiyon Sabitleme)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0' # SORUNU ÇÖZEN SATIR BURASI (9 yerine 8 kullan)

    - name: 🛠️ Eksikleri Tamamla ve Derle
      run: |
        # Proje klasörünü bul
        BUILD_FILE=$(find . -maxdepth 2 -name "build.gradle" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_FILE")
        
        echo "🏠 Proje Ana Dizini: $PROJECT_ROOT"
        
        # settings.gradle eksikse oluştur
        if [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
           echo "include ':app'" > "$PROJECT_ROOT/settings.gradle"
        fi
        
        # Derleme Başlasın
        cd "$PROJECT_ROOT"
        # --warning-mode all ile detayları görerek, stacktrace ile derliyoruz
        gradle assembleRelease --stacktrace

    - name: 📦 APK'yı Paketle ve Sun
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-release
        path: |
          **/build/outputs/apk/release/*.apk
          **/app-release.apk
