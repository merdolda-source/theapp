package $PACKAGE_NAME

import android.os.Bundle
import androidx.appcompat.app.AppCompatActivity
import com.google.android.material.bottomnavigation.BottomNavigationView

class HomeActivity : AppCompatActivity() {

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_home)

        val bottom = findViewById<BottomNavigationView>(R.id.bottomNav)

        // default: Live
        supportFragmentManager.beginTransaction()
            .replace(R.id.container, XtreamListFragment.newInstance("live"))
            .commit()

        bottom.setOnItemSelectedListener {
            when (it.itemId) {
                R.id.nav_live -> open("live")
                R.id.nav_movies -> open("vod")
                R.id.nav_series -> open("series")
            }
            true
        }
    }

    private fun open(type: String) {
        supportFragmentManager.beginTransaction()
            .replace(R.id.container, XtreamListFragment.newInstance(type))
            .commit()
    }
}
EOF

        # --- T. XTREAM LIST FRAGMENT (KATEGORİ + İÇERİK) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/XtreamListFragment.kt
package $PACKAGE_NAME

import android.content.Intent
import android.os.Bundle
import android.view.*
import android.widget.ProgressBar
import android.widget.TextView
import android.widget.Toast
import androidx.fragment.app.Fragment
import androidx.recyclerview.widget.LinearLayoutManager
import androidx.recyclerview.widget.RecyclerView
import com.google.gson.JsonObject
import retrofit2.Call
import retrofit2.Callback
import retrofit2.Response

class XtreamListFragment : Fragment() {

    private lateinit var type: String
    private lateinit var api: XtreamService
    private lateinit var username: String
    private lateinit var password: String
    private lateinit var portal: String

    private lateinit var rvCategories: RecyclerView
    private lateinit var rvItems: RecyclerView
    private lateinit var progress: ProgressBar
    private lateinit var txtHeader: TextView

    private lateinit var catAdapter: SimpleAdapter
    private lateinit var itemAdapter: SimpleAdapter

    companion object {
        fun newInstance(type: String): XtreamListFragment {
            val f = XtreamListFragment()
            f.arguments = Bundle().apply { putString("type", type) }
            return f
        }
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        type = arguments?.getString("type") ?: "live"

        portal = Prefs.portal(requireContext())
        username = Prefs.user(requireContext())
        password = Prefs.pass(requireContext())
        api = ApiClient.create(portal)
    }

    override fun onCreateView(inflater: LayoutInflater, container: ViewGroup?, savedInstanceState: Bundle?): View {
        val v = inflater.inflate(R.layout.fragment_dual_list, container, false)
        rvCategories = v.findViewById(R.id.rvCategories)
        rvItems = v.findViewById(R.id.rvItems)
        progress = v.findViewById(R.id.progress)
        txtHeader = v.findViewById(R.id.txtHeader)

        txtHeader.text = when (type) {
            "vod" -> "Filmler"
            "series" -> "Diziler"
            else -> "Canlı TV"
        }

        rvCategories.layoutManager = LinearLayoutManager(requireContext(), LinearLayoutManager.HORIZONTAL, false)
        rvItems.layoutManager = LinearLayoutManager(requireContext())

        catAdapter = SimpleAdapter(emptyList()) { row ->
            loadItems(row.id)
        }
        itemAdapter = SimpleAdapter(emptyList()) { row ->
            when (type) {
                "series" -> openSeries(row.id, row.title)
                else -> openPlayer(buildPlayUrl(type, row.id))
            }
        }

        rvCategories.adapter = catAdapter
        rvItems.adapter = itemAdapter

        loadCategories()
        return v
    }

    private fun loadCategories() {
        progress.visibility = View.VISIBLE
        val action = when (type) {
            "vod" -> "get_vod_categories"
            "series" -> "get_series_categories"
            else -> "get_live_categories"
        }

        api.playerApi(username, password, action).enqueue(object : Callback<JsonObject> {
            override fun onResponse(call: Call<JsonObject>, response: Response<JsonObject>) {
                progress.visibility = View.GONE
                val arr = response.body()?.asJsonArray ?: run {
                    Toast.makeText(requireContext(), "Kategori gelmedi", Toast.LENGTH_SHORT).show()
                    return
                }

                val list = arr.mapNotNull { el ->
                    val o = el.asJsonObject
                    val id = o.get("category_id")?.asString ?: return@mapNotNull null
                    val name = o.get("category_name")?.asString ?: "Kategori"
                    SimpleAdapter.RowItem(id, name)
                }

                catAdapter.submit(list)

                // otomatik ilk kategori
                if (list.isNotEmpty()) loadItems(list.first().id)
            }

            override fun onFailure(call: Call<JsonObject>, t: Throwable) {
                progress.visibility = View.GONE
                Toast.makeText(requireContext(), "Hata: \${t.message}", Toast.LENGTH_LONG).show()
            }
        })
    }

    private fun loadItems(categoryId: String) {
        progress.visibility = View.VISIBLE
        val action = when (type) {
            "vod" -> "get_vod_streams"
            "series" -> "get_series"
            else -> "get_live_streams"
        }

        api.playerApi(username, password, action, categoryId).enqueue(object : Callback<JsonObject> {
            override fun onResponse(call: Call<JsonObject>, response: Response<JsonObject>) {
                progress.visibility = View.GONE
                val arr = response.body()?.asJsonArray ?: run {
                    Toast.makeText(requireContext(), "Liste gelmedi", Toast.LENGTH_SHORT).show()
                    return
                }

                val list = arr.mapNotNull { el ->
                    val o = el.asJsonObject
                    val idField = when (type) {
                        "series" -> "series_id"
                        else -> "stream_id"
                    }
                    val id = o.get(idField)?.asString ?: return@mapNotNull null
                    val name = o.get("name")?.asString ?: "İçerik"
                    SimpleAdapter.RowItem(id, name)
                }

                itemAdapter.submit(list)
            }

            override fun onFailure(call: Call<JsonObject>, t: Throwable) {
                progress.visibility = View.GONE
                Toast.makeText(requireContext(), "Hata: \${t.message}", Toast.LENGTH_LONG).show()
            }
        })
    }

    private fun openPlayer(url: String) {
        val i = Intent(requireContext(), PlayerActivity::class.java)
        i.putExtra("play_url", url)
        startActivity(i)
    }

    private fun openSeries(seriesId: String, title: String) {
        val i = Intent(requireContext(), SeriesDetailsActivity::class.java)
        i.putExtra("series_id", seriesId)
        i.putExtra("series_title", title)
        startActivity(i)
    }

    private fun buildPlayUrl(type: String, streamId: String): String {
        // Xtream standart:
        // live:   /live/user/pass/id.m3u8  (bazı paneller .ts döner)
        // movie:  /movie/user/pass/id.mp4  (bazıları m3u8 olabilir)
        // series episode: SeriesDetailsActivity içinde video linki hazırlanacak
        val base = if (portal.endsWith("/")) portal.dropLast(1) else portal
        return when (type) {
            "vod" -> "\$base/movie/\$username/\$password/\$streamId.mp4"
            else -> "\$base/live/\$username/\$password/\$streamId.m3u8"
        }
    }
}
