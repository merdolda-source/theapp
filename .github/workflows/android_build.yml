        EOF

        # --- UTILS (Prefs + Çoklu Hesap + Silme) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import $PACKAGE_NAME.models.AccountProfile
        import org.json.JSONArray
        import org.json.JSONObject

        class Prefs(ctx: Context) {
            private val p = ctx.getSharedPreferences("EP_Prefs", 0)

            private fun loadArray(): JSONArray {
                val s = p.getString("accounts_json", "[]") ?: "[]"
                return JSONArray(s)
            }

            private fun saveArray(arr: JSONArray) {
                p.edit().putString("accounts_json", arr.toString()).apply()
            }

            fun createXtreamAccount(name: String, dns: String, u: String, ps: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "XTREAM")
                obj.put("dns", dns)
                obj.put("user", u)
                obj.put("pass", ps)
                obj.put("m3u", "")

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun createM3uAccount(name: String, m3u: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "M3U")
                obj.put("dns", "")
                obj.put("user", "")
                obj.put("pass", "")
                obj.put("m3u", m3u)

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun getAccounts(): List<AccountProfile> {
                val arr = loadArray()
                val list = ArrayList<AccountProfile>()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null) {
                        val id = o.optInt("id", 0)
                        val name = o.optString("name", "Hesap " + i)
                        val type = o.optString("type", "XTREAM")
                        val dns = o.optString("dns", null)
                        val user = o.optString("user", null)
                        val pass = o.optString("pass", null)
                        val m3u = o.optString("m3u", null)
                        list.add(AccountProfile(id, name, type, dns, user, pass, m3u))
                    }
                    i++
                }
                return list
            }

            fun deleteAccount(id: Int) {
                val arr = loadArray()
                val newArr = JSONArray()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null && o.optInt("id", 0) != id) {
                        newArr.put(o)
                    }
                    i++
                }
                saveArray(newArr)

                val activeId = p.getInt("active_id", -1)
                if (activeId == id) {
                    val remaining = getAccounts()
                    val newActive = if (remaining.isNotEmpty()) remaining[0].id else -1
                    p.edit().putInt("active_id", newActive).apply()
                }
            }

            fun setActive(id: Int) {
                p.edit().putInt("active_id", id).apply()
            }

            fun getActive(): AccountProfile? {
                val all = getAccounts()
                if (all.isEmpty()) return null
                val activeId = p.getInt("active_id", -1)
                if (activeId <= 0) return all[0]
                return all.find { it.id == activeId } ?: all[0]
            }

            fun getDns(): String = getActive()?.dns ?: ""
            fun getUser(): String = getActive()?.user ?: ""
            fun getPass(): String = getActive()?.pass ?: ""
        }
        EOF

        # --- ADAPTER ---
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/GridAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.StreamItem

        class GridAdapter(
            private val list: List<StreamItem>,
            private val onClick: (StreamItem) -> Unit
        ) : RecyclerView.Adapter<GridAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtName)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_grid_pro, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val item = list[position]
                holder.txt.text = item.name
                holder.itemView.setOnClickListener { onClick(item) }
            }

            override fun getItemCount(): Int = list.size
        }
        EOF

        # --- LOGIN ACTIVITY (Button’lu tip seçim + light dialog) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.View
        import android.widget.*
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.models.AccountProfile
        import $PACKAGE_NAME.utils.Prefs

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)

                val prefs = Prefs(this)

                val etName = findViewById<EditText>(R.id.etName)
                val etDns = findViewById<EditText>(R.id.etDns)
                val etUser = findViewById<EditText>(R.id.etUser)
                val etPass = findViewById<EditText>(R.id.etPass)
                val etM3u = findViewById<EditText>(R.id.etM3u)

                val layoutXtream = findViewById<View>(R.id.layoutXtream)
                val layoutM3u = findViewById<View>(R.id.layoutM3u)

                val btnTypeXtream = findViewById<Button>(R.id.btnTypeXtream)
                val btnTypeM3u = findViewById<Button>(R.id.btnTypeM3u)

                val btnAdd = findViewById<Button>(R.id.btnAddAccount)
                val lvAccounts = findViewById<ListView>(R.id.lvAccounts)

                var currentType = "XTREAM"

                fun updateTypeButtons() {
                    if (currentType == "XTREAM") {
                        layoutXtream.visibility = View.VISIBLE
                        layoutM3u.visibility = View.GONE
                        btnTypeXtream.setBackgroundColor(resources.getColor(R.color.accent_green))
                        btnTypeM3u.setBackgroundColor(resources.getColor(R.color.gray_800))
                    } else {
                        layoutXtream.visibility = View.GONE
                        layoutM3u.visibility = View.VISIBLE
                        btnTypeXtream.setBackgroundColor(resources.getColor(R.color.gray_800))
                        btnTypeM3u.setBackgroundColor(resources.getColor(R.color.accent_green))
                    }
                }

                btnTypeXtream.setOnClickListener {
                    currentType = "XTREAM"
                    updateTypeButtons()
                }

                btnTypeM3u.setOnClickListener {
                    currentType = "M3U"
                    updateTypeButtons()
                }

                updateTypeButtons()

                fun refreshList() {
                    val accounts: List<AccountProfile> = prefs.getAccounts()
                    val labels = accounts.map { acc ->
                        val tag = if (acc.type == "M3U") "M3U" else "Xtream"
                        acc.name + "  •  " + tag
                    }
                    val adapter = ArrayAdapter(
                        this,
                        android.R.layout.simple_list_item_1,
                        labels
                    )
                    lvAccounts.adapter = adapter
                }

                refreshList()

                btnAdd.setOnClickListener {
                    val name = etName.text.toString().trim()
                    val finalName = if (name.isNotEmpty()) name else "Hesap"

                    if (currentType == "XTREAM") {
                        val d = etDns.text.toString().trim()
                        val u = etUser.text.toString().trim()
                        val p = etPass.text.toString().trim()
                        if (d.isEmpty() || u.isEmpty()) {
                            Toast.makeText(this, "Xtream için DNS ve kullanıcı zorunlu.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createXtreamAccount(finalName, d, u, p)
                        Toast.makeText(this, "Xtream hesabı eklendi.", Toast.LENGTH_SHORT).show()
                    } else {
                        val m = etM3u.text.toString().trim()
                        if (m.isEmpty()) {
                            Toast.makeText(this, "M3U linki boş olamaz.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createM3uAccount(finalName, m)
                        Toast.makeText(this, "M3U hesabı eklendi.", Toast.LENGTH_SHORT).show()
                    }

                    refreshList()
                }

                lvAccounts.setOnItemClickListener { _, _, position, _ ->
                    val accounts = prefs.getAccounts()
                    if (position in accounts.indices) {
                        val acc = accounts[position]
                        prefs.setActive(acc.id)
                        startActivity(Intent(this, ContentActivity::class.java))
                    }
                }

                lvAccounts.setOnItemLongClickListener { _, _, position, _ ->
                    val accounts = prefs.getAccounts()
                    if (position in accounts.indices) {
                        val acc = accounts[position]
                        AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Light_Dialog_Alert)
                            .setTitle("Hesabı Sil")
                            .setMessage("\"" + acc.name + "\" hesabını silmek istiyor musun?")
                            .setPositiveButton("Evet") { _, _ ->
                                prefs.deleteAccount(acc.id)
                                Toast.makeText(this, "Hesap silindi.", Toast.LENGTH_SHORT).show()
                                refreshList()
                            }
                            .setNegativeButton("Hayır", null)
                            .show()
                    }
                    true
                }
            }
        }
        EOF

        # --- DASHBOARD (opsiyonel, istersen kullan) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.utils.Prefs

