name: EminXtream Player Pro - Full Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Cekme
      uses: actions/checkout@v4

    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. EminXtream Player Pro - Proje Uretimi
      shell: bash
      run: |
        set -e
        APP_NAME="EminXtreamPlayer"
        PACKAGE_NAME="com.emin.xtream.player"
        PATH_NAME="com/emin/xtream/player"
        PASS="emin2024"
        STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$PASS}"
        KEY_PASS="${ANDROID_KEY_PASSWORD:-$PASS}"
        KEY_ALIAS="${ANDROID_KEY_ALIAS:-key0}"

        echo "=== EminXtream Player Pro v3.0 uretiliyor ==="
        rm -rf "$APP_NAME"

        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/models"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/adapters"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/utils"
        mkdir -p "$APP_NAME/app/src/main/res/layout"
        mkdir -p "$APP_NAME/app/src/main/res/values"
        mkdir -p "$APP_NAME/app/src/main/res/drawable"
        mkdir -p "$APP_NAME/app/src/main/res/mipmap-hdpi"
        mkdir -p "$APP_NAME/app/src/main/res/xml"
        mkdir -p "$APP_NAME/app/src/main/res/anim"

        cd "$APP_NAME"

        wget -q -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png \
          "https://i.ibb.co/LDdzzhsk/f564b0ed-277d-489c-9a1a-c59f0fe471fc.png" || true

        if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks || \
            keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Emin, O=EminMedia, C=TR"
        else
          keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Emin, O=EminMedia, C=TR"
        fi

        echo "include ':app'" > settings.gradle

        echo 'YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9dHJ1ZQpvcmcuZ3JhZGxlLmp2bWFyZ3M9LVhteDIwNDhtCg==' | base64 -d > gradle.properties
        echo '' | base64 -d > build.gradle
        mkdir -p app
        echo '' | base64 -d | envsubst > app/build.gradle

        echo '' | base64 -d > app/src/main/res/values/colors.xml
        echo '' | base64 -d > app/src/main/res/values/styles.xml
        echo '' | base64 -d > app/src/main/res/values/strings.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_input_dark.xml
        echo '' | base64 -d > app/src/main/res/drawable/selector_input_focus.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_btn_primary.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_tab_sel.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_tab_uns.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_account_card.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_account_active.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_grid_card.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_badge_live.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_badge_vod.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_badge_ser.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_search_bar.xml
        echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iIzk5MDAwMDAwIi8+CiAgICA8Y29ybmVycyBhbmRyb2lkOnJhZGl1cz0iNTBkcCIvPgo8L3NoYXBlPgo=' | base64 -d > app/src/main/res/drawable/bg_player_btn.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_splash.xml
        echo '' | base64 -d > app/src/main/res/drawable/bg_focusable.xml

        echo '' | base64 -d > app/src/main/res/anim/anim_fade.xml
        echo '' | base64 -d > app/src/main/res/anim/anim_slide.xml
        echo '' | base64 -d > app/src/main/res/anim/anim_scale.xml

        echo '' | base64 -d > app/src/main/res/xml/network_security_config.xml
        echo '' | base64 -d > app/src/main/AndroidManifest.xml

        echo '' | base64 -d > app/src/main/res/layout/activity_splash.xml
        echo '' | base64 -d > app/src/main/res/layout/activity_login.xml
        echo '' | base64 -d > app/src/main/res/layout/item_account.xml
        echo '' | base64 -d > app/src/main/res/layout/activity_content.xml
        echo '' | base64 -d > app/src/main/res/layout/item_grid_pro.xml
        echo '' | base64 -d > app/src/main/res/layout/activity_player_pro.xml
        echo '' | base64 -d > app/src/main/res/layout/activity_series_detail.xml

        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/models/Models.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/utils/Prefs.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/utils/RemoteConfig.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/utils/RemoteLogger.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/utils/AdsHelper.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/adapters/Adapters.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/SplashActivity.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/LoginActivity.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/ContentActivity.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/PlayerActivity.kt"
        echo '' | base64 -d > "app/src/main/java/$PATH_NAME/SeriesDetailActivity.kt"

        echo "=== Tum dosyalar olusturuldu ==="

    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK + AAB
      run: |
        cd EminXtreamPlayer
        gradle assembleRelease --no-daemon
        gradle bundleRelease --no-daemon

    - name: 6. APK Yukle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: EminXtream-Player-APK
        path: EminXtreamPlayer/app/build/outputs/apk/release/*.apk

    - name: 7. AAB Yukle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: EminXtream-Player-AAB
        path: EminXtreamPlayer/app/build/outputs/bundle/release/*.aab

    - name: 8. URL Goster
      run: |
        echo "APK: ${ steps.upload_apk.outputs.artifact-url }"
        echo "AAB: ${ steps.upload_aab.outputs.artifact-url }"
        echo "### EminXtream Player Pro v3.0" >> $GITHUB_STEP_SUMMARY
        echo "[APK Indir](${ steps.upload_apk.outputs.artifact-url })" >> $GITHUB_STEP_SUMMARY
        echo "[AAB Indir](${ steps.upload_aab.outputs.artifact-url })" >> $GITHUB_STEP_SUMMARY
