        </selector>
        EOF

        # --- ASPECT ICON (eski kare stil) ---
        cat <<EOF > app/src/main/res/drawable/ic_aspect_toggle.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp"
            android:height="24dp"
            android:viewportWidth="24"
            android:viewportHeight="24">
            <path
                android:fillColor="#FFFFFFFF"
                android:pathData="M4,7v10h16V7H4zM6,9h12v6H6V9z"/>
