            private var favKeys: Set<String> = emptySet(),
            private val onFav: ((Int) -> Unit)? = null
        ) : RecyclerView.Adapter<GridAdapter.VH>() {
        
            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val cardLayout: LinearLayout = v.findViewById(R.id.cardLayout)
                val txt: TextView = v.findViewById(R.id.txtName)
                val sub: TextView = v.findViewById(R.id.txtSub)
                val adContainer: LinearLayout = v.findViewById(R.id.adContainer)
                val adView: AdView = v.findViewById(R.id.adViewItem)
                val btnFav: android.widget.ImageButton = v.findViewById(R.id.btnFav)
            }
            
            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context).inflate(R.layout.item_grid_pro, parent, false)
                return VH(v)
            }
            
            override fun onBindViewHolder(holder: VH, position: Int) {
                val t = titles[position]
                
                if (t == "###AD###") {
                    holder.cardLayout.visibility = View.GONE
                    holder.adContainer.visibility = View.VISIBLE
                    AdsHelper.loadBanner(holder.adView)
                    holder.itemView.isFocusable = false
                    holder.itemView.isClickable = false
                } else {
                    holder.adContainer.visibility = View.GONE
                    holder.cardLayout.visibility = View.VISIBLE
                    
                    holder.txt.text = t
                    val s = subtitles[position]
                    holder.sub.visibility = if (s.isNotEmpty()) View.VISIBLE else View.GONE
                    holder.sub.text = s
                    
                    holder.cardLayout.isFocusable = true
                    holder.cardLayout.isFocusableInTouchMode = false
                    holder.cardLayout.isClickable = true
                    
                    holder.cardLayout.setOnFocusChangeListener { v, hasFocus ->
                        if (hasFocus) {
                            v.animate().scaleX(1.05f).scaleY(1.05f).setDuration(150).start()
                            v.elevation = 10f
                        } else {
                            v.animate().scaleX(1.0f).scaleY(1.0f).setDuration(150).start()
                            v.elevation = 0f
                        }
                    }
                    
                    val isFav = favKeys.contains(t)
                    if (onFav != null) {
                        holder.btnFav.visibility = View.VISIBLE
                        holder.btnFav.setColorFilter(if (isFav) 0xFFFFC400.toInt() else 0xFF30354A.toInt())
                        holder.btnFav.setOnClickListener { onFav.invoke(position) }
                    } else { holder.btnFav.visibility = View.GONE }
                    holder.cardLayout.setOnClickListener { onClick(position) }
                    
                    holder.cardLayout.setOnKeyListener { _, keyCode, event ->
                        if (event.action == KeyEvent.ACTION_DOWN &&
                            (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER)
                        ) {
                            onClick(position)
                            true
                        } else {
                            false
                        }
                    }
                }
            }
            
            override fun getItemCount(): Int = titles.size
            
            fun update(newTitles: List<String>, newSubtitles: List<String>, newFavKeys: Set<String> = favKeys) {
                titles = newTitles; subtitles = newSubtitles; favKeys = newFavKeys
                notifyDataSetChanged()
            }
        }
