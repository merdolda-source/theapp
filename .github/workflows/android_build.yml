        EOF

        # --- CONTENT ACTIVITY (M3U gelişmiş grup + AdMob Banner + Interstitial) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/ContentActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.Menu
        import android.view.View
        import android.widget.ProgressBar
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.view.GravityCompat
        import androidx.drawerlayout.widget.DrawerLayout
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import com.google.android.material.bottomnavigation.BottomNavigationView
        import com.google.android.material.navigation.NavigationView
        import org.json.JSONArray
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.text.SimpleDateFormat
        import java.util.ArrayList
        import java.util.Date
        import java.util.Locale
        import $PACKAGE_NAME.adapters.GridAdapter
        import $PACKAGE_NAME.models.AccountProfile
        import $PACKAGE_NAME.models.Category
        import $PACKAGE_NAME.models.StreamItem
        import $PACKAGE_NAME.utils.Prefs

        // AdMob
        import com.google.android.gms.ads.AdRequest
        import com.google.android.gms.ads.AdView
        import com.google.android.gms.ads.MobileAds
        import com.google.android.gms.ads.FullScreenContentCallback
        import com.google.android.gms.ads.AdError
        import com.google.android.gms.ads.interstitial.InterstitialAd
        import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback
        import com.google.android.gms.ads.LoadAdError

        class ContentActivity : AppCompatActivity() {

            private lateinit var prefs: Prefs
            private lateinit var drawer: DrawerLayout
            private lateinit var navView: NavigationView
            private lateinit var bottomNav: BottomNavigationView
            private lateinit var rv: RecyclerView
            private lateinit var tvHeader: TextView
            private lateinit var tvStatus: TextView
            private lateinit var pb: ProgressBar

            private lateinit var headerUser: TextView
            private lateinit var headerExpire: TextView

            private var currentMode: String = "LIVE"
            private var categories: List<Category> = emptyList()
            private var streams: List<StreamItem> = emptyList()

            private var activeAcc: AccountProfile? = null
            private var accountType: String = "XTREAM"

            // AdMob değişkenleri
            companion object {
                // 🔁 Buradan değiştirebilirsin
                const val LAUNCH_AD_INTERVAL = 2    // Liste açılışında: her 2 seferde bir reklam
                const val CHANNEL_AD_INTERVAL = 4   // Kanal geçişi: her 4 tıklamada bir reklam

                private var launchCount = 0
                private var channelClickCount = 0

                const val BANNER_AD_UNIT_ID = "ca-app-pub-3940256099942544/6300978111"
                const val INTERSTITIAL_AD_UNIT_ID = "ca-app-pub-3940256099942544/1033173712"
            }

            private var interstitial: InterstitialAd? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_content)

                prefs = Prefs(this)

                drawer = findViewById(R.id.drawerLayout)
