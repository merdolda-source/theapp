                refreshAccountsList()
            }

            private fun switchMode(mode: String) {
                currentMode = if (accountType == "M3U") "LIVE" else mode
                stage = Stage.CATEGORIES
                selectedCategory = null
                etSearch.hint = "Ara (tüm içerik)"

                tvTitle.text = when (currentMode) {
                    "VOD" -> "Filmler"
                    "SERIES" -> "Diziler"
                    else -> "Canlı TV"
                }

                fetchCategoriesAndStreams()
            }

            private fun applySearch(qRaw: String) {
                val q = qRaw.trim().lowercase(Locale.getDefault())
                if (q.isEmpty()) {
                    renderStage()
                    return
                }

                // "tüm içerik" arama: o an yüklenen kategoriler + o modun stream'leri
                val results = ArrayList<String>()

                for (c in categories) {
                    val name = c.category_name ?: ""
                    if (name.lowercase(Locale.getDefault()).contains(q)) {
                        results.add("Kategori: " + name)
                    }
                }

                for (s in streams) {
                    val name = s.name ?: ""
                    if (name.lowercase(Locale.getDefault()).contains(q)) {
                        results.add("İçerik: " + name)
                    }
                }

                if (results.isEmpty()) {
                    adapter?.submit(listOf("Sonuç yok"))
                } else {
                    adapter?.submit(results)
                }

                // arama modunda tıklamayı "kategori/stream bulunursa aç"
                stage = if (stage == Stage.CATEGORIES) Stage.CATEGORIES else Stage.ITEMS
            }

            private fun onListClick(index: Int) {
                val q = etSearch.text?.toString()?.trim() ?: ""
                if (q.isNotEmpty()) {
                    // arama sonucuna tıklama: metinden çözmeye çalış
                    val text = (rv.adapter as SimpleListAdapter).let {
                        // basit: adapter'dan listeyi bilmiyoruz, o yüzden RecyclerView'daki view'den oku
                        // ama daha stabil olması için renderStage'da stage click kullanılır.
                        // burada en basit: arama varken tıklama davranışını devre dışı bırak.
                        ""
                    }
                    Toast.makeText(this, "Arama açıkken kategoriye dönmek için aramayı temizleyin.", Toast.LENGTH_SHORT).show()
                    return
                }

                when (stage) {
                    Stage.CATEGORIES -> {
                        if (index !in categories.indices) return
                        selectedCategory = categories[index]
                        stage = Stage.ITEMS
                        renderStage()
                    }
                    Stage.ITEMS -> {
                        val cat = selectedCategory
                        if (cat == null) return
                        val filtered = streams.filter { (it.category_id ?: "") == (cat.category_id ?: "") }
                        if (index !in filtered.indices) return
                        val item = filtered[index]
                        openItem(item)
                    }
                }
            }

            private fun renderStage() {
                val q = etSearch.text?.toString()?.trim() ?: ""
                if (q.isNotEmpty()) {
                    applySearch(q)
                    return
                }

                when (stage) {
                    Stage.CATEGORIES -> {
                        val labels = categories.map { it.category_name ?: "Kategori" }
                        adapter?.submit(if (labels.isNotEmpty()) labels else listOf("Kategori yok"))
                    }
                    Stage.ITEMS -> {
                        val cat = selectedCategory
                        if (cat == null) {
                            stage = Stage.CATEGORIES
                            renderStage()
                            return
                        }
                        val filtered = streams.filter { (it.category_id ?: "") == (cat.category_id ?: "") }
                        val labels = filtered.map { it.name ?: "İçerik" }
                        adapter?.submit(if (labels.isNotEmpty()) labels else listOf("İçerik yok"))
                    }
                }
            }

            private fun openItem(item: StreamItem) {
                val acc = activeAcc ?: return

                if (acc.type == "M3U") {
                    val url = item.full_url ?: ""
                    if (url.isEmpty()) {
                        Toast.makeText(this, "Geçersiz M3U.", Toast.LENGTH_SHORT).show()
                        return
                    }
                    val itn = Intent(this, PlayerActivity::class.java)
                    itn.putExtra("URL", url)
                    itn.putExtra("REF", item.referer ?: "")
                    itn.putExtra("ORG", item.origin ?: "")
                    AdsHelper.maybeShowOnClick(this) {
                        RemoteLogger.sendEvent(this, "play_m3u", mapOf("name" to (item.name ?: ""), "url" to url.take(200)))
                        startActivity(itn)
                    }
                    return
                }

                if (currentMode == "SERIES") {
                    val seriesId = item.series_id ?: ""
                    if (seriesId.isEmpty()) {
                        Toast.makeText(this, "Geçersiz seri.", Toast.LENGTH_SHORT).show()
                        return
                    }
                    val itn = Intent(this, SeriesDetailActivity::class.java)
                    itn.putExtra("SERIES_ID", seriesId)
                    itn.putExtra("SERIES_NAME", item.name ?: "Dizi")
                    AdsHelper.maybeShowOnClick(this) {
                        RemoteLogger.sendEvent(this, "open_series", mapOf("series_id" to seriesId, "name" to (item.name ?: "")))
                        startActivity(itn)
                    }
                    return
                }

                // LIVE veya VOD => direkt oynat
                val dnsRaw = (acc.dns ?: "").trim()
                val user = (acc.user ?: "").trim()
                val pass = (acc.pass ?: "").trim()
                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    Toast.makeText(this, "DNS / kullanıcı / şifre eksik.", Toast.LENGTH_SHORT).show()
                    return
                }
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw

                val path = if (currentMode == "LIVE") "live" else "movie"
                val ext = if (currentMode == "LIVE") ".ts"
                else {
                    val ce = item.container_extension ?: "mp4"
                    "." + ce
                }
                val id = item.stream_id ?: ""
                val playUrl = dns + "/" + path + "/" + user + "/" + pass + "/" + id + ext

                val itn = Intent(this, PlayerActivity::class.java)
                itn.putExtra("URL", playUrl)
                itn.putExtra("REF", "")
                itn.putExtra("ORG", "")
                AdsHelper.maybeShowOnClick(this) {
                    RemoteLogger.sendEvent(this, "play_xtream", mapOf("mode" to currentMode, "name" to (item.name ?: ""), "stream_id" to (item.stream_id ?: "")))
                    startActivity(itn)
                }
            }

            private fun fetchCategoriesAndStreams() {
                val acc = activeAcc
                if (acc == null) {
                    tvStatus.text = "Aktif hesap yok."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE

                // Drawer header: hesap adı + süre (expire)
                tvDrawerAccount.text = "Hesap: " + (acc.name.ifEmpty { "-" })
                tvDrawerExpire.text = "Süre: -"

                if (acc.type == "M3U") {
                    val m3uUrl = (acc.m3u ?: "").trim()
                    if (m3uUrl.isEmpty()) {
                        pb.visibility = View.GONE
                        tvStatus.text = "M3U link yok."
                        tvStatus.visibility = View.VISIBLE
                        return
                    }

                    Thread {
                        try {
                            val result = fetchM3u(m3uUrl)
                            runOnUiThread {
                                pb.visibility = View.GONE
                                categories = result.first
                                streams = result.second
                                tvDrawerExpire.text = "Süre: M3U Playlist"
                                stage = Stage.CATEGORIES
                                selectedCategory = null
                                renderStage()
                            }
                        } catch (e: Exception) {
                            runOnUiThread {
                                pb.visibility = View.GONE
                                tvStatus.text = "M3U okunamadı: " + (e.message ?: "hata")
                                tvStatus.visibility = View.VISIBLE
                            }
                        }
                    }.start()
                    return
                }

                // XTREAM
                val dnsRaw = (acc.dns ?: "").trim()
                val user = (acc.user ?: "").trim()
                val pass = (acc.pass ?: "").trim()

                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    pb.visibility = View.GONE
                    tvStatus.text = "DNS / kullanıcı / şifre boş."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val base = dns + "/player_api.php?username=" + user + "&password=" + pass

                val catAction = when (currentMode) {
                    "VOD" -> "get_vod_categories"
                    "SERIES" -> "get_series_categories"
                    else -> "get_live_categories"
                }
                val streamsAction = when (currentMode) {
                    "VOD" -> "get_vod_streams"
                    "SERIES" -> "get_series"
                    else -> "get_live_streams"
                }

                val catUrl = base + "&action=" + catAction
                val streamsUrl = base + "&action=" + streamsAction

                Thread {
                    try {
                        val info = fetchAccountInfo(base)
                        val fetchedCategories = fetchCategories(catUrl)
                        val fetchedStreams = fetchStreams(streamsUrl)

                        runOnUiThread {
                            pb.visibility = View.GONE
                            categories = fetchedCategories
                            streams = fetchedStreams

                            tvDrawerAccount.text = "Hesap: " + (acc.name.ifEmpty { info.first ?: user })
                            tvDrawerExpire.text = "Süre: " + formatExp(info.second)

                            stage = Stage.CATEGORIES
                            selectedCategory = null
                            renderStage()
                        }
                    } catch (e: Exception) {
                        runOnUiThread {
                            pb.visibility = View.GONE
                            tvStatus.text = "Veriler alınamadı: " + (e.message ?: "hata")
                            tvStatus.visibility = View.VISIBLE
                        }
                    }
                }.start()
            }

            private fun fetchM3u(urlStr: String): Pair<List<Category>, List<StreamItem>> {
                val categoriesMap = LinkedHashMap<String, Category>()
                val streamsList = ArrayList<StreamItem>()

                val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 10000
                    readTimeout = 20000
                    requestMethod = "GET"
                }

                if (conn.responseCode != HttpURLConnection.HTTP_OK) return Pair(emptyList(), emptyList())

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val lines = body.split("\n")

                var currentName = ""
                var currentGroup = "Genel"
                var currentRef: String? = null
                var currentOrg: String? = null

                for (raw in lines) {
                    val line = raw.trim()
                    if (line.isEmpty()) continue
                    if (line.startsWith("#EXTM3U", true)) continue

                    if (line.startsWith("#EXTINF", true)) {
                        var name = ""
                        var group = "Genel"

                        val gIdx = line.indexOf("group-title=\"")
                        if (gIdx >= 0) {
                            val start = gIdx + "group-title=\"".length
                            val end = line.indexOf("\"", startIndex = start)
                            if (end > start) group = line.substring(start, end)
                        }
                        val commaIndex = line.lastIndexOf(',')
                        if (commaIndex >= 0 && commaIndex < line.length - 1) {
                            name = line.substring(commaIndex + 1).trim()
                        }

                        currentName = if (name.isNotEmpty()) name else "Kanal"
                        currentGroup = if (group.isNotEmpty()) group else "Genel"
                        currentRef = null
                        currentOrg = null
                    } else if (line.startsWith("#EXTVLCOPT:http-referrer=", true)) {
                        val idx = line.indexOf("=")
                        if (idx >= 0 && idx < line.length - 1) currentRef = line.substring(idx + 1).trim()
                    } else if (line.startsWith("#EXTVLCOPT:http-origin=", true)) {
                        val idx = line.indexOf("=")
                        if (idx >= 0 && idx < line.length - 1) currentOrg = line.substring(idx + 1).trim()
                    } else if (!line.startsWith("#")) {
                        val urlPlay = line
                        val groupId = if (currentGroup.isNotEmpty()) currentGroup else "Genel"
                        val cat = categoriesMap.getOrPut(groupId) { Category(groupId, groupId) }

                        streamsList.add(
                            StreamItem(
                                name = currentName,
                                stream_id = null,
                                series_id = null,
                                container_extension = null,
                                category_id = cat.category_id,
                                full_url = urlPlay,
                                referer = currentRef,
                                origin = currentOrg
                            )
                        )
                        currentRef = null
                        currentOrg = null
                    }
                }
                return Pair(categoriesMap.values.toList(), streamsList)
            }

            private fun fetchAccountInfo(baseUrl: String): Pair<String?, String?> {
                return try {
                    val conn = (URL(baseUrl).openConnection() as HttpURLConnection).apply {
                        connectTimeout = 8000
                        readTimeout = 8000
                        requestMethod = "GET"
                    }
                    if (conn.responseCode != HttpURLConnection.HTTP_OK) Pair(null, null)
                    else {
                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val userInfo = obj.optJSONObject("user_info")
                        if (userInfo != null) Pair(userInfo.optString("username", null), userInfo.optString("exp_date", null))
                        else Pair(null, null)
                    }
                } catch (_: Exception) {
                    Pair(null, null)
                }
            }

            private fun formatExp(exp: String?): String {
                if (exp.isNullOrBlank() || exp == "0" || exp == "null") return "Sınırsız"
                return try {
                    val seconds = exp.toLong()
                    val date = Date(seconds * 1000L)
                    SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(date)
                } catch (_: Exception) {
                    exp ?: "-"
                }
            }

            private fun fetchCategories(urlStr: String): List<Category> {
                val list = ArrayList<Category>()
                val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 10000
                    readTimeout = 15000
                    requestMethod = "GET"
                }
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return list
                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    list.add(Category(obj.optString("category_id", ""), obj.optString("category_name", "Kategori " + i)))
                    i++
                }
                return list
            }

            private fun fetchStreams(urlStr: String): List<StreamItem> {
                val list = ArrayList<StreamItem>()
                val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 10000
                    readTimeout = 20000
                    requestMethod = "GET"
                }
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return list
                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    list.add(
                        StreamItem(
                            name = obj.optString("name", "Bilinmeyen"),
                            stream_id = obj.optString("stream_id", null),
                            series_id = obj.optString("series_id", null),
                            container_extension = obj.optString("container_extension", null),
                            category_id = obj.optString("category_id", ""),
                            full_url = null,
                            referer = null,
                            origin = null
                        )
                    )
                    i++
                }
                return list
            }

            override fun onBackPressed() {
                val q = etSearch.text?.toString()?.trim() ?: ""
                if (q.isNotEmpty()) {
                    etSearch.setText("")
                    return
                }
                if (stage == Stage.ITEMS) {
                    stage = Stage.CATEGORIES
                    selectedCategory = null
                    renderStage()
                    return
                }
                super.onBackPressed()
            }
        }
        EOF

        # SERIES DETAIL (İSTENEN: kategori->bölüm(sezon)->içerik(episode))
        cat <<EOF > app/src/main/java/$PATH_NAME/SeriesDetailActivity.kt
        package $PACKAGE_NAME

        import android.os.Bundle
        import android.text.Editable
        import android.text.TextWatcher
        import android.view.View
        import android.widget.ProgressBar
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.util.Locale
        import $PACKAGE_NAME.adapters.SimpleListAdapter
        import $PACKAGE_NAME.models.EpisodeItem
        import $PACKAGE_NAME.utils.Prefs

        class SeriesDetailActivity : AppCompatActivity() {

            private enum class Stage { SEASONS, EPISODES }

            private lateinit var prefs: Prefs
            private lateinit var tvTitle: TextView
            private lateinit var tvStatus: TextView
            private lateinit var pb: ProgressBar
            private lateinit var rv: RecyclerView
            private lateinit var etSearch: android.widget.EditText

            private var stage: Stage = Stage.SEASONS
            private var selectedSeason: Int? = null

            private val seasonToEpisodes = HashMap<Int, MutableList<EpisodeItem>>()
            private var seasons: List<Int> = emptyList()

            private var adapter: SimpleListAdapter? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_series_detail)

                prefs = Prefs(this)

                tvTitle = findViewById(R.id.tvSeriesTitle)
                tvStatus = findViewById(R.id.tvSeriesStatus)
                pb = findViewById(R.id.pbSeries)
                rv = findViewById(R.id.rvSeries)
                etSearch = findViewById(R.id.etSeriesSearch)

                rv.layoutManager = LinearLayoutManager(this)
                adapter = SimpleListAdapter(emptyList()) { idx -> onClick(idx) }
                rv.adapter = adapter

                val seriesName = intent.getStringExtra("SERIES_NAME") ?: "Dizi"
                val seriesId = intent.getStringExtra("SERIES_ID") ?: ""
                tvTitle.text = seriesName

                if (seriesId.isEmpty()) {
                    tvStatus.text = "Geçersiz seri."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                etSearch.addTextChangedListener(object : TextWatcher {
                    override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                    override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                    override fun afterTextChanged(s: Editable?) { render() }
                })

                loadSeriesInfo(seriesId)
            }

            private fun loadSeriesInfo(seriesId: String) {
                val dnsRaw = prefs.getActive()?.dns?.trim() ?: ""
                val user = prefs.getActive()?.user?.trim() ?: ""
                val pass = prefs.getActive()?.pass?.trim() ?: ""

                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    tvStatus.text = "DNS / kullanıcı / şifre eksik."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val urlStr = dns + "/player_api.php?username=" + user + "&password=" + pass + "&action=get_series_info&series_id=" + seriesId

                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE

                Thread {
                    try {
                        val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                            connectTimeout = 10000
                            readTimeout = 20000
                            requestMethod = "GET"
                        }
                        if (conn.responseCode != HttpURLConnection.HTTP_OK) {
                            showError("Sunucu: " + conn.responseCode)
                            return@Thread
                        }

                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val episodesObj = obj.optJSONObject("episodes") ?: JSONObject()

                        seasonToEpisodes.clear()

                        val keys = episodesObj.keys()
                        while (keys.hasNext()) {
                            val seasonKey = keys.next()
                            val seasonNum = seasonKey.toIntOrNull() ?: 0
                            val arr = episodesObj.optJSONArray(seasonKey) ?: continue
                            val eps = ArrayList<EpisodeItem>()

                            var i = 0
                            while (i < arr.length()) {
                                val epObj = arr.getJSONObject(i)
                                val id = epObj.optString("id", "")
                                val title = epObj.optString("title", "Bölüm " + i)
                                val epNum = epObj.optInt("episode_num", i + 1)
                                val ext = epObj.optString("container_extension", "mp4")
                                eps.add(EpisodeItem(id, title, seasonNum, epNum, ext))
                                i++
                            }
                            seasonToEpisodes[seasonNum] = eps
                        }

                        seasons = seasonToEpisodes.keys.toList().sorted()

                        runOnUiThread {
                            pb.visibility = View.GONE
                            stage = Stage.SEASONS
                            selectedSeason = null
                            render()
                        }
                    } catch (e: Exception) {
                        showError("Seri alınamadı: " + (e.message ?: "hata"))
                    }
                }.start()
            }

            private fun render() {
                val q = (etSearch.text?.toString() ?: "").trim().lowercase(Locale.getDefault())

                when (stage) {
                    Stage.SEASONS -> {
                        val labels = seasons.map { "Sezon " + it }
                            .filter { q.isEmpty() || it.lowercase(Locale.getDefault()).contains(q) }
                        adapter?.submit(if (labels.isNotEmpty()) labels else listOf("Sezon yok"))
                    }
                    Stage.EPISODES -> {
                        val sn = selectedSeason ?: return
                        val eps = seasonToEpisodes[sn] ?: mutableListOf()
                        val labels = eps.map { "S" + it.seasonNumber + "E" + it.episodeNumber + " - " + it.title }
                            .filter { q.isEmpty() || it.lowercase(Locale.getDefault()).contains(q) }
                        adapter?.submit(if (labels.isNotEmpty()) labels else listOf("Bölüm yok"))
                    }
                }
            }

            private fun onClick(index: Int) {
                val q = (etSearch.text?.toString() ?: "").trim()
                if (q.isNotEmpty()) {
                    Toast.makeText(this, "Arama açıkken seçim için aramayı temizleyin.", Toast.LENGTH_SHORT).show()
                    return
                }

                when (stage) {
                    Stage.SEASONS -> {
                        if (index !in seasons.indices) return
                        selectedSeason = seasons[index]
                        stage = Stage.EPISODES
                        render()
                    }
                    Stage.EPISODES -> {
                        val sn = selectedSeason ?: return
                        val eps = seasonToEpisodes[sn] ?: return
                        if (index !in eps.indices) return
                        playEpisode(eps[index])
                    }
                }
            }

            private fun playEpisode(ep: EpisodeItem) {
                val acc = prefs.getActive() ?: return
                val dnsRaw = (acc.dns ?: "").trim()
                val user = (acc.user ?: "").trim()
                val pass = (acc.pass ?: "").trim()
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val ext = (ep.container_extension ?: "mp4")
                val url = dns + "/series/" + user + "/" + pass + "/" + ep.id + "." + ext

                val itn = android.content.Intent(this, PlayerActivity::class.java)
                itn.putExtra("URL", url)
                itn.putExtra("REF", "")
                itn.putExtra("ORG", "")
                startActivity(itn)
            }

            private fun showError(msg: String) {
                runOnUiThread {
                    pb.visibility = View.GONE
                    tvStatus.text = msg
                    tvStatus.visibility = View.VISIBLE
                }
            }

            override fun onBackPressed() {
                val q = (etSearch.text?.toString() ?: "").trim()
                if (q.isNotEmpty()) { etSearch.setText(""); return }

                if (stage == Stage.EPISODES) {
                    stage = Stage.SEASONS
                    selectedSeason = null
                    render()
                    return
                }
                super.onBackPressed()
            }
        }
        EOF

        # PLAYER (aynı: gesture + double tap seek)
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME

        import android.content.Context
        import android.media.AudioManager
        import android.os.Bundle
        import android.view.MotionEvent
        import android.view.View
        import android.view.WindowManager
        import android.widget.ImageButton
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.datasource.DefaultHttpDataSource
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
        import androidx.media3.ui.AspectRatioFrameLayout
        import androidx.media3.ui.PlayerView
        import kotlin.math.abs

        class PlayerActivity : AppCompatActivity() {

            private var player: ExoPlayer? = null
            private var currentMode: Int = 0

            private lateinit var playerView: PlayerView
            private lateinit var leftOverlay: View
            private lateinit var rightOverlay: View

            private lateinit var tvCenterInfo: TextView
            private lateinit var tvBrightness: TextView
            private lateinit var tvVolume: TextView

            private var audioManager: AudioManager? = null
            private var maxVolume: Int = 0
            private var gestureStartVolume: Int = 0

            private var currentBrightness: Float = 0.5f
            private var gestureStartBrightness: Float = 0.5f

            private var gestureStartY: Float = 0f
            private var isGesture: Boolean = false

            private var lastTapLeft: Long = 0
            private var lastTapRight: Long = 0
            private var tapCountLeft: Int = 0
            private var tapCountRight: Int = 0

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)

                window.setFlags(
                    WindowManager.LayoutParams.FLAG_FULLSCREEN,
                    WindowManager.LayoutParams.FLAG_FULLSCREEN
                )
                window.addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)

                window.decorView.systemUiVisibility =
                    View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                    View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                    View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                    View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                    View.SYSTEM_UI_FLAG_FULLSCREEN or
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                setContentView(R.layout.activity_player_pro)

                val url = intent.getStringExtra("URL") ?: ""
                val ref = intent.getStringExtra("REF") ?: ""
                val org = intent.getStringExtra("ORG") ?: ""

                if (url.isEmpty()) {
                    Toast.makeText(this, "Geçersiz yayın URL'si.", Toast.LENGTH_SHORT).show()
                    finish()
                    return
                }

                playerView = findViewById(R.id.pvMain)
                val btnMode = findViewById<ImageButton>(R.id.btnMode)
                leftOverlay = findViewById(R.id.overlayLeft)
                rightOverlay = findViewById(R.id.overlayRight)
                tvCenterInfo = findViewById(R.id.tvInfoCenter)
                tvBrightness = findViewById(R.id.tvBrightness)
                tvVolume = findViewById(R.id.tvVolume)

                audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                maxVolume = audioManager?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15

                val lp = window.attributes
                currentBrightness = if (lp.screenBrightness in 0f..1f) lp.screenBrightness else 0.5f

                applyResizeMode(playerView)

                btnMode.setOnClickListener {
                    currentMode = (currentMode + 1) % 3
                    applyResizeMode(playerView)
                }

                setupGestureOverlay(leftOverlay, true)
                setupGestureOverlay(rightOverlay, false)

                try {
                    val headers = mutableMapOf<String, String>()
                    headers["User-Agent"] = "Mozilla/5.0 (Android) ExoPlayer"
                    if (ref.isNotEmpty()) headers["Referer"] = ref
                    if (org.isNotEmpty()) headers["Origin"] = org

                    val httpFactory = DefaultHttpDataSource.Factory()
                        .setConnectTimeoutMs(15000)
                        .setReadTimeoutMs(30000)
                        .setDefaultRequestProperties(headers)

                    val mediaSourceFactory = DefaultMediaSourceFactory(httpFactory)

                    player = ExoPlayer.Builder(this)
                        .setMediaSourceFactory(mediaSourceFactory)
                        .build()

                    val exo = player!!
                    playerView.player = exo
                    exo.setMediaItem(MediaItem.fromUri(url))
                    exo.prepare()
                    exo.play()
                } catch (e: Exception) {
                    Toast.makeText(this, "Oynatıcı başlatılamadı: " + (e.message ?: ""), Toast.LENGTH_LONG).show()
                    finish()
                }
            }

            private fun setupGestureOverlay(view: View, isLeft: Boolean) {
                view.setOnTouchListener { v, event ->
                    val am = audioManager
                    when (event.action) {
                        MotionEvent.ACTION_DOWN -> {
                            gestureStartY = event.y
                            isGesture = false
                            gestureStartVolume = am?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: (maxVolume / 2)
                            gestureStartBrightness = currentBrightness
                            tvBrightness.visibility = View.GONE
                            tvVolume.visibility = View.GONE
                            true
                        }
                        MotionEvent.ACTION_MOVE -> {
                            val dy = event.y - gestureStartY
                            if (abs(dy) > 50) {
                                isGesture = true
                                val percent = -dy / v.height.toFloat()
                                if (isLeft) adjustBrightness(percent) else adjustVolume(percent)
                            }
                            true
                        }
                        MotionEvent.ACTION_UP -> {
                            if (!isGesture) {
                                val now = System.currentTimeMillis()
                                if (isLeft) {
                                    tapCountLeft = if (now - lastTapLeft < 350) tapCountLeft + 1 else 1
                                    lastTapLeft = now
                                    if (tapCountLeft >= 2) {
                                        tapCountLeft = 0
                                        seekBy(-15000L)
                                        showCenterInfo("15 saniye geri")
                                    }
                                } else {
                                    tapCountRight = if (now - lastTapRight < 350) tapCountRight + 1 else 1
                                    lastTapRight = now
                                    if (tapCountRight >= 2) {
                                        tapCountRight = 0
                                        seekBy(15000L)
                                        showCenterInfo("15 saniye ileri")
                                    }
                                }
                                try { playerView.showController() } catch (_: Exception) {}
                            }
                            tvBrightness.visibility = View.GONE
                            tvVolume.visibility = View.GONE
                            true
                        }
                        else -> false
                    }
                }
            }

            private fun adjustVolume(percentDelta: Float) {
                val am = audioManager ?: return
                val change = (percentDelta * maxVolume).toInt()
                var newVol = gestureStartVolume + change
                if (newVol < 0) newVol = 0
                if (newVol > maxVolume) newVol = maxVolume
                am.setStreamVolume(AudioManager.STREAM_MUSIC, newVol, 0)

                val percent = if (maxVolume > 0) (newVol * 100 / maxVolume) else 0
                tvVolume.text = "Ses: " + percent + "%"
                tvVolume.visibility = View.VISIBLE
            }

            private fun adjustBrightness(percentDelta: Float) {
                var newB = gestureStartBrightness + percentDelta
                if (newB < 0f) newB = 0f
                if (newB > 1f) newB = 1f
                val lp = window.attributes
                lp.screenBrightness = newB
                window.attributes = lp
                currentBrightness = newB

                val percent = (currentBrightness * 100f).toInt()
                tvBrightness.text = "Parlaklık: " + percent + "%"
                tvBrightness.visibility = View.VISIBLE
            }

            private fun seekBy(deltaMs: Long) {
                val p = player ?: return
                var newPos = p.currentPosition + deltaMs
                if (newPos < 0L) newPos = 0L
                val duration = p.duration
                if (duration > 0 && newPos > duration) newPos = duration
                p.seekTo(newPos)
            }

            private fun applyResizeMode(pv: PlayerView) {
                pv.resizeMode = when (currentMode) {
                    0 -> AspectRatioFrameLayout.RESIZE_MODE_FIT
                    1 -> AspectRatioFrameLayout.RESIZE_MODE_FILL
                    else -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                }
            }

            private fun showCenterInfo(text: String) {
                tvCenterInfo.text = text
                tvCenterInfo.visibility = View.VISIBLE
                tvCenterInfo.postDelayed({ tvCenterInfo.visibility = View.GONE }, 1200)
            }

            override fun onDestroy() {
                super.onDestroy()
                player?.release()
                player = null
            }
        }
        EOF

