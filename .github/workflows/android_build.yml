        printf '%s\n' '        tvVolume.text = "🔊 ${newV*100/maxVol}%"; tvVolume.visibility = View.VISIBLE' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    private fun adjustBrightness(pct: Float) {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '        val newB = (gestureBrightStart + pct).coerceIn(0.01f, 1f)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '        window.attributes = window.attributes.also { it.screenBrightness = newB }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
