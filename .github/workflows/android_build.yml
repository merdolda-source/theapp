        </LinearLayout>
        EOF

        # --- MODELLER ---
        cat <<EOF > app/src/main/java/$PATH_NAME/models/Models.kt
        package $PACKAGE_NAME.models

        data class AccountProfile(
            val id: Int,
            val name: String,
            val type: String,
            val dns: String?,
            val user: String?,
            val pass: String?,
            val m3u: String?
        )

        data class Category(
            val category_id: String,
            val category_name: String
        )

        data class StreamItem(
            val name: String,
            val stream_id: String?,
            val series_id: String?,
            val container_extension: String?,
            val category_id: String?,
            val full_url: String?,
            val referer: String?,
            val origin: String?
        )

        data class EpisodeItem(
            val id: String,
            val title: String,
            val seasonNumber: Int,
            val episodeNumber: Int,
            val container_extension: String?
        )
        EOF

        # --- UTILS (Prefs + AdsHelper) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import $PACKAGE_NAME.models.AccountProfile
        import org.json.JSONArray
        import org.json.JSONObject

        class Prefs(ctx: Context) {
            private val p = ctx.getSharedPreferences("EP_Prefs", 0)

            private fun loadArray(): JSONArray {
                val s = p.getString("accounts_json", "[]") ?: "[]"
                return JSONArray(s)
            }

            private fun saveArray(arr: JSONArray) {
                p.edit().putString("accounts_json", arr.toString()).apply()
            }

            fun createXtreamAccount(name: String, dns: String, u: String, ps: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "XTREAM")
                obj.put("dns", dns)
                obj.put("user", u)
                obj.put("pass", ps)
                obj.put("m3u", "")

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun createM3uAccount(name: String, m3u: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "M3U")
                obj.put("dns", "")
                obj.put("user", "")
                obj.put("pass", "")
                obj.put("m3u", m3u)

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun getAccounts(): List<AccountProfile> {
                val arr = loadArray()
                val list = ArrayList<AccountProfile>()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null) {
                        val id = o.optInt("id", 0)
                        val name = o.optString("name", "Hesap " + i)
                        val type = o.optString("type", "XTREAM")
                        val dns = o.optString("dns", null)
                        val user = o.optString("user", null)
                        val pass = o.optString("pass", null)
                        val m3u = o.optString("m3u", null)
                        list.add(AccountProfile(id, name, type, dns, user, pass, m3u))
                    }
                    i++
                }
                return list
            }

            fun deleteAccount(id: Int) {
                val arr = loadArray()
                val newArr = JSONArray()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null && o.optInt("id", 0) != id) {
                        newArr.put(o)
                    }
                    i++
                }
                saveArray(newArr)

                val activeId = p.getInt("active_id", -1)
                if (activeId == id) {
                    val remaining = getAccounts()
                    val newActive = if (remaining.isNotEmpty()) remaining[0].id else -1
                    p.edit().putInt("active_id", newActive).apply()
                }
            }

            fun setActive(id: Int) {
                p.edit().putInt("active_id", id).apply()
            }

            fun getActive(): AccountProfile? {
                val all = getAccounts()
                if (all.isEmpty()) return null
                val activeId = p.getInt("active_id", -1)
                if (activeId <= 0) return all[0]
                return all.find { it.id == activeId } ?: all[0]
            }

            fun save(dns: String, u: String, ps: String) {
                val name = if (u.isNotEmpty()) u else "Xtream"
                createXtreamAccount(name, dns, u, ps)
            }

            fun getDns(): String = getActive()?.dns ?: ""
            fun getUser(): String = getActive()?.user ?: ""
            fun getPass(): String = getActive()?.pass ?: ""
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/utils/AdsHelper.kt
        package $PACKAGE_NAME.utils

        import android.app.Activity
        import android.content.Context
        import com.google.android.gms.ads.AdRequest
        import com.google.android.gms.ads.AdView
        import com.google.android.gms.ads.MobileAds
        import com.google.android.gms.ads.interstitial.InterstitialAd
        import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback
        import com.google.android.gms.ads.LoadAdError
        import $PACKAGE_NAME.R

        object AdsHelper {
            @Volatile
            private var initialized = false

            private var interstitial: InterstitialAd? = null
            private var clickCount = 0

            var CHANNEL_INTERVAL = 4
            var LIST_OPEN_INTERVAL = 2

            fun init(context: Context) {
                if (!initialized) {
                    synchronized(this) {
                        if (!initialized) {
                            MobileAds.initialize(context.applicationContext) {}
                            initialized = true
                        }
                    }
                }
            }

            fun loadBanner(adView: AdView?) {
                if (adView == null) return
                val request = AdRequest.Builder().build()
                adView.loadAd(request)
            }

            fun loadInterstitial(context: Context) {
                val adUnitId = context.getString(R.string.admob_interstitial_test)
                val request = AdRequest.Builder().build()
                InterstitialAd.load(
                    context,
                    adUnitId,
                    request,
                    object : InterstitialAdLoadCallback() {
                        override fun onAdLoaded(ad: InterstitialAd) {
                            interstitial = ad
                        }
                        override fun onAdFailedToLoad(error: LoadAdError) {
                            interstitial = null
                        }
                    }
                )
            }

            fun maybeShowOnChannelClick(activity: Activity, onContinue: () -> Unit) {
                clickCount++
                val ad = interstitial
                if (ad != null && CHANNEL_INTERVAL > 0 && (clickCount % CHANNEL_INTERVAL == 0)) {
                    ad.show(activity)
                    interstitial = null
                    loadInterstitial(activity)
                    onContinue()
                } else {
                    onContinue()
                }
            }
        }
        EOF

        # --- ADAPTERLER ---
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/GridAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.StreamItem

        class GridAdapter(
            private val list: List<StreamItem>,
            private val onClick: (StreamItem) -> Unit
        ) : RecyclerView.Adapter<GridAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtName)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_grid_pro, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val item = list[position]
                holder.txt.text = item.name
                holder.itemView.setOnClickListener { onClick(item) }
            }

            override fun getItemCount(): Int = list.size
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/AccountsAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.content.Context
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.BaseAdapter
        import android.widget.ImageButton
        import android.widget.TextView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.AccountProfile

        class AccountsAdapter(
            private val ctx: Context,
            private val items: MutableList<AccountProfile>,
            private val onOpen: (AccountProfile) -> Unit,
            private val onDelete: (AccountProfile) -> Unit
        ) : BaseAdapter() {

            override fun getCount(): Int = items.size

            override fun getItem(position: Int): Any = items[position]

            override fun getItemId(position: Int): Long = items[position].id.toLong()

            override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                val v = convertView ?: LayoutInflater.from(ctx)
                    .inflate(R.layout.item_account, parent, false)

                val txtName = v.findViewById<TextView>(R.id.tvAccountName)
                val txtType = v.findViewById<TextView>(R.id.tvAccountType)
                val btnDelete = v.findViewById<ImageButton>(R.id.btnDeleteAccount)

                val item = items[position]
                txtName.text = item.name
                txtType.text = if (item.type == "M3U") "M3U" else "Xtream"

                v.setOnClickListener {
                    onOpen(item)
                }

                btnDelete.setOnClickListener {
                    onDelete(item)
                }

                return v
            }

            fun update(newItems: List<AccountProfile>) {
                items.clear()
                items.addAll(newItems)
                notifyDataSetChanged()
            }
        }
        EOF

        # --- LOGIN ACTIVITY ---
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.View
        import android.widget.*
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat
        import com.google.android.gms.ads.AdView
        import $PACKAGE_NAME.adapters.AccountsAdapter
        import $PACKAGE_NAME.models.AccountProfile
        import $PACKAGE_NAME.utils.AdsHelper
        import $PACKAGE_NAME.utils.Prefs

        class LoginActivity : AppCompatActivity() {

            private var isXtream = true
            private var accountsAdapter: AccountsAdapter? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)

                val prefs = Prefs(this)

                AdsHelper.init(this)
                val adTop = findViewById<AdView>(R.id.adViewTopLogin)
                AdsHelper.loadBanner(adTop)
                AdsHelper.loadInterstitial(this)

                val etName = findViewById<EditText>(R.id.etName)
                val etDns = findViewById<EditText>(R.id.etDns)
                val etUser = findViewById<EditText>(R.id.etUser)
                val etPass = findViewById<EditText>(R.id.etPass)
                val etM3u = findViewById<EditText>(R.id.etM3u)

                val layoutXtream = findViewById<View>(R.id.layoutXtream)
                val layoutM3u = findViewById<View>(R.id.layoutM3u)

                val cardXtream = findViewById<View>(R.id.cardXtream)
                val cardM3u = findViewById<View>(R.id.cardM3u)
                val tvXtream = findViewById<TextView>(R.id.tvXtream)
                val tvM3u = findViewById<TextView>(R.id.tvM3u)

                val btnAdd = findViewById<Button>(R.id.btnAddAccount)
                val lvAccounts = findViewById<ListView>(R.id.lvAccounts)

                fun updateTypeUI() {
                    if (isXtream) {
                        layoutXtream.visibility = View.VISIBLE
                        layoutM3u.visibility = View.GONE

                        cardXtream.background = ContextCompat.getDrawable(this, R.drawable.bg_header_card)
                        cardM3u.background = ContextCompat.getDrawable(this, R.drawable.bg_input_dark)

                        tvXtream.setTextColor(ContextCompat.getColor(this, R.color.white))
                        tvM3u.setTextColor(ContextCompat.getColor(this, R.color.white))
                    } else {
                        layoutXtream.visibility = View.GONE
                        layoutM3u.visibility = View.VISIBLE

                        cardM3u.background = ContextCompat.getDrawable(this, R.drawable.bg_header_card)
                        cardXtream.background = ContextCompat.getDrawable(this, R.drawable.bg_input_dark)

                        tvXtream.setTextColor(ContextCompat.getColor(this, R.color.white))
                        tvM3u.setTextColor(ContextCompat.getColor(this, R.color.white))
                    }
                }

                cardXtream.setOnClickListener {
                    isXtream = true
                    updateTypeUI()
                }

                cardM3u.setOnClickListener {
                    isXtream = false
                    updateTypeUI()
                }

                updateTypeUI()

                fun refreshList() {
                    val accounts: MutableList<AccountProfile> = prefs.getAccounts().toMutableList()

                    if (accountsAdapter == null) {
                        accountsAdapter = AccountsAdapter(
                            this,
                            accounts,
                            onOpen = { acc ->
                                prefs.setActive(acc.id)
                                startActivity(Intent(this, ContentActivity::class.java))
                            },
                            onDelete = { acc ->
                                AlertDialog.Builder(this)
                                    .setTitle("Hesabı Sil")
                                    .setMessage("\"" + acc.name + "\" hesabını silmek istiyor musun?")
                                    .setPositiveButton("Evet") { _, _ ->
                                        prefs.deleteAccount(acc.id)
                                        refreshList()
                                    }
                                    .setNegativeButton("Hayır", null)
                                    .show()
                            }
                        )
                        lvAccounts.adapter = accountsAdapter
                    } else {
                        accountsAdapter?.update(accounts)
                    }
                }

                refreshList()

                btnAdd.setOnClickListener {
                    val name = etName.text.toString().trim()
                    val finalName = if (name.isNotEmpty()) name else "Hesap"

                    if (isXtream) {
                        val d = etDns.text.toString().trim()
                        val u = etUser.text.toString().trim()
                        val p = etPass.text.toString().trim()
                        if (d.isEmpty() || u.isEmpty()) {
                            Toast.makeText(this, "Xtream için DNS ve kullanıcı zorunlu.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createXtreamAccount(finalName, d, u, p)
                        Toast.makeText(this, "Xtream hesabı eklendi. Aşağıdaki kayıtlardan seçerek giriş yapın.", Toast.LENGTH_SHORT).show()
                    } else {
                        val m = etM3u.text.toString().trim()
                        if (m.isEmpty()) {
                            Toast.makeText(this, "M3U linki boş olamaz.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createM3uAccount(finalName, m)
                        Toast.makeText(this, "M3U hesabı eklendi. Aşağıdaki kayıtlardan seçerek giriş yapın.", Toast.LENGTH_SHORT).show()
                    }

                    etName.setText("")
                    etDns.setText("")
                    etUser.setText("")
                    etPass.setText("")
                    etM3u.setText("")

                    refreshList()
                }
            }
        }
