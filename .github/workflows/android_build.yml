                val dnsRaw = acc.dns?.trim() ?: ""; val user = (acc.user ?: "").trim(); val pass = acc.pass?.trim() ?: ""
                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) { tvStatus.text = "DNS/kullanÄ±cÄ±/ÅŸifre eksik."; tvStatus.visibility = View.VISIBLE; return }
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val urlStr = "${'$'}dns/player_api.php?username=${'$'}user&password=${'$'}pass&action=get_series_info&series_id=${'$'}seriesId"
                pb.visibility = View.VISIBLE; tvStatus.visibility = View.GONE
                Thread {
                    try {
                        val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                            connectTimeout = 15000; readTimeout = 25000; requestMethod = "GET"
                            setRequestProperty("User-Agent", FAKE_USER_AGENT)
                        }
                        if (conn.responseCode != HttpURLConnection.HTTP_OK) {
                            runOnUiThread { tvStatus.text = "Sunucu yanÄ±tÄ±: ${'$'}{conn.responseCode}"; tvStatus.visibility = View.VISIBLE; pb.visibility = View.GONE }
                            return@Thread
                        }
                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val episodesObj = obj.optJSONObject("episodes") ?: JSONObject()
                        allEpisodes.clear(); seasons.clear()
                        val keys = episodesObj.keys()
                        while (keys.hasNext()) {
                            val seasonKey = keys.next(); val seasonNum = seasonKey.toIntOrNull() ?: continue
                            if (!seasons.contains(seasonNum)) seasons.add(seasonNum)
                            val arr = episodesObj.optJSONArray(seasonKey) ?: continue
                            for (i in 0 until arr.length()) {
                                val epObj = arr.getJSONObject(i)
                                allEpisodes.add(EpisodeItem(epObj.optString("id",""), epObj.optString("title","BÃ¶lÃ¼m"), seasonNum, epObj.optInt("episode_num",1), epObj.optString("container_extension","mp4")))
                            }
                        }
                        seasons.sort()
                        runOnUiThread {
                            pb.visibility = View.GONE
                            if (seasons.isEmpty()) { tvStatus.text = "BÃ¶lÃ¼m bulunamadÄ±."; tvStatus.visibility = View.VISIBLE }
                            else showSeasons()
                        }
                    } catch (e: Exception) {
                        runOnUiThread { pb.visibility = View.GONE; tvStatus.text = "Seri bilgisi alÄ±namadÄ±: ${'$'}{e.message}"; tvStatus.visibility = View.VISIBLE }
                    }
                }.start()
            }
        }
