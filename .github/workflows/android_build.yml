package com.emin.xtream.player

import android.annotation.SuppressLint
import android.content.Intent
import android.os.Bundle
import android.os.Handler
import android.os.Looper
import android.view.View
import android.view.animation.AnimationUtils
import android.widget.ImageView
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity
import com.emin.xtream.player.utils.Prefs
import com.emin.xtream.player.utils.RemoteConfig

@SuppressLint("CustomSplashScreen")
class SplashActivity : AppCompatActivity() {

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        // Tam ekran
        window.decorView.systemUiVisibility = (
            View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
            View.SYSTEM_UI_FLAG_FULLSCREEN or
            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
        )
        setContentView(R.layout.activity_splash)

        // Arka planda config yükle
        RemoteConfig.init(this)

        val logo = findViewById<ImageView>(R.id.ivSplashLogo)
        val appName = findViewById<TextView>(R.id.tvSplashName)
        val tagline = findViewById<TextView>(R.id.tvSplashTagline)
        val version = findViewById<TextView>(R.id.tvSplashVersion)

        // Versiyon
        val ver = try { packageManager.getPackageInfo(packageName, 0).versionName } catch (e: Exception) { "3.0" }
        version.text = "v$ver"

        // Animasyonlar
        val scaleIn = AnimationUtils.loadAnimation(this, R.anim.scale_in)
        val fadeIn = AnimationUtils.loadAnimation(this, R.anim.fade_in)
        val slideUp = AnimationUtils.loadAnimation(this, R.anim.slide_up)

        logo.startAnimation(scaleIn)
        appName.startAnimation(fadeIn)
        tagline.startAnimation(slideUp)

        // 2 saniye sonra yönlendir
        Handler(Looper.getMainLooper()).postDelayed({
            val prefs = Prefs(this)
            val target = if (prefs.getActive() != null) ContentActivity::class.java else LoginActivity::class.java
            startActivity(Intent(this, target))
            overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
            finish()
        }, 2200)
    }
}
