name: ErdinPlayer Pro Ultra Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Depo Çekme
      uses: actions/checkout@v4
    
    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. ErdinPlayer Pro Modern Proje Üretimi
      run: |
        set -e
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        PASS="erdin123"
        
        echo "🚀 ErdinPlayer Pro Modern Arayüz ile Üretiliyor..."

        # Klasör Yapısı Temizliği ve Kurulumu
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/models
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/adapters
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/utils
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        mkdir -p $APP_NAME/app/src/main/res/menu
        
        cd $APP_NAME

        # İKON ve KEYSTORE
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://cdn-icons-png.flaticon.com/512/777/777242.png"
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass $PASS -keypass $PASS -dname "CN=Erdin, O=ErdinMedia, C=TR"

        # --- GRADLE ROOT ---
        echo "include ':app'" > settings.gradle
        echo -e "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m" > gradle.properties

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # --- APP MODULE GRADLE ---
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33

            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 33
                versionCode 2
                versionName "2.0.Ultra"
            }

            signingConfigs {
                release {
                    storeFile file("keystore.jks")
                    storePassword "$PASS"
                    keyAlias "key0"
                    keyPassword "$PASS"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                    signingConfig signingConfigs.release
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.recyclerview:recyclerview:1.3.0'

            // DrawerLayout
            implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

            // Media3 ExoPlayer
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
        }
        EOF

        # --- MODERN COLORS (Netflix / Dark Theme Style) ---
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <!-- Ana Arka Plan: Çok koyu lacivert/siyah -->
            <color name="bg_main">#0F1115</color>
            
            <!-- Kart ve Yüzey Rengi: Biraz daha açık gri/mavi -->
            <color name="bg_surface">#1C1F26</color>
            
            <!-- Ana Renk: Modern Mor/Mavi -->
            <color name="primary_brand">#6C63FF</color>
            
            <!-- Vurgu Rengi: Neon Turkuaz -->
            <color name="accent_cyan">#00E5FF</color>
            
            <!-- Metin Renkleri -->
            <color name="text_primary">#FFFFFF</color>
            <color name="text_secondary">#A0A3BD</color>
            <color name="divider">#2A2D3A</color>
            <color name="error_red">#FF4757</color>
        </resources>
        EOF

        # --- MODERN STYLES ---
        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <!-- Material Components Teması Kullanıyoruz -->
            <style name="Theme.ErdinPlayer" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="android:windowBackground">@color/bg_main</item>
                <item name="colorPrimary">@color/primary_brand</item>
                <item name="colorOnPrimary">@color/text_primary</item>
                <item name="colorSecondary">@color/accent_cyan</item>
                <item name="android:statusBarColor">@color/bg_main</item>
            </style>
            
            <style name="LoginInputStyle">
                <item name="android:background">@drawable/bg_input_modern</item>
                <item name="android:textColor">@color/text_primary</item>
                <item name="android:textColorHint">@color/text_secondary</item>
                <item name="android:padding">16dp</item>
                <item name="android:textSize">16sp</item>
            </style>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">ErdinPlayer Ultra</string>
        </resources>
        EOF

        # --- DRAWABLES (Modern Input & Icons) ---
        
        # Input Background
        cat <<EOF > app/src/main/res/drawable/bg_input_modern.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/bg_surface"/>
            <corners android:radius="12dp"/>
            <stroke android:width="1dp" android:color="#333845"/>
        </shape>
        EOF

        # Button Background
        cat <<EOF > app/src/main/res/drawable/bg_btn_gradient.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient 
                android:startColor="@color/primary_brand"
                android:endColor="#4834D4"
                android:angle="45"/>
            <corners android:radius="12dp"/>
        </shape>
        EOF

        # Icon Placeholder (Liste için)
        cat <<EOF > app/src/main/res/drawable/ic_play_circle.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp"
            android:height="24dp"
            android:viewportWidth="24"
            android:viewportHeight="24"
            android:tint="@color/accent_cyan">
            <path android:fillColor="@android:color/white" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,16.5v-9l6,4.5 -6,4.5z"/>
        </vector>
        EOF

        # --- BOTTOM NAV MENU ---
        cat <<EOF > app/src/main/res/menu/bottom_nav_menu.xml
        <menu xmlns:android="http://schemas.android.com/apk/res/android">
            <item
                android:id="@+id/nav_live"
                android:icon="@android:drawable/ic_menu_camera"
                android:title="Canlı TV" />
            <item
                android:id="@+id/nav_vod"
                android:icon="@android:drawable/ic_media_play"
                android:title="Filmler" />
            <item
                android:id="@+id/nav_series"
                android:icon="@android:drawable/ic_menu_my_calendar"
                android:title="Diziler" />
        </menu>
        EOF

        # --- MODELLER ---
        cat <<EOF > app/src/main/java/$PATH_NAME/models/Models.kt
        package $PACKAGE_NAME.models

        data class Category(
            val category_id: String,
            val category_name: String
        )

        data class StreamItem(
            val name: String,
            val stream_id: String?,
            val series_id: String?,
            val container_extension: String?,
            val category_id: String?
        )

        data class EpisodeItem(
            val id: String,
            val title: String,
            val seasonNumber: Int,
            val episodeNumber: Int,
            val container_extension: String?
        )
        EOF

        # --- UTILS (Prefs) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context

        class Prefs(ctx: Context) {
            private val p = ctx.getSharedPreferences("EP_Prefs", 0)

            fun save(dns: String, u: String, ps: String) {
                p.edit()
                    .putString("dns", dns)
                    .putString("u", u)
                    .putString("p", ps)
                    .apply()
            }

            fun getDns(): String = p.getString("dns", "") ?: ""
            fun getUser(): String = p.getString("u", "") ?: ""
            fun getPass(): String = p.getString("p", "") ?: ""
        }
        EOF

        # --- ADAPTER (List View - Alt Alta) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/ListAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.StreamItem

        class ListAdapter(
            private val list: List<StreamItem>,
            private val onClick: (StreamItem) -> Unit
        ) : RecyclerView.Adapter<ListAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txtName: TextView = v.findViewById(R.id.txtName)
                val txtInfo: TextView = v.findViewById(R.id.txtInfo)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                // item_list_modern layout'unu kullanıyoruz
                val v = LayoutInflater.from(parent.context)
                    .inflate(R.layout.item_list_modern, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                val item = list[position]
                holder.txtName.text = item.name
                
                // Alt bilgi (isteğe bağlı, şimdilik ID veya tip yazalım)
                if(item.series_id != null) {
                    holder.txtInfo.text = "Dizi • Tıkla İzle"
                } else if (item.container_extension != null) {
                    holder.txtInfo.text = "Film • " + item.container_extension
                } else {
                    holder.txtInfo.text = "Canlı Yayın"
                }
                
                holder.itemView.setOnClickListener { onClick(item) }
            }

            override fun getItemCount(): Int = list.size
        }
        EOF

        # --- LOGIN ACTIVITY (Modern Card UI) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.utils.Prefs

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)

                val prefs = Prefs(this)
                val eD = findViewById<EditText>(R.id.etDns)
                val eU = findViewById<EditText>(R.id.etUser)
                val eP = findViewById<EditText>(R.id.etPass)

                eD.setText(prefs.getDns())
                eU.setText(prefs.getUser())
                eP.setText(prefs.getPass())

                findViewById<Button>(R.id.btnLogin).setOnClickListener {
                    val d = eD.text.toString().trim()
                    val u = eU.text.toString().trim()
                    val p = eP.text.toString().trim()

                    if (d.isNotEmpty() && u.isNotEmpty()) {
                        prefs.save(d, u, p)
                        startActivity(Intent(this, ContentActivity::class.java))
                        finish() // Geri dönülmesin
                    } else {
                        Toast.makeText(this, "Lütfen tüm alanları doldurun!", Toast.LENGTH_SHORT).show()
                    }
                }
            }
        }
        EOF

        # --- CONTENT ACTIVITY (LinearLayoutManager Kullanıyor) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/ContentActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.Menu
        import android.view.View
        import android.widget.ProgressBar
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.view.GravityCompat
        import androidx.drawerlayout.widget.DrawerLayout
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import com.google.android.material.bottomnavigation.BottomNavigationView
        import com.google.android.material.navigation.NavigationView
        import org.json.JSONArray
        import java.net.HttpURLConnection
        import java.net.URL
        import java.util.ArrayList
        import $PACKAGE_NAME.adapters.ListAdapter
        import $PACKAGE_NAME.models.Category
        import $PACKAGE_NAME.models.StreamItem
        import $PACKAGE_NAME.utils.Prefs

        class ContentActivity : AppCompatActivity() {

            private lateinit var prefs: Prefs
            private lateinit var drawer: DrawerLayout
            private lateinit var navView: NavigationView
            private lateinit var bottomNav: BottomNavigationView
            private lateinit var rv: RecyclerView
            private lateinit var tvHeader: TextView
            private lateinit var tvStatus: TextView
            private lateinit var pb: ProgressBar

            private var currentMode: String = "LIVE"
            private var categories: List<Category> = emptyList()
            private var streams: List<StreamItem> = emptyList()

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_content)

                prefs = Prefs(this)

                drawer = findViewById(R.id.drawerLayout)
                navView = findViewById(R.id.navView)
                bottomNav = findViewById(R.id.bottomNav)
                rv = findViewById(R.id.rvContent)
                tvHeader = findViewById(R.id.tvHeader)
                tvStatus = findViewById(R.id.tvStatus)
                pb = findViewById(R.id.pbLoading)

                // BURASI DEĞİŞTİ: GridLayout yerine LinearLayoutManager (Alt Alta Liste)
                rv.layoutManager = LinearLayoutManager(this)

                tvHeader.setOnClickListener {
                    drawer.openDrawer(GravityCompat.START)
                }

                navView.setNavigationItemSelectedListener { item ->
                    val idx = item.itemId
                    if (idx in categories.indices) {
                        val cat = categories[idx]
                        // Kategorileri temizle, sadece seçileni işaretle (görsel olarak)
                        val m = navView.menu
                        for(i in 0 until m.size()) m.getItem(i).isChecked = false
                        
                        item.isChecked = true
                        filterAndShow(cat.category_id)
                        drawer.closeDrawer(GravityCompat.START)
                        true
                    } else {
                        false
                    }
                }

                bottomNav.setOnItemSelectedListener { item ->
                    when (item.itemId) {
                        R.id.nav_live -> { loadMode("LIVE"); true }
                        R.id.nav_vod -> { loadMode("VOD"); true }
                        R.id.nav_series -> { loadMode("SERIES"); true }
                        else -> false
                    }
                }

                bottomNav.selectedItemId = R.id.nav_live
                loadMode("LIVE")
            }

            private fun loadMode(mode: String) {
                currentMode = mode
                tvHeader.text = when(mode) {
                    "VOD" -> "🎬 FİLMLER (Kategori Seç)"
                    "SERIES" -> "🍿 DİZİLER (Kategori Seç)"
                    else -> "📺 CANLI YAYINLAR (Kategori Seç)"
                }
                fetchCategoriesAndStreams()
            }

            private fun fetchCategoriesAndStreams() {
                val dnsRaw = prefs.getDns().trim()
                val user = prefs.getUser().trim()
                val pass = prefs.getPass().trim()

                if (dnsRaw.isEmpty()) return

                val dns = if (dnsRaw.endsWith("/")) dnsRaw.substring(0, dnsRaw.length - 1) else dnsRaw
                val base = dns + "/player_api.php?username=" + user + "&password=" + pass

                val catAction = when(currentMode) {
                    "VOD" -> "get_vod_categories"
                    "SERIES" -> "get_series_categories"
                    else -> "get_live_categories"
                }

                val streamsAction = when(currentMode) {
                    "VOD" -> "get_vod_streams"
                    "SERIES" -> "get_series"
                    else -> "get_live_streams"
                }

                val catUrl = base + "&action=" + catAction
                val streamsUrl = base + "&action=" + streamsAction

                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE
                rv.visibility = View.GONE

                Thread {
                    try {
                        val fetchedCategories = fetchCategories(catUrl)
                        val fetchedStreams = fetchStreams(streamsUrl)

                        runOnUiThread {
                            pb.visibility = View.GONE
                            rv.visibility = View.VISIBLE
                            categories = fetchedCategories
                            streams = fetchedStreams

                            populateDrawerCategories()
                            if (categories.isNotEmpty()) {
                                filterAndShow(categories[0].category_id)
                            } else {
                                filterAndShow(null)
                            }
                        }
                    } catch (e: Exception) {
                        e.printStackTrace()
                        runOnUiThread {
                            pb.visibility = View.GONE
                            tvStatus.text = "Hata oluştu: " + e.message
                            tvStatus.visibility = View.VISIBLE
                        }
                    }
                }.start()
            }

            private fun fetchCategories(urlStr: String): List<Category> {
                val list = ArrayList<Category>()
                try {
                    val url = URL(urlStr)
                    val conn = url.openConnection() as HttpURLConnection
                    conn.connectTimeout = 5000
                    conn.readTimeout = 5000
                    conn.requestMethod = "GET"
                    if (conn.responseCode == 200) {
                        val body = conn.inputStream.bufferedReader().readText()
                        val arr = JSONArray(body)
                        for (i in 0 until arr.length()) {
                            val obj = arr.getJSONObject(i)
                            list.add(Category(
                                obj.optString("category_id", ""),
                                obj.optString("category_name", "Kategori $i")
                            ))
                        }
                    }
                } catch(e: Exception) {}
                return list
            }

            private fun fetchStreams(urlStr: String): List<StreamItem> {
                val list = ArrayList<StreamItem>()
                try {
                    val url = URL(urlStr)
                    val conn = url.openConnection() as HttpURLConnection
                    conn.connectTimeout = 10000
                    conn.readTimeout = 10000
                    conn.requestMethod = "GET"
                    if (conn.responseCode == 200) {
                        val body = conn.inputStream.bufferedReader().readText()
                        val arr = JSONArray(body)
                        for (i in 0 until arr.length()) {
                            val obj = arr.getJSONObject(i)
                            list.add(StreamItem(
                                name = obj.optString("name", "İsimsiz"),
                                stream_id = obj.optString("stream_id", null),
                                series_id = obj.optString("series_id", null),
                                container_extension = obj.optString("container_extension", null),
                                category_id = obj.optString("category_id", "")
                            ))
                        }
                    }
                } catch(e: Exception) {}
                return list
            }

            private fun populateDrawerCategories() {
                val menu: Menu = navView.menu
                menu.clear()
                for ((index, cat) in categories.withIndex()) {
                    val item = menu.add(0, index, 0, cat.category_name)
                    item.isCheckable = true
                    if (index == 0) item.isChecked = true
                }
            }

            private fun filterAndShow(categoryId: String?) {
                val filtered = if (categoryId.isNullOrEmpty()) streams else streams.filter { it.category_id == categoryId }

                val dnsRaw = prefs.getDns().trim()
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.substring(0, dnsRaw.length - 1) else dnsRaw
                val user = prefs.getUser()
                val pass = prefs.getPass()

                rv.adapter = ListAdapter(filtered) { item ->
                    if (currentMode == "SERIES") {
                        val itn = Intent(this, SeriesDetailActivity::class.java)
                        itn.putExtra("SERIES_ID", item.series_id ?: "")
                        itn.putExtra("SERIES_NAME", item.name)
                        startActivity(itn)
                    } else {
                        val path = if (currentMode == "LIVE") "live" else "movie"
                        val ext = if (currentMode == "LIVE") ".ts" else ("." + (item.container_extension ?: "mp4"))
                        val id = item.stream_id ?: ""
                        val playUrl = "$dns/$path/$user/$pass/$id$ext"

                        val itn = Intent(this, PlayerActivity::class.java)
                        itn.putExtra("URL", playUrl)
                        startActivity(itn)
                    }
                }
            }
        }
        EOF

        # --- SERIES DETAIL (Aynen korundu, sadece renk uyumu) ---
        cat <<EOF > app/src/main/java/$PATH_NAME/SeriesDetailActivity.kt
        package $PACKAGE_NAME

        import android.os.Bundle
        import android.view.View
        import android.widget.AdapterView
        import android.widget.ArrayAdapter
        import android.widget.ListView
        import android.widget.ProgressBar
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.util.ArrayList
        import $PACKAGE_NAME.models.EpisodeItem
        import $PACKAGE_NAME.utils.Prefs

        class SeriesDetailActivity : AppCompatActivity() {

            private lateinit var prefs: Prefs
            private lateinit var tvTitle: TextView
            private lateinit var tvStatus: TextView
            private lateinit var pb: ProgressBar
            private lateinit var lv: ListView
            private val episodes = ArrayList<EpisodeItem>()

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_series_detail)

                prefs = Prefs(this)
                tvTitle = findViewById(R.id.tvSeriesTitle)
                tvStatus = findViewById(R.id.tvSeriesStatus)
                pb = findViewById(R.id.pbSeries)
                lv = findViewById(R.id.lvEpisodes)

                val seriesName = intent.getStringExtra("SERIES_NAME") ?: "Dizi"
                val seriesId = intent.getStringExtra("SERIES_ID") ?: ""
                tvTitle.text = seriesName

                loadSeriesInfo(seriesId)
            }

            private fun loadSeriesInfo(seriesId: String) {
                val dns = prefs.getDns().trim().removeSuffix("/")
                val user = prefs.getUser()
                val pass = prefs.getPass()
                val urlStr = "$dns/player_api.php?username=$user&password=$pass&action=get_series_info&series_id=$seriesId"

                pb.visibility = View.VISIBLE
                Thread {
                    try {
                        val url = URL(urlStr)
                        val conn = url.openConnection() as HttpURLConnection
                        conn.requestMethod = "GET"
                        if (conn.responseCode == 200) {
                            val body = conn.inputStream.bufferedReader().readText()
                            val obj = JSONObject(body)
                            val episodesObj = obj.optJSONObject("episodes") ?: JSONObject()
                            episodes.clear()
                            
                            val keys = episodesObj.keys()
                            while (keys.hasNext()) {
                                val seasonKey = keys.next()
                                val arr = episodesObj.optJSONArray(seasonKey) ?: continue
                                for(i in 0 until arr.length()){
                                    val epObj = arr.getJSONObject(i)
                                    episodes.add(EpisodeItem(
                                        epObj.optString("id", ""),
                                        epObj.optString("title", "Bölüm"),
                                        seasonKey.toIntOrNull() ?: 1,
                                        epObj.optInt("episode_num", i + 1),
                                        epObj.optString("container_extension", "mp4")
                                    ))
                                }
                            }
                        }
                        runOnUiThread {
                            pb.visibility = View.GONE
                            val labels = episodes.map { "Sezon ${it.seasonNumber} - Bölüm ${it.episodeNumber}: ${it.title}" }
                            val adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, labels)
                            lv.adapter = adapter
                            lv.onItemClickListener = AdapterView.OnItemClickListener { _, _, i, _ ->
                                val ep = episodes[i]
                                val ext = ep.container_extension ?: "mp4"
                                val playUrl = "$dns/series/$user/$pass/${ep.id}.$ext"
                                val itn = android.content.Intent(this, PlayerActivity::class.java)
                                itn.putExtra("URL", playUrl)
                                startActivity(itn)
                            }
                        }
                    } catch (e: Exception) {
                        e.printStackTrace()
                    }
                }.start()
            }
        }
        EOF

        # --- PLAYER ACTIVITY ---
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME

        import android.os.Bundle
        import android.view.WindowManager
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView

        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                setContentView(R.layout.activity_player_pro)

                val url = intent.getStringExtra("URL") ?: ""
                val pv = findViewById<PlayerView>(R.id.pvMain)

                player = ExoPlayer.Builder(this).build().also { exo ->
                    pv.player = exo
                    exo.setMediaItem(MediaItem.fromUri(url))
                    exo.prepare()
                    exo.play()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                player?.release()
                player = null
            }
        }
        EOF

