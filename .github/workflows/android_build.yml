        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.KeyEvent
        import android.view.View
        import android.view.inputmethod.EditorInfo
        import android.widget.*
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import com.google.android.gms.ads.AdView
        import org.json.JSONArray
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale
        import $PACKAGE_NAME.adapters.RowAdapter
        import $PACKAGE_NAME.models.Category
        import $PACKAGE_NAME.models.RowItem
        import $PACKAGE_NAME.models.StreamItem
        import $PACKAGE_NAME.utils.AdsHelper
        import $PACKAGE_NAME.utils.LangManager
        import $PACKAGE_NAME.utils.Prefs

        class ContentActivity : AppCompatActivity() {

            private lateinit var prefs: Prefs

            private lateinit var rv: RecyclerView
            private lateinit var adapter: RowAdapter
            private lateinit var pb: ProgressBar
            private lateinit var tvStatus: TextView

            private lateinit var btnLive: Button
            private lateinit var btnVod: Button
            private lateinit var btnSeries: Button
            private lateinit var etSearch: EditText
            private lateinit var btnAccount: ImageButton
            private lateinit var tvBread: TextView

            private var accountType: String = "XTREAM"
            private var dns: String = ""
            private var user: String = ""
            private var pass: String = ""

            private var mode: String = "LIVE" // LIVE/VOD/SERIES
            private var level: String = "CATS" // CATS/LIST/SEASONS/EPISODES

            private var categories: List<Category> = emptyList()
            private var streams: List<StreamItem> = emptyList()

            // cache (global search için)
            private var cacheLive: List<StreamItem>? = null
            private var cacheVod: List<StreamItem>? = null
            private var cacheSeries: List<StreamItem>? = null
            private var cacheLiveCats: List<Category>? = null
            private var cacheVodCats: List<Category>? = null
            private var cacheSeriesCats: List<Category>? = null

            private var selectedCategory: Category? = null
            private var selectedSeries: StreamItem? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_content)

                prefs = Prefs(this)
                prefs.setLastScreen("CONTENT")

                val lang = prefs.getLang()
                LangManager.restoreFromPrefs(this, lang)
                LangManager.init(this, lang)

                AdsHelper.init(this)
                AdsHelper.loadInterstitial(this)
                AdsHelper.loadBanner(findViewById<AdView>(R.id.adViewTop))
                AdsHelper.loadBanner(findViewById<AdView>(R.id.adViewBottom))

                rv = findViewById(R.id.rvMain)
                pb = findViewById(R.id.pbLoading)
                tvStatus = findViewById(R.id.tvStatus)

                btnLive = findViewById(R.id.btnLive)
                btnVod = findViewById(R.id.btnVod)
                btnSeries = findViewById(R.id.btnSeries)
                etSearch = findViewById(R.id.etSearch)
                btnAccount = findViewById(R.id.btnAccount)
                tvBread = findViewById(R.id.tvBread)

                rv.layoutManager = LinearLayoutManager(this)
                adapter = RowAdapter(mutableListOf()) { onRowClick(it) }
                rv.adapter = adapter

                val active = prefs.getActive()
                if (active == null) {
                    tvStatus.text = "Kayıtlı hesap yok. Giriş ekranına dönün."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                accountType = active.type
                if (accountType == "XTREAM") {
                    val dnsRaw = (active.dns ?: "").trim()
                    user = (active.user ?: "").trim()
                    pass = (active.pass ?: "").trim()
                    dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                    if (dns.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                        tvStatus.text = "DNS / kullanıcı / şifre boş. Giriş ekranına dönün."
                        tvStatus.visibility = View.VISIBLE
                        return
                    }
                }

                // giriş sonrası öncelik LIVE
                mode = if (accountType == "M3U") "LIVE" else prefs.getLastMode()
                if (accountType == "M3U") {
                    btnVod.isEnabled = false
                    btnSeries.isEnabled = false
                    btnVod.alpha = 0.4f
                    btnSeries.alpha = 0.4f
                }

                setMode(mode)

                btnLive.setOnClickListener { setMode("LIVE") }
                btnVod.setOnClickListener { if (accountType != "M3U") setMode("VOD") }
                btnSeries.setOnClickListener { if (accountType != "M3U") setMode("SERIES") }

                btnAccount.setOnClickListener { showAccountMenu() }

                etSearch.setOnEditorActionListener { _, actionId, _ ->
                    if (actionId == EditorInfo.IME_ACTION_SEARCH || actionId == EditorInfo.IME_ACTION_DONE) {
                        doGlobalSearch(etSearch.text.toString().trim())
                        true
                    } else false
                }

                // TV kumandada ENTER ile arama çalışsın
                etSearch.setOnKeyListener { _, keyCode, event ->
                    if (event.action == KeyEvent.ACTION_DOWN && keyCode == KeyEvent.KEYCODE_ENTER) {
                        doGlobalSearch(etSearch.text.toString().trim())
                        true
                    } else false
                }
            }

            private fun setMode(newMode: String) {
                mode = if (accountType == "M3U") "LIVE" else newMode
                prefs.setLastMode(mode)
                level = "CATS"
                selectedCategory = null
                selectedSeries = null
                tvBread.text = breadcrumb()
                loadModeData(mode)
            }

            private fun breadcrumb(): String {
                val a = when (mode) { "VOD" -> "Filmler"; "SERIES" -> "Diziler"; else -> "Canlı TV" }
                val b = selectedCategory?.category_name
                val c = selectedSeries?.name
                return listOfNotNull(a, b, c).joinToString("  ›  ")
            }

            private fun showAccountMenu() {
                val active = prefs.getActive()
                val name = active?.name ?: "-"
                val type = active?.type ?: "-"
                val lang = prefs.getLang()

                val items = arrayOf(
                    "Hesap: $name ($type)",
                    "Dil: " + (if (lang == "tr") "Türkçe" else "English"),
                    "Çıkış"
                )

                AlertDialog.Builder(this)
                    .setTitle(getString(R.string.account_menu))
                    .setItems(items) { d, which ->
                        when (which) {
                            1 -> showLanguageDialog()
                            2 -> {
                                prefs.setLastScreen("LOGIN")
                                startActivity(Intent(this, LoginActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP))
                                finish()
                            }
                        }
                        d.dismiss()
                    }
                    .show()
            }

            private fun showLanguageDialog() {
                val items = arrayOf("English", "Türkçe")
                val codes = arrayOf("en", "tr")
                val current = prefs.getLang()
                var checked = if (current == "tr") 1 else 0

                val dialog = AlertDialog.Builder(this)
                    .setTitle(getString(R.string.language))
                    .setSingleChoiceItems(items, checked) { _, w -> checked = w }
                    .setPositiveButton("OK") { d, _ ->
                        val newLang = codes[checked]
                        if (newLang != current) {
                            prefs.setLang(newLang)
                            LangManager.restoreFromPrefs(this, newLang)
                            LangManager.init(this, newLang)
                            recreate()
                        }
                        d.dismiss()
                    }
                    .setNegativeButton("Cancel", null)
                    .create()

                dialog.show()
            }

            private fun loadModeData(m: String) {
                tvStatus.visibility = View.GONE
                pb.visibility = View.VISIBLE
                adapter.setNew(listOf(RowItem.Header("Yükleniyor...")))

                if (accountType == "M3U") {
                    val active = prefs.getActive()
                    val m3uUrl = active?.m3u?.trim() ?: ""
                    if (m3uUrl.isEmpty()) {
                        pb.visibility = View.GONE
                        tvStatus.text = "Bu M3U hesabında link bulunamadı."
                        tvStatus.visibility = View.VISIBLE
                        return
                    }
                    Thread {
                        try {
                            val res = fetchM3u(m3uUrl)
                            categories = res.first
                            streams = res.second
                            runOnUiThread {
                                pb.visibility = View.GONE
                                cacheLiveCats = categories
                                cacheLive = streams
                                showCategories()
                                tvBread.text = breadcrumb()
                                btnLive.requestFocus()
                            }
                        } catch (e: Exception) {
                            runOnUiThread {
                                pb.visibility = View.GONE
                                tvStatus.text = "M3U okunamadı: " + (e.message ?: "bilinmeyen hata")
                                tvStatus.visibility = View.VISIBLE
                            }
                        }
                    }.start()
                    return
                }

                // XTREAM: cache varsa hızlı göster
                val cachedCats = when (m) {
                    "VOD" -> cacheVodCats
                    "SERIES" -> cacheSeriesCats
                    else -> cacheLiveCats
                }
                val cachedStreams = when (m) {
                    "VOD" -> cacheVod
                    "SERIES" -> cacheSeries
                    else -> cacheLive
                }
                if (cachedCats != null && cachedStreams != null) {
                    pb.visibility = View.GONE
                    categories = cachedCats
                    streams = cachedStreams
                    showCategories()
                    tvBread.text = breadcrumb()
                    return
                }

                Thread {
                    try {
                        val base = dns + "/player_api.php?username=" + user + "&password=" + pass
                        val catAction = when (m) {
                            "VOD" -> "get_vod_categories"
                            "SERIES" -> "get_series_categories"
                            else -> "get_live_categories"
                        }
                        val streamsAction = when (m) {
                            "VOD" -> "get_vod_streams"
                            "SERIES" -> "get_series"
                            else -> "get_live_streams"
                        }
                        val fetchedCats = fetchCategories(base + "&action=" + catAction)
                        val fetchedStreams = fetchStreams(base + "&action=" + streamsAction)

                        runOnUiThread {
                            pb.visibility = View.GONE
                            categories = fetchedCats
                            streams = fetchedStreams

                            when (m) {
                                "VOD" -> { cacheVodCats = fetchedCats; cacheVod = fetchedStreams }
                                "SERIES" -> { cacheSeriesCats = fetchedCats; cacheSeries = fetchedStreams }
                                else -> { cacheLiveCats = fetchedCats; cacheLive = fetchedStreams }
                            }

                            showCategories()
                            tvBread.text = breadcrumb()
                        }
                    } catch (e: Exception) {
                        runOnUiThread {
                            pb.visibility = View.GONE
                            tvStatus.text = "Veriler alınamadı: " + (e.message ?: "bilinmeyen hata")
                            tvStatus.visibility = View.VISIBLE
                        }
                    }
                }.start()
            }

            private fun showCategories() {
                level = "CATS"
                selectedCategory = null
                selectedSeries = null
                tvBread.text = breadcrumb()

                val list = ArrayList<RowItem>()
                list.add(RowItem.Header("Önce Kategori Seç"))
                for (c in categories) list.add(RowItem.CategoryRow(c))
                if (categories.isEmpty()) {
                    list.add(RowItem.Header("Kategori yok (tüm liste)"))
                    // kategori yoksa direkt liste göster
                    showStreamList(null)
                    return
                }
                adapter.setNew(list)
                rv.scrollToPosition(0)
            }

            private fun showStreamList(cat: Category?) {
                level = "LIST"
                selectedCategory = cat
                selectedSeries = null
                tvBread.text = breadcrumb()

                val filtered = if (cat == null) streams else streams.filter { it.category_id == cat.category_id }
                val list = ArrayList<RowItem>()
                list.add(RowItem.Header("Liste"))
                for (s in filtered) list.add(RowItem.StreamRow(s))
                adapter.setNew(list)
                rv.scrollToPosition(0)
            }

            private fun doGlobalSearch(q: String) {
                if (q.isEmpty()) {
                    // arama boşsa bulunduğun seviyeyi tekrar çiz
                    if (level == "CATS") showCategories() else showStreamList(selectedCategory)
                    return
                }

                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE

                Thread {
                    try {
                        val all = ArrayList<StreamItem>()
                        if (accountType == "M3U") {
                            all.addAll(cacheLive ?: streams)
                        } else {
                            // global search için 3 modu da topla (cache yoksa getir)
                            ensureAllXtreamCaches()
                            cacheLive?.let { all.addAll(it) }
                            cacheVod?.let { all.addAll(it) }
                            cacheSeries?.let { all.addAll(it) }
                        }

                        val low = q.lowercase(Locale.getDefault())
                        val hit = all.filter { it.name.lowercase(Locale.getDefault()).contains(low) }.take(500)

                        runOnUiThread {
                            pb.visibility = View.GONE
                            val list = ArrayList<RowItem>()
                            list.add(RowItem.Header("Arama Sonuçları: \"$q\" (${hit.size})"))
                            for (s in hit) list.add(RowItem.StreamRow(s))
                            adapter.setNew(list)
                            rv.scrollToPosition(0)
                            tvBread.text = "Arama  ›  $q"
                        }
                    } catch (e: Exception) {
                        runOnUiThread {
                            pb.visibility = View.GONE
                            tvStatus.text = "Arama hatası: " + (e.message ?: "bilinmeyen hata")
                            tvStatus.visibility = View.VISIBLE
                        }
                    }
                }.start()
            }

            private fun ensureAllXtreamCaches() {
                if (cacheLive != null && cacheVod != null && cacheSeries != null) return

                val base = dns + "/player_api.php?username=" + user + "&password=" + pass

                fun loadCats(action: String): List<Category> = fetchCategories(base + "&action=" + action)
                fun loadStreams(action: String): List<StreamItem> = fetchStreams(base + "&action=" + action)

                if (cacheLive == null) {
                    cacheLiveCats = loadCats("get_live_categories")
                    cacheLive = loadStreams("get_live_streams")
                }
                if (cacheVod == null) {
                    cacheVodCats = loadCats("get_vod_categories")
                    cacheVod = loadStreams("get_vod_streams")
                }
                if (cacheSeries == null) {
                    cacheSeriesCats = loadCats("get_series_categories")
                    cacheSeries = loadStreams("get_series")
                }
            }

            private fun onRowClick(item: RowItem) {
                when (item) {
                    is RowItem.CategoryRow -> showStreamList(item.c)
                    is RowItem.StreamRow -> openStream(item.s)
                    else -> {}
                }
            }

            private fun openStream(s: StreamItem) {
                // SERIES: önce seri detay (bölümler)
                if (accountType == "XTREAM" && mode == "SERIES" && !s.series_id.isNullOrEmpty()) {
                    val itn = Intent(this, SeriesDetailActivity::class.java)
                    itn.putExtra("SERIES_ID", s.series_id ?: "")
                    itn.putExtra("SERIES_NAME", s.name)
                    AdsHelper.maybeShowOnClick(this) { startActivity(itn) }
                    return
                }

                // LIVE/VOD/M3U => direkt Player
                val itn = Intent(this, PlayerActivity::class.java)

                if (accountType == "M3U") {
                    val url = s.full_url ?: return
                    itn.putExtra("URL", url)
                    itn.putExtra("REF", s.referer ?: "")
                    itn.putExtra("ORG", s.origin ?: "")
                    AdsHelper.maybeShowOnClick(this) { startActivity(itn) }
                    return
                }

                val path = if (mode == "LIVE") "live" else "movie"
                val ext = if (mode == "LIVE") ".ts" else {
                    if (!s.container_extension.isNullOrEmpty()) "." + s.container_extension else ".mp4"
                }
                val id = s.stream_id ?: ""
                val playUrl = dns + "/" + path + "/" + user + "/" + pass + "/" + id + ext

                itn.putExtra("URL", playUrl)
                itn.putExtra("REF", "")
                itn.putExtra("ORG", "")
                AdsHelper.maybeShowOnClick(this) { startActivity(itn) }
            }

            // BACK: kategori->liste->geri
            override fun onBackPressed() {
                if (tvBread.text.toString().startsWith("Arama")) {
                    etSearch.setText("")
                    showCategories()
                    return
                }
                if (level == "LIST") {
                    showCategories()
                    return
                }
                super.onBackPressed()
            }

            private fun fetchM3u(urlStr: String): Pair<List<Category>, List<StreamItem>> {
                val categoriesMap = LinkedHashMap<String, Category>()
                val streamsList = ArrayList<StreamItem>()

                val conn = (URL(urlStr).openConnection() as HttpURLConnection)
                conn.connectTimeout = 10000
                conn.readTimeout = 20000
                conn.requestMethod = "GET"
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return Pair(emptyList(), emptyList())

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val lines = body.split("\n")

                var currentName = ""
                var currentGroup = "Genel"
                var currentRef: String? = null
                var currentOrg: String? = null

                for (raw in lines) {
                    val line = raw.trim()
                    if (line.isEmpty()) continue
                    if (line.startsWith("#EXTM3U", true)) continue

                    if (line.startsWith("#EXTINF", true)) {
                        var name = ""
                        var group = "Genel"

                        val groupIndex = line.indexOf("group-title=\"")
                        if (groupIndex >= 0) {
                            val start = groupIndex + "group-title=\"".length
                            val end = line.indexOf("\"", startIndex = start)
                            if (end > start) group = line.substring(start, end)
                        }
                        val commaIndex = line.lastIndexOf(',')
                        if (commaIndex >= 0 && commaIndex < line.length - 1) name = line.substring(commaIndex + 1).trim()

                        currentName = if (name.isNotEmpty()) name else "Kanal"
                        currentGroup = if (group.isNotEmpty()) group else "Genel"
                        currentRef = null
                        currentOrg = null
                    } else if (line.startsWith("#EXTVLCOPT:http-referrer=", true)) {
                        currentRef = line.substringAfter("=").trim()
                    } else if (line.startsWith("#EXTVLCOPT:http-origin=", true)) {
                        currentOrg = line.substringAfter("=").trim()
                    } else if (!line.startsWith("#")) {
                        val urlPlay = line
                        val groupId = if (currentGroup.isNotEmpty()) currentGroup else "Genel"
                        val cat = categoriesMap.getOrPut(groupId) { Category(groupId, groupId) }

                        streamsList.add(
                            StreamItem(
                                name = currentName,
                                stream_id = null,
                                series_id = null,
                                container_extension = null,
                                category_id = cat.category_id,
                                full_url = urlPlay,
                                referer = currentRef,
                                origin = currentOrg
                            )
                        )
                        currentRef = null
                        currentOrg = null
                    }
                }
                return Pair(categoriesMap.values.toList(), streamsList)
            }

            private fun fetchCategories(urlStr: String): List<Category> {
                val list = ArrayList<Category>()
                val conn = (URL(urlStr).openConnection() as HttpURLConnection)
                conn.connectTimeout = 10000
                conn.readTimeout = 15000
                conn.requestMethod = "GET"
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return list

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                for (i in 0 until arr.length()) {
                    val obj = arr.getJSONObject(i)
                    list.add(Category(obj.optString("category_id", ""), obj.optString("category_name", "Kategori $i")))
                }
                return list
            }

            private fun fetchStreams(urlStr: String): List<StreamItem> {
                val list = ArrayList<StreamItem>()
                val conn = (URL(urlStr).openConnection() as HttpURLConnection)
                conn.connectTimeout = 10000
                conn.readTimeout = 20000
                conn.requestMethod = "GET"
                if (conn.responseCode != HttpURLConnection.HTTP_OK) return list

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                for (i in 0 until arr.length()) {
                    val obj = arr.getJSONObject(i)
                    list.add(
                        StreamItem(
                            name = obj.optString("name", "Bilinmeyen"),
                            stream_id = obj.optString("stream_id", null),
                            series_id = obj.optString("series_id", null),
                            container_extension = obj.optString("container_extension", null),
                            category_id = obj.optString("category_id", ""),
                            full_url = null,
                            referer = null,
                            origin = null
                        )
                    )
                }
                return list
            }
        }
