                fun updateTypeUI() {
                    if (isXtream) {
                        layoutXtream.visibility = View.VISIBLE
                        layoutM3u.visibility = View.GONE
                        cardXtream.requestFocus()
                    } else {
                        layoutXtream.visibility = View.GONE
                        layoutM3u.visibility = View.VISIBLE
                        cardM3u.requestFocus()
                    }
                }

                cardXtream.setOnClickListener { isXtream = true; updateTypeUI() }
                cardM3u.setOnClickListener { isXtream = false; updateTypeUI() }
                updateTypeUI()

                fun refreshList() {
                    val accounts: MutableList<AccountProfile> = prefs.getAccounts().toMutableList()
                    if (accountsAdapter == null) {
                        accountsAdapter = AccountsAdapter(
                            this,
                            accounts,
                            onOpen = { acc ->
                                prefs.setActive(acc.id)
                                // girişten sonra öncelik LIVE
                                prefs.setLastMode("LIVE")
                                prefs.setLastScreen("CONTENT")
                                startActivity(Intent(this, ContentActivity::class.java))
                                finish()
                            },
                            onDelete = { acc ->
                                val dialog = AlertDialog.Builder(this)
                                    .setTitle("Delete Account")
                                    .setMessage("Delete account? " + acc.name)
                                    .setPositiveButton("Yes") { _, _ ->
                                        prefs.deleteAccount(acc.id)
                                        refreshList()
                                    }
                                    .setNegativeButton("No", null)
                                    .create()

                                dialog.setOnShowListener {
                                    val positive = dialog.getButton(AlertDialog.BUTTON_POSITIVE)
                                    val negative = dialog.getButton(AlertDialog.BUTTON_NEGATIVE)
                                    positive?.setTextColor(ContextCompat.getColor(this, R.color.accent_green))
                                    negative?.setTextColor(ContextCompat.getColor(this, R.color.error_red))
                                }
                                dialog.show()
                            }
                        )
                        lvAccounts.adapter = accountsAdapter
                    } else {
                        accountsAdapter?.update(accounts)
                    }
                }

                refreshList()

                btnAdd.setOnClickListener {
                    val name = etName.text.toString().trim()
                    val finalName = if (name.isNotEmpty()) name else "Hesap"

