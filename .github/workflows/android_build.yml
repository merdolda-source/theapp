name: Android Build APK (Auto-Fix)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek (Checkout)
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🕵️ Otomatik Sorun Giderici ve Build
      run: |
        echo "🔍 Proje dosyaları aranıyor..."
        
        # build.gradle dosyasını nerede olursa olsun bul
        # (Sadece root'taki veya ilk alt klasördeki build.gradle'ı hedefler)
        BUILD_FILE=$(find . -maxdepth 2 -name "build.gradle" | head -n 1)
        
        if [ -z "$BUILD_FILE" ]; then
          echo "❌ HATA: build.gradle dosyası bulunamadı! Depo boş veya yanlış yüklenmiş."
          echo "📂 Mevcut Dosyalar:"
          ls -R
          exit 1
        fi
        
        # Dosyanın olduğu klasörü al (Örn: ./ErdinPlayer veya .)
        PROJECT_ROOT=$(dirname "$BUILD_FILE")
        echo "✅ Proje şu klasörde bulundu: $PROJECT_ROOT"
        
        # 🛠️ DÜZELTME 1: settings.gradle EKSİKSE OLUŞTUR
        if [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
           echo "⚠️ settings.gradle eksik, otomatik oluşturuluyor..."
           echo "include ':app'" > "$PROJECT_ROOT/settings.gradle"
        fi

        # 🛠️ DÜZELTME 2: gradlew İZİNLERİ
        if [ -f "$PROJECT_ROOT/gradlew" ]; then
           chmod +x "$PROJECT_ROOT/gradlew"
        fi

        # 🚀 BUILD BAŞLATIYORUZ
        echo "🚀 Derleme Başlıyor..."
        cd "$PROJECT_ROOT"
        bash ./gradlew assembleRelease

    - name: 📦 APK'yı Bul ve Yükle
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-release
        # Klasör yolu ne olursa olsun APK'yı bulur
        path: |
          **/build/outputs/apk/release/*.apk
          **/app-release.apk
