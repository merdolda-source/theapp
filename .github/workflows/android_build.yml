        # ============ PLAYER ACTIVITY ============
        cat > "app/src/main/java/$PATH_NAME/PlayerActivity.kt" << 'PLAYEREOF'
package com.emin.xtream.player

import android.content.Context
import android.content.Intent
import android.media.AudioManager
import android.os.Bundle
import android.os.Handler
import android.os.Looper
import android.view.KeyEvent
import android.view.MotionEvent
import android.view.View
import android.view.WindowManager
import android.widget.*
import androidx.appcompat.app.AppCompatActivity
import androidx.media3.common.MediaItem
import androidx.media3.common.PlaybackException
import androidx.media3.common.Player
import androidx.media3.datasource.DefaultHttpDataSource
import androidx.media3.exoplayer.ExoPlayer
import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
import androidx.media3.ui.AspectRatioFrameLayout
import androidx.media3.ui.PlayerView
import com.emin.xtream.player.utils.Prefs
import com.emin.xtream.player.utils.RemoteLogger
import kotlin.math.abs

class PlayerActivity : AppCompatActivity() {

    private val FAKE_UA = "Mozilla/5.0 (Linux; Android 12; SM-G998B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/108.0.0.0 Mobile Safari/537.36"

    private var player: ExoPlayer? = null
    private lateinit var playerView: PlayerView
    private lateinit var tvTitle: TextView
    private lateinit var tvCenterInfo: TextView
    private lateinit var tvBrightness: TextView
    private lateinit var tvVolume: TextView
    private lateinit var tvPosition: TextView
    private lateinit var btnPlayPause: ImageButton
    private lateinit var btnBack: ImageButton
    private lateinit var btnMode: ImageButton
    private lateinit var btnLock: ImageButton
    private lateinit var leftOverlay: View
    private lateinit var rightOverlay: View
    private lateinit var controlsBar: View

    private var audioManager: AudioManager? = null
    private var maxVolume = 15
    private var gestureStartVolume = 0
    private var currentBrightness = 0.5f
    private var gestureStartBrightness = 0.5f
    private var gestureStartY = 0f
    private var isGesture = false
    private var tapCountLeft = 0
    private var tapCountRight = 0
    private var lastTapLeft = 0L
    private var lastTapRight = 0L

    private var playUrl = ""
    private var playTitle = ""
    private var playType = "LIVE"
    private var fitMode = 0
    private var isLocked = false
    private var seekSeconds = 15
    private var isControlsVisible = true

    private val handler = Handler(Looper.getMainLooper())
    private val hideControlsRunnable = Runnable { hideControls() }
    private val hideOverlayRunnable = Runnable {
        tvBrightness.visibility = View.GONE
        tvVolume.visibility = View.GONE
        tvCenterInfo.visibility = View.GONE
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.apply {
            addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
            setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
            addFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)
        }
        window.decorView.systemUiVisibility = (
            View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
            View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
        )
        setContentView(R.layout.activity_player_pro)

        playUrl = intent.getStringExtra("URL") ?: ""
        playTitle = intent.getStringExtra("TITLE") ?: ""
        playType = intent.getStringExtra("TYPE") ?: "LIVE"
        val ref = intent.getStringExtra("REF") ?: ""
        val org = intent.getStringExtra("ORG") ?: ""

        if (playUrl.isEmpty()) { Toast.makeText(this, "Geçersiz URL", Toast.LENGTH_SHORT).show(); finish(); return }

        val prefs = Prefs(this)
        fitMode = prefs.getPlayerFitMode()
        seekSeconds = prefs.getSeekSeconds()

        initViews()
        setupPlayer(playUrl, ref, org)
        setupGestures()
        scheduleHideControls()
    }

    private fun initViews() {
        playerView = findViewById(R.id.pvMain)
        tvTitle = findViewById(R.id.tvPlayerTitle)
        tvCenterInfo = findViewById(R.id.tvInfoCenter)
        tvBrightness = findViewById(R.id.tvBrightness)
        tvVolume = findViewById(R.id.tvVolume)
        tvPosition = findViewById(R.id.tvPosition)
        btnPlayPause = findViewById(R.id.btnPlayPause)
        btnBack = findViewById(R.id.btnPlayerBack)
        btnMode = findViewById(R.id.btnMode)
        btnLock = findViewById(R.id.btnLock)
        leftOverlay = findViewById(R.id.overlayLeft)
        rightOverlay = findViewById(R.id.overlayRight)
        controlsBar = findViewById(R.id.playerControlsBar)

        tvTitle.text = playTitle

        audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
        maxVolume = audioManager?.getStreamMaxVolume(AudioManager.STREAM_MUSIC) ?: 15
        val lp = window.attributes
        currentBrightness = if (lp.screenBrightness in 0f..1f) lp.screenBrightness else 0.5f

        // ExoPlayer controller gizle - kendi controllerimizi kullanıyoruz
        playerView.useController = false
        applyFitMode()

        btnBack.setOnClickListener { finish() }
        btnPlayPause.setOnClickListener { togglePlayPause(); rescheduleHideControls() }
        btnMode.setOnClickListener { fitMode = (fitMode + 1) % 3; applyFitMode(); rescheduleHideControls() }
        btnLock.setOnClickListener {
            isLocked = !isLocked
            btnLock.setImageResource(if (isLocked) android.R.drawable.ic_lock_lock else android.R.drawable.ic_lock_idle_lock)
            if (isLocked) hideControls()
            showToast(if (isLocked) "Ekran kilitlendi" else "Kilit açıldı")
        }

        // Position update
        handler.post(positionRunnable)
    }

    private val positionRunnable = object : Runnable {
        override fun run() {
            player?.let { p ->
                if (p.duration > 0) {
                    val pos = p.currentPosition / 1000
                    val dur = p.duration / 1000
                    tvPosition.text = "${formatTime(pos)} / ${formatTime(dur)}"
                    tvPosition.visibility = View.VISIBLE
                } else {
                    tvPosition.visibility = View.GONE
                }
            }
            handler.postDelayed(this, 1000)
        }
    }

    private fun formatTime(sec: Long): String {
        val h = sec / 3600; val m = (sec % 3600) / 60; val s = sec % 60
        return if (h > 0) String.format("%d:%02d:%02d", h, m, s) else String.format("%02d:%02d", m, s)
    }

    private fun setupPlayer(url: String, ref: String, org: String) {
        try {
            val headers = mutableMapOf("User-Agent" to FAKE_UA)
            if (ref.isNotEmpty()) headers["Referer"] = ref
            if (org.isNotEmpty()) headers["Origin"] = org

            val httpFactory = DefaultHttpDataSource.Factory()
                .setConnectTimeoutMs(20000)
                .setReadTimeoutMs(40000)
                .setDefaultRequestProperties(headers)

            player = ExoPlayer.Builder(this)
                .setMediaSourceFactory(DefaultMediaSourceFactory(httpFactory))
                .build()

            playerView.player = player
            player!!.apply {
                setMediaItem(MediaItem.fromUri(url))
                prepare()
                playWhenReady = true
                addListener(object : Player.Listener {
                    override fun onIsPlayingChanged(isPlaying: Boolean) {
                        btnPlayPause.setImageResource(
                            if (isPlaying) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play
                        )
                    }
                    override fun onPlayerError(error: PlaybackException) {
                        showToast("Hata: ${error.localizedMessage}")
                        RemoteLogger.sendEvent(this@PlayerActivity, "player_error", mapOf("url" to url))
                    }
                })
            }
        } catch (e: Exception) {
            showToast("Oynatıcı başlatılamadı: ${e.message}")
            finish()
        }
    }

    private fun setupGestures() {
        setupGestureOverlay(leftOverlay, true)
        setupGestureOverlay(rightOverlay, false)
    }

    private fun setupGestureOverlay(view: View, isLeft: Boolean) {
        view.setOnTouchListener { v, event ->
            if (isLocked) {
                if (event.action == MotionEvent.ACTION_UP) showControls()
                return@setOnTouchListener true
            }
            val am = audioManager
            when (event.action) {
                MotionEvent.ACTION_DOWN -> {
                    gestureStartY = event.y; isGesture = false
                    gestureStartVolume = am?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: (maxVolume / 2)
                    gestureStartBrightness = currentBrightness
                    handler.removeCallbacks(hideControlsRunnable)
                    true
                }
                MotionEvent.ACTION_MOVE -> {
                    val dy = event.y - gestureStartY
                    if (abs(dy) > 40) {
                        isGesture = true
                        val pct = -dy / v.height.toFloat()
                        if (isLeft) adjustBrightness(pct) else adjustVolume(pct)
                    }
                    true
                }
                MotionEvent.ACTION_UP -> {
                    if (!isGesture) {
                        showControls()
                        val now = System.currentTimeMillis()
                        if (isLeft) {
                            tapCountLeft = if (now - lastTapLeft < 350) tapCountLeft + 1 else 1
                            lastTapLeft = now
                            if (tapCountLeft >= 2) {
                                tapCountLeft = 0
                                seekBy(-seekSeconds * 1000L)
                                showCenterInfo("◄◄ $seekSeconds sn")
                            }
                        } else {
                            tapCountRight = if (now - lastTapRight < 350) tapCountRight + 1 else 1
                            lastTapRight = now
                            if (tapCountRight >= 2) {
                                tapCountRight = 0
                                seekBy(seekSeconds * 1000L)
                                showCenterInfo("$seekSeconds sn ►►")
                            }
                        }
                    }
                    handler.removeCallbacks(hideOverlayRunnable)
                    handler.postDelayed(hideOverlayRunnable, 1500)
                    rescheduleHideControls()
                    true
                }
                else -> false
            }
        }
    }

    private fun adjustBrightness(pct: Float) {
        currentBrightness = (gestureStartBrightness + pct * 1.5f).coerceIn(0.01f, 1.0f)
        val lp = window.attributes; lp.screenBrightness = currentBrightness; window.attributes = lp
        val percent = (currentBrightness * 100).toInt()
        tvBrightness.text = "☀ $percent%"
        tvBrightness.visibility = View.VISIBLE
    }

    private fun adjustVolume(pct: Float) {
        val newVol = (gestureStartVolume + pct * maxVolume).toInt().coerceIn(0, maxVolume)
        audioManager?.setStreamVolume(AudioManager.STREAM_MUSIC, newVol, 0)
        val percent = (newVol * 100f / maxVolume).toInt()
        tvVolume.text = "🔊 $percent%"
        tvVolume.visibility = View.VISIBLE
    }

    private fun seekBy(ms: Long) {
        player?.let { it.seekTo((it.currentPosition + ms).coerceAtLeast(0L)) }
    }

    private fun applyFitMode() {
        val mode = when (fitMode) {
            1 -> AspectRatioFrameLayout.RESIZE_MODE_FILL
            2 -> AspectRatioFrameLayout.RESIZE_MODE_ZOOM
            else -> AspectRatioFrameLayout.RESIZE_MODE_FIT
        }
        playerView.resizeMode = mode
        val label = when (fitMode) { 1 -> "Doldur"; 2 -> "Zoom"; else -> "Sığdır" }
        showCenterInfo(label)
    }

    private fun togglePlayPause() {
        player?.let { if (it.isPlaying) it.pause() else it.play() }
    }

    private fun showCenterInfo(msg: String) {
        tvCenterInfo.text = msg; tvCenterInfo.visibility = View.VISIBLE
        handler.removeCallbacks(hideOverlayRunnable)
        handler.postDelayed(hideOverlayRunnable, 1500)
    }

    private fun showControls() {
        if (isLocked) {
            btnLock.visibility = View.VISIBLE
            handler.postDelayed({ btnLock.visibility = View.GONE }, 2000)
            return
        }
        isControlsVisible = true
        controlsBar.visibility = View.VISIBLE
        tvTitle.visibility = View.VISIBLE
        btnBack.visibility = View.VISIBLE
        scheduleHideControls()
    }

    private fun hideControls() {
        isControlsVisible = false
        controlsBar.visibility = View.GONE
        if (!isLocked) {
            tvTitle.visibility = View.GONE
            btnBack.visibility = View.GONE
        }
    }

    private fun scheduleHideControls() {
        handler.removeCallbacks(hideControlsRunnable)
        handler.postDelayed(hideControlsRunnable, 4000)
    }

    private fun rescheduleHideControls() {
        showControls()
        scheduleHideControls()
    }

    override fun dispatchKeyEvent(event: KeyEvent): Boolean {
        if (event.action == KeyEvent.ACTION_DOWN) {
            if (isLocked) { showControls(); return true }
            when (event.keyCode) {
                KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> {
                    if (!isControlsVisible) showControls() else togglePlayPause()
                    return true
                }
                KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_MEDIA_REWIND -> {
                    seekBy(-seekSeconds * 1000L); showCenterInfo("◄◄ $seekSeconds sn"); showControls(); return true
                }
                KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_MEDIA_FAST_FORWARD -> {
                    seekBy(seekSeconds * 1000L); showCenterInfo("$seekSeconds sn ►►"); showControls(); return true
                }
                KeyEvent.KEYCODE_DPAD_UP -> { adjustVolume(0.1f); return true }
                KeyEvent.KEYCODE_DPAD_DOWN -> { adjustVolume(-0.1f); return true }
                KeyEvent.KEYCODE_BACK -> { finish(); return true }
            }
        }
        return super.dispatchKeyEvent(event)
    }

    // ARKA PLANA GEÇİNCE DURDUR
    override fun onPause() {
        super.onPause()
        player?.pause()
    }

    // ÖN PLANA GELİNCE DEVAM ET (isteğe bağlı)
    override fun onResume() {
        super.onResume()
        // Otomatik devam istemiyorsan bu satırı kaldır:
        // player?.play()
    }

    override fun onStop() {
        super.onStop()
        player?.pause()
    }

    override fun onDestroy() {
        super.onDestroy()
        handler.removeCallbacksAndMessages(null)
        player?.release()
        player = null
    }

    private fun showToast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
}
