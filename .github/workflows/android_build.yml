        # ---------- UTILS (Prefs + Ads + RemoteConfig + Logger + Lang basit) ----------
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import $PACKAGE_NAME.models.AccountProfile
        import org.json.JSONArray
        import org.json.JSONObject

        class Prefs(ctx: Context) {
            private val appContext = ctx.applicationContext
            private val p = appContext.getSharedPreferences("EP_Prefs", 0)

            private fun loadArray(): JSONArray {
                val s = p.getString("accounts_json", "[]") ?: "[]"
                return JSONArray(s)
            }

            private fun saveArray(arr: JSONArray) {
                p.edit().putString("accounts_json", arr.toString()).apply()
            }

            fun createXtreamAccount(name: String, dns: String, u: String, ps: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "XTREAM")
                obj.put("dns", dns)
                obj.put("user", u)
                obj.put("pass", ps)
                obj.put("m3u", "")

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun createM3uAccount(name: String, m3u: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "M3U")
                obj.put("dns", "")
                obj.put("user", "")
                obj.put("pass", "")
                obj.put("m3u", m3u)

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun getAccounts(): List<AccountProfile> {
                val arr = loadArray()
                val list = ArrayList<AccountProfile>()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null) {
                        val id = o.optInt("id", 0)
                        val name = o.optString("name", "Hesap " + i)
                        val type = o.optString("type", "XTREAM")
                        val dns = o.optString("dns", null)
                        val user = o.optString("user", null)
                        val pass = o.optString("pass", null)
                        val m3u = o.optString("m3u", null)
                        list.add(AccountProfile(id, name, type, dns, user, pass, m3u))
                    }
                    i++
                }
                return list
            }

            fun deleteAccount(id: Int) {
                val arr = loadArray()
                val newArr = JSONArray()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null && o.optInt("id", 0) != id) newArr.put(o)
                    i++
                }
                saveArray(newArr)

                val activeId = p.getInt("active_id", -1)
                if (activeId == id) {
                    val remaining = getAccounts()
                    val newActive = if (remaining.isNotEmpty()) remaining[0].id else -1
                    p.edit().putInt("active_id", newActive).apply()
                }
            }

            fun setActive(id: Int) { p.edit().putInt("active_id", id).apply() }

            fun getActive(): AccountProfile? {
                val all = getAccounts()
                if (all.isEmpty()) return null
                val activeId = p.getInt("active_id", -1)
                if (activeId <= 0) return all[0]
                return all.find { it.id == activeId } ?: all[0]
            }

            fun setLastScreen(screen: String) { p.edit().putString("last_screen", screen).apply() }
            fun getLastScreen(): String = p.getString("last_screen", "LOGIN") ?: "LOGIN"

            fun setLastMode(mode: String) { p.edit().putString("last_mode", mode).apply() }
            fun getLastMode(): String = p.getString("last_mode", "LIVE") ?: "LIVE"
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/utils/RemoteConfig.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import android.util.Log
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import $PACKAGE_NAME.R

        object RemoteConfig {
            private const val TAG = "RemoteConfig"
            private const val CONFIG_URL = "https://creatorapp24.com/erdin/api/config.php"

            @Volatile private var initialized = false
            @Volatile private var bannerId: String? = null
            @Volatile private var interstitialId: String? = null
            @Volatile private var channelInterval: Int = 4

            fun init(context: Context) {
                if (initialized) return
                synchronized(this) {
                    if (initialized) return
                    initialized = true
                    Thread {
                        try {
                            val conn = (URL(CONFIG_URL).openConnection() as HttpURLConnection).apply {
                                connectTimeout = 8000
                                readTimeout = 8000
                                requestMethod = "GET"
                            }
                            if (conn.responseCode != HttpURLConnection.HTTP_OK) return@Thread
                            val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                            val obj = JSONObject(body)
                            val ads = obj.optJSONObject("ads") ?: obj
                            bannerId = ads.optString("admob_banner_id", null)
                            interstitialId = ads.optString("admob_interstitial_id", null)
                            val interval = ads.optInt("channel_interval", 0)
                            if (interval > 0) channelInterval = interval
                        } catch (e: Exception) {
                            Log.w(TAG, "Config load failed: " + (e.message ?: ""))
                        }
                    }.start()
                }
            }

            fun getBannerId(context: Context): String {
                init(context)
                return bannerId ?: context.getString(R.string.admob_banner_test)
            }

            fun getInterstitialId(context: Context): String {
                init(context)
                return interstitialId ?: context.getString(R.string.admob_interstitial_test)
            }

            fun getChannelInterval(context: Context, def: Int): Int {
                init(context)
                return if (channelInterval > 0) channelInterval else def
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/utils/AdsHelper.kt
        package $PACKAGE_NAME.utils

        import android.app.Activity
        import android.content.Context
        import com.google.android.gms.ads.AdRequest
        import com.google.android.gms.ads.AdView
        import com.google.android.gms.ads.MobileAds
        import com.google.android.gms.ads.interstitial.InterstitialAd
        import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback
        import com.google.android.gms.ads.LoadAdError

        object AdsHelper {
            @Volatile private var initialized = false
            private var interstitial: InterstitialAd? = null
            private var clickCount = 0
            var CHANNEL_INTERVAL = 4

            fun init(context: Context) {
                if (!initialized) {
                    synchronized(this) {
                        if (!initialized) {
                            MobileAds.initialize(context.applicationContext) {}
                            initialized = true
                        }
                    }
                }
                RemoteConfig.init(context)
                CHANNEL_INTERVAL = RemoteConfig.getChannelInterval(context, CHANNEL_INTERVAL)
            }

            fun loadBanner(adView: AdView?) {
                if (adView == null) return
                try { adView.adUnitId = RemoteConfig.getBannerId(adView.context) } catch (_: Exception) {}
                adView.loadAd(AdRequest.Builder().build())
            }

            fun loadInterstitial(context: Context) {
                val adUnitId = RemoteConfig.getInterstitialId(context)
                InterstitialAd.load(
                    context,
                    adUnitId,
                    AdRequest.Builder().build(),
                    object : InterstitialAdLoadCallback() {
                        override fun onAdLoaded(ad: InterstitialAd) { interstitial = ad }
                        override fun onAdFailedToLoad(error: LoadAdError) { interstitial = null }
                    }
                )
            }

            fun maybeShowOnClick(activity: Activity, onContinue: () -> Unit) {
                clickCount++
                val ad = interstitial
                if (ad != null && CHANNEL_INTERVAL > 0 && (clickCount % CHANNEL_INTERVAL == 0)) {
                    ad.show(activity)
                    interstitial = null
                    loadInterstitial(activity)
                    onContinue()
                } else onContinue()
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/utils/RemoteLogger.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import android.os.Build
        import android.provider.Settings
        import android.util.Log
        import java.net.HttpURLConnection
        import java.net.URL
        import java.net.URLEncoder

        object RemoteLogger {
            private const val TAG = "RemoteLogger"
            private const val EVENT_URL = "https://creatorapp24.com/erdin/api/event.php"

            fun sendEvent(context: Context, type: String, data: Map<String, String>) {
                Thread {
                    try {
                        val appContext = context.applicationContext
                        val deviceId = Settings.Secure.getString(appContext.contentResolver, Settings.Secure.ANDROID_ID) ?: "unknown"
                        val pkg = appContext.packageName
                        val verName = try { appContext.packageManager.getPackageInfo(pkg, 0).versionName ?: "1.0" } catch (_: Exception) { "1.0" }

                        val base = HashMap<String, String>()
                        base["type"] = type
                        base["device_id"] = deviceId
                        base["package"] = pkg
                        base["version"] = verName
                        base["brand"] = Build.BRAND ?: ""
                        base["model"] = Build.MODEL ?: ""
                        base.putAll(data)

                        val body = buildString {
                            var first = true
                            for ((k, v) in base) {
                                if (!first) append("&") else first = false
                                append(URLEncoder.encode(k, "UTF-8"))
                                append("=")
                                append(URLEncoder.encode(v, "UTF-8"))
                            }
                        }

                        val conn = (URL(EVENT_URL).openConnection() as HttpURLConnection).apply {
                            connectTimeout = 8000
                            readTimeout = 8000
                            requestMethod = "POST"
                            doOutput = true
                            setRequestProperty("Content-Type", "application/x-www-form-urlencoded")
                        }
                        conn.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                        if (conn.responseCode != HttpURLConnection.HTTP_OK) Log.w(TAG, "Event HTTP code: " + conn.responseCode)
                    } catch (e: Exception) {
                        Log.w(TAG, "sendEvent failed: " + (e.message ?: ""))
                    }
                }.start()
            }
        }
        EOF

        # ---------- ADAPTERS ----------
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/SimpleListAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R

        class SimpleListAdapter(
            private var items: List<String>,
            private val onClick: (Int) -> Unit
        ) : RecyclerView.Adapter<SimpleListAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtName)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context).inflate(R.layout.item_row, parent, false)
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                holder.txt.text = items[position]
                holder.itemView.setOnClickListener { onClick(position) }
            }

            override fun getItemCount(): Int = items.size

            fun submit(newItems: List<String>) {
                items = newItems
                notifyDataSetChanged()
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/AccountsAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.content.Context
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.BaseAdapter
        import android.widget.ImageButton
        import android.widget.TextView
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.models.AccountProfile

        class AccountsAdapter(
            private val ctx: Context,
            private val items: MutableList<AccountProfile>,
            private val onOpen: (AccountProfile) -> Unit,
            private val onDelete: (AccountProfile) -> Unit
        ) : BaseAdapter() {

            override fun getCount(): Int = items.size
            override fun getItem(position: Int): Any = items[position]
            override fun getItemId(position: Int): Long = items[position].id.toLong()

            override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                val v = convertView ?: LayoutInflater.from(ctx).inflate(R.layout.item_account, parent, false)

                val txtName = v.findViewById<TextView>(R.id.tvAccountName)
                val txtType = v.findViewById<TextView>(R.id.tvAccountType)
                val btnDelete = v.findViewById<ImageButton>(R.id.btnDeleteAccount)

                val item = items[position]
                txtName.text = item.name
                txtType.text = if (item.type == "M3U") "M3U" else "Xtream"

                v.setOnClickListener { onOpen(item) }
                btnDelete.setOnClickListener { onDelete(item) }
                return v
            }

            fun update(newItems: List<AccountProfile>) {
                items.clear()
                items.addAll(newItems)
                notifyDataSetChanged()
            }
        }
        EOF

        # ---------- ACTIVITIES ----------
        # LOGIN (aynı mantık: hesap ekle / kayıtlardan seç)
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.View
        import android.widget.*
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.content.ContextCompat
        import com.google.android.gms.ads.AdView
        import $PACKAGE_NAME.adapters.AccountsAdapter
        import $PACKAGE_NAME.models.AccountProfile
        import $PACKAGE_NAME.utils.AdsHelper
        import $PACKAGE_NAME.utils.Prefs
        import $PACKAGE_NAME.utils.RemoteLogger

        class LoginActivity : AppCompatActivity() {

            private var isXtream = true
            private var accountsAdapter: AccountsAdapter? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)

                val prefs = Prefs(this)

                val lastScreen = prefs.getLastScreen()
                val activeStartup = prefs.getActive()
                if (lastScreen == "CONTENT" && activeStartup != null) {
                    startActivity(Intent(this, ContentActivity::class.java))
                    finish()
                    return
                }

                RemoteLogger.sendEvent(this, "screen_login_open", emptyMap())

                AdsHelper.init(this)
                AdsHelper.loadBanner(findViewById<AdView>(R.id.adViewTopLogin))
                AdsHelper.loadInterstitial(this)

                val etName = findViewById<EditText>(R.id.etName)
                val etDns = findViewById<EditText>(R.id.etDns)
                val etUser = findViewById<EditText>(R.id.etUser)
                val etPass = findViewById<EditText>(R.id.etPass)
                val etM3u = findViewById<EditText>(R.id.etM3u)

                val layoutXtream = findViewById<View>(R.id.layoutXtream)
                val layoutM3u = findViewById<View>(R.id.layoutM3u)

                val cardXtream = findViewById<View>(R.id.cardXtream)
                val cardM3u = findViewById<View>(R.id.cardM3u)

                fun updateTypeUI() {
                    if (isXtream) {
                        layoutXtream.visibility = View.VISIBLE
                        layoutM3u.visibility = View.GONE
                        cardXtream.alpha = 1f
                        cardM3u.alpha = 0.55f
                    } else {
                        layoutXtream.visibility = View.GONE
                        layoutM3u.visibility = View.VISIBLE
                        cardM3u.alpha = 1f
                        cardXtream.alpha = 0.55f
                    }
                }

                cardXtream.setOnClickListener { isXtream = true; updateTypeUI() }
                cardM3u.setOnClickListener { isXtream = false; updateTypeUI() }
                updateTypeUI()

                val lvAccounts = findViewById<ListView>(R.id.lvAccounts)
                fun refreshList() {
                    val accounts: MutableList<AccountProfile> = prefs.getAccounts().toMutableList()

                    if (accountsAdapter == null) {
                        accountsAdapter = AccountsAdapter(
                            this,
                            accounts,
                            onOpen = { acc ->
                                prefs.setActive(acc.id)
                                prefs.setLastScreen("CONTENT")
                                startActivity(Intent(this, ContentActivity::class.java))
                            },
                            onDelete = { acc ->
                                val dialog = AlertDialog.Builder(this)
                                    .setTitle("Hesabı Sil")
                                    .setMessage("Hesap silinsin mi? " + acc.name)
                                    .setPositiveButton("Evet") { _, _ ->
                                        prefs.deleteAccount(acc.id)
                                        refreshList()
                                    }
                                    .setNegativeButton("Hayır", null)
                                    .create()

                                dialog.setOnShowListener {
                                    dialog.getButton(AlertDialog.BUTTON_POSITIVE)
                                        ?.setTextColor(ContextCompat.getColor(this, R.color.accent_green))
                                    dialog.getButton(AlertDialog.BUTTON_NEGATIVE)
                                        ?.setTextColor(ContextCompat.getColor(this, R.color.error_red))
                                }
                                dialog.show()
                            }
                        )
                        lvAccounts.adapter = accountsAdapter
                    } else {
                        accountsAdapter?.update(accounts)
                    }
                }
                refreshList()

                findViewById<Button>(R.id.btnAddAccount).setOnClickListener {
                    val name = etName.text.toString().trim().ifEmpty { "Hesap" }

                    if (isXtream) {
                        val d = etDns.text.toString().trim()
                        val u = etUser.text.toString().trim()
                        val p = etPass.text.toString().trim()
                        if (d.isEmpty() || u.isEmpty()) {
                            Toast.makeText(this, "Xtream URL ve kullanıcı adı zorunlu.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createXtreamAccount(name, d, u, p)
                        RemoteLogger.sendEvent(this, "account_xtream_created", mapOf("name" to name, "dns" to d, "user" to u))
                        Toast.makeText(this, "Xtream hesabı eklendi. Alttan seçerek devam edin.", Toast.LENGTH_SHORT).show()
                    } else {
                        val m = etM3u.text.toString().trim()
                        if (m.isEmpty()) {
                            Toast.makeText(this, "M3U URL boş olamaz.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createM3uAccount(name, m)
                        RemoteLogger.sendEvent(this, "account_m3u_created", mapOf("name" to name, "m3u_prefix" to m.take(160)))
                        Toast.makeText(this, "M3U hesabı eklendi. Alttan seçerek devam edin.", Toast.LENGTH_SHORT).show()
                    }

                    etName.setText(""); etDns.setText(""); etUser.setText(""); etPass.setText(""); etM3u.setText("")
                    refreshList()
                }
            }
        }
