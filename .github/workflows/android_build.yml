                <EditText android:id="@+id/etPort"
                    android:layout_width="88dp" android:layout_height="match_parent"
                    android:hint=":8080"
                    android:background="@drawable/bg_input"
                    android:gravity="center"
                    android:textColor="@color/text_primary"
                    android:textColorHint="@color/text_hint"
                    android:textSize="13sp" android:inputType="number"/>
            </LinearLayout>

            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="GİRİŞ BİLGİLERİ" android:textColor="@color/text_secondary"
                android:textSize="11sp" android:letterSpacing="0.08"
                android:layout_marginBottom="6dp"/>
            <EditText android:id="@+id/etUser"
                android:layout_width="match_parent" android:layout_height="52dp"
                android:hint="@string/hint_username"
                android:background="@drawable/bg_input"
                android:paddingHorizontal="16dp"
                android:textColor="@color/text_primary"
                android:textColorHint="@color/text_hint"
                android:textSize="15sp"
                android:inputType="textNoSuggestions"
                android:layout_marginBottom="12dp"/>
            <EditText android:id="@+id/etPass"
                android:layout_width="match_parent" android:layout_height="52dp"
                android:hint="@string/hint_password"
                android:background="@drawable/bg_input"
                android:paddingHorizontal="16dp"
                android:textColor="@color/text_primary"
                android:textColorHint="@color/text_hint"
                android:textSize="15sp"
                android:inputType="textVisiblePassword"/>
        </LinearLayout>

        <LinearLayout
            android:id="@+id/formM3u"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:orientation="vertical" android:visibility="gone">

            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="LİSTE ADI" android:textColor="@color/text_secondary"
                android:textSize="11sp" android:letterSpacing="0.08"
                android:layout_marginBottom="6dp"/>
            <EditText android:id="@+id/etM3uName"
                android:layout_width="match_parent" android:layout_height="52dp"
                android:hint="@string/hint_portal_name"
                android:background="@drawable/bg_input"
                android:paddingHorizontal="16dp"
                android:textColor="@color/text_primary"
                android:textColorHint="@color/text_hint"
                android:textSize="15sp"
                android:layout_marginBottom="16dp"/>

            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="M3U URL" android:textColor="@color/text_secondary"
                android:textSize="11sp" android:letterSpacing="0.08"
                android:layout_marginBottom="6dp"/>
            <EditText android:id="@+id/etM3u"
                android:layout_width="match_parent" android:layout_height="52dp"
                android:hint="@string/hint_m3u"
                android:background="@drawable/bg_input"
                android:paddingHorizontal="16dp"
                android:textColor="@color/text_primary"
                android:textColorHint="@color/text_hint"
                android:textSize="13sp" android:inputType="textUri"/>
        </LinearLayout>

        <!-- Giriş Butonu -->
        <Button
            android:id="@+id/btnLogin"
            android:layout_width="match_parent" android:layout_height="56dp"
            android:text="Giriş Yap"
            android:textStyle="bold" android:textColor="@color/white" android:textSize="16sp"
            android:background="@drawable/bg_primary_btn"
            android:layout_marginTop="20dp" android:focusable="true"
            style="@style/Widget.MaterialComponents.Button.UnelevatedButton"/>

        <!-- Kayıtlı Hesaplar -->
        <View android:layout_width="match_parent" android:layout_height="1dp"
            android:background="@color/divider" android:layout_marginVertical="28dp"/>

        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
            android:orientation="horizontal" android:gravity="center_vertical"
            android:layout_marginBottom="12dp">
            <TextView android:layout_width="0dp" android:layout_height="wrap_content"
                android:layout_weight="1"
                android:text="Kayıtlı Portallar"
                android:textColor="@color/text_primary"
                android:textSize="15sp" android:textStyle="bold"/>
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="Seçmek için dokun"
                android:textColor="@color/text_secondary" android:textSize="12sp"/>
        </LinearLayout>

        <ListView
            android:id="@+id/lvAccounts"
            android:layout_width="match_parent" android:layout_height="300dp"
            android:divider="@color/divider" android:dividerHeight="1dp"/>

        <TextView
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:text="Bilgileriniz yalnızca cihazınızda saklanır."
            android:textColor="@color/text_disabled"
            android:textSize="12sp" android:gravity="center"
            android:layout_marginTop="28dp"/>
    </LinearLayout>
</ScrollView>
