package com.emin.xtream.player.utils

import android.content.Context
import com.emin.xtream.player.models.Portal
import com.emin.xtream.player.models.ResumeItem
import org.json.JSONArray
import org.json.JSONObject

class Prefs(ctx: Context) {
    private val sp = ctx.applicationContext.getSharedPreferences("EX_Prefs", 0)

    // ─── Portal CRUD ─────────────────────────────────────────────────
    private fun loadPortals(): JSONArray {
        return try { JSONArray(sp.getString("portals", "[]") ?: "[]") } catch (e: Exception) { JSONArray() }
    }
    private fun savePortals(arr: JSONArray) = sp.edit().putString("portals", arr.toString()).apply()

    fun addXtreamPortal(name: String, server: String, user: String, pass: String): Int {
        val id = sp.getInt("next_id", 1)
        val o = JSONObject().apply {
            put("id", id); put("name", name); put("type", "XTREAM")
            put("server", server); put("username", user); put("password", pass); put("m3u_url", "")
        }
        val arr = loadPortals(); arr.put(o); savePortals(arr)
        sp.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
        return id
    }

    fun addM3uPortal(name: String, url: String): Int {
        val id = sp.getInt("next_id", 1)
        val o = JSONObject().apply {
            put("id", id); put("name", name); put("type", "M3U")
            put("server", ""); put("username", ""); put("password", ""); put("m3u_url", url)
        }
        val arr = loadPortals(); arr.put(o); savePortals(arr)
        sp.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
        return id
    }

    fun getPortals(): List<Portal> {
        val arr = loadPortals(); val list = mutableListOf<Portal>()
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            list.add(Portal(
                o.optInt("id"), o.optString("name", "Portal $i"),
                o.optString("type", "XTREAM"),
                o.optString("server").takeIf { it.isNotEmpty() },
                o.optString("username").takeIf { it.isNotEmpty() },
                o.optString("password").takeIf { it.isNotEmpty() },
                o.optString("m3u_url").takeIf { it.isNotEmpty() }
            ))
        }
        return list
    }

    fun deletePortal(id: Int) {
        val arr = loadPortals(); val newArr = JSONArray()
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            if (o.optInt("id") != id) newArr.put(o)
        }
        savePortals(newArr)
        if (sp.getInt("active_id", -1) == id) sp.edit().putInt("active_id", -1).apply()
    }

    fun setActivePortal(id: Int) = sp.edit().putInt("active_id", id).apply()
    fun clearActivePortal() = sp.edit().putInt("active_id", -1).apply()
    fun getActivePortal(): Portal? {
        val id = sp.getInt("active_id", -1); if (id < 0) return null
        return getPortals().find { it.id == id }
    }

    // ─── Resume ──────────────────────────────────────────────────────
    private fun loadResume(): JSONArray {
        return try { JSONArray(sp.getString("resume", "[]") ?: "[]") } catch (e: Exception) { JSONArray() }
    }

    fun saveResume(item: ResumeItem) {
        val arr = loadResume(); val newArr = JSONArray()
        newArr.put(JSONObject().apply {
            put("id", item.id); put("kind", item.kind); put("name", item.name)
            put("thumb", item.thumbnailUrl ?: ""); put("url", item.streamUrl)
            put("pos", item.positionSec); put("dur", item.durationSec); put("ts", item.updatedAt)
        })
        for (i in 0 until minOf(arr.length(), 19)) newArr.put(arr.getJSONObject(i))
        sp.edit().putString("resume", newArr.toString()).apply()
    }

    fun getResume(): List<ResumeItem> {
        val arr = loadResume(); val list = mutableListOf<ResumeItem>()
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            list.add(ResumeItem(
                o.optString("id"), o.optString("kind"), o.optString("name"),
                o.optString("thumb").takeIf { it.isNotEmpty() }, o.optString("url"),
                o.optLong("pos"), o.optLong("dur"), o.optLong("ts")
            ))
        }
        return list
    }

    // ─── Favoriler ───────────────────────────────────────────────────
    private fun favKey() = "fav_${sp.getInt("active_id", 0)}"
    fun getFavorites(): Set<String> = sp.getStringSet(favKey(), emptySet()) ?: emptySet()
    fun toggleFavorite(key: String): Boolean {
        val set = getFavorites().toMutableSet()
        return if (set.contains(key)) { set.remove(key); sp.edit().putStringSet(favKey(), set).apply(); false }
        else { set.add(key); sp.edit().putStringSet(favKey(), set).apply(); true }
    }
    fun isFavorite(key: String) = getFavorites().contains(key)

    // ─── Diğer ayarlar ───────────────────────────────────────────────
    fun getSeekSec(): Int = sp.getInt("seek_sec", 10)
    fun setSeekSec(v: Int) = sp.edit().putInt("seek_sec", v).apply()
    fun getActiveServer(): String = getActivePortal()?.server?.trimEnd('/') ?: ""
    fun getActiveUser(): String = getActivePortal()?.username ?: ""
    fun getActivePass(): String = getActivePortal()?.password ?: ""
}
