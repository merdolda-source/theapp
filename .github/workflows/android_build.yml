name: ErdinPlayer Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android_build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depo Cekme
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Keystore hazirla (secret varsa)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Gradle ile derle (Unit testler dahil)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: AAB Yukle
        uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Ozet
        if: always()
        run: |
          echo '### ErdinPlayer build' >> $GITHUB_STEP_SUMMARY
          echo 'Gercek proje dosyalari app/ altinda; bu workflow artik kod uretmiyor, dogrudan derliyor.' >> $GITHUB_STEP_SUMMARY
