        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-feature android:name="android.software.leanback" android:required="false" />

            <application
                android:theme="@style/Theme.ErdinPlayer"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:usesCleartextTraffic="true">

                <meta-data
                    android:name="com.google.android.gms.ads.APPLICATION_ID"
                    android:value="@string/admob_app_id" />

                <activity
                    android:name=".LoginActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                    </intent-filter>
                </activity>

                <activity android:name=".ContentActivity" />
                <activity android:name=".SeriesDetailActivity" />

                <activity
                    android:name=".PlayerActivity"
                    android:screenOrientation="fullSensor"
                    android:configChanges="orientation|screenSize|keyboardHidden|layoutDirection|screenLayout|smallestScreenSize" />
            </application>
        </manifest>
        EOF

    - name: 4) Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5) Build APK + AAB (Release / Signed)
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon
        gradle bundleRelease --no-daemon

    - name: 6) APK'yi GitHub Artifact Olarak Yükle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Ultra-APK
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk

    - name: 7) AAB'yi GitHub Artifact Olarak Yükle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Ultra-AAB
        path: ErdinPlayer/app/build/outputs/bundle/release/*.aab

    - name: 8) Artifact URL'lerini Göster
      run: |
        echo "====================================="
        echo " 📦 APK Artifact URL (GitHub):"
        echo "${{ steps.upload_apk.outputs.artifact-url }}"
        echo "-------------------------------------"
        echo " 📦 AAB Artifact URL (GitHub):"
        echo "${{ steps.upload_aab.outputs.artifact-url }}"
        echo "====================================="

        echo "### ErdinPlayer Pro Çıktılar" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [APK'yi buradan indir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [AAB'yi buradan indir](${{ steps.upload_aab.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
