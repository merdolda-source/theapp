name: Generate and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek (Scripti Al)
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🏗️ Uygulama Oluşturuluyor (Script Çalıştırılıyor)
      run: |
        echo "⚙️ Script aranıyor..."
        # Klasördeki .sh uzantılı dosyayı bul ve çalıştır
        SCRIPT_FILE=$(find . -maxdepth 1 -name "*.sh" | head -n 1)
        
        if [ -z "$SCRIPT_FILE" ]; then
          echo "❌ Script bulunamadı! Lütfen 'create_app.sh' dosyasının yüklü olduğundan emin ol."
          exit 1
        fi
        
        echo "✅ Script bulundu: $SCRIPT_FILE"
        chmod +x "$SCRIPT_FILE"
        bash "$SCRIPT_FILE"
        
        echo "📂 Oluşturulan dosyalar kontrol ediliyor..."
        ls -R

    - name: 🛠️ Eksik Dosyaları Tamamla ve Derle
      run: |
        # Oluşturulan proje klasörünü bul (build.gradle içeren klasör)
        BUILD_FILE=$(find . -maxdepth 2 -name "build.gradle" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_FILE")
        
        echo "🏠 Proje Ana Dizini: $PROJECT_ROOT"
        
        # settings.gradle eksikse oluştur (Önceki script hatası için yama)
        if [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
           echo "include ':app'" > "$PROJECT_ROOT/settings.gradle"
           echo "✅ settings.gradle oluşturuldu."
        fi

        # Gradle'a çalıştırma izni ver
        chmod +x "$PROJECT_ROOT/gradlew"
        
        # Derleme Başlasın
        cd "$PROJECT_ROOT"
        bash ./gradlew assembleRelease

    - name: 📦 APK'yı Paketle ve Sun
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-release
        path: |
          **/build/outputs/apk/release/*.apk
          **/app-release.apk
