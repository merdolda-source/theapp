        # -----------------------------
        # PREFS (lang + accounts)
        # -----------------------------
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/Prefs.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import $PACKAGE_NAME.models.AccountProfile
        import org.json.JSONArray
        import org.json.JSONObject

        class Prefs(ctx: Context) {
            private val appContext = ctx.applicationContext
            private val p = appContext.getSharedPreferences("EP_Prefs", 0)

            private fun loadArray(): JSONArray {
                val s = p.getString("accounts_json", "[]") ?: "[]"
                return JSONArray(s)
            }

            private fun saveArray(arr: JSONArray) {
                p.edit().putString("accounts_json", arr.toString()).apply()
            }

            fun createXtreamAccount(name: String, dns: String, u: String, ps: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "XTREAM")
                obj.put("dns", dns)
                obj.put("user", u)
                obj.put("pass", ps)
                obj.put("m3u", "")

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun createM3uAccount(name: String, m3u: String): Int {
                val id = p.getInt("next_id", 1)
                val obj = JSONObject()
                obj.put("id", id)
                obj.put("name", name)
                obj.put("type", "M3U")
                obj.put("dns", "")
                obj.put("user", "")
                obj.put("pass", "")
                obj.put("m3u", m3u)

                val arr = loadArray()
                arr.put(obj)
                saveArray(arr)

                p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
                return id
            }

            fun getAccounts(): List<AccountProfile> {
                val arr = loadArray()
                val list = ArrayList<AccountProfile>()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null) {
                        val id = o.optInt("id", 0)
                        val name = o.optString("name", "Account " + i)
                        val type = o.optString("type", "XTREAM")
                        val dns = o.optString("dns", null)
                        val user = o.optString("user", null)
                        val pass = o.optString("pass", null)
                        val m3u = o.optString("m3u", null)
                        list.add(AccountProfile(id, name, type, dns, user, pass, m3u))
                    }
                    i++
                }
                return list
            }

            fun deleteAccount(id: Int) {
                val arr = loadArray()
                val newArr = JSONArray()
                var i = 0
                while (i < arr.length()) {
                    val o = arr.optJSONObject(i)
                    if (o != null && o.optInt("id", 0) != id) newArr.put(o)
                    i++
                }
                saveArray(newArr)

                val activeId = p.getInt("active_id", -1)
                if (activeId == id) {
                    val remaining = getAccounts()
                    val newActive = if (remaining.isNotEmpty()) remaining[0].id else -1
                    p.edit().putInt("active_id", newActive).apply()
                }
            }

            fun setActive(id: Int) { p.edit().putInt("active_id", id).apply() }

            fun getActive(): AccountProfile? {
                val all = getAccounts()
                if (all.isEmpty()) return null
                val activeId = p.getInt("active_id", -1)
                if (activeId <= 0) return all[0]
                return all.find { it.id == activeId } ?: all[0]
            }

            fun setLastScreen(screen: String) { p.edit().putString("last_screen", screen).apply() }
            fun getLastScreen(): String = p.getString("last_screen", "LOGIN") ?: "LOGIN"

            fun setLastMode(mode: String) { p.edit().putString("last_mode", mode).apply() }
            fun getLastMode(): String = p.getString("last_mode", "LIVE") ?: "LIVE"

            fun setLang(lang: String) { p.edit().putString("lang", lang).apply() }
            fun getLang(): String = p.getString("lang", "en") ?: "en"
        }
        EOF

        # -----------------------------
        # LOCALE (GLOBAL)
        # -----------------------------
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/LocaleManager.kt
        package $PACKAGE_NAME.utils

        import android.content.Context
        import android.content.res.Configuration
        import java.util.Locale

        object LocaleManager {

            fun wrap(ctx: Context, lang: String): Context {
                val locale = Locale(lang)
                Locale.setDefault(locale)

                val config = Configuration(ctx.resources.configuration)
                config.setLocale(locale)
                config.setLayoutDirection(locale)

                return ctx.createConfigurationContext(config)
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/BaseActivity.kt
        package $PACKAGE_NAME

        import android.content.Context
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.utils.Prefs
        import $PACKAGE_NAME.utils.LocaleManager

        open class BaseActivity : AppCompatActivity() {
            override fun attachBaseContext(newBase: Context) {
                val prefs = Prefs(newBase)
                val lang = prefs.getLang()
                super.attachBaseContext(LocaleManager.wrap(newBase, lang))
            }
        }
        EOF

        # -----------------------------
        # ADAPTER (TV focusable row)
        # -----------------------------
        cat <<EOF > app/src/main/java/$PATH_NAME/adapters/RowAdapter.kt
        package $PACKAGE_NAME.adapters

        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R

        class RowAdapter(
            private val items: List<String>,
            private val onClick: (Int) -> Unit
        ) : RecyclerView.Adapter<RowAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtRow)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context).inflate(R.layout.item_row, parent, false)
                v.isFocusable = true
                v.isFocusableInTouchMode = true
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                holder.txt.text = items[position]
                holder.itemView.setOnClickListener { onClick(position) }
            }

            override fun getItemCount(): Int = items.size
        }
        EOF

        # -----------------------------
        # LOGIN (language: click -> dialog EN/TR)
        # -----------------------------
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AlertDialog
        import com.google.android.gms.ads.AdView
        import $PACKAGE_NAME.adapters.AccountsAdapter
        import $PACKAGE_NAME.models.AccountProfile
        import $PACKAGE_NAME.utils.AdsHelper
        import $PACKAGE_NAME.utils.Prefs

        class LoginActivity : BaseActivity() {

            private var isXtream = true
            private var accountsAdapter: AccountsAdapter? = null

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)

                val prefs = Prefs(this)

                val lastScreen = prefs.getLastScreen()
                val activeStartup = prefs.getActive()
                if (lastScreen == "CONTENT" && activeStartup != null) {
                    startActivity(Intent(this, ContentActivity::class.java))
                    finish()
                    return
                }

                AdsHelper.init(this)
                val adTop = findViewById<AdView>(R.id.adViewTopLogin)
                AdsHelper.loadBanner(adTop)
                AdsHelper.loadInterstitial(this)

                val layoutLang = findViewById<LinearLayout>(R.id.layoutLang)
                val tvLang = findViewById<TextView>(R.id.tvLangLine)

                fun updateLangLine() {
                    val lang = prefs.getLang()
                    tvLang.text = if (lang == "tr") "TR" else "EN"
                }
                updateLangLine()

                layoutLang.setOnClickListener {
                    val items = arrayOf(getString(R.string.lang_en), getString(R.string.lang_tr))
                    AlertDialog.Builder(this)
                        .setTitle(getString(R.string.lang_title))
                        .setItems(items) { _, which ->
                            val newLang = if (which == 1) "tr" else "en"
                            prefs.setLang(newLang)
                            // restart to apply globally
                            val i = intent
                            finish()
                            startActivity(i)
                        }
                        .show()
                }

                val etName = findViewById<EditText>(R.id.etName)
                val etDns = findViewById<EditText>(R.id.etDns)
                val etUser = findViewById<EditText>(R.id.etUser)
                val etPass = findViewById<EditText>(R.id.etPass)
                val etM3u = findViewById<EditText>(R.id.etM3u)

                val layoutXtream = findViewById<LinearLayout>(R.id.layoutXtream)
                val layoutM3u = findViewById<LinearLayout>(R.id.layoutM3u)

                val cardXtream = findViewById<LinearLayout>(R.id.cardXtream)
                val cardM3u = findViewById<LinearLayout>(R.id.cardM3u)

                val btnAdd = findViewById<Button>(R.id.btnAddAccount)
                val lvAccounts = findViewById<ListView>(R.id.lvAccounts)

                fun updateTypeUI() {
                    if (isXtream) {
                        layoutXtream.visibility = android.view.View.VISIBLE
                        layoutM3u.visibility = android.view.View.GONE
                        cardXtream.alpha = 1f
                        cardM3u.alpha = 0.55f
                    } else {
                        layoutXtream.visibility = android.view.View.GONE
                        layoutM3u.visibility = android.view.View.VISIBLE
                        cardM3u.alpha = 1f
                        cardXtream.alpha = 0.55f
                    }
                }

                cardXtream.setOnClickListener { isXtream = true; updateTypeUI() }
                cardM3u.setOnClickListener { isXtream = false; updateTypeUI() }
                updateTypeUI()

                fun refreshList() {
                    val accounts: MutableList<AccountProfile> = prefs.getAccounts().toMutableList()
                    if (accountsAdapter == null) {
                        accountsAdapter = AccountsAdapter(
                            this,
                            accounts,
                            onOpen = { acc ->
                                prefs.setActive(acc.id)
                                prefs.setLastScreen("CONTENT")
                                startActivity(Intent(this, ContentActivity::class.java))
                                finish()
                            },
                            onDelete = { acc ->
                                AlertDialog.Builder(this)
                                    .setTitle("Delete")
                                    .setMessage("Delete \"" + acc.name + "\" ?")
                                    .setPositiveButton("Yes") { _, _ ->
                                        prefs.deleteAccount(acc.id); refreshList()
                                    }
                                    .setNegativeButton("No", null)
                                    .show()
                            }
                        )
                        lvAccounts.adapter = accountsAdapter
                    } else {
                        accountsAdapter?.update(accounts)
                    }
                }

                refreshList()

                btnAdd.setOnClickListener {
                    val name = etName.text.toString().trim()
                    val finalName = if (name.isNotEmpty()) name else "Account"

                    if (isXtream) {
                        val d = etDns.text.toString().trim()
                        val u = etUser.text.toString().trim()
                        val p = etPass.text.toString().trim()
                        if (d.isEmpty() || u.isEmpty()) {
                            Toast.makeText(this, "Xtream: url + user required", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createXtreamAccount(finalName, d, u, p)
                    } else {
                        val m = etM3u.text.toString().trim()
                        if (m.isEmpty()) {
                            Toast.makeText(this, "M3U cannot be empty", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createM3uAccount(finalName, m)
                    }

                    etName.setText("")
                    etDns.setText("")
                    etUser.setText("")
                    etPass.setText("")
                    etM3u.setText("")
                    refreshList()
                }
            }
        }
        EOF

        # -----------------------------
        # CONTENT (Drawer yok, LIST flow)
        # -----------------------------
        cat <<EOF > app/src/main/java/$PATH_NAME/ContentActivity.kt
        package $PACKAGE_NAME

        import android.content.Intent
        import android.os.Bundle
        import android.view.View
        import android.widget.ProgressBar
        import android.widget.TextView
        import android.widget.Toast
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import com.google.android.gms.ads.AdView
        import org.json.JSONArray
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale
        import $PACKAGE_NAME.adapters.RowAdapter
        import $PACKAGE_NAME.models.AccountProfile
        import $PACKAGE_NAME.models.Category
        import $PACKAGE_NAME.models.StreamItem
        import $PACKAGE_NAME.utils.AdsHelper
        import $PACKAGE_NAME.utils.Prefs

        class ContentActivity : BaseActivity() {

            private lateinit var prefs: Prefs
            private lateinit var rv: RecyclerView
            private lateinit var tvHeader: TextView
            private lateinit var tvSub: TextView
            private lateinit var tvAccount: TextView
            private lateinit var tvStatus: TextView
            private lateinit var pb: ProgressBar

            private var currentMode: String = "LIVE"
            private var activeAcc: AccountProfile? = null
            private var accountType: String = "XTREAM"

            private var categories: List<Category> = emptyList()
            private var streams: List<StreamItem> = emptyList()

            // navigation state
            private var level: Int = 0   // 0=categories, 1=items
            private var selectedCategoryId: String? = null
            private var selectedCategoryName: String = ""

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_content)

                prefs = Prefs(this)
                prefs.setLastScreen("CONTENT")

                AdsHelper.init(this)
                findViewById<AdView>(R.id.adViewTopContent)?.let { AdsHelper.loadBanner(it) }
                findViewById<AdView>(R.id.adViewBottomContent)?.let { AdsHelper.loadBanner(it) }
                AdsHelper.loadInterstitial(this)

                rv = findViewById(R.id.rvContent)
                tvHeader = findViewById(R.id.tvHeader)
                tvSub = findViewById(R.id.tvSub)
                tvAccount = findViewById(R.id.tvAccount)
                tvStatus = findViewById(R.id.tvStatus)
                pb = findViewById(R.id.pbLoading)

                rv.layoutManager = LinearLayoutManager(this)
                rv.isFocusable = true
                rv.descendantFocusability = View.FOCUS_AFTER_DESCENDANTS

                tvAccount.setOnClickListener {
                    startActivity(Intent(this, AccountActivity::class.java))
                }

                // header click: back in list hierarchy
                tvHeader.setOnClickListener {
                    if (level == 1) {
                        showCategories()
                    }
                }

                activeAcc = prefs.getActive()
                if (activeAcc == null) {
                    tvStatus.text = "No account. Add account first."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                accountType = activeAcc?.type ?: "XTREAM"
                currentMode = if (accountType == "M3U") "LIVE" else prefs.getLastMode()

                // mode title (tap changes mode on mobile, dpad enter works too)
                tvSub.setOnClickListener {
                    if (accountType == "M3U") return@setOnClickListener
                    val next = when (currentMode) {
                        "LIVE" -> "VOD"
                        "VOD" -> "SERIES"
                        else -> "LIVE"
                    }
                    currentMode = next
                    prefs.setLastMode(next)
                    fetchCategoriesAndStreams()
                }

                fetchCategoriesAndStreams()
            }

            private fun setHeaderTexts() {
                tvHeader.text = if (level == 0) getString(R.string.categories) else getString(R.string.back)
                tvSub.text = when (currentMode) {
                    "VOD" -> getString(R.string.movies)
                    "SERIES" -> getString(R.string.series)
                    else -> getString(R.string.live_tv)
                }
            }

            private fun fetchCategoriesAndStreams() {
                setHeaderTexts()

                val acc = activeAcc ?: return

                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE

                if (acc.type == "M3U") {
                    val m3uUrl = acc.m3u?.trim() ?: ""
                    if (m3uUrl.isEmpty()) {
                        pb.visibility = View.GONE
                        tvStatus.text = "M3U link missing."
                        tvStatus.visibility = View.VISIBLE
                        return
                    }

                    Thread {
                        try {
                            val result = fetchM3u(m3uUrl)
                            val cats = result.first
                            val streamsList = result.second
                            runOnUiThread {
                                pb.visibility = View.GONE
                                categories = cats
                                streams = streamsList
                                showCategories()
                            }
                        } catch (e: Exception) {
                            runOnUiThread {
                                pb.visibility = View.GONE
                                tvStatus.text = "M3U failed: " + (e.message ?: "")
                                tvStatus.visibility = View.VISIBLE
                            }
                        }
                    }.start()
                    return
                }

                val dnsRaw = acc.dns?.trim() ?: ""
                val user = acc.user?.trim() ?: ""
                val pass = acc.pass?.trim() ?: ""
                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    pb.visibility = View.GONE
                    tvStatus.text = "DNS / user / pass missing."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val base = dns + "/player_api.php?username=" + user + "&password=" + pass

                val catAction = when (currentMode) {
                    "VOD" -> "get_vod_categories"
                    "SERIES" -> "get_series_categories"
                    else -> "get_live_categories"
                }
                val streamsAction = when (currentMode) {
                    "VOD" -> "get_vod_streams"
                    "SERIES" -> "get_series"
                    else -> "get_live_streams"
                }

                val catUrl = base + "&action=" + catAction
                val streamsUrl = base + "&action=" + streamsAction

                Thread {
                    try {
                        val accInfo = fetchAccountInfo(base)
                        val fetchedCategories = fetchCategories(catUrl)
                        val fetchedStreams = fetchStreams(streamsUrl)

                        runOnUiThread {
                            pb.visibility = View.GONE
                            categories = fetchedCategories
                            streams = fetchedStreams

                            // account info shown in AccountActivity, but keep cached:
                            showCategories()
                        }
                    } catch (e: Exception) {
                        runOnUiThread {
                            pb.visibility = View.GONE
                            tvStatus.text = "Load failed: " + (e.message ?: "")
                            tvStatus.visibility = View.VISIBLE
                        }
                    }
                }.start()
            }

            private fun showCategories() {
                level = 0
                selectedCategoryId = null
                selectedCategoryName = ""
                setHeaderTexts()

                val labels = categories.map { it.category_name }
                if (labels.isEmpty()) {
                    tvStatus.text = "No categories."
                    tvStatus.visibility = View.VISIBLE
                    rv.adapter = RowAdapter(emptyList()) {}
                    return
                }

                tvStatus.visibility = View.GONE
                rv.adapter = RowAdapter(labels) { index ->
                    val cat = categories[index]
                    selectedCategoryId = cat.category_id
                    selectedCategoryName = cat.category_name
                    showItemsForCategory(cat.category_id, cat.category_name)
                }
                rv.post { rv.requestFocus() }
            }

            private fun showItemsForCategory(catId: String, catName: String) {
                level = 1
                setHeaderTexts()

                val filtered = streams.filter { it.category_id == catId }
                if (filtered.isEmpty()) {
                    tvStatus.text = "Empty."
                    tvStatus.visibility = View.VISIBLE
                    rv.adapter = RowAdapter(emptyList()) {}
                    return
                }

                tvStatus.visibility = View.GONE
                val labels = filtered.map { it.name }

                rv.adapter = RowAdapter(labels) { idx ->
                    val item = filtered[idx]
                    openItem(item)
                }
                rv.post { rv.requestFocus() }
            }

            override fun onBackPressed() {
                if (level == 1) {
                    showCategories()
                } else {
                    super.onBackPressed()
                }
            }

            private fun openItem(item: StreamItem) {
                val acc = activeAcc ?: return

                if (acc.type == "M3U") {
                    val url = item.full_url ?: ""
                    if (url.isEmpty()) {
                        Toast.makeText(this, "Invalid url", Toast.LENGTH_SHORT).show()
                        return
                    }
                    val itn = Intent(this, PlayerActivity::class.java)
                    itn.putExtra("URL", url)
                    itn.putExtra("REF", item.referer ?: "")
                    itn.putExtra("ORG", item.origin ?: "")
                    AdsHelper.maybeShowOnChannelClick(this) { startActivity(itn) }
                    return
                }

                if (currentMode == "SERIES") {
                    val itn = Intent(this, SeriesDetailActivity::class.java)
                    itn.putExtra("SERIES_ID", item.series_id ?: "")
                    itn.putExtra("SERIES_NAME", item.name)
                    AdsHelper.maybeShowOnChannelClick(this) { startActivity(itn) }
                    return
                }

                val dnsRaw = acc.dns?.trim() ?: ""
                val user = acc.user?.trim() ?: ""
                val pass = acc.pass?.trim() ?: ""
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw

                val path = if (currentMode == "LIVE") "live" else "movie"
                val ext = if (currentMode == "LIVE") ".ts" else ("." + (item.container_extension ?: "mp4"))
                val id = item.stream_id ?: ""

                val playUrl = dns + "/" + path + "/" + user + "/" + pass + "/" + id + ext
                val itn = Intent(this, PlayerActivity::class.java)
                itn.putExtra("URL", playUrl)
                itn.putExtra("REF", "")
                itn.putExtra("ORG", "")
                AdsHelper.maybeShowOnChannelClick(this) { startActivity(itn) }
            }

            private fun fetchM3u(urlStr: String): Pair<List<Category>, List<StreamItem>> {
                val categoriesMap = LinkedHashMap<String, Category>()
                val streamsList = ArrayList<StreamItem>()

                val url = URL(urlStr)
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000
                conn.readTimeout = 20000
                conn.requestMethod = "GET"

                val code = conn.responseCode
                if (code != HttpURLConnection.HTTP_OK) return Pair(emptyList(), emptyList())

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val lines = body.split("\n")

                var currentName = ""
                var currentGroup = "General"
                var currentRef: String? = null
                var currentOrg: String? = null

                for (raw in lines) {
                    val line = raw.trim()
                    if (line.isEmpty()) continue
                    if (line.startsWith("#EXTM3U", true)) continue

                    if (line.startsWith("#EXTINF", true)) {
                        var name = ""
                        var group = "General"
                        val groupIndex = line.indexOf("group-title=\"")
                        if (groupIndex >= 0) {
                            val start = groupIndex + "group-title=\"".length
                            val end = line.indexOf("\"", startIndex = start)
                            if (end > start) group = line.substring(start, end)
                        }
                        val commaIndex = line.lastIndexOf(',')
                        if (commaIndex >= 0 && commaIndex < line.length - 1) {
                            name = line.substring(commaIndex + 1).trim()
                        }
                        currentName = if (name.isNotEmpty()) name else "Channel"
                        currentGroup = if (group.isNotEmpty()) group else "General"
                        currentRef = null
                        currentOrg = null
                    } else if (line.startsWith("#EXTVLCOPT:http-referrer=", true)) {
                        val idx = line.indexOf("=")
                        if (idx >= 0 && idx < line.length - 1) currentRef = line.substring(idx + 1).trim()
                    } else if (line.startsWith("#EXTVLCOPT:http-origin=", true)) {
                        val idx = line.indexOf("=")
                        if (idx >= 0 && idx < line.length - 1) currentOrg = line.substring(idx + 1).trim()
                    } else if (!line.startsWith("#")) {
                        val urlPlay = line
                        val groupId = if (currentGroup.isNotEmpty()) currentGroup else "General"
                        val cat = categoriesMap.getOrPut(groupId) { Category(groupId, groupId) }

                        streamsList.add(
                            StreamItem(
                                name = currentName,
                                stream_id = null,
                                series_id = null,
                                container_extension = null,
                                category_id = cat.category_id,
                                full_url = urlPlay,
                                referer = currentRef,
                                origin = currentOrg
                            )
                        )
                        currentRef = null
                        currentOrg = null
                    }
                }

                return Pair(categoriesMap.values.toList(), streamsList)
            }

            private fun fetchAccountInfo(baseUrl: String): Pair<String?, String?> {
                return try {
                    val url = URL(baseUrl)
                    val conn = url.openConnection() as HttpURLConnection
                    conn.connectTimeout = 8000
                    conn.readTimeout = 8000
                    conn.requestMethod = "GET"
                    val code = conn.responseCode
                    if (code != HttpURLConnection.HTTP_OK) Pair(null, null)
                    else {
                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val userInfo = obj.optJSONObject("user_info")
                        if (userInfo != null) Pair(userInfo.optString("username", null), userInfo.optString("exp_date", null))
                        else Pair(null, null)
                    }
                } catch (_: Exception) { Pair(null, null) }
            }

            private fun fetchCategories(urlStr: String): List<Category> {
                val list = ArrayList<Category>()
                val url = URL(urlStr)
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000
                conn.readTimeout = 15000
                conn.requestMethod = "GET"

                if (conn.responseCode != HttpURLConnection.HTTP_OK) return list
                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    list.add(Category(obj.optString("category_id", ""), obj.optString("category_name", "Category $i")))
                    i++
                }
                return list
            }

            private fun fetchStreams(urlStr: String): List<StreamItem> {
                val list = ArrayList<StreamItem>()
                val url = URL(urlStr)
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000
                conn.readTimeout = 20000
                conn.requestMethod = "GET"

                if (conn.responseCode != HttpURLConnection.HTTP_OK) return list
                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    list.add(
                        StreamItem(
                            name = obj.optString("name", "Unknown"),
                            stream_id = obj.optString("stream_id", null),
                            series_id = obj.optString("series_id", null),
                            container_extension = obj.optString("container_extension", null),
                            category_id = obj.optString("category_id", ""),
                            full_url = null,
                            referer = null,
                            origin = null
                        )
                    )
                    i++
                }
                return list
            }
        }
