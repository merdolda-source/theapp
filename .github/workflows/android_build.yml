<?xml version="1.0" encoding="utf-8"?>
<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="@color/black">

    <!-- Video görüntüsü -->
    <androidx.media3.ui.PlayerView
        android:id="@+id/pvMain"
        android:layout_width="match_parent"
        android:layout_height="match_parent"/>

    <!-- Gesture overlaylar (sol: parlaklık, sağ: ses / çift tıklama seek) -->
    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="match_parent"
        android:orientation="horizontal"
        android:layout_marginBottom="72dp">

        <View
            android:id="@+id/overlayLeft"
            android:layout_width="0dp"
            android:layout_height="match_parent"
            android:layout_weight="1"/>

        <View
            android:id="@+id/overlayRight"
            android:layout_width="0dp"
            android:layout_height="match_parent"
            android:layout_weight="1"/>
    </LinearLayout>

    <!-- Üst Bar: Geri + Başlık -->
    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="60dp"
        android:orientation="horizontal"
        android:gravity="center_vertical"
        android:background="#AA000000"
        android:paddingStart="8dp"
        android:paddingEnd="16dp"
        android:layout_gravity="top">

        <ImageButton
            android:id="@+id/btnPlayerBack"
            android:layout_width="48dp"
            android:layout_height="48dp"
            android:background="@android:color/transparent"
            android:src="@android:drawable/ic_media_previous"
            android:tint="@color/white"/>

        <TextView
            android:id="@+id/tvPlayerTitle"
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:textColor="@color/white"
            android:textSize="16sp"
            android:textStyle="bold"
            android:ellipsize="end"
            android:singleLine="true"
            android:layout_marginStart="8dp"/>
    </LinearLayout>

    <!-- Bilgi Overlay (merkez) -->
    <TextView
        android:id="@+id/tvInfoCenter"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:textColor="@color/white"
        android:textSize="18sp"
        android:textStyle="bold"
        android:background="#CC000000"
        android:padding="12dp"
        android:layout_gravity="center"
        android:visibility="gone"/>

    <!-- Parlaklık (sol üst) -->
    <TextView
        android:id="@+id/tvBrightness"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:textColor="@color/white"
        android:textSize="14sp"
        android:background="#CC000000"
        android:padding="8dp"
        android:layout_gravity="top|start"
        android:layout_margin="70dp"
        android:visibility="gone"/>

    <!-- Ses (sağ üst) -->
    <TextView
        android:id="@+id/tvVolume"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:textColor="@color/white"
        android:textSize="14sp"
        android:background="#CC000000"
        android:padding="8dp"
        android:layout_gravity="top|end"
        android:layout_margin="70dp"
        android:visibility="gone"/>

    <!-- Alt Kontrol Çubuğu -->
    <LinearLayout
        android:id="@+id/playerControlsBar"
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:background="#AA000000"
        android:paddingBottom="16dp"
        android:layout_gravity="bottom">

        <!-- Pozisyon -->
        <TextView
            android:id="@+id/tvPosition"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:textColor="@color/white"
            android:textSize="12sp"
            android:gravity="center"
            android:padding="4dp"
            android:visibility="gone"/>

        <!-- Kontrol Butonları -->
        <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="horizontal"
            android:gravity="center"
            android:paddingStart="16dp"
            android:paddingEnd="16dp">

            <!-- Geri Sar -->
            <ImageButton
                android:layout_width="56dp"
                android:layout_height="56dp"
                android:background="@android:color/transparent"
                android:src="@android:drawable/ic_media_rew"
                android:tint="@color/white"
                android:focusable="false"
                android:onClick="seekBackward"/>

            <!-- Play/Pause -->
            <ImageButton
                android:id="@+id/btnPlayPause"
                android:layout_width="64dp"
                android:layout_height="64dp"
                android:background="@drawable/bg_player_control"
                android:src="@android:drawable/ic_media_pause"
                android:padding="10dp"
                android:tint="@color/white"
                android:layout_marginStart="8dp"
                android:layout_marginEnd="8dp"
                android:focusable="true"/>

            <!-- İleri Sar -->
            <ImageButton
                android:layout_width="56dp"
                android:layout_height="56dp"
                android:background="@android:color/transparent"
                android:src="@android:drawable/ic_media_ff"
                android:tint="@color/white"
                android:focusable="false"
                android:onClick="seekForward"/>

            <!-- Boşluk -->
            <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>

            <!-- Ekran Modu -->
            <ImageButton
                android:id="@+id/btnMode"
                android:layout_width="48dp"
                android:layout_height="48dp"
                android:background="@android:color/transparent"
                android:src="@android:drawable/ic_menu_crop"
                android:tint="@color/white"
                android:padding="8dp"
                android:focusable="true"/>

            <!-- Ekran Kilidi -->
            <ImageButton
                android:id="@+id/btnLock"
                android:layout_width="48dp"
                android:layout_height="48dp"
                android:background="@android:color/transparent"
                android:src="@android:drawable/ic_lock_idle_lock"
                android:tint="@color/white"
                android:padding="8dp"
                android:focusable="true"/>
        </LinearLayout>
    </LinearLayout>

</FrameLayout>
EOF

