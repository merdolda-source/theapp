package com.emin.xtream.player.adapters

import android.view.KeyEvent
import android.view.LayoutInflater
import android.view.View
import android.view.ViewGroup
import android.widget.ImageView
import android.widget.LinearLayout
import android.widget.TextView
import androidx.recyclerview.widget.RecyclerView
import com.bumptech.glide.Glide
import com.bumptech.glide.load.resource.drawable.DrawableTransitionOptions
import com.google.android.gms.ads.AdView
import com.emin.xtream.player.R
import com.emin.xtream.player.utils.AdsHelper

private const val VT_ITEM = 0
private const val VT_AD   = 1

class MediaAdapter(
    private var titles: List<String>,
    private var subtitles: List<String>,
    private var thumbnails: List<String?>,
    private var isLiveFlags: List<Boolean>,
    private var ratings: List<Float?>,
    private val onClick: (Int) -> Unit
) : RecyclerView.Adapter<RecyclerView.ViewHolder>() {

    inner class ItemVH(v: View) : RecyclerView.ViewHolder(v) {
        val root: LinearLayout = v.findViewById(R.id.cardRoot)
        val thumb: ImageView   = v.findViewById(R.id.ivThumb)
        val title: TextView    = v.findViewById(R.id.tvTitle)
        val sub: TextView      = v.findViewById(R.id.tvSubtitle)
        val live: View         = v.findViewById(R.id.liveBadge)
        val rating: TextView   = v.findViewById(R.id.tvRating)
    }

    inner class AdVH(v: View) : RecyclerView.ViewHolder(v) {
        val adView: AdView = v.findViewById(R.id.adView)
    }

    override fun getItemViewType(pos: Int) =
        if (titles[pos] == "###AD###") VT_AD else VT_ITEM

    override fun onCreateViewHolder(parent: ViewGroup, vt: Int): RecyclerView.ViewHolder {
        val inf = LayoutInflater.from(parent.context)
        return if (vt == VT_AD)
            AdVH(inf.inflate(R.layout.item_ad_banner, parent, false))
        else
            ItemVH(inf.inflate(R.layout.item_media_card, parent, false))
    }

    override fun getItemCount() = titles.size

    override fun onBindViewHolder(holder: RecyclerView.ViewHolder, pos: Int) {
        if (holder is AdVH) { AdsHelper.loadBanner(holder.adView); return }
        holder as ItemVH

        holder.title.text = titles[pos]
        val sub = subtitles[pos]
        holder.sub.visibility = if (sub.isNotEmpty()) View.VISIBLE else View.GONE
        holder.sub.text = sub

        // Thumbnail — Glide ile yükle
        val thumb = thumbnails.getOrNull(pos)
        if (!thumb.isNullOrEmpty()) {
            Glide.with(holder.thumb.context)
                .load(thumb)
                .transition(DrawableTransitionOptions.withCrossFade(200))
                .centerCrop()
                .into(holder.thumb)
        } else {
            holder.thumb.setImageResource(android.R.drawable.ic_media_play)
        }

        // Canlı rozeti
        holder.live.visibility = if (isLiveFlags.getOrNull(pos) == true) View.VISIBLE else View.GONE

        // Puan rozeti
        val r = ratings.getOrNull(pos)
        if (r != null && r > 0f) {
            holder.rating.text = "★ ${String.format("%.1f", r)}"
            holder.rating.visibility = View.VISIBLE
        } else {
            holder.rating.visibility = View.GONE
        }

        // Hybrid fix: focusable=true (TV), focusableInTouchMode=false (telefon tek tık)
        holder.root.isFocusable = true
        holder.root.isClickable = true

        holder.root.setOnFocusChangeListener { v, hasFocus ->
            v.animate()
                .scaleX(if (hasFocus) 1.04f else 1f)
                .scaleY(if (hasFocus) 1.04f else 1f)
                .setDuration(140).start()
            v.elevation = if (hasFocus) 12f else 0f
        }

        holder.root.setOnClickListener { onClick(pos) }

        // TV kumanda OK
        holder.root.setOnKeyListener { _, code, event ->
            if (event.action == KeyEvent.ACTION_DOWN &&
                (code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER)) {
                onClick(pos); true
            } else false
        }
    }

    fun update(
        t: List<String>, s: List<String>,
        th: List<String?>, live: List<Boolean>, rat: List<Float?>
    ) {
        titles = t; subtitles = s; thumbnails = th
        isLiveFlags = live; ratings = rat
        notifyDataSetChanged()
    }
}
