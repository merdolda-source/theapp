package com.emin.xtream.player

import android.content.Intent
import android.os.Bundle
import android.view.View
import android.widget.*
import androidx.appcompat.app.AlertDialog
import androidx.appcompat.app.AppCompatActivity
import androidx.recyclerview.widget.LinearLayoutManager
import androidx.recyclerview.widget.RecyclerView
import com.google.android.gms.ads.AdView
import com.emin.xtream.player.adapters.AccountsAdapter
import com.emin.xtream.player.models.AccountProfile
import com.emin.xtream.player.utils.AdsHelper
import com.emin.xtream.player.utils.Prefs
import com.emin.xtream.player.utils.RemoteLogger

class LoginActivity : AppCompatActivity() {
    private var isXtream = true
    private lateinit var prefs: Prefs
    private lateinit var accountsAdapter: AccountsAdapter

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_login)

        prefs = Prefs(this)
        AdsHelper.init(this)
        AdsHelper.loadBanner(findViewById(R.id.adViewLogin))
        AdsHelper.loadInterstitial(this)
        RemoteLogger.sendEvent(this, "screen_login")

        setupTabUI()
        setupForm()
        setupAccountsList()
    }

    private fun setupTabUI() {
        val tabXtream = findViewById<View>(R.id.tabXtream)
        val tabM3u = findViewById<View>(R.id.tabM3u)
        val layoutXtream = findViewById<View>(R.id.layoutXtream)
        val layoutM3u = findViewById<View>(R.id.layoutM3u)

        fun updateTabs() {
            tabXtream.setBackgroundResource(if (isXtream) R.drawable.bg_tab_selected else R.drawable.bg_tab_unselected)
            tabM3u.setBackgroundResource(if (!isXtream) R.drawable.bg_tab_selected else R.drawable.bg_tab_unselected)
            layoutXtream.visibility = if (isXtream) View.VISIBLE else View.GONE
            layoutM3u.visibility = if (!isXtream) View.VISIBLE else View.GONE
        }

        tabXtream.setOnClickListener { isXtream = true; updateTabs() }
        tabM3u.setOnClickListener { isXtream = false; updateTabs() }
        updateTabs()
    }

    private fun setupForm() {
        val etName = findViewById<EditText>(R.id.etName)
        val etDns = findViewById<EditText>(R.id.etDns)
        val etPort = findViewById<EditText>(R.id.etPort)
        val etUser = findViewById<EditText>(R.id.etUser)
        val etPass = findViewById<EditText>(R.id.etPass)
        val etM3u = findViewById<EditText>(R.id.etM3u)
        val btnAdd = findViewById<Button>(R.id.btnAddAccount)

        btnAdd.setOnClickListener {
            val name = etName.text.toString().trim().ifEmpty { "Hesap" }

            if (isXtream) {
                var dns = etDns.text.toString().trim()
                val port = etPort.text.toString().trim()
                val user = etUser.text.toString().trim().replace("\\s+".toRegex(), "")
                val pass = etPass.text.toString().trim()

                if (dns.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    showToast("Sunucu URL, kullanıcı adı ve şifre zorunludur")
                    return@setOnClickListener
                }
                if (!dns.startsWith("http://", true) && !dns.startsWith("https://", true)) {
                    dns = "http://$dns"
                }
                dns = dns.trimEnd('/')

                prefs.createXtreamAccount(name, dns, port, user, pass)
                showToast("Xtream hesabı eklendi: $name")
            } else {
                var m3u = etM3u.text.toString().trim()
                if (m3u.isEmpty()) {
                    showToast("M3U URL zorunludur")
                    return@setOnClickListener
                }
                if (!m3u.startsWith("http://", true) && !m3u.startsWith("https://", true)) {
                    m3u = "http://$m3u"
                }
                prefs.createM3uAccount(name, m3u)
                showToast("M3U hesabı eklendi: $name")
            }

            // Formu temizle
            etName.setText(""); etDns.setText(""); etPort.setText("")
            etUser.setText(""); etPass.setText(""); etM3u.setText("")

            refreshAccountsList()
            RemoteLogger.sendEvent(this, "account_added", mapOf("type" to if (isXtream) "XTREAM" else "M3U"))

            // Hesabı aç
            val acc = prefs.getActive()
            if (acc != null) openContent()
        }
    }

    private fun setupAccountsList() {
        val rv = findViewById<RecyclerView>(R.id.rvAccounts)
        val tvEmpty = findViewById<TextView>(R.id.tvNoAccounts)
        rv.layoutManager = LinearLayoutManager(this)
        accountsAdapter = AccountsAdapter(
            mutableListOf(),
            onOpen = { acc ->
                prefs.setActive(acc.id)
                RemoteLogger.sendEvent(this, "account_selected", mapOf("type" to acc.type))
                openContent()
            },
            onDelete = { acc -> confirmDelete(acc) }
        )
        rv.adapter = accountsAdapter
        refreshAccountsList()
    }

    private fun refreshAccountsList() {
        val accounts = prefs.getAccounts().toMutableList()
        val tvEmpty = findViewById<TextView>(R.id.tvNoAccounts)
        val rvAccounts = findViewById<RecyclerView>(R.id.rvAccounts)
        if (accounts.isEmpty()) {
            tvEmpty.visibility = View.VISIBLE
            rvAccounts.visibility = View.GONE
        } else {
            tvEmpty.visibility = View.GONE
            rvAccounts.visibility = View.VISIBLE
            accountsAdapter.update(accounts)
        }
    }

    private fun confirmDelete(acc: AccountProfile) {
        AlertDialog.Builder(this)
            .setTitle("Hesabı Sil")
            .setMessage("\"${acc.name}\" hesabı silinsin mi?")
            .setPositiveButton("Sil") { _, _ ->
                prefs.deleteAccount(acc.id)
                refreshAccountsList()
                showToast("Hesap silindi")
            }
            .setNegativeButton("İptal", null)
            .show()
    }

    private fun openContent() {
        startActivity(Intent(this, ContentActivity::class.java))
        overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
        finish()
    }

    private fun showToast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
}
