        # SERIES + PLAYER
        # (Senin mevcut dosyaları çalışır; sadece BaseActivity extend et)
        # -----------------------------
        # SeriesDetailActivity: BaseActivity
        # PlayerActivity: BaseActivity (dil etkilesin diye)
        # Burada dosyalarını "aynı" tutup sadece class extends değiştiriyoruz:

        # (Kısaltma yapmamak için minimal değişiklikle yeniden yazıyorum)
        cat <<EOF > app/src/main/java/$PATH_NAME/SeriesDetailActivity.kt
        package $PACKAGE_NAME

        import android.os.Bundle
        import android.view.View
        import android.widget.AdapterView
        import android.widget.ArrayAdapter
        import android.widget.ListView
        import android.widget.ProgressBar
        import android.widget.TextView
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.util.ArrayList
        import $PACKAGE_NAME.utils.Prefs

        class SeriesDetailActivity : BaseActivity() {

            private lateinit var prefs: Prefs
            private lateinit var tvTitle: TextView
            private lateinit var tvStatus: TextView
            private lateinit var pb: ProgressBar
            private lateinit var lv: ListView

            data class EpisodeItem(val id: String, val title: String, val season: Int, val ep: Int, val ext: String)

            private val episodes = ArrayList<EpisodeItem>()

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_series_detail)

                prefs = Prefs(this)

                tvTitle = findViewById(R.id.tvSeriesTitle)
                tvStatus = findViewById(R.id.tvSeriesStatus)
                pb = findViewById(R.id.pbSeries)
                lv = findViewById(R.id.lvEpisodes)

                val seriesName = intent.getStringExtra("SERIES_NAME") ?: "Series"
                val seriesId = intent.getStringExtra("SERIES_ID") ?: ""

                tvTitle.text = seriesName

                if (seriesId.isEmpty()) {
                    tvStatus.text = "Invalid series."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                loadSeriesInfo(seriesId)
            }

            private fun loadSeriesInfo(seriesId: String) {
                val acc = prefs.getActive()
                val dnsRaw = acc?.dns?.trim() ?: ""
                val user = acc?.user?.trim() ?: ""
                val pass = acc?.pass?.trim() ?: ""

                if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                    tvStatus.text = "Missing credentials."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val urlStr = dns +
                        "/player_api.php?username=" + user +
                        "&password=" + pass +
                        "&action=get_series_info&series_id=" + seriesId

                pb.visibility = View.VISIBLE
                tvStatus.visibility = View.GONE

                Thread {
                    try {
                        val conn = (URL(urlStr).openConnection() as HttpURLConnection)
                        conn.connectTimeout = 10000
                        conn.readTimeout = 20000
                        conn.requestMethod = "GET"

                        if (conn.responseCode != HttpURLConnection.HTTP_OK) {
                            showError("HTTP: " + conn.responseCode)
                            return@Thread
                        }

                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val episodesObj = obj.optJSONObject("episodes") ?: JSONObject()

                        episodes.clear()
                        val keys = episodesObj.keys()
                        while (keys.hasNext()) {
                            val seasonKey = keys.next()
                            val seasonNum = seasonKey.toIntOrNull() ?: 0
                            val arr = episodesObj.optJSONArray(seasonKey) ?: continue
                            var i = 0
                            while (i < arr.length()) {
                                val epObj = arr.getJSONObject(i)
                                val id = epObj.optString("id", "")
                                val title = epObj.optString("title", "Episode")
                                val epNum = epObj.optInt("episode_num", i + 1)
                                val ext = epObj.optString("container_extension", "mp4")
                                episodes.add(EpisodeItem(id, title, seasonNum, epNum, ext))
                                i++
                            }
                        }

                        runOnUiThread {
                            pb.visibility = View.GONE
                            if (episodes.isEmpty()) {
                                tvStatus.text = "No episodes."
                                tvStatus.visibility = View.VISIBLE
                            } else {
                                val labels = ArrayList<String>()
                                for (ep in episodes) labels.add("S${ep.season}E${ep.ep} - ${ep.title}")
                                lv.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, labels)
                                lv.onItemClickListener = AdapterView.OnItemClickListener { _, _, pos, _ ->
                                    playEpisode(episodes[pos])
                                }
                            }
                        }

                    } catch (e: Exception) {
                        showError("Failed: " + (e.message ?: ""))
                    }
                }.start()
            }

            private fun playEpisode(ep: EpisodeItem) {
                val acc = prefs.getActive() ?: return
                val dnsRaw = acc.dns?.trim() ?: ""
                val user = acc.user?.trim() ?: ""
                val pass = acc.pass?.trim() ?: ""
                val dns = if (dnsRaw.endsWith("/")) dnsRaw.dropLast(1) else dnsRaw
                val url = dns + "/series/" + user + "/" + pass + "/" + ep.id + "." + ep.ext

                val itn = Intent(this, PlayerActivity::class.java)
                itn.putExtra("URL", url)
                itn.putExtra("REF", "")
                itn.putExtra("ORG", "")
                startActivity(itn)
            }

            private fun showError(msg: String) {
                runOnUiThread {
                    pb.visibility = View.GONE
                    tvStatus.text = msg
                    tvStatus.visibility = View.VISIBLE
                }
            }
        }
        EOF

