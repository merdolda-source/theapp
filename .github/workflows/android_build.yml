package com.emin.xtream.player.adapters

import android.view.KeyEvent
import android.view.LayoutInflater
import android.view.View
import android.view.ViewGroup
import android.widget.ImageButton
import android.widget.TextView
import androidx.recyclerview.widget.RecyclerView
import com.emin.xtream.player.R
import com.emin.xtream.player.models.AccountProfile

class AccountsAdapter(
    private var items: MutableList<AccountProfile>,
    private val onOpen: (AccountProfile) -> Unit,
    private val onDelete: (AccountProfile) -> Unit
) : RecyclerView.Adapter<AccountsAdapter.VH>() {

    class VH(v: View) : RecyclerView.ViewHolder(v) {
        val container: View = v.findViewById(R.id.accountContainer)
        val tvName: TextView = v.findViewById(R.id.tvAccountName)
        val tvType: TextView = v.findViewById(R.id.tvAccountType)
        val tvDns: TextView = v.findViewById(R.id.tvAccountDns)
        val tvBadge: TextView = v.findViewById(R.id.tvAccountBadge)
        val btnDelete: ImageButton = v.findViewById(R.id.btnDeleteAccount)
        val icActive: View = v.findViewById(R.id.icActive)
    }

    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
        val v = LayoutInflater.from(parent.context).inflate(R.layout.item_account, parent, false)
        return VH(v)
    }

    override fun onBindViewHolder(holder: VH, position: Int) {
        val item = items[position]
        val ctx = holder.itemView.context

        holder.tvName.text = item.name
        holder.tvType.text = if (item.type == "M3U") "M3U Playlist" else "Xtream Codes"
        holder.tvDns.text = when {
            item.type == "M3U" -> item.m3u?.take(50) ?: "-"
            else -> "${item.dns ?: "-"}${if (!item.port.isNullOrEmpty()) ":${item.port}" else ""}"
        }

        // Badge
        if (item.type == "M3U") {
            holder.tvBadge.text = "M3U"
            holder.tvBadge.setBackgroundResource(R.drawable.bg_badge_series)
        } else {
            holder.tvBadge.text = "XC"
            holder.tvBadge.setBackgroundResource(R.drawable.bg_badge_vod)
        }

        // Aktif hesap göstergesi
        holder.icActive.visibility = if (item.isActive) View.VISIBLE else View.INVISIBLE
        holder.container.setBackgroundResource(
            if (item.isActive) R.drawable.bg_account_active else R.drawable.bg_account_card
        )

        holder.container.isFocusable = true
        holder.container.isClickable = true

        holder.container.setOnFocusChangeListener { v, hasFocus ->
            v.animate().scaleX(if (hasFocus) 1.02f else 1.0f)
                .scaleY(if (hasFocus) 1.02f else 1.0f)
                .setDuration(150).start()
            v.elevation = if (hasFocus) 8f else 0f
        }

        holder.container.setOnClickListener { onOpen(item) }
        holder.btnDelete.setOnClickListener { onDelete(item) }

        holder.container.setOnKeyListener { _, keyCode, event ->
            if (event.action == KeyEvent.ACTION_DOWN &&
                (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER)
            ) { onOpen(item); true } else false
        }
    }

    override fun getItemCount() = items.size

    fun update(newItems: List<AccountProfile>) {
        items.clear()
        items.addAll(newItems)
        notifyDataSetChanged()
    }
}
