package $PACKAGE_NAME

import com.google.gson.JsonObject
import retrofit2.Call
import retrofit2.http.GET
import retrofit2.http.Query

interface XtreamService {
    @GET("player_api.php")
    fun playerApi(
        @Query("username") username: String,
        @Query("password") password: String,
        @Query("action") action: String? = null,
        @Query("category_id") categoryId: String? = null,
        @Query("series_id") seriesId: String? = null
    ): Call<JsonObject>
}
EOF

        cat > app/src/main/java/$PATH_NAME/ApiClient.kt <<EOF
package $PACKAGE_NAME

import retrofit2.Retrofit
import retrofit2.converter.gson.GsonConverterFactory

object ApiClient {
    fun create(portal: String): XtreamService {
        val base = if (portal.endsWith("/")) portal else "\$portal/"
        val retrofit = Retrofit.Builder()
            .baseUrl(base)
            .addConverterFactory(GsonConverterFactory.create())
            .build()
        return retrofit.create(XtreamService::class.java)
    }
}
EOF

        # --- ADAPTER ---
        cat > app/src/main/java/$PATH_NAME/SimpleAdapter.kt <<EOF
package $PACKAGE_NAME

import android.view.LayoutInflater
import android.view.View
import android.view.ViewGroup
import android.widget.TextView
import androidx.recyclerview.widget.RecyclerView

class SimpleAdapter(
    private var items: List<RowItem>,
    private val onClick: (RowItem) -> Unit
) : RecyclerView.Adapter<SimpleAdapter.VH>() {

    data class RowItem(val id: String, val title: String, val subtitle: String? = null)

    fun submit(newItems: List<RowItem>) {
        items = newItems
        notifyDataSetChanged()
    }

    class VH(v: View) : RecyclerView.ViewHolder(v) {
        val title: TextView = v.findViewById(R.id.title)
        val subtitle: TextView = v.findViewById(R.id.subtitle)
    }

    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
        val v = LayoutInflater.from(parent.context).inflate(R.layout.item_row, parent, false)
        return VH(v)
    }

    override fun getItemCount(): Int = items.size

    override fun onBindViewHolder(holder: VH, position: Int) {
        val it = items[position]
        holder.title.text = it.title
        if (it.subtitle.isNullOrEmpty()) {
            holder.subtitle.visibility = View.GONE
        } else {
            holder.subtitle.visibility = View.VISIBLE
            holder.subtitle.text = it.subtitle
        }
        holder.itemView.setOnClickListener { onClick(it) }
    }
}
EOF

        # --- LOGIN ACTIVITY (DÜZELTİLDİ: Player'a değil Home'a gider + Xtream doğrular) ---
        cat > app/src/main/java/$PATH_NAME/LoginActivity.kt <<EOF
package $PACKAGE_NAME

import android.content.Intent
import android.os.Bundle
import android.view.View
import android.widget.*
import androidx.appcompat.app.AppCompatActivity
import com.google.android.gms.ads.AdRequest
import com.google.android.gms.ads.AdView
import com.google.android.gms.ads.MobileAds
import com.google.gson.JsonObject
import retrofit2.Call
import retrofit2.Callback
import retrofit2.Response

class LoginActivity : AppCompatActivity() {

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_login)

        MobileAds.initialize(this) {}
        findViewById<AdView>(R.id.adView).loadAd(AdRequest.Builder().build())

        val btnLogin = findViewById<Button>(R.id.btnLogin)
        val etUrl = findViewById<EditText>(R.id.etUrl)
        val etUser = findViewById<EditText>(R.id.etUser)
        val etPass = findViewById<EditText>(R.id.etPass)
        val progress = findViewById<ProgressBar>(R.id.progress)

        // Kaydedilmişse doldur
        etUrl.setText(Prefs.portal(this))
        etUser.setText(Prefs.user(this))
        etPass.setText(Prefs.pass(this))

        btnLogin.setOnClickListener {
            val portal = etUrl.text.toString().trim()
            val user = etUser.text.toString().trim()
            val pass = etPass.text.toString().trim()

            if (portal.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                Toast.makeText(this, "Bilgileri giriniz", Toast.LENGTH_SHORT).show()
                return@setOnClickListener
            }

            progress.visibility = View.VISIBLE
            btnLogin.isEnabled = false

            val api = ApiClient.create(portal)
            api.playerApi(user, pass, null).enqueue(object : Callback<JsonObject> {
                override fun onResponse(call: Call<JsonObject>, response: Response<JsonObject>) {
                    progress.visibility = View.GONE
                    btnLogin.isEnabled = true

                    val body = response.body()
                    val userInfo = body?.getAsJsonObject("user_info")
                    val status = userInfo?.get("status")?.asString ?: ""

                    if (status.equals("Active", true)) {
                        Prefs.save(this@LoginActivity, portal, user, pass)
                        startActivity(Intent(this@LoginActivity, HomeActivity::class.java))
                        finish()
                    } else {
                        Toast.makeText(this@LoginActivity, "Giriş başarısız (status: \$status)", Toast.LENGTH_LONG).show()
                    }
                }

                override fun onFailure(call: Call<JsonObject>, t: Throwable) {
                    progress.visibility = View.GONE
                    btnLogin.isEnabled = true
                    Toast.makeText(this@LoginActivity, "Hata: \${t.message}", Toast.LENGTH_LONG).show()
                }
            })
        }
    }
}
EOF

