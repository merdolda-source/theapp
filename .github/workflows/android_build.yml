            private fun fetchAccountInfo(baseUrl: String): Pair<String?, String?> { /* aynı kod */ }
            private fun formatExp(exp: String?): String { /* aynı kod */ }
            private fun fetchCategories(urlStr: String): List<Category> { /* aynı kod */ }
            private fun fetchStreams(urlStr: String): List<StreamItem> { /* aynı kod */ }
            private fun httpGet(urlStr: String): String { /* aynı kod */ }
            private fun doHttpGet(urlStr: String, redirectsLeft: Int): String { /* aynı kod */ }
        }
