name: EminXtream Player Pro - Full Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Ã‡ekme
      uses: actions/checkout@v4

    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. EminXtream Player Pro Proje Ãœretimi
      shell: bash
      run: |
        set -e

        APP_NAME="EminXtreamPlayer"
        PACKAGE_NAME="com.emin.xtream.player"
        PATH_NAME="com/emin/xtream/player"

        PASS="emin2024"
        STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$PASS}"
        KEY_PASS="${ANDROID_KEY_PASSWORD:-$PASS}"
        KEY_ALIAS="${ANDROID_KEY_ALIAS:-key0}"

        echo "ğŸš€ EminXtream Player Pro Ã¼retiliyor..."

        rm -rf "$APP_NAME"

        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/models"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/adapters"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/utils"
        mkdir -p "$APP_NAME/app/src/main/res/layout"
        mkdir -p "$APP_NAME/app/src/main/res/values"
        mkdir -p "$APP_NAME/app/src/main/res/values-tr"
        mkdir -p "$APP_NAME/app/src/main/res/drawable"
        mkdir -p "$APP_NAME/app/src/main/res/mipmap-hdpi"
        mkdir -p "$APP_NAME/app/src/main/res/menu"
        mkdir -p "$APP_NAME/app/src/main/res/color"
        mkdir -p "$APP_NAME/app/src/main/res/xml"
        mkdir -p "$APP_NAME/app/src/main/res/anim"

        cd "$APP_NAME"

        # Icon
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png \
          "https://i.ibb.co/LDdzzhsk/f564b0ed-277d-489c-9a1a-c59f0fe471fc.png" || true

        # Keystore
        if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          echo "ğŸ” Keystore secrets'ten yazÄ±lÄ±yor..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks || {
            echo "âš ï¸ base64 decode HATASI â€“ local keystore Ã¼retilecek."
            keytool -genkey -v \
              -keystore app/keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Emin, O=EminMedia, C=TR"
          }
        else
          echo "âš ï¸ ANDROID_KEYSTORE_BASE64 yok, local keystore Ã¼retilecek."
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Emin, O=EminMedia, C=TR"
        fi

        # ============ GRADLE CONFIG ============
        echo "include ':app'" > settings.gradle

        echo 'YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9dHJ1ZQpvcmcuZ3JhZGxlLmp2bWFyZ3M9LVhteDIwNDhtCg==' | base64 -d > gradle.properties

        echo '' | base64 -d > build.gradle

        mkdir -p app

        echo '' | base64 -d | envsubst > app/build.gradle

        # ============ RENK PALETÄ° ============
        echo '' | base64 -d > app/src/main/res/values/colors.xml

        echo '' | base64 -d > app/src/main/res/values/styles.xml

        echo '' | base64 -d > app/src/main/res/values/strings.xml

        # ============ DRAWABLES ============
        echo '' | base64 -d > app/src/main/res/drawable/bg_splash_gradient.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_logo_glow.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_input_dark.xml

        echo '' | base64 -d > app/src/main/res/drawable/selector_input_focus.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_btn_primary.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_tab_selected.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_tab_unselected.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_account_card.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_account_active.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_grid_card.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_badge_live.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_badge_vod.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_badge_series.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_search_bar.xml

        echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iIzk5MDAwMDAwIi8+CiAgICA8Y29ybmVycyBhbmRyb2lkOnJhZGl1cz0iNTBkcCIvPgo8L3NoYXBlPgo=' | base64 -d > app/src/main/res/drawable/bg_player_control.xml

        echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iIzA3MDkxQSIvPgo8L3NoYXBlPgo=' | base64 -d > app/src/main/res/drawable/bg_drawer.xml

        echo '' | base64 -d > app/src/main/res/drawable/bg_mode_selector.xml

        echo '' | base64 -d > app/src/main/res/drawable/ic_live.xml

        echo '' | base64 -d > app/src/main/res/drawable/ic_movie.xml

        echo '' | base64 -d > app/src/main/res/drawable/ic_series.xml

        # ============ ANÄ°MASYONLAR ============
        echo '' | base64 -d > app/src/main/res/anim/fade_in.xml

        echo '' | base64 -d > app/src/main/res/anim/slide_up.xml

        echo '' | base64 -d > app/src/main/res/anim/scale_in.xml

        # ============ MODELLER ============
        echo '' | base64 -d > app/src/main/java/$PATH_NAME/models/Models.kt

        # ============ UTILS ============
        echo '' | base64 -d > app/src/main/java/$PATH_NAME/utils/RemoteConfig.kt

        echo '' | base64 -d > app/src/main/java/$PATH_NAME/utils/RemoteLogger.kt

        echo '' | base64 -d > app/src/main/java/$PATH_NAME/utils/Prefs.kt

        echo '' | base64 -d > app/src/main/java/$PATH_NAME/utils/AdsHelper.kt

        # ============ ADAPTERS ============
