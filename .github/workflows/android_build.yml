                            false
                        }
                    } else {
                        when (item.itemId) {
                            R.id.nav_live -> { prefs.setLastMode("LIVE"); switchMode("LIVE"); true }
                            R.id.nav_vod -> { prefs.setLastMode("VOD"); switchMode("VOD"); true }
                            R.id.nav_series -> { prefs.setLastMode("SERIES"); switchMode("SERIES"); true }
