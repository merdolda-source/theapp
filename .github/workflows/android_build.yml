name: Xtream Dashboard Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Hazırlık
      uses: actions/checkout@v4
    
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 2. Gelişmiş IPTV Sistemini Kur
      run: |
        # --- AYARLAR ---
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        KEYSTORE_PASS="erdin123"
        KEY_ALIAS="key0"
        
        echo "🚀 Gelişmiş Xtream Sistemi Kuruluyor..."

        # Klasörleri Temizle ve Aç
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # İKON İNDİR (Anarchy Logosu)
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"

        # --- A. KEYSTORE ---
        keytool -genkey -v -keystore app/keystore.jks \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -alias $KEY_ALIAS -storepass $KEYSTORE_PASS -keypass $KEYSTORE_PASS \
                -dname "CN=Erdin, OU=TV, O=ErdinMedia, L=Istanbul, S=Istanbul, C=TR"

        # --- B. CONFIG DOSYALARI ---
        echo "include ':app'" > settings.gradle

        cat <<EOF > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        EOF

        cat <<EOF > build.gradle
        buildscript {
            ext.kotlin_version = '1.9.0'
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        task clean(type: Delete) { delete rootProject.buildDir }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33
            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            signingConfigs {
                release {
                    storeFile file("keystore.jks"); storePassword "$KEYSTORE_PASS"; keyAlias "$KEY_ALIAS"; keyPassword "$KEYSTORE_PASS"
                }
            }
            buildTypes {
                release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.release }
            }
            buildFeatures { viewBinding true }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
            implementation 'com.google.android.gms:play-services-ads:22.1.0'
        }
        EOF

        # --- C. MANIFEST (Tüm Sayfalar Eklendi) ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                android:usesCleartextTraffic="true">
                
                <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>

                <activity android:name=".LoginActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                
                <activity android:name=".DashboardActivity" />
                <activity android:name=".ListActivity" />
                <activity android:name=".PlayerActivity" />
            </application>
        </manifest>
        EOF

        # --- D. STRINGS ---
        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">$APP_NAME</string>
            <string name="login_btn">Giriş Yap</string>
            <string name="dashboard_title">Xtream Menü</string>
            <string name="live_tv">CANLI TV</string>
            <string name="movies">FİLMLER (VOD)</string>
            <string name="series">DİZİLER</string>
        </resources>
        EOF

        # ==========================================
        # 1. LOGIN ACTIVITY (Giriş Yap -> Dashboard'a Git)
        # ==========================================
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        import com.erdin.player.databinding.ActivityLoginBinding
        import com.google.android.gms.ads.MobileAds

        class LoginActivity : AppCompatActivity() {
            private lateinit var binding: ActivityLoginBinding
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                binding = ActivityLoginBinding.inflate(layoutInflater)
                setContentView(binding.root)
                MobileAds.initialize(this) {}

                binding.btnLogin.setOnClickListener {
                    val url = binding.etUrl.text.toString()
                    val user = binding.etUser.text.toString()
                    val pass = binding.etPass.text.toString()
                    
                    if(url.isNotEmpty() && user.isNotEmpty()){
                        val intent = Intent(this, DashboardActivity::class.java)
                        intent.putExtra("url", url)
                        intent.putExtra("user", user)
                        intent.putExtra("pass", pass)
                        startActivity(intent)
                    }
                }
            }
        }
        EOF

        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="24dp" android:background="#121212">
            
            <TextView android:text="Xtream Login" android:textColor="#FFF" android:textSize="30sp" android:textStyle="bold" android:layout_marginBottom="40dp"/>
            <EditText android:id="@+id/etUrl" android:hint="http://url:port" android:textColorHint="#AAA" android:textColor="#FFF" android:background="#333" android:padding="15dp" android:layout_marginBottom="10dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <EditText android:id="@+id/etUser" android:hint="Kullanıcı Adı" android:textColorHint="#AAA" android:textColor="#FFF" android:background="#333" android:padding="15dp" android:layout_marginBottom="10dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <EditText android:id="@+id/etPass" android:hint="Şifre" android:inputType="textPassword" android:textColorHint="#AAA" android:textColor="#FFF" android:background="#333" android:padding="15dp" android:layout_marginBottom="20dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <Button android:id="@+id/btnLogin" android:text="@string/login_btn" android:backgroundTint="#D32F2F" android:layout_width="match_parent" android:layout_height="60dp"/>
        </LinearLayout>
        EOF

        # ==========================================
        # 2. DASHBOARD ACTIVITY (Ana Menü: Canlı - VOD - Dizi)
        # ==========================================
        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        import com.erdin.player.databinding.ActivityDashboardBinding

        class DashboardActivity : AppCompatActivity() {
            private lateinit var binding: ActivityDashboardBinding
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                binding = ActivityDashboardBinding.inflate(layoutInflater)
                setContentView(binding.root)

                val url = intent.getStringExtra("url")
                val user = intent.getStringExtra("user")
                val pass = intent.getStringExtra("pass")

                fun goToList(type: String) {
                    val intent = Intent(this, ListActivity::class.java)
                    intent.putExtra("url", url)
                    intent.putExtra("user", user)
                    intent.putExtra("pass", pass)
                    intent.putExtra("type", type)
                    startActivity(intent)
                }

                binding.btnLive.setOnClickListener { goToList("live") }
                binding.btnVod.setOnClickListener { goToList("movie") }
                binding.btnSeries.setOnClickListener { goToList("series") }
            }
        }
        EOF

        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="20dp" android:background="#000000">
            
            <TextView android:text="HOŞGELDİNİZ" android:textColor="#FFF" android:textSize="24sp" android:layout_marginBottom="40dp"/>
            
            <Button android:id="@+id/btnLive" android:text="@string/live_tv" android:backgroundTint="#1976D2" android:layout_marginBottom="20dp" android:layout_width="match_parent" android:layout_height="80dp"/>
            <Button android:id="@+id/btnVod" android:text="@string/movies" android:backgroundTint="#388E3C" android:layout_marginBottom="20dp" android:layout_width="match_parent" android:layout_height="80dp"/>
            <Button android:id="@+id/btnSeries" android:text="@string/series" android:backgroundTint="#FBC02D" android:textColor="#000" android:layout_width="match_parent" android:layout_height="80dp"/>
        </LinearLayout>
        EOF

        # ==========================================
        # 3. LIST ACTIVITY (Kanal Listesi - Örnek Veri)
        # ==========================================
        # Not: Gerçek API bağlantısı çok uzun kod gerektirir. 
        # Burada sistemin çalıştığını görmen için manuel bir liste yapısı kuruyoruz.
        # Tıklayınca URL'yi Xtream formatında oluşturur.
        
        cat <<EOF > app/src/main/java/$PATH_NAME/ListActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.ArrayAdapter
        import androidx.appcompat.app.AppCompatActivity
        import com.erdin.player.databinding.ActivityListBinding

        class ListActivity : AppCompatActivity() {
            private lateinit var binding: ActivityListBinding
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                binding = ActivityListBinding.inflate(layoutInflater)
                setContentView(binding.root)

                val type = intent.getStringExtra("type") ?: "live"
                val url = intent.getStringExtra("url")
                val user = intent.getStringExtra("user")
                val pass = intent.getStringExtra("pass")
                
                binding.tvTitle.text = type.uppercase() + " LİSTESİ"

                // ÖRNEK LİSTE (Gerçek uygulamada API'den çekilir)
                val items = listOf("Kanal 1 (Test)", "Kanal 2 (Test)", "Spor 1 (Test)", "Sinema 1 (Test)")
                
                val adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, items)
                binding.listView.adapter = adapter
                
                binding.listView.setOnItemClickListener { _, _, position, _ ->
                    // Xtream URL Oluşturma Mantığı
                    // Canlı: http://dns/live/user/pass/id.ts
                    // Film: http://dns/movie/user/pass/id.mp4
                    
                    val streamId = position + 1 // Test ID
                    var finalUrl = ""
                    
                    if(type == "live") {
                        finalUrl = "\$url/live/\$user/\$pass/\$streamId.ts"
                    } else if (type == "movie") {
                        finalUrl = "\$url/movie/\$user/\$pass/\$streamId.mp4"
                    } else {
                        finalUrl = "\$url/series/\$user/\$pass/\$streamId.mp4"
                    }

                    val intent = Intent(this, PlayerActivity::class.java)
                    intent.putExtra("stream_url", finalUrl)
                    startActivity(intent)
                }
            }
        }
        EOF

        cat <<EOF > app/src/main/res/layout/activity_list.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:background="#222">
            
            <TextView android:id="@+id/tvTitle" android:text="LİSTE" android:textColor="#FFF" android:textSize="22sp" android:padding="20dp" android:gravity="center" android:background="#000"/>
            <ListView android:id="@+id/listView" android:layout_width="match_parent" android:layout_height="match_parent"/>
        </LinearLayout>
        EOF

        # ==========================================
        # 4. PLAYER ACTIVITY (Değişmedi, aynı kaldı)
        # ==========================================
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView
        import $PACKAGE_NAME.R
        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            private lateinit var playerView: PlayerView
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_player)
                playerView = findViewById(R.id.player_view)
                val streamUrl = intent.getStringExtra("stream_url") ?: ""
                initializePlayer(streamUrl)
            }
            private fun initializePlayer(url: String) {
                player = ExoPlayer.Builder(this).build()
                playerView.player = player
                val mediaItem = MediaItem.fromUri(url)
                player!!.setMediaItem(mediaItem)
                player!!.prepare()
                player!!.play()
            }
            override fun onStop() {
                super.onStop()
                player?.release()
                player = null
            }
        }
        EOF

        cat <<EOF > app/src/main/res/layout/activity_player.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
            <androidx.media3.ui.PlayerView android:id="@+id/player_view" android:layout_width="match_parent" android:layout_height="match_parent" />
        </FrameLayout>
        EOF
        
        echo "✅ Gelişmiş sistem dosyaları hazırlandı!"

    - name: 3. Gradle 8.0 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 4. APK Derleme
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon --stacktrace

    - name: 5. APK'yı Yükle
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-xtream
        path: |
          ErdinPlayer/app/build/outputs/apk/release/*.apk
