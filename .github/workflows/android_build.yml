package com.emin.xtream.player.utils

import android.content.Context
import android.util.Log
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL

object RemoteConfig {
    private const val TAG = "RemoteConfig"
    // KENDİ sunucunuza göre güncelleyin:
    private const val CONFIG_URL = "https://creatorapp24.com/erdin/api/config.php"

    @Volatile private var initialized = false
    @Volatile private var bannerId: String? = null
    @Volatile private var interstitialId: String? = null
    @Volatile private var channelInterval: Int = 5
    @Volatile private var bannerListInterval: Int = 8
    @Volatile private var seekSeconds: Int = 15
    @Volatile private var appUpdateUrl: String? = null
    @Volatile private var maintenanceMode: Boolean = false

    fun init(context: Context) {
        if (initialized) return
        synchronized(this) {
            if (initialized) return
            initialized = true
            Thread {
                try {
                    val url = URL(CONFIG_URL)
                    val conn = url.openConnection() as HttpURLConnection
                    conn.connectTimeout = 8000
                    conn.readTimeout = 8000
                    conn.requestMethod = "GET"
                    if (conn.responseCode != HttpURLConnection.HTTP_OK) return@Thread
                    val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                    val obj = JSONObject(body)

                    val ads = obj.optJSONObject("ads") ?: obj
                    bannerId = ads.optString("admob_banner_id").takeIf { it.isNotEmpty() }
                    interstitialId = ads.optString("admob_interstitial_id").takeIf { it.isNotEmpty() }
                    val ci = ads.optInt("channel_interval", 0)
                    if (ci > 0) channelInterval = ci
                    val li = ads.optInt("banner_interval", 0)
                    if (li > 0) bannerListInterval = li

                    val player = obj.optJSONObject("player")
                    if (player != null) {
                        val sk = player.optInt("seek_seconds", 0)
                        if (sk > 0) seekSeconds = sk
                    }

                    appUpdateUrl = obj.optString("update_url").takeIf { it.isNotEmpty() }
                    maintenanceMode = obj.optBoolean("maintenance", false)

                } catch (e: Exception) {
                    Log.w(TAG, "Config load failed: ${e.message}")
                }
            }.start()
        }
    }

    fun getBannerId(context: Context): String {
        init(context)
        return bannerId ?: context.getString(com.emin.xtream.player.R.string.admob_banner_test)
    }

    fun getInterstitialId(context: Context): String {
        init(context)
        return interstitialId ?: context.getString(com.emin.xtream.player.R.string.admob_interstitial_test)
    }

    fun getChannelInterval(context: Context): Int {
        init(context)
        return channelInterval
    }

    fun getBannerListInterval(context: Context): Int {
        init(context)
        return bannerListInterval
    }

    fun getSeekSeconds(): Int = seekSeconds
    fun isMaintenanceMode(): Boolean = maintenanceMode
    fun getUpdateUrl(): String? = appUpdateUrl
}
