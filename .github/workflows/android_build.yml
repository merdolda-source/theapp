        printf '%s\n' '    }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    private fun scheduleHide() {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '        handler.removeCallbacks(hideControls); handler.postDelayed(hideControls, 4000)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    private fun reHide() { showCtrl() }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    override fun dispatchKeyEvent(ev: KeyEvent): Boolean {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '        if (ev.action != KeyEvent.ACTION_DOWN) return super.dispatchKeyEvent(ev)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '        showCtrl()' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '        return when (ev.keyCode) {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER,' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> { togglePlay(); true }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_MEDIA_REWIND ->' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '                if (playType != "LIVE") { seekBy(-seekMs); center("−${seekMs/1000}sn"); true } else false' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_MEDIA_FAST_FORWARD ->' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '                if (playType != "LIVE") { seekBy(seekMs); center("+${seekMs/1000}sn"); true } else false' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            KeyEvent.KEYCODE_DPAD_UP -> {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '                val nv = ((audio?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: 0) + 1).coerceAtMost(maxVol)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '                audio?.setStreamVolume(AudioManager.STREAM_MUSIC, nv, 0)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '                center("🔊 ${nv*100/maxVol}%"); true' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            KeyEvent.KEYCODE_DPAD_DOWN -> {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '                val nv = ((audio?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: 0) - 1).coerceAtLeast(0)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '                audio?.setStreamVolume(AudioManager.STREAM_MUSIC, nv, 0)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '                center("🔊 ${nv*100/maxVol}%"); true' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            KeyEvent.KEYCODE_BACK -> { finish(); true }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '            else -> super.dispatchKeyEvent(ev)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '        }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
