package com.emin.xtream.player.utils

import android.content.Context
import android.os.Build
import android.provider.Settings
import android.util.Log
import java.net.HttpURLConnection
import java.net.URL
import java.net.URLEncoder

object RemoteLogger {
    private const val TAG = "RemoteLogger"
    // KENDİ sunucunuza göre güncelleyin:
    private const val EVENT_URL = "https://creatorapp24.com/erdin/api/event.php"

    fun sendEvent(context: Context, type: String, data: Map<String, String> = emptyMap()) {
        Thread {
            try {
                val appContext = context.applicationContext
                val deviceId = Settings.Secure.getString(
                    appContext.contentResolver, Settings.Secure.ANDROID_ID
                ) ?: "unknown"
                val pkg = appContext.packageName
                val verName = try {
                    appContext.packageManager.getPackageInfo(pkg, 0).versionName ?: "1.0"
                } catch (e: Exception) { "1.0" }

                val allData = mutableMapOf(
                    "type" to type,
                    "device_id" to deviceId,
                    "package" to pkg,
                    "version" to verName,
                    "brand" to (Build.BRAND ?: ""),
                    "model" to (Build.MODEL ?: ""),
                    "os_ver" to Build.VERSION.SDK_INT.toString()
                )
                allData.putAll(data)

                val body = allData.entries.joinToString("&") { (k, v) ->
                    "${URLEncoder.encode(k, "UTF-8")}=${URLEncoder.encode(v, "UTF-8")}"
                }

                val conn = (URL(EVENT_URL).openConnection() as HttpURLConnection).apply {
                    connectTimeout = 8000
                    readTimeout = 8000
                    requestMethod = "POST"
                    doOutput = true
                    setRequestProperty("Content-Type", "application/x-www-form-urlencoded")
                }
                conn.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                conn.responseCode // trigger send
            } catch (e: Exception) {
                Log.w(TAG, "sendEvent failed: ${e.message}")
            }
        }.start()
    }
}
