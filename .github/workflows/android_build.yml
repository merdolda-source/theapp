        EOF

        cat <<EOF > app/src/main/res/color/nav_item_text.xml
        <selector xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:state_checked="true" android:color="@color/accent_green"/>
            <item android:color="@color/white"/>
        </selector>
        EOF

        # --- BOTTOM NAV MENU ---
        cat <<EOF > app/src/main/res/menu/bottom_nav_menu.xml
        <menu xmlns:android="http://schemas.android.com/apk/res/android">
            <item
                android:id="@+id/nav_live"
                android:icon="@android:drawable/ic_media_play"
                android:title="Canlı TV" />
            <item
                android:id="@+id/nav_vod"
                android:icon="@android:drawable/ic_menu_slideshow"
                android:title="Filmler" />
            <item
                android:id="@+id/nav_series"
                android:icon="@android:drawable/ic_menu_agenda"
                android:title="Diziler" />
        </menu>
        EOF

        # --- NAV HEADER ---
        cat <<EOF > app/src/main/res/layout/nav_header.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="12dp"
            android:background="@color/drawer_bg">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:background="@drawable/bg_header_card">

                <TextView
                    android:id="@+id/tvHeaderUser"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="Kullanıcı: -"
                    android:textColor="@color/white"
                    android:textStyle="bold"
                    android:textSize="16sp" />

                <TextView
                    android:id="@+id/tvHeaderExpire"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="Bitiş: -"
                    android:textColor="@color/white"
                    android:textSize="14sp"
                    android:layout_marginTop="4dp" />
