name: ErdinPlayer Pro Ultra Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # ✅ Keystore secrets ENV olarak job'a alındı
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Çekme
      uses: actions/checkout@v4
    
    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. ErdinPlayer Pro Proje Üretimi (Xtream + M3U + Reklamlı + Gesture Player) - SIGNED
      shell: bash
      run: |
        set -e
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"

        # ✅ Eski PASS mantığını bozma ama secrets varsa onları kullan
        PASS="erdin123"
        STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$PASS}"
        KEY_PASS="${ANDROID_KEY_PASSWORD:-$PASS}"
        KEY_ALIAS="${ANDROID_KEY_ALIAS:-key0}"
        
        echo "🚀 EMİN XTREAM Player Projesi Üretiliyor..."

        # Klasör Yapısı
        rm -rf "$APP_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/models"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/adapters"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/utils"
        mkdir -p "$APP_NAME/app/src/main/res/layout"
        mkdir -p "$APP_NAME/app/src/main/res/values"
        mkdir -p "$APP_NAME/app/src/main/res/values-tr"
        mkdir -p "$APP_NAME/app/src/main/res/drawable"
        mkdir -p "$APP_NAME/app/src/main/res/mipmap-hdpi"
        mkdir -p "$APP_NAME/app/src/main/res/menu"
        mkdir -p "$APP_NAME/app/src/main/res/color"
        
        cd "$APP_NAME"

        # İKON
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://i.ibb.co/LDdzzhsk/f564b0ed-277d-489c-9a1a-c59f0fe471fc.png"

        # ✅ KEYSTORE (SECRETS'TEN) -> app/keystore.jks
        if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          echo "🔐 Keystore secrets'ten yazılıyor..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
        else
          echo "⚠️ ANDROID_KEYSTORE_BASE64 yok, local keystore üretilecek."
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Erdin, O=ErdinMedia, C=TR"
        fi

        # --- GRADLE ROOT ---
        echo "include ':app'" > settings.gradle

        cat <<EOF > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # --- APP MODULE GRADLE ---
        mkdir -p app
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            namespace '$PACKAGE_NAME'
            compileSdk 34

            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 35
                versionCode 3
                versionName "1.6.0"
            }

            signingConfigs {
                release {
                    storeFile file("keystore.jks")
                    storePassword "$STORE_PASS"
                    keyAlias "$KEY_ALIAS"
                    keyPassword "$KEY_PASS"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                    signingConfig signingConfigs.release
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.0'
            implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
            implementation 'androidx.media3:media3-exoplayer-hls:1.1.0'
            implementation 'androidx.media3:media3-exoplayer-dash:1.1.0'

            implementation 'com.github.bumptech.glide:glide:4.15.1'

            implementation 'com.google.android.gms:play-services-ads:23.4.0'
        }
        EOF

