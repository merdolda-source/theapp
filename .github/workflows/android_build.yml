        printf '%s\n' '        tvBrightness.text = "☀ ${(newB*100).toInt()}%"; tvBrightness.visibility = View.VISIBLE' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    private fun center(msg: String) {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
