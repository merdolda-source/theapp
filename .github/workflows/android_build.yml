package com.emin.xtream.player

import android.annotation.SuppressLint
import android.content.Intent
import android.os.Bundle
import android.os.Handler
import android.os.Looper
import android.view.View
import android.view.animation.AnimationUtils
import android.widget.ImageView
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity
import com.emin.xtream.player.utils.Prefs

@SuppressLint("CustomSplashScreen")
class SplashActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.decorView.systemUiVisibility =
            View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
        setContentView(R.layout.activity_splash)

        val logo = findViewById<ImageView>(R.id.ivSplashLogo)
        val name = findViewById<TextView>(R.id.tvSplashName)
        val tag  = findViewById<TextView>(R.id.tvSplashTagline)
        val ver  = findViewById<TextView>(R.id.tvSplashVersion)

        runCatching { ver.text = "v${packageManager.getPackageInfo(packageName, 0).versionName}" }
        runCatching { logo.startAnimation(AnimationUtils.loadAnimation(this, R.anim.anim_scale_in)) }
        runCatching { name.startAnimation(AnimationUtils.loadAnimation(this, R.anim.anim_fade_in)) }
        runCatching { tag.startAnimation(AnimationUtils.loadAnimation(this, R.anim.anim_slide_up)) }

        Handler(Looper.getMainLooper()).postDelayed({
            val prefs = Prefs(this)
            val dest = if (prefs.getActivePortal() != null) ContentActivity::class.java
                       else LoginActivity::class.java
            startActivity(Intent(this, dest))
            overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
            finish()
        }, 2000)
    }
}
