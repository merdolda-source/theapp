name: ErdinPlayer Pro Ultra Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Çekme
      uses: actions/checkout@v4
    
    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. ErdinPlayer Pro Proje Üretimi (Xtream + M3U + Reklamlı + Gesture Player)
      run: |
        set -e
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"

        # Şifre & alias:
        PASS="${ANDROID_KEYSTORE_PASSWORD:-erdin123}"
        KEY_ALIAS="${ANDROID_KEYSTORE_ALIAS:-key0}"
        KEY_PASS="${ANDROID_KEY_PASSWORD:-$PASS}"
        
        echo "🚀 ErdinPlayer Pro Projesi Üretiliyor..."

        # Klasör Yapısı
        rm -rf "$APP_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/models"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/adapters"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/utils"
        mkdir -p "$APP_NAME/app/src/main/res/layout"
        mkdir -p "$APP_NAME/app/src/main/res/values"
        mkdir -p "$APP_NAME/app/src/main/res/drawable"
        mkdir -p "$APP_NAME/app/src/main/res/mipmap-hdpi"
        mkdir -p "$APP_NAME/app/src/main/res/menu"
        mkdir -p "$APP_NAME/app/src/main/res/color"
        
        cd "$APP_NAME"

        # İKON
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"

        # KEYSTORE (Secrets varsa onu kullan, yoksa üret)
        mkdir -p app
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "🔐 Keystore secrets'ten alınıyor..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore.jks
        else
          echo "🔐 ANDROID_KEYSTORE_BASE64 bulunamadı, geçici keystore oluşturuluyor..."
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Erdin, O=ErdinMedia, C=TR"
        fi

        # --- GRADLE ROOT ---
        echo "include ':app'" > settings.gradle
        cat <<EOF > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # --- APP MODULE GRADLE ---
        mkdir -p app
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            namespace '$PACKAGE_NAME'
            compileSdk 34

            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.6.0"
            }

            signingConfigs {
                release {
                    storeFile file("keystore.jks")
                    storePassword "$PASS"
                    keyAlias "$KEY_ALIAS"
                    keyPassword "$KEY_PASS"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                    signingConfig signingConfigs.release
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.recyclerview:recyclerview:1.3.0'
            implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
            implementation 'androidx.media3:media3-exoplayer-hls:1.1.0'
            implementation 'androidx.media3:media3-exoplayer-dash:1.1.0'

            implementation 'com.github.bumptech.glide:glide:4.15.1'

            implementation 'com.google.android.gms:play-services-ads:23.4.0'
        }
        EOF

        # --- COLORS / STYLES / STRINGS ---
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <color name="bg_dark">#050608</color>
            <color name="accent_green">#00C853</color>
            <color name="bordo">#801336</color>
            <color name="white">#FFFFFF</color>
            <color name="black">#000000</color>
            <color name="gray_800">#1C1C1E</color>
            <color name="error_red">#FF5252</color>
            <color name="drawer_bg">#0B0D10</color>
            <color name="hint_yellow">#FFD600</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.DayNight.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="android:textColor">@color/white</item>
                <item name="colorAccent">@color/accent_green</item>
                <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                <item name="android:windowFullscreen">true</item>
            </style>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">ErdinPlayer Pro</string>
            <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>
            <string name="admob_banner_test">ca-app-pub-3940256099942544/6300978111</string>
            <string name="admob_interstitial_test">ca-app-pub-3940256099942544/1033173712</string>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_input.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/white"/>
            <corners android:radius="10dp"/>
