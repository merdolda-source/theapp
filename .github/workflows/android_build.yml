package com.emin.xtream.player

import android.content.Intent
import android.os.Bundle
import android.text.Editable
import android.text.TextWatcher
import android.view.Gravity
import android.view.View
import android.widget.*
import androidx.appcompat.app.AlertDialog
import androidx.appcompat.app.AppCompatActivity
import androidx.core.view.GravityCompat
import androidx.drawerlayout.widget.DrawerLayout
import androidx.recyclerview.widget.GridLayoutManager
import androidx.recyclerview.widget.RecyclerView
import com.google.android.gms.ads.AdView
import com.emin.xtream.player.adapters.GridAdapter
import com.emin.xtream.player.models.AccountProfile
import com.emin.xtream.player.models.Category
import com.emin.xtream.player.models.StreamItem
import com.emin.xtream.player.utils.AdsHelper
import com.emin.xtream.player.utils.Prefs
import com.emin.xtream.player.utils.RemoteConfig
import com.emin.xtream.player.utils.RemoteLogger
import org.json.JSONArray
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL
import java.text.SimpleDateFormat
import java.util.*

class ContentActivity : AppCompatActivity() {

    private val FAKE_USER_AGENT = "Mozilla/5.0 (Linux; Android 12; SM-G998B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/108.0.0.0 Mobile Safari/537.36"

    enum class Screen { CATEGORIES, ITEMS }

    private lateinit var prefs: Prefs
    private lateinit var drawer: DrawerLayout
    private lateinit var rv: RecyclerView
    private lateinit var pb: ProgressBar
    private lateinit var tvTitle: TextView
    private lateinit var tvStatus: TextView
    private lateinit var etSearch: EditText
    private lateinit var tvDrawerAccount: TextView
    private lateinit var tvDrawerExpire: TextView
    private lateinit var gridAdapter: GridAdapter

    private var currentMode = "LIVE"
    private var screen = Screen.CATEGORIES
    private var selectedCategory: Category? = null
    private var activeAcc: AccountProfile? = null

    private var categoriesAll: List<Category> = emptyList()
    private var streamsAll: List<StreamItem> = emptyList()
    private var filteredCategoryIds: List<String> = emptyList()
    private var filteredStreamIdx: List<Int> = emptyList()
    private var displayTitles = ArrayList<String>()
    private var displaySubtitles = ArrayList<String>()
    private var displayBadges = ArrayList<String>()
    private var displayMapIndex = ArrayList<Int>()
    private var displayMapType = "CAT"
    private var categoriesScrollPos = 0
    private var itemsScrollPos = 0

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_content)

        prefs = Prefs(this)
        activeAcc = prefs.getActive()

        if (activeAcc == null) {
            startActivity(Intent(this, LoginActivity::class.java))
            finish()
            return
        }

        AdsHelper.init(this)
        AdsHelper.loadBanner(findViewById(R.id.adViewContent))
        AdsHelper.loadInterstitial(this)

        initViews()
        setupDrawer()
        setupModeSelector()
        setupSearch()

        currentMode = prefs.getLastMode()
        fetchCategoriesAndStreams()
    }

    private fun initViews() {
        drawer = findViewById(R.id.drawerLayout)
        rv = findViewById(R.id.rvGrid)
        pb = findViewById(R.id.progressBar)
        tvTitle = findViewById(R.id.tvTitle)
        tvStatus = findViewById(R.id.tvStatus)
        etSearch = findViewById(R.id.etSearch)
        tvDrawerAccount = findViewById(R.id.tvDrawerAccount)
        tvDrawerExpire = findViewById(R.id.tvDrawerExpire)

        val layoutManager = GridLayoutManager(this, 2)
        rv.layoutManager = layoutManager
        gridAdapter = GridAdapter(emptyList(), emptyList(), emptyList()) { pos -> onGridClick(pos) }
        rv.adapter = gridAdapter
    }

    private fun setupDrawer() {
        val acc = activeAcc ?: return
        tvDrawerAccount.text = acc.name
        tvDrawerExpire.text = "Süre: Yükleniyor..."

        // Hesap değiştir
        findViewById<View>(R.id.btnSwitchAccount).setOnClickListener {
            drawer.closeDrawer(GravityCompat.START)
            startActivity(Intent(this, LoginActivity::class.java))
            finish()
        }

        // Çıkış
        findViewById<View>(R.id.btnLogout).setOnClickListener {
            AlertDialog.Builder(this)
                .setTitle("Hesaptan Çık")
                .setMessage("Bu hesaptan çıkmak istiyor musunuz?")
                .setPositiveButton("Çık") { _, _ ->
                    prefs.clearActive()
                    startActivity(Intent(this, LoginActivity::class.java))
                    finish()
                }
                .setNegativeButton("İptal", null)
                .show()
        }

        // Ayarlar
        findViewById<View>(R.id.btnSettings).setOnClickListener {
            drawer.closeDrawer(GravityCompat.START)
            // Ayarlar diyaloğu
            showSettingsDialog()
        }

        // Menü butonu
        findViewById<View>(R.id.btnMenu).setOnClickListener {
            if (drawer.isDrawerOpen(GravityCompat.START)) drawer.closeDrawer(GravityCompat.START)
            else drawer.openDrawer(GravityCompat.START)
        }
    }

    private fun showSettingsDialog() {
        val items = arrayOf("Seek Süresi: ${prefs.getSeekSeconds()}sn", "Hesap Ekle", "Tüm Hesaplar")
        AlertDialog.Builder(this)
            .setTitle("Ayarlar")
            .setItems(items) { _, which ->
                when (which) {
                    0 -> showSeekDialog()
                    1 -> { startActivity(Intent(this, LoginActivity::class.java)); finish() }
                    2 -> showAccountsDialog()
                }
            }
            .show()
    }

    private fun showSeekDialog() {
        val options = arrayOf("5 saniye", "10 saniye", "15 saniye", "30 saniye", "60 saniye")
        val values = intArrayOf(5, 10, 15, 30, 60)
        AlertDialog.Builder(this)
            .setTitle("Seek Süresi")
            .setItems(options) { _, which ->
                prefs.setSeekSeconds(values[which])
                Toast.makeText(this, "Seek: ${values[which]}sn ayarlandı", Toast.LENGTH_SHORT).show()
            }
            .show()
    }

    private fun showAccountsDialog() {
        val accounts = prefs.getAccounts()
        val names = accounts.map { "${it.name} (${it.type})" }.toTypedArray()
        AlertDialog.Builder(this)
            .setTitle("Hesaplar")
            .setItems(names) { _, which ->
                val acc = accounts[which]
                prefs.setActive(acc.id)
                activeAcc = prefs.getActive()
                drawer.closeDrawer(GravityCompat.START)
                fetchCategoriesAndStreams()
            }
            .show()
    }

    private fun setupModeSelector() {
        val btnLive = findViewById<View>(R.id.btnModeLive)
        val btnVod = findViewById<View>(R.id.btnModeVod)
        val btnSeries = findViewById<View>(R.id.btnModeSeries)

        fun updateModeUI() {
            btnLive.setBackgroundResource(if (currentMode == "LIVE") R.drawable.bg_tab_selected else R.drawable.bg_tab_unselected)
            btnVod.setBackgroundResource(if (currentMode == "VOD") R.drawable.bg_tab_selected else R.drawable.bg_tab_unselected)
            btnSeries.setBackgroundResource(if (currentMode == "SERIES") R.drawable.bg_tab_selected else R.drawable.bg_tab_unselected)
        }

        btnLive.setOnClickListener { if (currentMode != "LIVE") { currentMode = "LIVE"; prefs.setLastMode("LIVE"); updateModeUI(); resetAndFetch() } }
        btnVod.setOnClickListener { if (currentMode != "VOD") { currentMode = "VOD"; prefs.setLastMode("VOD"); updateModeUI(); resetAndFetch() } }
        btnSeries.setOnClickListener { if (currentMode != "SERIES") { currentMode = "SERIES"; prefs.setLastMode("SERIES"); updateModeUI(); resetAndFetch() } }

        updateModeUI()
    }

    private fun setupSearch() {
        etSearch.addTextChangedListener(object : TextWatcher {
            override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
            override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
            override fun afterTextChanged(s: Editable?) {
                val q = s?.toString() ?: ""
                if (q.length >= 2) applyGlobalSearch(q) else applySearchFilter(q)
            }
        })

        // Temizle butonu
        val btnClearSearch = findViewById<ImageButton>(R.id.btnClearSearch)
        etSearch.addTextChangedListener(object : TextWatcher {
            override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
            override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {
                btnClearSearch.visibility = if (s.isNullOrEmpty()) View.GONE else View.VISIBLE
            }
            override fun afterTextChanged(s: Editable?) {}
        })
        btnClearSearch.setOnClickListener { etSearch.setText("") }
    }

    private fun resetAndFetch() {
        categoriesAll = emptyList()
        streamsAll = emptyList()
        screen = Screen.CATEGORIES
        selectedCategory = null
        fetchCategoriesAndStreams()
    }

    override fun onBackPressed() {
        if (drawer.isDrawerOpen(GravityCompat.START)) {
            drawer.closeDrawer(GravityCompat.START)
            return
        }
        if (screen == Screen.ITEMS) {
            if (etSearch.text.isNotEmpty()) {
                etSearch.setText("")
                return
            }
            showCategories()
            return
        }
        super.onBackPressed()
    }

    private fun showCategories() {
        if (screen == Screen.ITEMS) itemsScrollPos = (rv.layoutManager as? GridLayoutManager)?.findFirstVisibleItemPosition() ?: 0
        screen = Screen.CATEGORIES
        selectedCategory = null
        tvTitle.text = when (currentMode) { "VOD" -> "Filmler"; "SERIES" -> "Diziler"; else -> "Canlı TV" }
        applySearchFilter(etSearch.text?.toString() ?: "")
        (rv.layoutManager as? GridLayoutManager)?.scrollToPositionWithOffset(categoriesScrollPos, 0)
    }

    private fun showItemsForCategory(cat: Category) {
        if (screen == Screen.CATEGORIES) categoriesScrollPos = (rv.layoutManager as? GridLayoutManager)?.findFirstVisibleItemPosition() ?: 0
        selectedCategory = cat
        screen = Screen.ITEMS
        tvTitle.text = cat.category_name
        applySearchFilter(etSearch.text?.toString() ?: "")
        (rv.layoutManager as? GridLayoutManager)?.scrollToPositionWithOffset(0, 0)
    }

    private fun applyGlobalSearch(qRaw: String) {
        val q = qRaw.trim().lowercase(Locale.getDefault())
        screen = Screen.ITEMS
        displayMapType = "STREAM"
        val filtered = streamsAll.filter { it.name.lowercase(Locale.getDefault()).contains(q) }
        filteredStreamIdx = filtered.map { streamsAll.indexOf(it) }
        val adInterval = RemoteConfig.getBannerListInterval(this)
        val tempT = ArrayList<String>(); val tempS = ArrayList<String>()
        val tempB = ArrayList<String>(); val tempI = ArrayList<Int>()
        var count = 0
        for (i in filtered.indices) {
            tempT.add(filtered[i].name); tempS.add(""); tempB.add(currentMode); tempI.add(i)
            count++
            if (adInterval > 0 && count % adInterval == 0) { tempT.add("###AD###"); tempS.add(""); tempB.add(""); tempI.add(-1) }
        }
        displayTitles = tempT; displaySubtitles = tempS; displayBadges = tempB; displayMapIndex = tempI
        gridAdapter.update(displayTitles, displaySubtitles, displayBadges)
        tvTitle.text = "Arama: $qRaw (${filtered.size})"
    }

    private fun applySearchFilter(qRaw: String) {
        val q = qRaw.trim().lowercase(Locale.getDefault())
        val adInterval = RemoteConfig.getBannerListInterval(this)
        val tempT = ArrayList<String>(); val tempS = ArrayList<String>()
        val tempB = ArrayList<String>(); val tempI = ArrayList<Int>()
        if (screen == Screen.CATEGORIES) {
            displayMapType = "CAT"
            val cats = if (q.isEmpty()) categoriesAll else categoriesAll.filter { it.category_name.lowercase().contains(q) }
            filteredCategoryIds = cats.map { it.category_id }
            var count = 0
            for (i in cats.indices) {
                tempT.add(cats[i].category_name); tempS.add(""); tempB.add(""); tempI.add(i)
                count++
                if (adInterval > 0 && count % adInterval == 0) { tempT.add("###AD###"); tempS.add(""); tempB.add(""); tempI.add(-1) }
            }
        } else {
            displayMapType = "STREAM"
            val catId = selectedCategory?.category_id
            val items = if (catId.isNullOrEmpty()) streamsAll else streamsAll.filter { it.category_id == catId }
            val filtered = if (q.isEmpty()) items else items.filter { it.name.lowercase().contains(q) }
            filteredStreamIdx = filtered.map { streamsAll.indexOf(it) }
            var count = 0
            for (i in filtered.indices) {
                tempT.add(filtered[i].name); tempS.add(""); tempB.add(currentMode); tempI.add(i)
                count++
                if (adInterval > 0 && count % adInterval == 0) { tempT.add("###AD###"); tempS.add(""); tempB.add(""); tempI.add(-1) }
            }
        }
        displayTitles = tempT; displaySubtitles = tempS; displayBadges = tempB; displayMapIndex = tempI
        gridAdapter.update(displayTitles, displaySubtitles, displayBadges)
    }

    private fun onGridClick(position: Int) {
        if (position < 0 || position >= displayMapIndex.size) return
        val realIndex = displayMapIndex[position]
        if (realIndex == -1) return
        val acc = activeAcc ?: return

        if (screen == Screen.CATEGORIES) {
            if (realIndex < filteredCategoryIds.size) {
                val catId = filteredCategoryIds[realIndex]
                val cat = categoriesAll.find { it.category_id == catId } ?: return
                showItemsForCategory(cat)
            }
            return
        }

        if (realIndex >= filteredStreamIdx.size) return
        val globalIdx = filteredStreamIdx[realIndex]
        if (globalIdx !in streamsAll.indices) return
        val item = streamsAll[globalIdx]

        if (acc.type == "M3U") {
            val url = item.full_url ?: return
            val itn = Intent(this, PlayerActivity::class.java).apply {
                putExtra("URL", url); putExtra("TITLE", item.name)
                putExtra("REF", item.referer ?: ""); putExtra("ORG", item.origin ?: "")
                putExtra("TYPE", "LIVE")
            }
            AdsHelper.maybeShowOnChannelClick(this) {
                RemoteLogger.sendEvent(this, "play_m3u", mapOf("name" to item.name))
                startActivity(itn)
            }
            return
        }

        if (currentMode == "SERIES" && item.series_id != null) {
            val itn = Intent(this, SeriesDetailActivity::class.java).apply {
                putExtra("SERIES_ID", item.series_id); putExtra("SERIES_NAME", item.name)
            }
            startActivity(itn)
            return
        }

        val baseUrl = prefs.buildBaseUrl(acc)
        val user = (acc.user ?: "").trim()
        val pass = acc.pass?.trim() ?: ""
        val path = if (currentMode == "LIVE") "live" else "movie"
        val ext = if (currentMode == "LIVE") ".ts" else ".${item.container_extension ?: "mp4"}"
        val id = item.stream_id ?: ""
        val playUrl = "$baseUrl/$path/$user/$pass/$id$ext"
        val itn = Intent(this, PlayerActivity::class.java).apply {
            putExtra("URL", playUrl); putExtra("TITLE", item.name)
            putExtra("REF", ""); putExtra("ORG", "")
            putExtra("TYPE", if (currentMode == "LIVE") "LIVE" else "VOD")
        }
        AdsHelper.maybeShowOnChannelClick(this) {
            RemoteLogger.sendEvent(this, "play_xtream", mapOf("name" to item.name, "mode" to currentMode))
            startActivity(itn)
        }
    }

    private fun fetchCategoriesAndStreams() {
        val acc = activeAcc ?: return
        pb.visibility = View.VISIBLE
        tvStatus.visibility = View.GONE
        rv.visibility = View.GONE

        if (acc.type == "M3U") {
            val m3uUrl = acc.m3u?.trim() ?: ""
            if (m3uUrl.isEmpty()) {
                showError("M3U URL bulunamadı")
                return
            }
            Thread {
                try {
                    val result = fetchM3u(m3uUrl)
                    runOnUiThread {
                        pb.visibility = View.GONE
                        rv.visibility = View.VISIBLE
                        categoriesAll = result.first
                        streamsAll = result.second
                        tvDrawerExpire.text = "M3U Playlist · ${streamsAll.size} kanal"
                        showCategories()
                    }
                } catch (e: Exception) {
                    runOnUiThread { showError("M3U yüklenemedi: ${e.message}") }
                }
            }.start()
            return
        }

        val baseUrl = prefs.buildBaseUrl(acc)
        val user = (acc.user ?: "").trim()
        val pass = acc.pass?.trim() ?: ""
        if (baseUrl.isEmpty() || user.isEmpty()) { showError("Hesap bilgileri eksik"); return }

        val apiBase = "$baseUrl/player_api.php?username=$user&password=$pass"
        val catAction = when (currentMode) { "VOD" -> "get_vod_categories"; "SERIES" -> "get_series_categories"; else -> "get_live_categories" }
        val streamAction = when (currentMode) { "VOD" -> "get_vod_streams"; "SERIES" -> "get_series"; else -> "get_live_streams" }

        Thread {
            try {
                val info = fetchAccountInfo(apiBase)
                val cats = fetchCategories("$apiBase&action=$catAction")
                val streams = fetchStreams("$apiBase&action=$streamAction")
                runOnUiThread {
                    pb.visibility = View.GONE
                    rv.visibility = View.VISIBLE
                    categoriesAll = cats
                    streamsAll = streams
                    tvDrawerExpire.text = "Bitiş: ${formatExp(info.second)}"
                    showCategories()
                }
            } catch (e: Exception) {
                runOnUiThread { showError("Veriler alınamadı: ${e.message}") }
            }
        }.start()
    }

    private fun showError(msg: String) {
        pb.visibility = View.GONE
        rv.visibility = View.GONE
        tvStatus.text = msg
        tvStatus.visibility = View.VISIBLE
    }

    private fun fetchM3u(urlStr: String): Pair<List<Category>, List<StreamItem>> {
        val catsMap = LinkedHashMap<String, Category>()
        val streams = ArrayList<StreamItem>()
        val body = httpGet(urlStr)
        val lines = body.split("\n")
        var curName = ""
        var curGroup = "Genel"
        var curRef: String? = null
        var curOrg: String? = null
        for (rawLine in lines) {
            val line = rawLine.trim()
            if (line.isEmpty() || line.startsWith("#EXTM3U", true)) continue
            if (line.startsWith("#EXTINF", true)) {
                val groupIdx = line.indexOf("group-title=\"")
                if (groupIdx >= 0) {
                    val s = groupIdx + "group-title=\"".length
                    val e = line.indexOf("\"", s)
                    if (e > s) curGroup = line.substring(s, e)
                }
                val comma = line.lastIndexOf(',')
                curName = if (comma >= 0 && comma < line.length - 1) line.substring(comma + 1).trim() else "Kanal"
                val refIdx = line.indexOf("tvg-referrer=\"")
                curRef = if (refIdx >= 0) { val s = refIdx + "tvg-referrer=\"".length; val e = line.indexOf("\"", s); if (e > s) line.substring(s, e) else null } else null
            } else if (!line.startsWith("#") && line.isNotEmpty()) {
                if (!catsMap.containsKey(curGroup)) catsMap[curGroup] = Category(curGroup, curGroup)
                streams.add(StreamItem(curName, null, null, null, curGroup, line, curRef, curOrg))
                curName = ""; curGroup = "Genel"; curRef = null; curOrg = null
            }
        }
        return Pair(catsMap.values.toList(), streams)
    }

    private fun fetchAccountInfo(apiBase: String): Pair<String, Long> {
        return try {
            val body = httpGet("$apiBase&action=get_user_info")
            val obj = JSONObject(body)
            val info = obj.optJSONObject("user_info")
            val username = info?.optString("username") ?: ""
            val exp = info?.optLong("exp_date") ?: 0L
            Pair(username, exp)
        } catch (e: Exception) { Pair("", 0L) }
    }

    private fun fetchCategories(url: String): List<Category> {
        val body = httpGet(url)
        val arr = JSONArray(body)
        return (0 until arr.length()).map { i ->
            val o = arr.getJSONObject(i)
            Category(o.optString("category_id", "$i"), o.optString("category_name", "Kategori"))
        }
    }

    private fun fetchStreams(url: String): List<StreamItem> {
        val body = httpGet(url)
        val arr = JSONArray(body)
        return (0 until arr.length()).map { i ->
            val o = arr.getJSONObject(i)
            StreamItem(
                name = o.optString("name", ""),
                stream_id = o.optString("stream_id").takeIf { it.isNotEmpty() },
                series_id = o.optString("series_id").takeIf { it.isNotEmpty() },
                container_extension = o.optString("container_extension").takeIf { it.isNotEmpty() },
                category_id = o.optString("category_id").takeIf { it.isNotEmpty() },
                full_url = null, referer = null, origin = null,
                stream_icon = o.optString("stream_icon").takeIf { it.isNotEmpty() },
                rating = o.optString("rating").takeIf { it.isNotEmpty() }
            )
        }
    }

    private fun httpGet(urlStr: String): String {
        val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
            connectTimeout = 20000; readTimeout = 30000
            requestMethod = "GET"
            setRequestProperty("User-Agent", FAKE_USER_AGENT)
        }
        if (conn.responseCode != HttpURLConnection.HTTP_OK) throw Exception("HTTP ${conn.responseCode}")
        return conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
    }

    private fun formatExp(ts: Long): String {
        if (ts <= 0L) return "Süresiz"
        return try {
            val sdf = SimpleDateFormat("dd.MM.yyyy", Locale.getDefault())
            sdf.format(Date(ts * 1000))
        } catch (e: Exception) { "?" }
    }
}
