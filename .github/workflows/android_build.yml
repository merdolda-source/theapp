    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon

    - name: 6. Build AAB (Play Store)
      run: |
        cd ErdinPlayer
        gradle bundleRelease --no-daemon

    - name: 7. APK + AAB'yi GitHub Artifact Olarak Yükle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Ultra
        path: |
          ErdinPlayer/app/build/outputs/apk/release/*.apk
          ErdinPlayer/app/build/outputs/bundle/release/*.aab

    - name: 8. Artifact URL'ini Göster
      run: |
        echo "====================================="
        echo " 📦 APK + AAB Artifact URL (GitHub):"
        echo "${{ steps.upload_apk.outputs.artifact-url }}"
        echo "====================================="

        echo "### ErdinPlayer Pro (APK + AAB)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [Dosyaları buradan indir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
