                android:textStyle='bold'/>
            <androidx.recyclerview.widget.RecyclerView
                android:id='@+id/rvContent'
                android:layout_width='match_parent'
                android:layout_height='match_parent'
                android:padding='8dp'/>
        </LinearLayout>" > app/src/main/res/layout/activity_content.xml

        echo "<LinearLayout xmlns:android='http://schemas.android.com/apk/res/android'
            android:layout_width='match_parent'
            android:layout_height='match_parent'
            android:orientation='vertical'
            android:background='#0A0A0A'>
            <TextView
                android:id='@+id/tvSeriesTitle'
                android:layout_width='match_parent'
                android:layout_height='wrap_content'
                android:textColor='#00E676'
                android:textSize='22sp'
                android:padding='20dp'
                android:textStyle='bold'/>
            <ListView
                android:id='@+id/lvEpisodes'
                android:layout_width='match_parent'
                android:layout_height='match_parent'
                android:divider='#222222'
                android:dividerHeight='1dp'/>
        </LinearLayout>" > app/src/main/res/layout/activity_series_detail.xml

        echo "<FrameLayout xmlns:android='http://schemas.android.com/apk/res/android'
            android:layout_width='match_parent'
            android:layout_height='match_parent'
            android:background='#000000'>
            <androidx.media3.ui.PlayerView
                android:id='@+id/pvMain'
                android:layout_width='match_parent'
                android:layout_height='match_parent'/>
        </FrameLayout>" > app/src/main/res/layout/activity_player_pro.xml

        # --- MANIFEST ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:theme="@style/Theme.ErdinPlayer"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:usesCleartextTraffic="true">

                <activity
                    android:name=".LoginActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>

                <activity android:name=".DashboardActivity" />
                <activity android:name=".ContentActivity" />
                <activity android:name=".SeriesDetailActivity" />
                <activity android:name=".PlayerActivity" />
            </application>
        </manifest>
        EOF

    - name: 4. Gradle Derleme
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon

    - name: 6. APK'yi GitHub Artifact Olarak Yükle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Ultra
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk

    - name: 7. Artifact URL'ini Göster
      run: |
        echo "====================================="
        echo " 📦 APK Artifact URL (GitHub):"
        echo "${{ steps.upload_apk.outputs.artifact-url }}"
        echo "====================================="

        echo "### ErdinPlayer Pro APK" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [APK'yi buradan indir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
