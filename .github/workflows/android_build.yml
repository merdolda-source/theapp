    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK + AAB (Release)
      run: |
        cd EminXtreamPlayer
        gradle assembleRelease --no-daemon
        gradle bundleRelease --no-daemon

    - name: 6. APK Yükle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: EminXtream-Player-Pro-APK
        path: EminXtreamPlayer/app/build/outputs/apk/release/*.apk

    - name: 7. AAB Yükle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: EminXtream-Player-Pro-AAB
        path: EminXtreamPlayer/app/build/outputs/bundle/release/*.aab

    - name: 8. URL'leri Göster
      run: |
        echo "====================================="
        echo " 📦 APK: ${{ steps.upload_apk.outputs.artifact-url }}"
        echo " 📦 AAB: ${{ steps.upload_aab.outputs.artifact-url }}"
        echo "====================================="
        echo "### EminXtream Player Pro v3.0 Çıktılar" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [APK İndir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [AAB İndir](${{ steps.upload_aab.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
