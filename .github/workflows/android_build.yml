    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK + AAB (Release / Signed)
      run: |
        cd ErdinXtream
        gradle assembleRelease --no-daemon
        gradle bundleRelease --no-daemon

    - name: 6. APK'yi GitHub Artifact Olarak YÃ¼kle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinXtream-Pro-v3-APK
        path: ErdinXtream/app/build/outputs/apk/release/*.apk

    - name: 7. AAB'yi GitHub Artifact Olarak YÃ¼kle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: ErdinXtream-Pro-v3-AAB
        path: ErdinXtream/app/build/outputs/bundle/release/*.aab

    - name: 8. Artifact URL'lerini GÃ¶ster
      run: |
        echo "====================================="
        echo " ğŸ“¦ APK Artifact URL (GitHub):"
        echo "${{ steps.upload_apk.outputs.artifact-url }}"
        echo "-------------------------------------"
        echo " ğŸ“¦ AAB Artifact URL (GitHub):"
        echo "${{ steps.upload_aab.outputs.artifact-url }}"
        echo "====================================="

        echo "### ErdinXtream Player Pro v3 Ã‡Ä±ktÄ±lar" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "ğŸ”— [APK'yi buradan indir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "ğŸ”— [AAB'yi buradan indir](${{ steps.upload_aab.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
