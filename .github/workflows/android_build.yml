name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manuel tetikleme butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek (Checkout)
      uses: actions/checkout@v4

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle İzinlerini Ayarla
      # Klasör adı olmadan direkt gradlew'e yetki veriyoruz
      run: chmod +x gradlew || true 

    - name: Gradle Kur ve Derle (İmzalı)
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.2'
        arguments: assembleRelease
        # 'build-root-directory' satırını SİLDİK. Artık ana dizinde çalışacak.

    - name: Dosya Kontrolü (Debug)
      # Eğer APK oluşmazsa nedenini görmek için dosya listesini basar
      if: failure()
      run: ls -R app/build/outputs/apk/

    - name: APK'yı Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-release
        # Yolu ana dizine göre güncelledik
        path: app/build/outputs/apk/release/app-release.apk
