                headerExpire = headerView.findViewById(R.id.tvHeaderExpire)

                tvHeader.setOnClickListener {
                    drawer.openDrawer(GravityCompat.START)
                }

                navView.setNavigationItemSelectedListener { item ->
                    val idx = item.itemId
                    if (idx in categories.indices) {
                        val cat = categories[idx]
                        item.isChecked = true
                        filterAndShow(cat.category_id)
                        drawer.closeDrawer(GravityCompat.START)
                        true
                    } else {
                        false
                    }
                }

                activeAcc = prefs.getActive()
                if (activeAcc == null) {
                    tvStatus.text = "Kayıtlı hesap bulunamadı. Önce giriş ekranından hesap ekleyin."
                    tvStatus.visibility = View.VISIBLE
                    return
                }
                accountType = activeAcc?.type ?: "XTREAM"

                // AdMob init + banner + interstitial
                MobileAds.initialize(this) { }
                prepareAds()

                bottomNav.setOnItemSelectedListener { item ->
                    if (accountType == "M3U") {
                        when (item.itemId) {
                            R.id.nav_live -> {
                                loadMode("LIVE")
                                true
                            }
                            else -> {
                                Toast.makeText(
                                    this,
                                    "M3U hesabında sadece Canlı TV listesi gösterilir.",
                                    Toast.LENGTH_SHORT
                                ).show()
                                false
                            }
                        }
                    } else {
                        when (item.itemId) {
                            R.id.nav_live -> { loadMode("LIVE"); true }
                            R.id.nav_vod -> { loadMode("VOD"); true }
                            R.id.nav_series -> { loadMode("SERIES"); true }
                            else -> false
                        }
                    }
                }

                bottomNav.selectedItemId = R.id.nav_live
                loadMode("LIVE")

                // Açılış reklamı kontrolü
                showLaunchAdIfNeeded()
            }

            private fun prepareAds() {
                val adView = findViewById<AdView>(R.id.adView)
                val adRequest = AdRequest.Builder().build()
                adView.adUnitId = BANNER_AD_UNIT_ID
                adView.loadAd(adRequest)

                loadInterstitial()
            }

            private fun loadInterstitial() {
                val request = AdRequest.Builder().build()
                InterstitialAd.load(
                    this,
                    INTERSTITIAL_AD_UNIT_ID,
                    request,
                    object : InterstitialAdLoadCallback() {
                        override fun onAdLoaded(ad: InterstitialAd) {
                            interstitial = ad
                        }

                        override fun onAdFailedToLoad(error: LoadAdError) {
                            interstitial = null
                        }
                    }
                )
            }

            private fun showInterstitial() {
                val ad = interstitial
                if (ad != null) {
                    ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                        override fun onAdDismissedFullScreenContent() {
                            interstitial = null
                            loadInterstitial()
                        }

                        override fun onAdFailedToShowFullScreenContent(adError: AdError) {
                            interstitial = null
                            loadInterstitial()
                        }
                    }
                    ad.show(this)
                } else {
                    loadInterstitial()
                }
            }

            private fun showLaunchAdIfNeeded() {
                launchCount++
                if (LAUNCH_AD_INTERVAL > 0 && launchCount % LAUNCH_AD_INTERVAL == 0) {
                    showInterstitial()
                }
            }

            private fun showChannelAdIfNeeded() {
                channelClickCount++
                if (CHANNEL_AD_INTERVAL > 0 && channelClickCount % CHANNEL_AD_INTERVAL == 0) {
                    showInterstitial()
                }
            }

            private fun loadMode(mode: String) {
                currentMode = if (accountType == "M3U") "LIVE" else mode
                tvHeader.text = when (currentMode) {
                    "VOD" -> "☰ Filmler"
                    "SERIES" -> "☰ Diziler"
                    else -> "☰ Canlı TV"
                }
                fetchCategoriesAndStreams()
            }

            private fun fetchCategoriesAndStreams() {
                val acc = activeAcc
                if (acc == null) {
                    tvStatus.text = "Aktif hesap yok."
                    tvStatus.visibility = View.VISIBLE
                    return
                }

                if (acc.type == "M3U") {
                    val m3uUrl = acc.m3u?.trim() ?: ""
                    if (m3uUrl.isEmpty()) {
                        tvStatus.text = "Bu M3U hesabında link bulunamadı."
                        tvStatus.visibility = View.VISIBLE
                        return
                    }

                    pb.visibility = View.VISIBLE
                    tvStatus.visibility = View.GONE

                    Thread {
                        try {
                            val result = fetchM3u(m3uUrl)
                            val cats = result.first
                            val streamsList = result.second

                            runOnUiThread {
                                pb.visibility = View.GONE
                                categories = cats
                                streams = streamsList

                                headerUser.text = "Hesap: " + acc.name
                                headerExpire.text = "M3U Playlist"

                                populateDrawerCategories()
                                if (categories.isNotEmpty()) {
                                    filterAndShow(categories[0].category_id)
                                } else {
                                    filterAndShow(null)
                                }
                            }
                        } catch (e: Exception) {
                            e.printStackTrace()
                            runOnUiThread {
                                pb.visibility = View.GONE
                                tvStatus.text = "M3U okunamadı: " + (e.message ?: "bilinmeyen hata")
                                tvStatus.visibility = View.VISIBLE
                            }
                        }
                    }.start()
                } else {
                    val dnsRaw = acc.dns?.trim() ?: ""
                    val user = acc.user?.trim() ?: ""
                    val pass = acc.pass?.trim() ?: ""

                    if (dnsRaw.isEmpty() || user.isEmpty() || pass.isEmpty()) {
                        tvStatus.text = "DNS / kullanıcı / şifre boş. Giriş ekranına dönün."
                        tvStatus.visibility = View.VISIBLE
                        return
                    }

                    val dns = if (dnsRaw.endsWith("/")) dnsRaw.substring(0, dnsRaw.length - 1) else dnsRaw
                    val base = dns + "/player_api.php?username=" + user + "&password=" + pass

                    val catAction = when (currentMode) {
                        "VOD" -> "get_vod_categories"
                        "SERIES" -> "get_series_categories"
                        else -> "get_live_categories"
                    }

                    val streamsAction = when (currentMode) {
                        "VOD" -> "get_vod_streams"
                        "SERIES" -> "get_series"
                        else -> "get_live_streams"
                    }

                    val catUrl = base + "&action=" + catAction
                    val streamsUrl = base + "&action=" + streamsAction

                    pb.visibility = View.VISIBLE
                    tvStatus.visibility = View.GONE

                    Thread {
                        try {
                            val accInfo = fetchAccountInfo(base)
                            val fetchedCategories = fetchCategories(catUrl)
                            val fetchedStreams = fetchStreams(streamsUrl)

                            runOnUiThread {
                                pb.visibility = View.GONE
                                categories = fetchedCategories
                                streams = fetchedStreams

                                val nameToShow = if (acc.name.isNotEmpty()) acc.name else (accInfo.first ?: user)
                                val expText = formatExp(accInfo.second)

                                headerUser.text = "Kullanıcı: " + nameToShow
                                headerExpire.text = "Bitiş: " + expText

                                populateDrawerCategories()
                                if (categories.isNotEmpty()) {
                                    filterAndShow(categories[0].category_id)
                                } else {
                                    filterAndShow(null)
                                }
                            }
                        } catch (e: Exception) {
                            e.printStackTrace()
                            runOnUiThread {
                                pb.visibility = View.GONE
                                tvStatus.text = "Veriler alınamadı: " + (e.message ?: "bilinmeyen hata")
                                tvStatus.visibility = View.VISIBLE
                            }
                        }
                    }.start()
                }
            }

            private fun fetchM3u(urlStr: String): Pair<List<Category>, List<StreamItem>> {
                val categoriesMap = LinkedHashMap<String, Category>()
                val streamsList = ArrayList<StreamItem>()

                val url = URL(urlStr)
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000
                conn.readTimeout = 20000
                conn.requestMethod = "GET"

                val code = conn.responseCode
                if (code != HttpURLConnection.HTTP_OK) {
                    return Pair(emptyList(), emptyList())
                }

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val lines = body.split("\n")

                var currentName = ""
                var currentGroup = "Genel"
                var currentRef: String? = null
                var currentOrg: String? = null

                for (raw in lines) {
                    val line = raw.trim()
                    if (line.isEmpty()) continue

                    if (line.startsWith("#EXTM3U", ignoreCase = true)) continue

                    if (line.startsWith("#EXTINF", ignoreCase = true)) {
                        var name = ""
                        var group = "Genel"

                        // group-title / group_title / tvg-group / tvg_group vs.
                        val keys = arrayOf(
                            "group-title=\"",
                            "group_title=\"",
                            "tvg-group=\"",
                            "tvg_group=\""
                        )
                        for (k in keys) {
                            val idx = line.indexOf(k)
                            if (idx >= 0) {
                                val start = idx + k.length
                                val end = line.indexOf("\"", startIndex = start)
                                if (end > start) {
                                    group = line.substring(start, end)
                                    break
                                }
                            }
                        }

                        val commaIndex = line.lastIndexOf(',')
                        if (commaIndex >= 0 && commaIndex < line.length - 1) {
                            name = line.substring(commaIndex + 1).trim()
                        }

                        currentName = if (name.isNotEmpty()) name else "Kanal"
                        currentGroup = if (group.isNotEmpty()) group else "Genel"
                        currentRef = null
                        currentOrg = null
                    } else if (line.startsWith("#EXTVLCOPT:http-referrer=", ignoreCase = true)) {
                        val idx = line.indexOf("=")
                        if (idx >= 0 && idx < line.length - 1) {
                            currentRef = line.substring(idx + 1).trim()
                        }
                    } else if (line.startsWith("#EXTVLCOPT:http-origin=", ignoreCase = true)) {
                        val idx = line.indexOf("=")
                        if (idx >= 0 && idx < line.length - 1) {
                            currentOrg = line.substring(idx + 1).trim()
                        }
                    } else if (!line.startsWith("#")) {
                        val urlPlay = line
                        val groupId = if (currentGroup.isNotEmpty()) currentGroup else "Genel"

                        val cat = categoriesMap.getOrPut(groupId) {
                            Category(groupId, groupId)
                        }

                        streamsList.add(
                            StreamItem(
                                name = currentName,
                                stream_id = null,
                                series_id = null,
                                container_extension = null,
                                category_id = cat.category_id,
                                full_url = urlPlay,
                                referer = currentRef,
                                origin = currentOrg
                            )
                        )

                        currentRef = null
                        currentOrg = null
                    }
                }

                return Pair(categoriesMap.values.toList(), streamsList)
            }

            private fun fetchAccountInfo(baseUrl: String): Pair<String?, String?> {
                return try {
                    val url = URL(baseUrl)
                    val conn = url.openConnection() as HttpURLConnection
                    conn.connectTimeout = 8000
                    conn.readTimeout = 8000
                    conn.requestMethod = "GET"

                    val code = conn.responseCode
                    if (code != HttpURLConnection.HTTP_OK) {
                        Pair(null, null)
                    } else {
                        val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                        val obj = JSONObject(body)
                        val userInfo = obj.optJSONObject("user_info")
                        if (userInfo != null) {
                            val uname = userInfo.optString("username", null)
                            val exp = userInfo.optString("exp_date", null)
                            Pair(uname, exp)
                        } else {
                            Pair(null, null)
                        }
                    }
                } catch (e: Exception) {
                    Pair(null, null)
                }
            }

            private fun formatExp(exp: String?): String {
                if (exp == null || exp == "" || exp == "0" || exp == "null") {
                    return "Sınırsız"
                }
                return try {
                    val seconds = exp.toLong()
                    val millis = seconds * 1000L
                    val date = Date(millis)
                    val sdf = SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault())
                    sdf.format(date)
                } catch (e: Exception) {
                    exp
                }
            }

            private fun fetchCategories(urlStr: String): List<Category> {
                val list = ArrayList<Category>()
                val url = URL(urlStr)
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000
                conn.readTimeout = 15000
                conn.requestMethod = "GET"

                val code = conn.responseCode
                if (code != HttpURLConnection.HTTP_OK) {
                    return list
                }

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    val id = obj.optString("category_id", "")
                    val name = obj.optString("category_name", "Kategori " + i)
                    list.add(Category(id, name))
                    i++
                }
                return list
            }

            private fun fetchStreams(urlStr: String): List<StreamItem> {
                val list = ArrayList<StreamItem>()
                val url = URL(urlStr)
                val conn = url.openConnection() as HttpURLConnection
                conn.connectTimeout = 10000
                conn.readTimeout = 20000
                conn.requestMethod = "GET"

                val code = conn.responseCode
                if (code != HttpURLConnection.HTTP_OK) {
                    return list
                }

                val body = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                val arr = JSONArray(body)
                var i = 0
                while (i < arr.length()) {
                    val obj = arr.getJSONObject(i)
                    val name = obj.optString("name", "Bilinmeyen")
                    val catId = obj.optString("category_id", "")
                    val streamId = obj.optString("stream_id", null)
                    val seriesId = obj.optString("series_id", null)
                    val ext = obj.optString("container_extension", null)
                    list.add(
                        StreamItem(
                            name = name,
                            stream_id = streamId,
                            series_id = seriesId,
                            container_extension = ext,
                            category_id = catId,
                            full_url = null,
                            referer = null,
                            origin = null
                        )
                    )
                    i++
                }
                return list
            }

            private fun populateDrawerCategories() {
                val menu: Menu = navView.menu
                menu.clear()
                var index = 0
                for (cat in categories) {
                    val item = menu.add(0, index, 0, cat.category_name)
                    item.isCheckable = true
                    if (index == 0) {
                        item.isChecked = true
                    }
                    index++
                }
            }

            private fun filterAndShow(categoryId: String?) {
                val filtered = if (categoryId == null || categoryId.length == 0) {
                    streams
                } else {
                    streams.filter { it.category_id == categoryId }
                }

                val acc = activeAcc ?: return

                rv.adapter = GridAdapter(filtered) { item ->
                    // Kanal tıklamalarında interstitial kontrolü
                    showChannelAdIfNeeded()

                    if (acc.type == "M3U") {
                        val url = item.full_url
                        if (url.isNullOrEmpty()) {
                            Toast.makeText(this, "Geçersiz M3U kanalı.", Toast.LENGTH_SHORT).show()
                            return@GridAdapter
                        }
                        val itn = Intent(this, PlayerActivity::class.java)
                        itn.putExtra("URL", url)
                        itn.putExtra("REF", item.referer ?: "")
                        itn.putExtra("ORG", item.origin ?: "")
                        startActivity(itn)
                    } else {
                        if (currentMode == "SERIES") {
                            val itn = Intent(this, SeriesDetailActivity::class.java)
                            itn.putExtra("SERIES_ID", item.series_id ?: "")
                            itn.putExtra("SERIES_NAME", item.name)
                            startActivity(itn)
                        } else {
                            val dnsRaw = acc.dns?.trim() ?: ""
                            val user = acc.user?.trim() ?: ""
                            val pass = acc.pass?.trim() ?: ""
                            val dns = if (dnsRaw.endsWith("/")) dnsRaw.substring(0, dnsRaw.length - 1) else dnsRaw

                            val path = if (currentMode == "LIVE") "live" else "movie"
                            val ext = if (currentMode == "LIVE") {
                                ".ts"
                            } else {
                                if (item.container_extension != null && item.container_extension.length > 0) {
                                    "." + item.container_extension
                                } else {
                                    ".mp4"
                                }
                            }
                            val id = item.stream_id ?: ""
                            val playUrl = dns + "/" + path + "/" + user + "/" + pass + "/" + id + ext

                            val itn = Intent(this, PlayerActivity::class.java)
                            itn.putExtra("URL", playUrl)
                            itn.putExtra("REF", "")
                            itn.putExtra("ORG", "")
                            startActivity(itn)
                        }
                    }
                }
            }
        }
