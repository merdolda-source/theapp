                            Toast.makeText(this, "M3U URL cannot be empty.", Toast.LENGTH_SHORT).show()
                            return@setOnClickListener
                        }
                        prefs.createM3uAccount(finalName, m)
                        Toast.makeText(this, "M3U account added. Select it below.", Toast.LENGTH_SHORT).show()
                    }

                    etName.setText("")
                    etDns.setText("")
                    etUser.setText("")
                    etPass.setText("")
                    etM3u.setText("")
                    refreshList()
                }
            }
        }
