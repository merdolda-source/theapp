        package $PACKAGE_NAME.adapters

        import android.view.KeyEvent
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView
        import $PACKAGE_NAME.R

        class GridAdapter(
            private var titles: List<String>,
            private var subtitles: List<String>,
            private val onClick: (Int) -> Unit
        ) : RecyclerView.Adapter<GridAdapter.VH>() {

            class VH(v: View) : RecyclerView.ViewHolder(v) {
                val txt: TextView = v.findViewById(R.id.txtName)
                val sub: TextView = v.findViewById(R.id.txtSub)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                val v = LayoutInflater.from(parent.context).inflate(R.layout.item_grid_pro, parent, false)
                v.isFocusable = true
                v.isFocusableInTouchMode = true
                v.isClickable = true
                return VH(v)
            }

            override fun onBindViewHolder(holder: VH, position: Int) {
                holder.txt.text = titles[position]
                val s = subtitles[position]
                holder.sub.visibility = if (s.isNotEmpty()) View.VISIBLE else View.GONE
                holder.sub.text = s

                holder.itemView.setOnFocusChangeListener { v, hasFocus ->
                    val scale = if (hasFocus) 1.06f else 1.0f
                    v.animate().scaleX(scale).scaleY(scale).setDuration(100).start()
                }

                holder.itemView.setOnClickListener { onClick(holder.bindingAdapterPosition) }

                holder.itemView.setOnKeyListener { _, keyCode, event ->
                    if (event.action == KeyEvent.ACTION_DOWN &&
                        (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER)
                    ) {
                        onClick(holder.bindingAdapterPosition)
                        true
                    } else {
                        false
                    }
                }
            }

            override fun getItemCount(): Int = titles.size

            fun update(newTitles: List<String>, newSubtitles: List<String>) {
                titles = newTitles
                subtitles = newSubtitles
                notifyDataSetChanged()
            }
        }
