        printf '%s\n' '        handler.removeCallbacks(hideOverlay); handler.postDelayed(hideOverlay, 1500)' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    private fun showCtrl() {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '        controlsVisible = true; controlsOverlay.visibility = View.VISIBLE; scheduleHide()' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    }' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
        printf '%s\n' '    private fun hideCtrl() {' >> app/src/main/java/$PATH_NAME/PlayerActivity.kt
