name: ErdinPlayer Final System

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Depo Hazırlığı
      uses: actions/checkout@v4
    
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 2. Tüm Sistemi Sıfırdan İnşa Et
      run: |
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        PASS="erdin123"
        
        echo "🚀 Yeni nesil IPTV sistemi kuruluyor..."

        # Klasör Yapısı
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # --- İkon ve İmza ---
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass $PASS -keypass $PASS -dname "CN=Erdin, O=ErdinMedia, C=TR"

        # --- Gradle Dosyaları ---
        echo "include ':app'" > settings.gradle
        echo -e "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m" > gradle.properties

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.0.0'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0" }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33
            defaultConfig { applicationId "$PACKAGE_NAME"; minSdk 24; targetSdk 33; versionCode 1; versionName "1.0" }
            signingConfigs { release { storeFile file("keystore.jks"); storePassword "$PASS"; keyAlias "key0"; keyPassword "$PASS" } }
            buildTypes { release { minifyEnabled true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
        }
        EOF

        # --- Tasarım Kaynakları (Renkler ve Şekiller) ---
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <color name="bg_dark">#121212</color>
            <color name="sport_green">#00E676</color>
            <color name="white">#FFFFFF</color>
            <color name="black">#000000</color>
            <color name="gray">#333333</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_input.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#FFFFFF"/>
            <corners android:radius="10dp"/>
            <stroke android:width="3dp" android:color="#00E676"/>
        </shape>
        EOF

        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
            </style>
        </resources>
        EOF

        # --- XML Layoutlar ---
        # 1. Login
        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="30dp" android:background="#121212">
            <ImageView android:src="@mipmap/ic_launcher" android:layout_width="100dp" android:layout_height="100dp" android:layout_marginBottom="20dp"/>
            <TextView android:text="XTREAM GİRİŞ" android:textColor="#00E676" android:textSize="24sp" android:textStyle="bold" android:layout_marginBottom="30dp"/>
            <EditText android:id="@+id/etUrl" android:hint="DNS: http://url:port" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="10dp" android:textColor="#000"/>
            <EditText android:id="@+id/etUser" android:hint="Kullanıcı Adı" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="10dp" android:textColor="#000"/>
            <EditText android:id="@+id/etPass" android:hint="Şifre" android:inputType="textPassword" android:background="@drawable/bg_input" android:padding="15dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="25dp" android:textColor="#000"/>
            <Button android:id="@+id/btnLogin" android:text="GİRİŞ YAP" android:backgroundTint="#00E676" android:textColor="#000" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="60dp"/>
        </LinearLayout>
        EOF

        # 2. Dashboard
        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="20dp" android:background="#121212" android:gravity="center">
            <TextView android:id="@+id/tvUser" android:text="Hoşgeldiniz" android:textColor="#00E676" android:textSize="20sp" android:layout_marginBottom="40dp"/>
            <Button android:id="@+id/btnLive" android:text="📺 CANLI TV" android:layout_width="match_parent" android:layout_height="80dp" android:backgroundTint="#333" android:layout_marginBottom="15dp"/>
            <Button android:id="@+id/btnVod" android:text="🎬 FİLMLER" android:layout_width="match_parent" android:layout_height="80dp" android:backgroundTint="#333" android:layout_marginBottom="15dp"/>
            <Button android:id="@+id/btnSeries" android:text="🍿 DİZİLER" android:layout_width="match_parent" android:layout_height="80dp" android:backgroundTint="#333"/>
        </LinearLayout>
        EOF

        # 3. List & Player
        echo "<LinearLayout xmlns:android='http://schemas.android.com/apk/res/android' android:layout_width='match_parent' android:layout_height='match_parent' android:orientation='vertical' android:background='#121212'><TextView android:id='@+id/tvTitle' android:layout_width='match_parent' android:layout_height='wrap_content' android:textColor='#00E676' android:textSize='22sp' android:padding='20dp' android:gravity='center'/><ListView android:id='@+id/listView' android:layout_width='match_parent' android:layout_height='match_parent'/></LinearLayout>" > app/src/main/res/layout/activity_list.xml
        echo "<FrameLayout xmlns:android='http://schemas.android.com/apk/res/android' android:layout_width='match_parent' android:layout_height='match_parent' android:background='#000'><androidx.media3.ui.PlayerView android:id='@+id/player_view' android:layout_width='match_parent' android:layout_height='match_parent'/></FrameLayout>" > app/src/main/res/layout/activity_player.xml
        echo "<TextView xmlns:android='http://schemas.android.com/apk/res/android' android:id='@android:id/text1' android:layout_width='match_parent' android:layout_height='wrap_content' android:textColor='#FFF' android:textSize='18sp' android:padding='15dp'/>" > app/src/main/res/layout/item_row.xml

        # --- Kotlin Kodları ---
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_login)
                findViewById<Button>(R.id.btnLogin).setOnClickListener {
                    val url = findViewById<EditText>(R.id.etUrl).text.toString()
                    val user = findViewById<EditText>(R.id.etUser).text.toString()
                    val pass = findViewById<EditText>(R.id.etPass).text.toString()
                    if(url.isNotEmpty() && user.isNotEmpty()) {
                        val i = Intent(this, DashboardActivity::class.java)
                        i.putExtra("u", url); i.putExtra("n", user); i.putExtra("p", pass)
                        startActivity(i)
                    }
                }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity

        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)
                val u = intent.getStringExtra("u"); val n = intent.getStringExtra("n"); val p = intent.getStringExtra("p")
                findViewById<TextView>(R.id.tvUser).text = "Kullanıcı: \$n"
                
                fun open(type: String) {
                    val i = Intent(this, ListActivity::class.java)
                    i.putExtra("u", u); i.putExtra("n", n); i.putExtra("p", p); i.putExtra("t", type)
                    startActivity(i)
                }
                findViewById<Button>(R.id.btnLive).setOnClickListener { open("live") }
                findViewById<Button>(R.id.btnVod).setOnClickListener { open("movie") }
                findViewById<Button>(R.id.btnSeries).setOnClickListener { open("series") }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/ListActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity

        class ListActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_list)
                val u = intent.getStringExtra("u"); val n = intent.getStringExtra("n")
                val p = intent.getStringExtra("p"); val t = intent.getStringExtra("t")
                findViewById<TextView>(R.id.tvTitle).text = t?.uppercase() + " LİSTESİ"
                
                val list = listOf("Kanal 1", "Kanal 2", "Spor 1", "Sinema 1", "Belgesel 1")
                val adp = ArrayAdapter(this, R.layout.item_row, list)
                val lv = findViewById<ListView>(R.id.listView)
                lv.adapter = adp
                lv.setOnItemClickListener { _, _, pos, _ ->
                    val finalUrl = "\$u/\$t/\$n/\$p/\${pos+1}.ts"
                    val i = Intent(this, PlayerActivity::class.java)
                    i.putExtra("url", finalUrl)
                    startActivity(i)
                }
            }
        }
        EOF

        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView

        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_player)
                val url = intent.getStringExtra("url") ?: ""
                player = ExoPlayer.Builder(this).build()
                findViewById<PlayerView>(R.id.player_view).player = player
                player?.setMediaItem(MediaItem.fromUri(url))
                player?.prepare(); player?.play()
            }
            override fun onDestroy() { super.onDestroy(); player?.release() }
        }
        EOF

        # --- Manifest ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/Theme.ErdinPlayer" android:icon="@mipmap/ic_launcher" android:label="ErdinPlayer" android:usesCleartextTraffic="true">
                <activity android:name=".LoginActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
                <activity android:name=".DashboardActivity"/><activity android:name=".ListActivity"/><activity android:name=".PlayerActivity"/>
            </application>
        </manifest>
        EOF

    - name: 3. Gradle ve Derleme
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 4. APK Oluştur
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon

    - name: 5. APK'yı Sun (Download)
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Final-v2
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk
