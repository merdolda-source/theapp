        # ============ PlayerActivity (Media3 Turbo - Ä°leri/Geri Sarma + Gesture) ============
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.media.AudioManager
        import android.os.Build
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.view.GestureDetector
        import android.view.MotionEvent
        import android.view.View
        import android.view.WindowManager
        import android.widget.ImageView
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.view.WindowCompat
        import androidx.core.view.WindowInsetsCompat
        import androidx.core.view.WindowInsetsControllerCompat
        import androidx.media3.common.MediaItem
        import androidx.media3.common.PlaybackException
        import androidx.media3.common.Player
        import androidx.media3.datasource.DefaultHttpDataSource
        import androidx.media3.datasource.okhttp.OkHttpDataSource
        import androidx.media3.exoplayer.DefaultLoadControl
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
        import androidx.media3.ui.PlayerView
        import okhttp3.OkHttpClient
        import java.util.concurrent.TimeUnit

        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            private lateinit var playerView: PlayerView
            private lateinit var tvOsd: TextView
            private lateinit var ivOsdIcon: ImageView
            private var audioManager: AudioManager? = null
            private var startX = 0f; private var startY = 0f
            private var startVolume = 0; private var startBrightness = 0.5f
            private var isLiveStream = false
            private val hideOsdHandler = Handler(Looper.getMainLooper())
            private val hideOsdRunnable = Runnable { tvOsd.visibility = View.GONE; ivOsdIcon.visibility = View.GONE }
            private val FAKE_USER_AGENT = "Mozilla/5.0 (Linux; Android 12; SM-G998B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                WindowCompat.setDecorFitsSystemWindows(window, false)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                    window.attributes = window.attributes.apply { layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES }
                }
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                setContentView(R.layout.activity_player_pro)
                hideSystemBars()

                val playUrl = intent.getStringExtra("URL") ?: ""
                val ref = intent.getStringExtra("REF") ?: ""
                val org = intent.getStringExtra("ORG") ?: ""
                val type = intent.getStringExtra("TYPE") ?: "LIVE"
                isLiveStream = (type == "LIVE")

                if (playUrl.isEmpty()) { Toast.makeText(this, "GeÃ§ersiz URL.", Toast.LENGTH_SHORT).show(); finish(); return }

                playerView = findViewById(R.id.pvMain)
                tvOsd = findViewById(R.id.tvOsd)
                ivOsdIcon = findViewById(R.id.ivOsdIcon)
                audioManager = getSystemService(AUDIO_SERVICE) as AudioManager

                setupPlayer(playUrl, ref, org)
                setupGestures()
            }

            private fun setupPlayer(playUrl: String, ref: String, org: String) {
                try {
                    val headers = mutableMapOf("User-Agent" to FAKE_USER_AGENT)
                    if (ref.isNotEmpty()) headers["Referer"] = ref
                    if (org.isNotEmpty()) headers["Origin"] = org

                    val okClient = OkHttpClient.Builder()
                        .connectTimeout(20, TimeUnit.SECONDS)
                        .readTimeout(60, TimeUnit.SECONDS)
                        .retryOnConnectionFailure(true)
                        .build()

                    val dataSourceFactory = OkHttpDataSource.Factory(okClient).setDefaultRequestProperties(headers)
                    val mediaSourceFactory = DefaultMediaSourceFactory(dataSourceFactory)

                    val loadControl = DefaultLoadControl.Builder()
                        .setBufferDurationsMs(
                            if (isLiveStream) 5000 else 20000,
                            if (isLiveStream) 10000 else 60000,
                            if (isLiveStream) 1000 else 2500,
                            if (isLiveStream) 5000 else 10000
                        )
                        .build()

                    player = ExoPlayer.Builder(this)
                        .setMediaSourceFactory(mediaSourceFactory)
                        .setLoadControl(loadControl)
                        .build()

                    playerView.player = player
                    playerView.useController = !isLiveStream

                    val mediaItem = MediaItem.fromUri(playUrl)
                    player?.setMediaItem(mediaItem)
                    player?.prepare()
                    player?.playWhenReady = true

                    player?.addListener(object : Player.Listener {
                        override fun onPlayerError(error: PlaybackException) {
                            Toast.makeText(this@PlayerActivity, "Hata: ${'$'}{error.message}", Toast.LENGTH_LONG).show()
                        }
                        override fun onPlaybackStateChanged(playbackState: Int) {
                            if (playbackState == Player.STATE_READY && isLiveStream) {
                                player?.seekToDefaultPosition()
                            }
                        }
                    })
                } catch (e: Exception) {
                    Toast.makeText(this, "OynatÄ±cÄ± hatasÄ±: ${'$'}{e.message}", Toast.LENGTH_LONG).show(); finish()
                }
            }

            private fun showOsd(msg: String) {
                tvOsd.text = msg; tvOsd.visibility = View.VISIBLE
                hideOsdHandler.removeCallbacks(hideOsdRunnable)
                hideOsdHandler.postDelayed(hideOsdRunnable, 1500)
            }

            private fun setupGestures() {
                val gd = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                    override fun onDoubleTap(e: MotionEvent): Boolean {
                        val width = playerView.width.toFloat()
                        if (!isLiveStream) {
                            val p = player ?: return true
                            if (e.x < width / 2f) {
                                p.seekTo((p.currentPosition - 10000).coerceAtLeast(0))
                                showOsd("âª -10s")
                            } else {
                                p.seekTo((p.currentPosition + 10000).coerceAtMost(p.duration.coerceAtLeast(0)))
                                showOsd("â© +10s")
                            }
                        }
                        return true
                    }
                    override fun onSingleTapConfirmed(e: MotionEvent): Boolean {
                        if (isLiveStream) {
                            val p = player ?: return true
                            if (p.isPlaying) { p.pause(); showOsd("â¸ Durduruldu") } else { p.play(); showOsd("â–¶ OynatÄ±lÄ±yor") }
                        }
                        return true
                    }
                })

                playerView.setOnTouchListener { v, event ->
                    val width = v.width.toFloat(); val height = v.height.toFloat()
                    gd.onTouchEvent(event)
                    when (event.action) {
                        MotionEvent.ACTION_DOWN -> {
                            startX = event.x; startY = event.y
                            startVolume = audioManager?.getStreamVolume(AudioManager.STREAM_MUSIC) ?: 0
                            val lp = window.attributes
                            startBrightness = if (lp.screenBrightness >= 0f) lp.screenBrightness else 0.5f
                        }
                        MotionEvent.ACTION_MOVE -> {
                            val dx = event.x - startX; val dy = startY - event.y
                            if (kotlin.math.abs(dx) > kotlin.math.abs(dy) * 1.5f) {
                                // Yatay swipe: VOD seek
                                if (!isLiveStream) {
                                    val p = player ?: return@setOnTouchListener true
                                    val seekDelta = (dx / width * 120000).toLong()
                                    val newPos = (p.currentPosition + seekDelta).coerceIn(0, p.duration.coerceAtLeast(0))
                                    p.seekTo(newPos)
                                    val secs = seekDelta / 1000
                                    showOsd(if (secs >= 0) "â© +${'$'}{secs}s" else "âª ${'$'}{secs}s")
                                }
                                return@setOnTouchListener true
                            }
                            val percent = dy / height
                            if (startX > width / 2f) {
                                val am = audioManager ?: return@setOnTouchListener true
                                val maxVol = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                val delta = (percent * maxVol * 1.5f).toInt()
                                val newVol = (startVolume + delta).coerceIn(0, maxVol)
                                am.setStreamVolume(AudioManager.STREAM_MUSIC, newVol, 0)
                                val pct = (newVol * 100 / maxVol)
                                showOsd("ğŸ”Š Ses: ${'$'}pct%")
                            } else {
                                val lp = window.attributes
                                val newB = (startBrightness + percent * 1.5f).coerceIn(0.05f, 1f)
                                lp.screenBrightness = newB; window.attributes = lp
                                showOsd("â˜€ ParlaklÄ±k: ${'$'}{(newB * 100).toInt()}%")
                            }
                            return@setOnTouchListener true
                        }
                        else -> {}
                    }
                    false
                }
            }

            private fun hideSystemBars() {
                WindowInsetsControllerCompat(window, window.decorView).apply {
                    systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                    hide(WindowInsetsCompat.Type.systemBars())
                }
            }

            override fun onWindowFocusChanged(hasFocus: Boolean) { super.onWindowFocusChanged(hasFocus); if (hasFocus) hideSystemBars() }
            override fun onPause() { super.onPause(); player?.pause() }
            override fun onResume() { super.onResume(); hideSystemBars(); player?.play() }
            override fun onDestroy() { super.onDestroy(); player?.release(); player = null; hideOsdHandler.removeCallbacksAndMessages(null) }
        }
