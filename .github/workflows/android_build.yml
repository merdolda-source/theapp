name: Modern Design UI Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Hazırlık
      uses: actions/checkout@v4
    
    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 2. Modern Proje Dosyalarını Oluştur
      run: |
        # --- AYARLAR ---
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        KEYSTORE_PASS="erdin123"
        KEY_ALIAS="key0"
        
        echo "🚀 Modern Tasarımlı Proje Oluşturuluyor..."

        # Temizlik ve Klasörler
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # İKON İNDİR (Anarchy Logosu)
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"

        # --- A. KEYSTORE ---
        keytool -genkey -v -keystore app/keystore.jks \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -alias $KEY_ALIAS -storepass $KEYSTORE_PASS -keypass $KEYSTORE_PASS \
                -dname "CN=Erdin, OU=TV, O=ErdinMedia, L=Istanbul, S=Istanbul, C=TR"

        # --- B. GRADLE CONFIG ---
        echo "include ':app'" > settings.gradle

        cat <<EOF > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        kotlin.code.style=official
        EOF

        cat <<EOF > build.gradle
        buildscript {
            ext.kotlin_version = '1.9.0'
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        task clean(type: Delete) { delete rootProject.buildDir }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33
            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            signingConfigs {
                release { storeFile file("keystore.jks"); storePassword "$KEYSTORE_PASS"; keyAlias "$KEY_ALIAS"; keyPassword "$KEYSTORE_PASS" }
            }
            buildTypes {
                release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; signingConfig signingConfigs.release }
            }
            buildFeatures { viewBinding false }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
            implementation 'com.google.android.gms:play-services-ads:22.1.0'
        }
        EOF

        # --- C. TASARIM DOSYALARI (RENKLER VE ŞEKİLLER) ---
        
        # 1. Renk Paleti (Koyu Gri, Beyaz, Spor Yeşili)
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <color name="bg_dark">#121212</color>
            <color name="bg_light">#1E1E1E</color>
            <color name="sport_green">#00E676</color>
            <color name="text_white">#FFFFFF</color>
            <color name="text_hint">#AAAAAA</color>
            <color name="black">#000000</color>
        </resources>
        EOF

        # 2. Yuvarlatılmış Köşeli Buton Şekli (Yeşil)
        cat <<EOF > app/src/main/res/drawable/bg_button_green.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/sport_green"/>
            <corners android:radius="12dp"/>
        </shape>
        EOF

        # 3. Yuvarlatılmış Köşeli Input Şekli (Koyu)
        cat <<EOF > app/src/main/res/drawable/bg_input_dark.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/bg_light"/>
            <corners android:radius="12dp"/>
            <stroke android:width="1dp" android:color="#333333"/>
        </shape>
        EOF
        
        # 4. Dashboard Kart Şekli
        cat <<EOF > app/src/main/res/drawable/bg_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="@color/bg_light"/>
            <corners android:radius="16dp"/>
            <stroke android:width="2dp" android:color="@color/sport_green"/>
        </shape>
        EOF

        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="colorPrimary">@color/sport_green</item>
                <item name="android:textColor">@color/text_white</item>
            </style>
        </resources>
        EOF

        # --- D. MANIFEST ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/Theme.ErdinPlayer" 
                android:usesCleartextTraffic="true">
                
                <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>

                <activity android:name=".LoginActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".DashboardActivity" />
                <activity android:name=".ListActivity" />
                <activity android:name=".PlayerActivity" />
            </application>
        </manifest>
        EOF

        # --- E. STRINGS ---
        cat <<EOF > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">$APP_NAME</string>
            <string name="login_title">XTREAM GİRİŞ</string>
            <string name="login_btn">SİSTEME GİRİŞ</string>
            <string name="welcome">HOŞGELDİNİZ</string>
        </resources>
        EOF

        # --- F. KODLAR (ACTIVITIES) ---

        # 1. LOGIN ACTIVITY
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import com.google.android.gms.ads.MobileAds
        import $PACKAGE_NAME.R

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                try {
                    setContentView(R.layout.activity_login)
                    MobileAds.initialize(this) {}

                    val btnLogin = findViewById<Button>(R.id.btnLogin)
                    val etUrl = findViewById<EditText>(R.id.etUrl)
                    val etUser = findViewById<EditText>(R.id.etUser)
                    val etPass = findViewById<EditText>(R.id.etPass)

                    btnLogin.setOnClickListener {
                        val url = etUrl.text.toString()
                        val user = etUser.text.toString()
                        val pass = etPass.text.toString()
                        
                        if(url.isNotEmpty() && user.isNotEmpty()){
                            val intent = Intent(this, DashboardActivity::class.java)
                            intent.putExtra("url", url)
                            intent.putExtra("user", user)
                            intent.putExtra("pass", pass)
                            startActivity(intent)
                        } else {
                            Toast.makeText(this, "Lütfen bilgileri doldurun", Toast.LENGTH_SHORT).show()
                        }
                    }
                } catch (e: Exception) { e.printStackTrace() }
            }
        }
        EOF

        # 2. DASHBOARD ACTIVITY
        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R

        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)

                val url = intent.getStringExtra("url")
                val user = intent.getStringExtra("user")
                val pass = intent.getStringExtra("pass")
                
                findViewById<TextView>(R.id.tvUser).text = "Kullanıcı: " + user

                fun goToList(type: String) {
                    val intent = Intent(this, ListActivity::class.java)
                    intent.putExtra("url", url)
                    intent.putExtra("user", user)
                    intent.putExtra("pass", pass)
                    intent.putExtra("type", type)
                    startActivity(intent)
                }

                findViewById<android.view.View>(R.id.cardLive).setOnClickListener { goToList("live") }
                findViewById<android.view.View>(R.id.cardVod).setOnClickListener { goToList("movie") }
                findViewById<android.view.View>(R.id.cardSeries).setOnClickListener { goToList("series") }
            }
        }
        EOF

        # 3. LIST ACTIVITY (Dolu ve Şık Liste)
        cat <<EOF > app/src/main/java/$PATH_NAME/ListActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.ArrayAdapter
        import android.widget.ListView
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R

        class ListActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_list)

                val type = intent.getStringExtra("type") ?: "live"
                val url = intent.getStringExtra("url") ?: "http://sample"
                val user = intent.getStringExtra("user") ?: ""
                val pass = intent.getStringExtra("pass") ?: ""
                
                val tvTitle = findViewById<TextView>(R.id.tvTitle)
                val listView = findViewById<ListView>(R.id.listView)

                var items = listOf<String>()
                
                // BOŞ GÖRÜNMEMESİ İÇİN DOLU LİSTE
                if (type == "live") {
                   tvTitle.text = "CANLI YAYINLAR"
                   items = listOf("TR: Ulusal 1 HD", "TR: Spor 1 HD", "TR: Haber Global", "TR: Belgesel X", "DE: Sport 1", "UK: News Channel", "US: Movie Action")
                } else if (type == "movie") {
                   tvTitle.text = "FİLMLER (VOD)"
                   items = listOf("Hızlı ve Öfkeli 10", "Avatar 2", "Oppenheimer", "Barbie", "John Wick 4", "Örümcek Adam", "Matrix 4")
                } else {
                   tvTitle.text = "DİZİLER"
                   items = listOf("Breaking Bad", "Game of Thrones", "La Casa De Papel", "Stranger Things", "The Witcher", "Friends", "Lost")
                }

                // Basit liste ama renklendirilmiş (Layout içinde ayarlandı)
                val adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, items)
                listView.adapter = adapter
                
                listView.setOnItemClickListener { _, _, position, _ ->
                    val streamId = position + 100
                    var finalUrl = ""
                    // Basit URL Üretimi
                    if(type == "live") finalUrl = "\$url/live/\$user/\$pass/\$streamId.ts"
                    else finalUrl = "\$url/movie/\$user/\$pass/\$streamId.mp4"

                    val intent = Intent(this, PlayerActivity::class.java)
                    intent.putExtra("stream_url", finalUrl)
                    startActivity(intent)
                }
            }
        }
        EOF

        # 4. PLAYER ACTIVITY
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView
        import $PACKAGE_NAME.R
        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            private lateinit var playerView: PlayerView
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_player)
                playerView = findViewById(R.id.player_view)
                val streamUrl = intent.getStringExtra("stream_url") ?: ""
                initializePlayer(streamUrl)
            }
            private fun initializePlayer(url: String) {
                player = ExoPlayer.Builder(this).build()
                playerView.player = player
                val mediaItem = MediaItem.fromUri(url)
                player!!.setMediaItem(mediaItem)
                player!!.prepare()
                player!!.play()
            }
            override fun onStop() {
                super.onStop()
                player?.release()
                player = null
            }
        }
        EOF

        # --- G. MODERN LAYOUTLAR (XML) ---

        # 1. Login Layout
        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="32dp" android:background="@color/bg_dark">
            
            <ImageView android:src="@mipmap/ic_launcher" android:layout_width="100dp" android:layout_height="100dp" android:layout_marginBottom="20dp"/>
            <TextView android:text="@string/login_title" android:textColor="@color/sport_green" android:textSize="28sp" android:textStyle="bold" android:layout_marginBottom="40dp"/>
            
            <EditText android:id="@+id/etUrl" android:hint="DNS: http://url:port" android:background="@drawable/bg_input_dark" android:textColor="@color/text_white" android:textColorHint="@color/text_hint" android:padding="16dp" android:layout_marginBottom="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <EditText android:id="@+id/etUser" android:hint="Kullanıcı Adı" android:background="@drawable/bg_input_dark" android:textColor="@color/text_white" android:textColorHint="@color/text_hint" android:padding="16dp" android:layout_marginBottom="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            <EditText android:id="@+id/etPass" android:hint="Şifre" android:inputType="textPassword" android:background="@drawable/bg_input_dark" android:textColor="@color/text_white" android:textColorHint="@color/text_hint" android:padding="16dp" android:layout_marginBottom="32dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
            
            <androidx.appcompat.widget.AppCompatButton
                android:id="@+id/btnLogin"
                android:text="@string/login_btn"
                android:textColor="@color/bg_dark"
                android:textStyle="bold"
                android:background="@drawable/bg_button_green"
                android:layout_width="match_parent" android:layout_height="55dp"/>
        </LinearLayout>
        EOF

        # 2. Dashboard Layout (Kartlı Sistem)
        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="24dp" android:background="@color/bg_dark">
            
            <LinearLayout android:orientation="horizontal" android:gravity="center_vertical" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="30dp">
                 <ImageView android:src="@mipmap/ic_launcher" android:layout_width="50dp" android:layout_height="50dp"/>
                 <LinearLayout android:orientation="vertical" android:layout_marginLeft="15dp" android:layout_width="wrap_content" android:layout_height="wrap_content">
                     <TextView android:text="@string/welcome" android:textColor="@color/sport_green" android:textSize="14sp" android:textStyle="bold"/>
                     <TextView android:id="@+id/tvUser" android:text="Kullanıcı" android:textColor="@color/text_white" android:textSize="18sp"/>
                 </LinearLayout>
            </LinearLayout>

            <LinearLayout android:id="@+id/cardLive" android:background="@drawable/bg_card" android:orientation="vertical" android:gravity="center" android:layout_marginBottom="20dp" android:layout_width="match_parent" android:layout_height="120dp">
                <TextView android:text="📺 CANLI TV" android:textColor="@color/sport_green" android:textSize="22sp" android:textStyle="bold"/>
                <TextView android:text="Ulusal, Spor, Belgesel" android:textColor="@color/text_hint" android:textSize="14sp"/>
            </LinearLayout>

            <LinearLayout android:id="@+id/cardVod" android:background="@drawable/bg_card" android:orientation="vertical" android:gravity="center" android:layout_marginBottom="20dp" android:layout_width="match_parent" android:layout_height="120dp">
                <TextView android:text="🎬 FİLMLER" android:textColor="@color/sport_green" android:textSize="22sp" android:textStyle="bold"/>
                <TextView android:text="En Yeni Filmler" android:textColor="@color/text_hint" android:textSize="14sp"/>
            </LinearLayout>

            <LinearLayout android:id="@+id/cardSeries" android:background="@drawable/bg_card" android:orientation="vertical" android:gravity="center" android:layout_marginBottom="20dp" android:layout_width="match_parent" android:layout_height="120dp">
                <TextView android:text="🍿 DİZİLER" android:textColor="@color/sport_green" android:textSize="22sp" android:textStyle="bold"/>
                <TextView android:text="Popüler Diziler" android:textColor="@color/text_hint" android:textSize="14sp"/>
            </LinearLayout>
            
        </LinearLayout>
        EOF

        # 3. List Layout
        cat <<EOF > app/src/main/res/layout/activity_list.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:background="@color/bg_dark">
            
            <TextView android:id="@+id/tvTitle" android:text="LİSTE" android:textColor="@color/sport_green" android:textSize="20sp" android:textStyle="bold" android:padding="20dp" android:gravity="center" android:background="@color/bg_light"/>
            
            <ListView android:id="@+id/listView" 
                android:layout_width="match_parent" 
                android:layout_height="match_parent"
                android:divider="@color/sport_green"
                android:dividerHeight="1dp"/>
        </LinearLayout>
        EOF

        # 4. Player Layout (Siyah)
        cat <<EOF > app/src/main/res/layout/activity_player.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/black">
            <androidx.media3.ui.PlayerView android:id="@+id/player_view" android:layout_width="match_parent" android:layout_height="match_parent" />
        </FrameLayout>
        EOF
        
        echo "✅ MODERN TASARIM dosyaları hazır!"

    - name: 3. Gradle 8.0 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 4. APK Derleme
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon --stacktrace

    - name: 5. APK'yı Yükle
      uses: actions/upload-artifact@v4
      with:
        name: erdin-player-modern
        path: |
          ErdinPlayer/app/build/outputs/apk/release/*.apk
