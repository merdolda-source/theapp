<?xml version="1.0" encoding="utf-8"?>
<androidx.drawerlayout.widget.DrawerLayout
    xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:ads="http://schemas.android.com/apk/res-auto"
    android:id="@+id/drawerLayout"
    android:layout_width="match_parent" android:layout_height="match_parent">

    <!-- ─── Ana içerik ─── -->
    <LinearLayout android:layout_width="match_parent" android:layout_height="match_parent"
        android:orientation="vertical" android:background="@color/bg_dark">

        <!-- Top banner -->
        <com.google.android.gms.ads.AdView
            android:id="@+id/adViewTop"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            ads:adSize="BANNER" ads:adUnitId="@string/admob_banner"
            android:focusable="false" android:focusableInTouchMode="false"/>

        <!-- Top Bar -->
        <LinearLayout android:layout_width="match_parent" android:layout_height="56dp"
            android:orientation="horizontal" android:gravity="center_vertical"
            android:background="@color/bg_paper"
            android:paddingHorizontal="12dp">

            <TextView android:id="@+id/tvMenuBtn"
                android:layout_width="44dp" android:layout_height="44dp"
                android:gravity="center" android:text="☰"
                android:textColor="@color/text_primary" android:textSize="22sp"
                android:focusable="true" android:clickable="true"/>

            <TextView android:id="@+id/tvTitleBar"
                android:layout_width="0dp" android:layout_height="wrap_content"
                android:layout_weight="1"
                android:text="@string/app_name"
                android:textColor="@color/text_primary"
                android:textSize="18sp" android:textStyle="bold"
                android:paddingStart="4dp"/>

            <EditText android:id="@+id/etSearch"
                android:layout_width="0dp" android:layout_height="38dp"
                android:layout_weight="1.5"
                android:hint="Ara…"
                android:background="@drawable/bg_input"
                android:paddingHorizontal="12dp"
                android:textColor="@color/text_primary"
                android:textColorHint="@color/text_hint"
                android:textSize="14sp" android:singleLine="true"
                android:imeOptions="actionSearch"
                android:focusable="true" android:focusableInTouchMode="true"/>
        </LinearLayout>

        <!-- Mode seçici tabs -->
        <LinearLayout android:id="@+id/layoutModeTabs"
            android:layout_width="match_parent" android:layout_height="48dp"
            android:orientation="horizontal" android:background="@color/bg_paper"
            android:paddingHorizontal="16dp" android:paddingBottom="8dp">

            <TextView android:id="@+id/tabLive"
                android:layout_width="0dp" android:layout_height="match_parent"
                android:layout_weight="1" android:gravity="center"
                android:text="@string/tab_live"
                android:textColor="@color/white" android:textSize="13sp" android:textStyle="bold"
                android:background="@drawable/bg_tab_active"
                android:focusable="true" android:clickable="true"
                android:layout_marginEnd="4dp"/>

            <TextView android:id="@+id/tabMovies"
                android:layout_width="0dp" android:layout_height="match_parent"
                android:layout_weight="1" android:gravity="center"
                android:text="@string/tab_movies"
                android:textColor="@color/text_secondary" android:textSize="13sp" android:textStyle="bold"
                android:background="@drawable/bg_tab_inactive"
                android:focusable="true" android:clickable="true"
                android:layout_marginHorizontal="4dp"/>

            <TextView android:id="@+id/tabSeries"
                android:layout_width="0dp" android:layout_height="match_parent"
                android:layout_weight="1" android:gravity="center"
                android:text="@string/tab_series"
                android:textColor="@color/text_secondary" android:textSize="13sp" android:textStyle="bold"
                android:background="@drawable/bg_tab_inactive"
                android:focusable="true" android:clickable="true"
                android:layout_marginStart="4dp"/>
        </LinearLayout>

        <!-- Kategori chip scroll -->
        <androidx.core.widget.NestedScrollView
            android:id="@+id/svChips"
            android:layout_width="match_parent" android:layout_height="52dp"
            android:scrollbars="none">
            <LinearLayout android:id="@+id/llChips"
                android:layout_width="wrap_content" android:layout_height="match_parent"
                android:orientation="horizontal"
                android:paddingHorizontal="16dp" android:paddingVertical="8dp"/>
        </androidx.core.widget.NestedScrollView>

        <!-- Loading / Status -->
        <ProgressBar android:id="@+id/pbLoading"
            style="?android:attr/progressBarStyleHorizontal"
            android:layout_width="match_parent" android:layout_height="3dp"
            android:indeterminate="true"
            android:indeterminateTint="@color/primary"
            android:visibility="gone"/>

        <TextView android:id="@+id/tvStatus"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:textColor="@color/error" android:textSize="13sp"
            android:padding="12dp" android:visibility="gone"/>

        <!-- İçerik listesi -->
        <androidx.recyclerview.widget.RecyclerView
            android:id="@+id/rvContent"
            android:layout_width="match_parent" android:layout_height="0dp"
            android:layout_weight="1"
            android:clipToPadding="false"
            android:paddingHorizontal="12dp" android:paddingBottom="8dp"/>

        <!-- Bottom banner -->
        <com.google.android.gms.ads.AdView
            android:id="@+id/adViewBottom"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            ads:adSize="BANNER" ads:adUnitId="@string/admob_banner"
            android:focusable="false" android:focusableInTouchMode="false"/>
    </LinearLayout>

    <!-- ─── Yan Çekmece ─── -->
    <LinearLayout android:layout_width="300dp" android:layout_height="match_parent"
        android:layout_gravity="start" android:orientation="vertical"
        android:background="@color/drawer_bg" android:padding="16dp">

        <!-- Hesap bilgisi -->
        <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
            android:orientation="vertical" android:background="@drawable/bg_card"
            android:padding="16dp" android:layout_marginBottom="16dp">
            <TextView android:id="@+id/tvDrawerPortal"
                android:layout_width="match_parent" android:layout_height="wrap_content"
                android:text="Portal: —" android:textColor="@color/text_primary"
                android:textStyle="bold" android:textSize="15sp"/>
            <TextView android:id="@+id/tvDrawerExpiry"
                android:layout_width="match_parent" android:layout_height="wrap_content"
                android:text="Süre: —" android:textColor="@color/text_secondary"
                android:textSize="13sp" android:layout_marginTop="4dp"/>
        </LinearLayout>

        <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
            android:text="PORTALLAR" android:textColor="@color/text_secondary"
            android:textSize="11sp" android:letterSpacing="0.08"
            android:layout_marginBottom="8dp"/>

        <androidx.recyclerview.widget.RecyclerView
            android:id="@+id/rvDrawerPortals"
            android:layout_width="match_parent" android:layout_height="0dp"
            android:layout_weight="1"/>

        <View android:layout_width="match_parent" android:layout_height="1dp"
            android:background="@color/divider" android:layout_marginVertical="12dp"/>

        <TextView android:id="@+id/tvDrawerSettings"
            android:layout_width="match_parent" android:layout_height="48dp"
            android:gravity="center" android:text="⚙  Ayarlar"
            android:textColor="@color/text_primary" android:textSize="14sp"
            android:background="@drawable/bg_card"
            android:focusable="true" android:clickable="true"
            android:layout_marginBottom="8dp"/>

        <TextView android:id="@+id/tvDrawerLogout"
            android:layout_width="match_parent" android:layout_height="52dp"
            android:gravity="center" android:text="Çıkış Yap"
            android:textColor="@color/primary" android:textStyle="bold" android:textSize="14sp"
            android:background="@drawable/bg_card"
            android:focusable="true" android:clickable="true"/>
    </LinearLayout>
</androidx.drawerlayout.widget.DrawerLayout>
EOF

