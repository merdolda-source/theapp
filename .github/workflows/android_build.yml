name: ErdinPlayer Pro Ultra Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Çekme
      uses: actions/checkout@v4
    
    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. ErdinPlayer Pro Proje Üretimi (Xtream + M3U + Reklamlı + Gesture Player) - SIGNED
      shell: bash
      run: |
        chmod +x generate_erdinplayer.sh
        ./generate_erdinplayer.sh

    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK + AAB (Release / Signed)
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon
        gradle bundleRelease --no-daemon

    - name: 6. APK'yi GitHub Artifact Olarak Yükle
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Ultra-APK
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk

    - name: 7. AAB'yi GitHub Artifact Olarak Yükle
      id: upload_aab
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-Ultra-AAB
        path: ErdinPlayer/app/build/outputs/bundle/release/*.aab

    - name: 8. Artifact URL'lerini Göster
      run: |
        echo "====================================="
        echo " 📦 APK Artifact URL (GitHub):"
        echo "${{ steps.upload_apk.outputs.artifact-url }}"
        echo "-------------------------------------"
        echo " 📦 AAB Artifact URL (GitHub):"
        echo "${{ steps.upload_aab.outputs.artifact-url }}"
        echo "====================================="

        echo "### ErdinPlayer Pro Çıktılar" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [APK'yi buradan indir](${{ steps.upload_apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [AAB'yi buradan indir](${{ steps.upload_aab.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
