name: ErdinPlayer Pro Anti-Crash Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Depo Kontrolü
      uses: actions/checkout@v4
    
    - name: 2. JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Profesyonel Mimari İnşası (Hata Ayıklamalı)
      run: |
        echo "Goodbye"
        APP_NAME="ErdinPlayer"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        PASS="erdin123"
        
        echo "🚀 Uygulama Motoru ve Arayüzü İnşa Ediliyor..."

        # Klasör Yapısı (Modüler Mimari)
        rm -rf $APP_NAME
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/models
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/adapters
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/utils
        mkdir -p $APP_NAME/app/src/main/java/$PATH_NAME/player
        mkdir -p $APP_NAME/app/src/main/res/layout
        mkdir -p $APP_NAME/app/src/main/res/values
        mkdir -p $APP_NAME/app/src/main/res/drawable
        mkdir -p $APP_NAME/app/src/main/res/mipmap-hdpi
        
        cd $APP_NAME

        # İKON VE İMZA DOSYALARI
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://www.freepnglogos.com/uploads/512x512-logo-png/512x512-logo-download-anarchy-png-image-transparent-png-31.png"
        keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass $PASS -keypass $PASS -dname "CN=Erdin, O=ErdinMedia, C=TR"

        # --- GRADLE YAPILANDIRMASI (HATA KORUMALI) ---
        echo "include ':app'" > settings.gradle
        echo -e "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m" > gradle.properties

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { 
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'kotlin-android' }
        android {
            namespace '$PACKAGE_NAME'
            compileSdk 33
            defaultConfig { 
                applicationId "$PACKAGE_NAME"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0.5"
            }
            signingConfigs { release { storeFile file("keystore.jks"); storePassword "$PASS"; keyAlias "key0"; keyPassword "$PASS" } }
            buildTypes { release { minifyEnabled true; signingConfig signingConfigs.release; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.7.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.media3:media3-exoplayer:1.1.0'
            implementation 'androidx.media3:media3-ui:1.1.0'
            implementation 'com.github.bumptech.glide:glide:4.15.1'
        }
        EOF

        # --- GÜÇLÜ KAYNAK DOSYALARI (ÇÖKMEYİ ENGELLER) ---
        cat <<EOF > app/src/main/res/values/colors.xml
        <resources>
            <color name="bg_dark">#0A0A0A</color>
            <color name="card_dark">#161616</color>
            <color name="sport_green">#00E676</color>
            <color name="white">#FFFFFF</color>
            <color name="gray_text">#9E9E9E</color>
            <color name="pure_black">#000000</color>
        </resources>
        EOF

        cat <<EOF > app/src/main/res/drawable/bg_input_fix.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#FFFFFF"/><corners android:radius="12dp"/><stroke android:width="3dp" android:color="#00E676"/>
        </shape>
        EOF

        cat <<EOF > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.ErdinPlayer" parent="Theme.AppCompat.DayNight.NoActionBar">
                <item name="android:windowBackground">@color/bg_dark</item>
                <item name="colorPrimary">@color/sport_green</item>
                <item name="colorAccent">@color/sport_green</item>
                <item name="android:textColor">@color/white</item>
            </style>
        </resources>
        EOF

        # --- MODEL VE YARDIMCI SINIFLAR ---
        echo "package $PACKAGE_NAME.models; data class XtreamItem(val id: String, val name: String, val type: String)" > app/src/main/java/$PATH_NAME/models/XtreamItem.kt
        
        cat <<EOF > app/src/main/java/$PATH_NAME/utils/SessionManager.kt
        package $PACKAGE_NAME.utils
        import android.content.Context
        class SessionManager(ctx: Context) {
            private val pref = ctx.getSharedPreferences("ErdinSession", 0)
            fun save(dns: String, u: String, p: String) {
                pref.edit().putString("dns", dns).putString("u", u).putString("p", p).apply()
            }
            fun getDns() = pref.getString("dns", "") ?: ""
            fun getUser() = pref.getString("u", "") ?: ""
            fun getPass() = pref.getString("p", "") ?: ""
        }
        EOF

        # --- ANA KOTLIN AKTİVİTELERİ (RESOURCES IMPORTLARI EKLENDİ) ---

        # 1. LOGIN ACTIVITY (LAUNCHER)
        cat <<EOF > app/src/main/java/$PATH_NAME/LoginActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.utils.SessionManager

        class LoginActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                try {
                    setContentView(R.layout.activity_login)
                    val session = SessionManager(this)
                    val eD = findViewById<EditText>(R.id.etDns)
                    val eU = findViewById<EditText>(R.id.etUser)
                    val eP = findViewById<EditText>(R.id.etPass)
                    
                    eD.setText(session.getDns())
                    eU.setText(session.getUser())
                    eP.setText(session.getPass())

                    findViewById<Button>(R.id.btnLogin).setOnClickListener {
                        if (eD.text.isNotEmpty() && eU.text.isNotEmpty()) {
                            session.save(eD.text.toString(), eU.text.toString(), eP.text.toString())
                            startActivity(Intent(this, DashboardActivity::class.java))
                        } else {
                            Toast.makeText(this, "Tüm alanları doldurun!", Toast.LENGTH_SHORT).show()
                        }
                    }
                } catch (e: Exception) { e.printStackTrace() }
            }
        }
        EOF

        # 2. DASHBOARD ACTIVITY
        cat <<EOF > app/src/main/java/$PATH_NAME/DashboardActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.view.View
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.utils.SessionManager

        class DashboardActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_dashboard)
                val user = SessionManager(this).getUser()
                findViewById<TextView>(R.id.tvTitle).text = "HOŞGELDİN, \$user"

                val openList = { type: String ->
                    val i = Intent(this, ListActivity::class.java)
                    i.putExtra("TYPE", type)
                    startActivity(i)
                }

                findViewById<View>(R.id.btnLive).setOnClickListener { openList("LIVE") }
                findViewById<View>(R.id.btnVod).setOnClickListener { openList("VOD") }
                findViewById<View>(R.id.btnSeries).setOnClickListener { openList("SERIES") }
                findViewById<View>(R.id.btnSettings).setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
            }
        }
        EOF

        # 3. LIST ACTIVITY
        cat <<EOF > app/src/main/java/$PATH_NAME/ListActivity.kt
        package $PACKAGE_NAME
        import android.content.Intent
        import android.os.Bundle
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity
        import $PACKAGE_NAME.R
        import $PACKAGE_NAME.utils.SessionManager

        class ListActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_list_view)
                val type = intent.getStringExtra("TYPE") ?: "LIVE"
                findViewById<TextView>(R.id.tvHeader).text = "\$type KATEGORİLERİ"
                
                val items = listOf("Spor", "Sinema", "Ulusal", "Belgesel", "Haber", "Çocuk", "Müzik", "Eğlence")
                val lv = findViewById<ListView>(R.id.listView)
                lv.adapter = ArrayAdapter(this, R.layout.pro_row_item, items)
                
                lv.setOnItemClickListener { _, _, _, _ ->
                    val i = Intent(this, PlayerActivity::class.java)
                    val s = SessionManager(this)
                    // Örnek Xtream URL Mantığı
                    i.putExtra("URL", "\${s.getDns()}/live/\${s.getUser()}/\${s.getPass()}/1.ts")
                    startActivity(i)
                }
            }
        }
        EOF

        # 4. PLAYER ACTIVITY (PROFESYONEL MOTOR)
        cat <<EOF > app/src/main/java/$PATH_NAME/PlayerActivity.kt
        package $PACKAGE_NAME
        import android.os.Bundle
        import android.view.WindowManager
        import androidx.appcompat.app.AppCompatActivity
        import androidx.media3.common.MediaItem
        import androidx.media3.exoplayer.ExoPlayer
        import androidx.media3.ui.PlayerView
        import $PACKAGE_NAME.R

        class PlayerActivity : AppCompatActivity() {
            private var player: ExoPlayer? = null
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                setContentView(R.layout.activity_player_view)
                
                val url = intent.getStringExtra("URL") ?: ""
                player = ExoPlayer.Builder(this).build()
                val pv = findViewById<PlayerView>(R.id.playerView)
                pv.player = player
                
                val mediaItem = MediaItem.fromUri(url)
                player?.setMediaItem(mediaItem)
                player?.prepare()
                player?.play()
            }
            override fun onDestroy() { super.onDestroy(); player?.release(); player = null }
        }
        EOF

        # 5. SETTINGS ACTIVITY
        echo "package $PACKAGE_NAME; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; class SettingsActivity : AppCompatActivity() { override fun onCreate(b: Bundle?) { super.onCreate(b); setContentView(R.layout.activity_dashboard) } }" > app/src/main/java/$PATH_NAME/SettingsActivity.kt

        # --- GÖRSEL TASARIMLAR (XML) ---
        cat <<EOF > app/src/main/res/layout/activity_login.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:gravity="center" android:padding="35dp" android:background="@color/bg_dark">
            <ImageView android:src="@mipmap/ic_launcher" android:layout_width="110dp" android:layout_height="110dp" android:layout_marginBottom="20dp"/>
            <TextView android:text="ERDIN PLAYER PRO" android:textColor="@color/sport_green" android:textSize="26sp" android:textStyle="bold" android:layout_marginBottom="40dp"/>
            <EditText android:id="@+id/etDns" android:hint="DNS: http://url:port" android:background="@drawable/bg_input_fix" android:padding="16dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="12dp" android:textColor="#000" android:textColorHint="#777"/>
            <EditText android:id="@+id/etUser" android:hint="Kullanıcı Adı" android:background="@drawable/bg_input_fix" android:padding="16dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="12dp" android:textColor="#000" android:textColorHint="#777"/>
            <EditText android:id="@+id/etPass" android:hint="Şifre" android:inputType="textPassword" android:background="@drawable/bg_input_fix" android:padding="16dp" android:layout_width="match_parent" android:layout_height="60dp" android:layout_marginBottom="35dp" android:textColor="#000" android:textColorHint="#777"/>
            <Button android:id="@+id/btnLogin" android:text="SİSTEME GİRİŞ YAP" android:backgroundTint="@color/sport_green" android:textColor="@color/pure_black" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="65dp"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_dashboard.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="20dp" android:background="@color/bg_dark">
            <TextView android:id="@+id/tvTitle" android:text="HOŞGELDİN" android:textColor="@color/sport_green" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="40dp"/>
            <GridLayout android:columnCount="2" android:layout_width="match_parent" android:layout_height="wrap_content">
                <Button android:id="@+id/btnLive" android:text="📺 CANLI" android:layout_margin="8dp" android:layout_columnWeight="1" android:layout_height="120dp" android:backgroundTint="@color/card_dark"/>
                <Button android:id="@+id/btnVod" android:text="🎬 FİLM" android:layout_margin="8dp" android:layout_columnWeight="1" android:layout_height="120dp" android:backgroundTint="@color/card_dark"/>
                <Button android:id="@+id/btnSeries" android:text="🍿 DİZİ" android:layout_margin="8dp" android:layout_columnWeight="1" android:layout_height="120dp" android:backgroundTint="@color/card_dark"/>
                <Button android:id="@+id/btnSettings" android:text="⚙️ AYARLAR" android:layout_margin="8dp" android:layout_columnWeight="1" android:layout_height="120dp" android:backgroundTint="@color/card_dark"/>
            </GridLayout>
        </LinearLayout>
        EOF

        echo "<LinearLayout xmlns:android='http://schemas.android.com/apk/res/android' android:layout_width='match_parent' android:layout_height='match_parent' android:orientation='vertical' android:background='#0A0A0A'><TextView android:id='@+id/tvHeader' android:layout_width='match_parent' android:layout_height='wrap_content' android:textColor='#00E676' android:textSize='20sp' android:padding='20dp'/><ListView android:id='@+id/listView' android:layout_width='match_parent' android:layout_height='match_parent' android:divider='#222' android:dividerHeight='1dp'/></LinearLayout>" > app/src/main/res/layout/activity_list_view.xml
        echo "<FrameLayout xmlns:android='http://schemas.android.com/apk/res/android' android:layout_width='match_parent' android:layout_height='match_parent' android:background='#000'><androidx.media3.ui.PlayerView android:id='@+id/playerView' android:layout_width='match_parent' android:layout_height='match_parent'/></FrameLayout>" > app/src/main/res/layout/activity_player_view.xml
        echo "<TextView xmlns:android='http://schemas.android.com/apk/res/android' android:id='@android:id/text1' android:layout_width='match_parent' android:layout_height='wrap_content' android:textColor='#FFF' android:textSize='17sp' android:padding='18dp' android:background='#161616' android:layout_marginBottom='2dp'/>" > app/src/main/res/layout/pro_row_item.xml

        # --- MANIFEST (EN ÖNEMLİ KISIM) ---
        cat <<EOF > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/Theme.ErdinPlayer" android:icon="@mipmap/ic_launcher" android:label="ErdinPlayer Pro" android:usesCleartextTraffic="true">
                <activity android:name=".LoginActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
                <activity android:name=".DashboardActivity"/><activity android:name=".ListActivity"/><activity android:name=".PlayerActivity"/><activity android:name=".SettingsActivity"/>
            </application>
        </manifest>
        EOF

    - name: 4. Gradle Derleme
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK
      run: |
        cd ErdinPlayer
        gradle assembleRelease --no-daemon

    - name: 6. APK Yükle
      uses: actions/upload-artifact@v4
      with:
        name: ErdinPlayer-Pro-AntiCrash
        path: ErdinPlayer/app/build/outputs/apk/release/*.apk
