name: ErdinPlayer Pro Hybrid (Final PHP Config + UI Fix + Dynamic Ads + Gestures)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Çekme
      uses: actions/checkout@v4

    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. ErdinPlayer Pro Proje Üretimi (PHP Config + New UI + Dynamic Ads + Gestures)
      shell: bash
      run: |
        set -e
        APP_NAME="ErdinXtream"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"
        PASS="erdin123"
        STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$PASS}"
        KEY_PASS="${ANDROID_KEY_PASSWORD:-$PASS}"
        KEY_ALIAS="${ANDROID_KEY_ALIAS:-key0}"

        rm -rf "$APP_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/models"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/adapters"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/utils"
        mkdir -p "$APP_NAME/app/src/main/res/layout"
        mkdir -p "$APP_NAME/app/src/main/res/values"
        mkdir -p "$APP_NAME/app/src/main/res/values-tr"
        mkdir -p "$APP_NAME/app/src/main/res/drawable"
        mkdir -p "$APP_NAME/app/src/main/res/mipmap-hdpi"
        mkdir -p "$APP_NAME/app/src/main/res/xml"
        mkdir -p "$APP_NAME/app/src/main/res/anim"
        cd "$APP_NAME"

        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png \
          "https://i.ibb.co/LDdzzhsk/f564b0ed-277d-489c-9a1a-c59f0fe471fc.png" || true

        if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks || \
          keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 \
            -validity 10000 -alias "$KEY_ALIAS" -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" -dname "CN=Erdin,O=ErdinMedia,C=TR"
        else
          keytool -genkey -v -keystore app/keystore.jks -keyalg RSA -keysize 2048 \
            -validity 10000 -alias "$KEY_ALIAS" -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" -dname "CN=Erdin,O=ErdinMedia,C=TR"
        fi

        echo "include ':app'" > settings.gradle

        python3 -c "import base64,os; os.makedirs(os.path.dirname('gradle.properties') or '.', exist_ok=True); open('gradle.properties','wb').write(base64.b64decode('YW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQuZW5hYmxlSmV0aWZpZXI9dHJ1ZQpvcmcuZ3JhZGxlLmp2bWFyZ3M9LVhteDIwNDhtCg=='))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('build.gradle') or '.', exist_ok=True); open('build.gradle','wb').write(base64.b64decode(''))"
        mkdir -p app
        python3 -c "import base64,os; t=base64.b64decode('').decode(); t=t.replace('PACKAGE_NAME_PLACEHOLDER',os.environ['PACKAGE_NAME']).replace('STORE_PASS_PLACEHOLDER',os.environ['STORE_PASS']).replace('KEY_ALIAS_PLACEHOLDER',os.environ['KEY_ALIAS']).replace('KEY_PASS_PLACEHOLDER',os.environ['KEY_PASS']); open('app/build.gradle','w').write(t)"

        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/values/colors.xml') or '.', exist_ok=True); open('app/src/main/res/values/colors.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/values/styles.xml') or '.', exist_ok=True); open('app/src/main/res/values/styles.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/values/strings.xml') or '.', exist_ok=True); open('app/src/main/res/values/strings.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/values-tr/strings.xml') or '.', exist_ok=True); open('app/src/main/res/values-tr/strings.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/anim/slide_in_right.xml') or '.', exist_ok=True); open('app/src/main/res/anim/slide_in_right.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/anim/slide_out_left.xml') or '.', exist_ok=True); open('app/src/main/res/anim/slide_out_left.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/anim/slide_in_left.xml') or '.', exist_ok=True); open('app/src/main/res/anim/slide_in_left.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/anim/slide_out_right.xml') or '.', exist_ok=True); open('app/src/main/res/anim/slide_out_right.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/drawable/bg_input.xml') or '.', exist_ok=True); open('app/src/main/res/drawable/bg_input.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/drawable/bg_input_focused.xml') or '.', exist_ok=True); open('app/src/main/res/drawable/bg_input_focused.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/drawable/sel_input.xml') or '.', exist_ok=True); open('app/src/main/res/drawable/sel_input.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/drawable/bg_btn_accent.xml') or '.', exist_ok=True); open('app/src/main/res/drawable/bg_btn_accent.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/drawable/bg_card.xml') or '.', exist_ok=True); open('app/src/main/res/drawable/bg_card.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/drawable/bg_tab_sel.xml') or '.', exist_ok=True); open('app/src/main/res/drawable/bg_tab_sel.xml','wb').write(base64.b64decode('PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iIzZDNjNGRiIvPgogICAgPGNvcm5lcnMgYW5kcm9pZDpyYWRpdXM9IjIwZHAiLz4KPC9zaGFwZT4='))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/drawable/bg_tab_norm.xml') or '.', exist_ok=True); open('app/src/main/res/drawable/bg_tab_norm.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/drawable/bg_chip.xml') or '.', exist_ok=True); open('app/src/main/res/drawable/bg_chip.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/xml/network_security_config.xml') or '.', exist_ok=True); open('app/src/main/res/xml/network_security_config.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/AndroidManifest.xml') or '.', exist_ok=True); open('app/src/main/AndroidManifest.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/layout/activity_splash.xml') or '.', exist_ok=True); open('app/src/main/res/layout/activity_splash.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/layout/activity_login.xml') or '.', exist_ok=True); open('app/src/main/res/layout/activity_login.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/layout/activity_content.xml') or '.', exist_ok=True); open('app/src/main/res/layout/activity_content.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/layout/item_stream.xml') or '.', exist_ok=True); open('app/src/main/res/layout/item_stream.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/layout/item_account.xml') or '.', exist_ok=True); open('app/src/main/res/layout/item_account.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/layout/activity_series.xml') or '.', exist_ok=True); open('app/src/main/res/layout/activity_series.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/res/layout/activity_player.xml') or '.', exist_ok=True); open('app/src/main/res/layout/activity_player.xml','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/models/Models.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/models/Models.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/utils/RemoteConfig.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/utils/RemoteConfig.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/utils/AdsHelper.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/utils/AdsHelper.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/utils/Prefs.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/utils/Prefs.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/utils/RemoteLogger.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/utils/RemoteLogger.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/adapters/GridAdapter.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/adapters/GridAdapter.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/adapters/AccountsAdapter.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/adapters/AccountsAdapter.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/SplashActivity.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/SplashActivity.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/LoginActivity.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/LoginActivity.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/ContentActivity.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/ContentActivity.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/SeriesDetailActivity.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/SeriesDetailActivity.kt','wb').write(base64.b64decode(''))"
        python3 -c "import base64,os; os.makedirs(os.path.dirname('app/src/main/java/com/erdin/player/PlayerActivity.kt') or '.', exist_ok=True); open('app/src/main/java/com/erdin/player/PlayerActivity.kt','wb').write(base64.b64decode(''))"
    - name: 4. Gradle Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: 5. Build APK + AAB
      run: |
        cd ErdinXtream
        gradle assembleRelease --no-daemon
        gradle bundleRelease --no-daemon

    - name: 6. APK Bul
      id: find_apk
      run: |
        APK=$(find ErdinXtream/app/build/outputs/apk/release -name "*.apk" | head -1)
        AAB=$(find ErdinXtream/app/build/outputs/bundle/release -name "*.aab" | head -1)
        echo "apk=$APK" >> $GITHUB_OUTPUT
        echo "aab=$AAB" >> $GITHUB_OUTPUT

    - name: 7. GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v4.0.${{ github.run_number }}
        name: ErdinXtream Pro v4.0.${{ github.run_number }}
        body: |
          ErdinXtream Player Pro v4 - Yeni tasarim + Canli TV duzeltme
        files: |
          ${{ steps.find_apk.outputs.apk }}
          ${{ steps.find_apk.outputs.aab }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
