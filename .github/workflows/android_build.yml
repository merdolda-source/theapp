                    android:text="EN"
                    android:textColor="@color/white"
                    android:paddingLeft="10dp"
                    android:textStyle="bold"/>
            </LinearLayout>

            <TextView
                android:id="@+id/tvTitle"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="@string/app_name"
                android:textColor="@color/accent_green"
                android:textStyle="bold"
                android:textSize="22sp"
                android:layout_marginBottom="10dp"/>

            <TextView
                android:id="@+id/tvLoginType"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="@string/login_type"
                android:textColor="@color/white"
                android:textSize="15sp"
                android:layout_marginBottom="6dp"/>

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:layout_marginBottom="12dp">

                <LinearLayout
                    android:id="@+id/cardXtream"
                    android:layout_width="0dp"
                    android:layout_height="64dp"
                    android:layout_weight="1"
                    android:orientation="vertical"
                    android:gravity="center"
                    android:padding="8dp"
                    android:background="@drawable/bg_input_dark"
                    android:layout_marginRight="6dp">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="@string/xtream"
                        android:textStyle="bold"
                        android:textColor="@color/white"
                        android:textSize="15sp"/>
                </LinearLayout>

                <LinearLayout
                    android:id="@+id/cardM3u"
                    android:layout_width="0dp"
                    android:layout_height="64dp"
                    android:layout_weight="1"
                    android:orientation="vertical"
                    android:gravity="center"
                    android:padding="8dp"
                    android:background="@drawable/bg_input_dark"
                    android:layout_marginLeft="6dp">

                    <TextView
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="@string/m3u"
                        android:textStyle="bold"
                        android:textColor="@color/white"
                        android:textSize="15sp"/>
                </LinearLayout>
            </LinearLayout>

            <EditText
                android:id="@+id/etName"
                android:layout_width="match_parent"
                android:layout_height="52dp"
                android:hint="@string/example_name"
                android:background="@drawable/bg_input_dark"
                android:padding="10dp"
                android:textColor="@color/white"
                android:textColorHint="@color/white"
                android:inputType="textPersonName"
                android:layout_marginBottom="8dp"/>

            <LinearLayout
                android:id="@+id/layoutXtream"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical">

                <EditText
                    android:id="@+id/etDns"
                    android:layout_width="match_parent"
                    android:layout_height="52dp"
                    android:hint="@string/enter_xtream_url"
                    android:background="@drawable/bg_input_dark"
                    android:padding="10dp"
                    android:textColor="@color/white"
                    android:textColorHint="@color/white"
                    android:inputType="textUri"
                    android:layout_marginBottom="8dp"/>

                <EditText
                    android:id="@+id/etUser"
                    android:layout_width="match_parent"
                    android:layout_height="52dp"
                    android:hint="@string/username"
                    android:background="@drawable/bg_input_dark"
                    android:padding="10dp"
                    android:textColor="@color/white"
                    android:textColorHint="@color/white"
                    android:inputType="textEmailAddress"
                    android:layout_marginBottom="8dp"/>

                <EditText
                    android:id="@+id/etPass"
                    android:layout_width="match_parent"
                    android:layout_height="52dp"
                    android:hint="@string/password"
                    android:inputType="textVisiblePassword"
                    android:background="@drawable/bg_input_dark"
                    android:padding="10dp"
                    android:textColor="@color/white"
                    android:textColorHint="@color/white"
                    android:layout_marginBottom="8dp"/>
            </LinearLayout>

            <LinearLayout
                android:id="@+id/layoutM3u"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical"
                android:visibility="gone">

                <EditText
                    android:id="@+id/etM3u"
                    android:layout_width="match_parent"
                    android:layout_height="52dp"
                    android:hint="@string/enter_m3u"
                    android:background="@drawable/bg_input_dark"
                    android:padding="10dp"
                    android:textColor="@color/white"
                    android:textColorHint="@color/hint_yellow"
                    android:inputType="textUri"
                    android:layout_marginBottom="8dp"/>
            </LinearLayout>

            <Button
                android:id="@+id/btnAddAccount"
                android:layout_width="match_parent"
                android:layout_height="56dp"
                android:text="@string/add_account"
                android:textStyle="bold"
                android:textColor="@color/black"
                android:background="@color/accent_green"
                android:layout_marginBottom="16dp"/>

            <TextView
                android:id="@+id/tvAccountsTitle"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="@string/saved_accounts"
                android:textColor="@color/white"
                android:textSize="16sp"
                android:textStyle="bold"
                android:layout_marginBottom="2dp"/>

            <TextView
                android:id="@+id/tvAccountsHint"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="@string/saved_accounts_hint"
                android:textColor="@color/hint_yellow"
                android:textSize="13sp"
                android:layout_marginBottom="6dp"/>

            <ListView
                android:id="@+id/lvAccounts"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:divider="@android:color/transparent"
                android:dividerHeight="10dp"/>
        </LinearLayout>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_content.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:ads="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="@color/bg_dark">

            <com.google.android.gms.ads.AdView
                android:id="@+id/adViewTopContent"
