name: ErdinXtream Player Pro v3 (Favs + History + Media3 + Gestures + Seek)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Ã‡ekme
      uses: actions/checkout@v4

    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. ErdinXtream Player Pro v3 Proje Uretimi
      shell: bash
      run: |
        set -e

        APP_NAME="ErdinXtream"
        PACKAGE_NAME="com.erdin.player"
        PATH_NAME="com/erdin/player"

        PASS="erdin123"
        STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$PASS}"
        KEY_PASS="${ANDROID_KEY_PASSWORD:-$PASS}"
        KEY_ALIAS="${ANDROID_KEY_ALIAS:-key0}"

        echo "ğŸš€ ErdinPlayer Pro (PHP Config Edition) Ã¼retiliyor..."

        rm -rf "$APP_NAME"

        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/models"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/adapters"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/utils"
        mkdir -p "$APP_NAME/app/src/main/res/layout"
        mkdir -p "$APP_NAME/app/src/main/res/values"
        mkdir -p "$APP_NAME/app/src/main/res/values-tr"
        mkdir -p "$APP_NAME/app/src/main/res/drawable"
        mkdir -p "$APP_NAME/app/src/main/res/mipmap-hdpi"
        mkdir -p "$APP_NAME/app/src/main/res/menu"
        mkdir -p "$APP_NAME/app/src/main/res/color"
        mkdir -p "$APP_NAME/app/src/main/res/xml"

        cd "$APP_NAME"

        # Icon
        wget -U "Mozilla/5.0" -O app/src/main/res/mipmap-hdpi/ic_launcher.png "https://i.ibb.co/LDdzzhsk/f564b0ed-277d-489c-9a1a-c59f0fe471fc.png" || true

        # Keystore
        if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          echo "ğŸ” Keystore secrets'ten yazÄ±lÄ±yor..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks || {
            echo "âš ï¸ base64 decode HATASI â€“ local keystore Ã¼retilecek."
            keytool -genkey -v \
              -keystore app/keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Erdin, O=ErdinMedia, C=TR"
          }
        else
          echo "âš ï¸ ANDROID_KEYSTORE_BASE64 yok, local keystore Ã¼retilecek."
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Erdin, O=ErdinMedia, C=TR"
        fi

        # Gradle config
        echo "include ':app'" > settings.gradle

        cat <<EOF > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.0.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        mkdir -p app

        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            namespace '$PACKAGE_NAME'
            compileSdk 34

            defaultConfig {
                applicationId "$PACKAGE_NAME"
                minSdk 21
                targetSdk 35
                versionCode 20
                versionName "3.0.0-xtream-pro"
            }

            signingConfigs {
                release {
                    storeFile file("keystore.jks")
                    storePassword "$STORE_PASS"
                    keyAlias "$KEY_ALIAS"
                    keyPassword "$KEY_PASS"
                }
            }

            buildTypes {
                release {
                    minifyEnabled false
                    signingConfig signingConfigs.release
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
