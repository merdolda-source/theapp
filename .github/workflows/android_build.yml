        # --- CONTENT ACTIVITY (Kategori + Liste) ---
        cat > app/src/main/java/$PATH_NAME/ContentActivity.kt <<EOF
package $PACKAGE_NAME

import android.content.Intent
import android.os.Bundle
import android.view.View
import android.widget.ProgressBar
import android.widget.TextView
import android.widget.Toast
import androidx.appcompat.app.AppCompatActivity
import androidx.recyclerview.widget.LinearLayoutManager
import androidx.recyclerview.widget.RecyclerView
import com.google.gson.JsonObject
import retrofit2.Call
import retrofit2.Callback
import retrofit2.Response

class ContentActivity : AppCompatActivity() {

    private lateinit var type: String
    private lateinit var api: XtreamService
    private lateinit var portal: String
    private lateinit var user: String
    private lateinit var pass: String

    private lateinit var rvCats: RecyclerView
    private lateinit var rvItems: RecyclerView
    private lateinit var progress: ProgressBar
    private lateinit var txtTitle: TextView

    private lateinit var catAdapter: SimpleAdapter
    private lateinit var itemAdapter: SimpleAdapter

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_content)

        type = intent.getStringExtra("type") ?: "live"

        portal = Prefs.portal(this)
        user = Prefs.user(this)
        pass = Prefs.pass(this)
        api = ApiClient.create(portal)

        txtTitle = findViewById(R.id.txtTitle)
        rvCats = findViewById(R.id.rvCategories)
        rvItems = findViewById(R.id.rvItems)
        progress = findViewById(R.id.progress)

        txtTitle.text = when(type) {
            "vod" -> "Filmler"
            "series" -> "Diziler"
            else -> "Canlı TV"
        }

        rvCats.layoutManager = LinearLayoutManager(this, LinearLayoutManager.HORIZONTAL, false)
        rvItems.layoutManager = LinearLayoutManager(this)

        catAdapter = SimpleAdapter(emptyList()) { row -> loadItems(row.id) }
        itemAdapter = SimpleAdapter(emptyList()) { row ->
            when (type) {
                "series" -> {
                    val i = Intent(this, SeriesEpisodesActivity::class.java)
                    i.putExtra("series_id", row.id)
                    i.putExtra("series_title", row.title)
                    startActivity(i)
                }
                else -> {
                    val url = buildPlayUrl(type, row.id)
                    val i = Intent(this, PlayerActivity::class.java)
                    i.putExtra("stream_url", url)
                    startActivity(i)
                }
            }
        }

        rvCats.adapter = catAdapter
        rvItems.adapter = itemAdapter

        loadCategories()
    }

    private fun loadCategories() {
        progress.visibility = View.VISIBLE

        val action = when(type) {
            "vod" -> "get_vod_categories"
            "series" -> "get_series_categories"
            else -> "get_live_categories"
        }

        api.playerApi(user, pass, action).enqueue(object : Callback<JsonObject> {
            override fun onResponse(call: Call<JsonObject>, response: Response<JsonObject>) {
                progress.visibility = View.GONE
                val arr = response.body()?.asJsonArray ?: run {
                    Toast.makeText(this@ContentActivity, "Kategori gelmedi", Toast.LENGTH_SHORT).show()
                    return
                }

                val list = arr.mapNotNull { el ->
                    val o = el.asJsonObject
                    val id = o.get("category_id")?.asString ?: return@mapNotNull null
                    val name = o.get("category_name")?.asString ?: "Kategori"
                    SimpleAdapter.RowItem(id, name)
                }

                catAdapter.submit(list)
                if (list.isNotEmpty()) loadItems(list.first().id)
            }

            override fun onFailure(call: Call<JsonObject>, t: Throwable) {
                progress.visibility = View.GONE
                Toast.makeText(this@ContentActivity, "Hata: \${t.message}", Toast.LENGTH_LONG).show()
            }
        })
    }

    private fun loadItems(categoryId: String) {
        progress.visibility = View.VISIBLE

        val action = when(type) {
            "vod" -> "get_vod_streams"
            "series" -> "get_series"
            else -> "get_live_streams"
        }

        api.playerApi(user, pass, action, categoryId).enqueue(object : Callback<JsonObject> {
            override fun onResponse(call: Call<JsonObject>, response: Response<JsonObject>) {
                progress.visibility = View.GONE
                val arr = response.body()?.asJsonArray ?: run {
                    Toast.makeText(this@ContentActivity, "Liste gelmedi", Toast.LENGTH_SHORT).show()
                    return
                }

                val idField = if (type == "series") "series_id" else "stream_id"

                val list = arr.mapNotNull { el ->
                    val o = el.asJsonObject
                    val id = o.get(idField)?.asString ?: return@mapNotNull null
                    val name = o.get("name")?.asString ?: "İçerik"
                    SimpleAdapter.RowItem(id, name)
                }

                itemAdapter.submit(list)
            }

            override fun onFailure(call: Call<JsonObject>, t: Throwable) {
                progress.visibility = View.GONE
                Toast.makeText(this@ContentActivity, "Hata: \${t.message}", Toast.LENGTH_LONG).show()
            }
        })
    }

    private fun buildPlayUrl(type: String, id: String): String {
        val base = if (portal.endsWith("/")) portal.dropLast(1) else portal
        return when(type) {
            "vod" -> "\$base/movie/\$user/\$pass/\$id.mp4"
            else -> "\$base/live/\$user/\$pass/\$id.m3u8"
        }
    }
}
EOF

        # --- SERIES EPISODES ACTIVITY (Dizi -> Bölümler) ---
        cat > app/src/main/java/$PATH_NAME/SeriesEpisodesActivity.kt <<EOF
package $PACKAGE_NAME

import android.content.Intent
import android.os.Bundle
import android.view.View
import android.widget.ProgressBar
import android.widget.TextView
import android.widget.Toast
import androidx.appcompat.app.AppCompatActivity
import androidx.recyclerview.widget.LinearLayoutManager
import androidx.recyclerview.widget.RecyclerView
import com.google.gson.JsonObject
import retrofit2.Call
import retrofit2.Callback
import retrofit2.Response

class SeriesEpisodesActivity : AppCompatActivity() {

    private lateinit var api: XtreamService
    private lateinit var portal: String
    private lateinit var user: String
    private lateinit var pass: String

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_series_episodes)

        portal = Prefs.portal(this)
        user = Prefs.user(this)
        pass = Prefs.pass(this)
        api = ApiClient.create(portal)

        val seriesId = intent.getStringExtra("series_id") ?: ""
        val seriesTitle = intent.getStringExtra("series_title") ?: "Dizi"

        val txtTitle = findViewById<TextView>(R.id.txtTitle)
        val rv = findViewById<RecyclerView>(R.id.rvEpisodes)
        val progress = findViewById<ProgressBar>(R.id.progress)

        txtTitle.text = seriesTitle
        rv.layoutManager = LinearLayoutManager(this)

        val adapter = SimpleAdapter(emptyList()) { row ->
            val url = buildEpisodeUrl(row.id)
            val i = Intent(this, PlayerActivity::class.java)
            i.putExtra("stream_url", url)
            startActivity(i)
        }
        rv.adapter = adapter

        if (seriesId.isEmpty()) {
            Toast.makeText(this, "Series ID yok", Toast.LENGTH_SHORT).show()
            finish()
            return
        }

        progress.visibility = View.VISIBLE
        api.playerApi(user, pass, "get_series_info", null, seriesId).enqueue(object : Callback<JsonObject> {
            override fun onResponse(call: Call<JsonObject>, response: Response<JsonObject>) {
                progress.visibility = View.GONE
                val body = response.body() ?: run {
                    Toast.makeText(this@SeriesEpisodesActivity, "Bilgi gelmedi", Toast.LENGTH_SHORT).show()
                    return
                }

                val episodesObj = body.getAsJsonObject("episodes") ?: run {
                    Toast.makeText(this@SeriesEpisodesActivity, "Bölüm bulunamadı", Toast.LENGTH_SHORT).show()
                    return
                }

                val out = mutableListOf<SimpleAdapter.RowItem>()
                for ((seasonKey, arrEl) in episodesObj.entrySet()) {
                    val arr = arrEl.asJsonArray
                    arr.forEach { epEl ->
                        val o = epEl.asJsonObject
                        val id = o.get("id")?.asString ?: return@forEach
                        val titleEp = o.get("title")?.asString ?: "Episode"
                        val epNum = o.get("episode_num")?.asString ?: ""
                        val label = "S\${seasonKey}E\${epNum} - \$titleEp"
                        out.add(SimpleAdapter.RowItem(id, label))
                    }
                }

                if (out.isEmpty()) {
                    Toast.makeText(this@SeriesEpisodesActivity, "Bölüm listesi boş", Toast.LENGTH_SHORT).show()
                } else {
                    adapter.submit(out)
                }
            }

            override fun onFailure(call: Call<JsonObject>, t: Throwable) {
                progress.visibility = View.GONE
                Toast.makeText(this@SeriesEpisodesActivity, "Hata: \${t.message}", Toast.LENGTH_LONG).show()
            }
        })
    }

    private fun buildEpisodeUrl(episodeId: String): String {
        val base = if (portal.endsWith("/")) portal.dropLast(1) else portal
        return "\$base/series/\$user/\$pass/\$episodeId.m3u8"
    }
}
EOF

        # --- PLAYER ACTIVITY (AYNI MANTIK) ---
        cat > app/src/main/java/$PATH_NAME/PlayerActivity.kt <<EOF
package $PACKAGE_NAME

import android.os.Bundle
import androidx.appcompat.app.AppCompatActivity
import androidx.media3.common.MediaItem
import androidx.media3.exoplayer.ExoPlayer
import androidx.media3.ui.PlayerView

class PlayerActivity : AppCompatActivity() {
    private var player: ExoPlayer? = null
    private lateinit var playerView: PlayerView

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_player)

        playerView = findViewById(R.id.player_view)
        val streamUrl = intent.getStringExtra("stream_url") ?: ""
        initializePlayer(streamUrl)
    }

    private fun initializePlayer(url: String) {
        player = ExoPlayer.Builder(this).build()
        playerView.player = player
        val mediaItem = MediaItem.fromUri(url)
        player!!.setMediaItem(mediaItem)
        player!!.prepare()
        player!!.play()
    }

    override fun onStop() {
        super.onStop()
        player?.release()
        player = null
    }
}
EOF

