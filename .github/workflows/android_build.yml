package com.emin.xtream.player

import android.content.Intent
import android.os.Bundle
import android.view.View
import android.widget.*
import androidx.appcompat.app.AlertDialog
import androidx.appcompat.app.AppCompatActivity
import com.google.android.gms.ads.AdView
import com.emin.xtream.player.models.Portal
import com.emin.xtream.player.utils.AdsHelper
import com.emin.xtream.player.utils.Prefs
import com.emin.xtream.player.utils.RemoteLogger
import com.emin.xtream.player.utils.XtreamApi

class LoginActivity : AppCompatActivity() {

    private lateinit var prefs: Prefs
    private var isXtream = true

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_login)
        prefs = Prefs(this)

        if (prefs.getActivePortal() != null) {
            startActivity(Intent(this, ContentActivity::class.java)); finish(); return
        }

        AdsHelper.init(this)
        AdsHelper.loadBanner(findViewById(R.id.adViewLogin))
        AdsHelper.loadInterstitial(this)
        RemoteLogger.send(this, "screen_login")

        val tabXtream = findViewById<View>(R.id.tabXtream)
        val tabM3u    = findViewById<View>(R.id.tabM3u)
        val formX     = findViewById<View>(R.id.formXtream)
        val formM     = findViewById<View>(R.id.formM3u)
        val tvTabX    = findViewById<TextView>(R.id.tvTabXtream)
        val tvTabM    = findViewById<TextView>(R.id.tvTabM3u)
        val btnLogin  = findViewById<Button>(R.id.btnLogin)
        val lvAccs    = findViewById<ListView>(R.id.lvAccounts)

        fun switchTab(xtream: Boolean) {
            isXtream = xtream
            formX.visibility = if (xtream) View.VISIBLE else View.GONE
            formM.visibility = if (xtream) View.GONE else View.VISIBLE
            tabXtream.setBackgroundResource(if (xtream) R.drawable.bg_tab_active else android.R.color.transparent)
            tabM3u.setBackgroundResource(if (!xtream) R.drawable.bg_tab_active else android.R.color.transparent)
            tvTabX.setTextColor(getColor(if (xtream) R.color.white else R.color.text_secondary))
            tvTabM.setTextColor(getColor(if (!xtream) R.color.white else R.color.text_secondary))
            btnLogin.text = if (xtream) "Giriş Yap" else "Listeyi Yükle"
        }
        tabXtream.setOnClickListener { switchTab(true) }
        tabM3u.setOnClickListener    { switchTab(false) }
        switchTab(true)

        fun refreshList() {
            val list = prefs.getPortals()
            val labels = list.map { "${it.name}  (${if (it.type == "M3U") "M3U" else "Xtream"})" }
            lvAccs.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, labels)
            lvAccs.setOnItemClickListener { _, _, pos, _ ->
                prefs.setActivePortal(list[pos].id)
                startActivity(Intent(this, ContentActivity::class.java)); finish()
            }
            lvAccs.setOnItemLongClickListener { _, _, pos, _ ->
                AlertDialog.Builder(this)
                    .setTitle("Portal Sil")
                    .setMessage("\"${list[pos].name}\" silinsin mi?")
                    .setPositiveButton("Sil") { _, _ -> prefs.deletePortal(list[pos].id); refreshList() }
                    .setNegativeButton("İptal", null).show()
                true
            }
        }
        refreshList()

        btnLogin.setOnClickListener {
            if (isXtream) loginXtream() else loginM3u()
        }
    }

    private fun loginXtream() {
        val name = fieldVal(R.id.etXtreamName).ifEmpty { "Portal" }
        var dns  = fieldVal(R.id.etDns)
        val port = fieldVal(R.id.etPort)
        val user = fieldVal(R.id.etUser)
        val pass = fieldVal(R.id.etPass)

        if (dns.isEmpty() || user.isEmpty() || pass.isEmpty()) {
            toast(getString(R.string.error_fill_all)); return
        }
        if (!dns.startsWith("http://") && !dns.startsWith("https://")) dns = "http://$dns"
        dns = dns.trimEnd('/')
        val finalDns = if (port.isNotEmpty()) {
            val proto = if (dns.startsWith("https")) "https" else "http"
            val host  = dns.removePrefix("https://").removePrefix("http://").split(":")[0]
            "$proto://$host:$port"
        } else dns

        val btn = findViewById<Button>(R.id.btnLogin)
        btn.isEnabled = false; btn.text = "Doğrulanıyor…"

        Thread {
            try {
                XtreamApi.auth(finalDns, user, pass)
                val id = prefs.addXtreamPortal(name, finalDns, user, pass)
                RemoteLogger.send(this, "portal_xtream_add", mapOf("name" to name))
                runOnUiThread {
                    prefs.setActivePortal(id)
                    startActivity(Intent(this, ContentActivity::class.java)); finish()
                }
            } catch (e: Exception) {
                runOnUiThread {
                    btn.isEnabled = true; btn.text = "Giriş Yap"
                    AlertDialog.Builder(this)
                        .setTitle(getString(R.string.error_login_failed))
                        .setMessage(e.message ?: "Sunucuya bağlanılamadı")
                        .setPositiveButton("Tamam", null).show()
                }
            }
        }.start()
    }

    private fun loginM3u() {
        val name = fieldVal(R.id.etM3uName).ifEmpty { "M3U" }
        var url  = fieldVal(R.id.etM3u)
        if (url.isEmpty()) { toast(getString(R.string.error_m3u_empty)); return }
        if (!url.startsWith("http")) url = "http://$url"

        val btn = findViewById<Button>(R.id.btnLogin)
        btn.isEnabled = false; btn.text = "Yükleniyor…"

        Thread {
            try {
                val (_, items) = XtreamApi.parseM3u(url)
                if (items.isEmpty()) throw Exception("M3U boş veya geçersiz")
                val id = prefs.addM3uPortal(name, url)
                RemoteLogger.send(this, "portal_m3u_add", mapOf("name" to name, "count" to "${items.size}"))
                runOnUiThread {
                    prefs.setActivePortal(id)
                    startActivity(Intent(this, ContentActivity::class.java)); finish()
                }
            } catch (e: Exception) {
                runOnUiThread {
                    btn.isEnabled = true; btn.text = "Listeyi Yükle"
                    AlertDialog.Builder(this)
                        .setTitle("Yüklenemedi")
                        .setMessage(e.message ?: "M3U yüklenemedi")
                        .setPositiveButton("Tamam", null).show()
                }
            }
        }.start()
    }

    private fun fieldVal(id: Int) = findViewById<EditText>(id).text.toString().trim()
    private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
}
