name: EminXtream Ultra Player v4.0

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: 1. Depo Çekme
      uses: actions/checkout@v4

    - name: 2. Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. EminXtream Ultra Player v4.0 Proje Üretimi
      shell: bash
      run: |
        set -e

        APP_NAME="EminXtream"
        PACKAGE_NAME="com.emin.xtream.player"
        PATH_NAME="com/emin/xtream/player"

        PASS="emin123"
        STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-$PASS}"
        KEY_PASS="${ANDROID_KEY_PASSWORD:-$PASS}"
        KEY_ALIAS="${ANDROID_KEY_ALIAS:-key0}"

        echo "🚀 EminXtream Ultra Player v4.0 üretiliyor..."

        rm -rf "$APP_NAME"

        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/models"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/adapters"
        mkdir -p "$APP_NAME/app/src/main/java/$PATH_NAME/utils"
        mkdir -p "$APP_NAME/app/src/main/res/layout"
        mkdir -p "$APP_NAME/app/src/main/res/values"
        mkdir -p "$APP_NAME/app/src/main/res/values-tr"
        mkdir -p "$APP_NAME/app/src/main/res/drawable"
        mkdir -p "$APP_NAME/app/src/main/res/mipmap-hdpi"
        mkdir -p "$APP_NAME/app/src/main/res/menu"
        mkdir -p "$APP_NAME/app/src/main/res/color"
        mkdir -p "$APP_NAME/app/src/main/res/xml"
        mkdir -p "$APP_NAME/app/src/main/res/anim"
        mkdir -p "$APP_NAME/app/src/main/res/font"

        cd "$APP_NAME"

        # Icon
        wget -q -O app/src/main/res/mipmap-hdpi/ic_launcher.png \
          "https://i.ibb.co/LDdzzhsk/f564b0ed-277d-489c-9a1a-c59f0fe471fc.png" || true

        # ─── Keystore ────────────────────────────────────────────────
        if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          echo "🔐 Keystore secrets'ten yazılıyor..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/keystore.jks || {
            echo "⚠️ base64 decode HATASI – local keystore üretilecek."
            keytool -genkey -v \
              -keystore app/keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Emin, O=EminMedia, C=TR"
          }
        else
          echo "⚠️ ANDROID_KEYSTORE_BASE64 yok — local keystore üretilecek."
          keytool -genkey -v \
            -keystore app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Emin, O=EminMedia, C=TR"
        fi

        # ─── Gradle Yapılandırması ────────────────────────────────────
        echo "include ':app'" > settings.gradle

        rm -f gradle.properties
        printf '%s\n' 'android.useAndroidX=true' >> gradle.properties
        printf '%s\n' 'android.enableJetifier=true' >> gradle.properties
        printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties

        rm -f build.gradle
        printf '%s\n' 'buildscript {' >> build.gradle
        printf '%s\n' '    repositories { google(); mavenCentral() }' >> build.gradle
        printf '%s\n' '    dependencies {' >> build.gradle
        printf '%s\n' '        classpath '\''com.android.tools.build:gradle:8.0.0'\''' >> build.gradle
        printf '%s\n' '        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"' >> build.gradle
        printf '%s\n' '    }' >> build.gradle
        printf '%s\n' '}' >> build.gradle
        printf '%s\n' 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle

        mkdir -p app

        # ─── app/build.gradle ─────────────────────────────────────────
        mkdir -p app
        rm -f app/build.gradle
        printf '%s\n' 'plugins {' >> app/build.gradle
        printf '%s\n' '    id '\''com.android.application'\''' >> app/build.gradle
        printf '%s\n' '    id '\''kotlin-android'\''' >> app/build.gradle
        printf '%s\n' '}' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' 'android {' >> app/build.gradle
        printf "%s\n" "    namespace '$PACKAGE_NAME'" >> app/build.gradle
        printf '%s\n' '    compileSdk 34' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' '    defaultConfig {' >> app/build.gradle
        printf "%s\n" "        applicationId \"$PACKAGE_NAME\"" >> app/build.gradle
        printf '%s\n' '        minSdk 21' >> app/build.gradle
        printf '%s\n' '        targetSdk 35' >> app/build.gradle
        printf '%s\n' '        versionCode 20' >> app/build.gradle
        printf '%s\n' '        versionName "4.0.0"' >> app/build.gradle
        printf '%s\n' '    }' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' '    signingConfigs {' >> app/build.gradle
        printf '%s\n' '        release {' >> app/build.gradle
        printf '%s\n' '            storeFile file("keystore.jks")' >> app/build.gradle
        printf "%s\n" "            storePassword \"$STORE_PASS\"" >> app/build.gradle
        printf "%s\n" "            keyAlias \"$KEY_ALIAS\"" >> app/build.gradle
        printf "%s\n" "            keyPassword \"$KEY_PASS\"" >> app/build.gradle
        printf '%s\n' '        }' >> app/build.gradle
        printf '%s\n' '    }' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' '    buildTypes {' >> app/build.gradle
        printf '%s\n' '        release {' >> app/build.gradle
        printf '%s\n' '            minifyEnabled false' >> app/build.gradle
        printf '%s\n' '            signingConfig signingConfigs.release' >> app/build.gradle
        printf '%s\n' '            proguardFiles getDefaultProguardFile('\''proguard-android-optimize.txt'\'')' >> app/build.gradle
        printf '%s\n' '        }' >> app/build.gradle
        printf '%s\n' '    }' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' '    compileOptions {' >> app/build.gradle
        printf '%s\n' '        sourceCompatibility JavaVersion.VERSION_17' >> app/build.gradle
        printf '%s\n' '        targetCompatibility JavaVersion.VERSION_17' >> app/build.gradle
        printf '%s\n' '    }' >> app/build.gradle
        printf '%s\n' '    kotlinOptions { jvmTarget = '\''17'\'' }' >> app/build.gradle
        printf '%s\n' '}' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' 'dependencies {' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.core:core-ktx:1.12.0'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.appcompat:appcompat:1.6.1'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''com.google.android.material:material:1.11.0'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.recyclerview:recyclerview:1.3.2'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.drawerlayout:drawerlayout:1.2.0'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.leanback:leanback:1.0.0'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.constraintlayout:constraintlayout:2.1.4'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'\''' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' '    // ExoPlayer / Media3' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.media3:media3-exoplayer:1.2.1'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.media3:media3-ui:1.2.1'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.media3:media3-exoplayer-hls:1.2.1'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.media3:media3-exoplayer-dash:1.2.1'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.media3:media3-exoplayer-rtsp:1.2.1'\''' >> app/build.gradle
        printf '%s\n' '    implementation '\''androidx.media3:media3-datasource-okhttp:1.2.1'\''' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' '    // Görsel' >> app/build.gradle
        printf '%s\n' '    implementation '\''com.github.bumptech.glide:glide:4.16.0'\''' >> app/build.gradle
        printf '%s\n' '    annotationProcessor '\''com.github.bumptech.glide:compiler:4.16.0'\''' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' '    // Ağ' >> app/build.gradle
        printf '%s\n' '    implementation '\''com.squareup.okhttp3:okhttp:4.12.0'\''' >> app/build.gradle
        printf '%s\n' '' >> app/build.gradle
        printf '%s\n' '    // AdMob' >> app/build.gradle
        printf '%s\n' '    implementation '\''com.google.android.gms:play-services-ads:23.4.0'\''' >> app/build.gradle
        printf '%s\n' '}' >> app/build.gradle

        # ═══════════════════════════════════════════════════════════════
        # RENK PALETİ  — StreamPort'tan ilham alan koyu-kırmızı tema
        # ═══════════════════════════════════════════════════════════════
        mkdir -p app/src/main/res/values
        rm -f app/src/main/res/values/colors.xml
        printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '<resources>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <!-- Arka Planlar -->' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="bg_dark">#050505</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="bg_paper">#0F0F13</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="bg_card">#16161B</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="bg_card_soft">#1A1A1F</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="bg_glass">#990F0F13</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="drawer_bg">#060609</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <!-- Birincil Renk — Kırmızı (StreamPort teması) -->' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="primary">#E11D48</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="primary_dark">#9F1239</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="primary_glow">#80E11D48</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <!-- Metin -->' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="text_primary">#FFFFFF</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="text_secondary">#A1A1AA</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="text_disabled">#52525B</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="text_hint">#71717A</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <!-- Sınır / Ayırıcı -->' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="border">#1AFFFFFF</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="divider">#0DFFFFFF</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <!-- Durum -->' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="error">#EF4444</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="success">#22C55E</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="warning">#F59E0B</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="live_red">#EF4444</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <!-- Odak (TV Kumanda) -->' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="focus_ring">#E11D48</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="focus_bg">#1AE11D48</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <!-- Seekbar -->' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="seek_progress">#E11D48</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="seek_bg">#3AFFFFFF</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <!-- Diğer -->' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="black">#000000</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="white">#FFFFFF</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="overlay_dark">#CC000000</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="overlay_mid">#80000000</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '    <color name="rating_gold">#F59E0B</color>' >> app/src/main/res/values/colors.xml
        printf '%s\n' '</resources>' >> app/src/main/res/values/colors.xml

        # ─── Stiller ─────────────────────────────────────────────────
        mkdir -p app/src/main/res/values
        rm -f app/src/main/res/values/styles.xml
        printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '<resources>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '    <style name="Theme.EminXtream" parent="Theme.MaterialComponents.DayNight.NoActionBar">' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="android:windowBackground">@color/bg_dark</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="android:textColor">@color/text_primary</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="colorPrimary">@color/primary</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="colorPrimaryDark">@color/primary_dark</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="colorAccent">@color/primary</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="android:statusBarColor">@color/bg_dark</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="android:navigationBarColor">@color/bg_dark</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="android:windowFullscreen">false</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '    </style>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '' >> app/src/main/res/values/styles.xml
        printf '%s\n' '    <style name="Theme.EminXtream.Fullscreen" parent="Theme.EminXtream">' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="android:windowFullscreen">true</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '    </style>' >> app/src/main/res/values/styles.xml
        printf '%s\n' '</resources>' >> app/src/main/res/values/styles.xml

        # ─── Strings ─────────────────────────────────────────────────
