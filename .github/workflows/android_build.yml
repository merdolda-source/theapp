import com.emin.xtream.player.utils.Prefs
import com.emin.xtream.player.utils.RemoteLogger
import com.emin.xtream.player.utils.XtreamApi
import java.text.SimpleDateFormat
import java.util.*

class ContentActivity : AppCompatActivity() {

    private lateinit var prefs: Prefs
    private lateinit var drawer: DrawerLayout

    // UI
    private lateinit var tvTitle: TextView
    private lateinit var etSearch: EditText
    private lateinit var tabLive: TextView
    private lateinit var tabMovies: TextView
    private lateinit var tabSeries: TextView
    private lateinit var llChips: LinearLayout
    private lateinit var pb: ProgressBar
    private lateinit var tvStatus: TextView
    private lateinit var rv: RecyclerView
    private lateinit var tvDrawerPortal: TextView
    private lateinit var tvDrawerExpiry: TextView
    private lateinit var rvPortals: RecyclerView

    private var currentMode = "LIVE"
    private var activePortal: Portal? = null

    private enum class Screen { CATS, ITEMS }
    private var screen = Screen.CATS
    private var selectedCat: Category? = null
    private var allCats: List<Category> = emptyList()
    private var allItems: List<MediaItem> = emptyList()

    private lateinit var adapter: MediaAdapter
    private lateinit var lm: LinearLayoutManager

    // Index haritası
    private data class Row(val realIndex: Int, val isAd: Boolean)
    private var rowMap: List<Row> = emptyList()
    private var filteredCatIds: List<String> = emptyList()
    private var filteredItemIdx: List<Int> = emptyList()
    private val AD_INTERVAL = 8

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_content)
        prefs = Prefs(this)

        activePortal = prefs.getActivePortal()
        if (activePortal == null) { startActivity(Intent(this, LoginActivity::class.java)); finish(); return }

        AdsHelper.init(this)
        AdsHelper.loadBanner(findViewById(R.id.adViewTop))
        AdsHelper.loadBanner(findViewById(R.id.adViewBottom))
        AdsHelper.loadInterstitial(this)

        bindViews()
        setupDrawer()
        setupTabs()
        setupSearch()
        loadMode("LIVE")
    }

    private fun bindViews() {
        drawer        = findViewById(R.id.drawerLayout)
        tvTitle       = findViewById(R.id.tvTitleBar)
        etSearch      = findViewById(R.id.etSearch)
        tabLive       = findViewById(R.id.tabLive)
        tabMovies     = findViewById(R.id.tabMovies)
        tabSeries     = findViewById(R.id.tabSeries)
        llChips       = findViewById(R.id.llChips)
        pb            = findViewById(R.id.pbLoading)
        tvStatus      = findViewById(R.id.tvStatus)
        rv            = findViewById(R.id.rvContent)
        tvDrawerPortal = findViewById(R.id.tvDrawerPortal)
        tvDrawerExpiry = findViewById(R.id.tvDrawerExpiry)
        rvPortals     = findViewById(R.id.rvDrawerPortals)

        lm = LinearLayoutManager(this)
        rv.layoutManager = lm
        adapter = MediaAdapter(emptyList(), emptyList(), emptyList(), emptyList(), emptyList()) { pos -> onItemClick(pos) }
        rv.adapter = adapter

        findViewById<View>(R.id.tvMenuBtn).setOnClickListener { drawer.openDrawer(GravityCompat.START) }
        tvTitle.setOnClickListener {
            if (screen == Screen.ITEMS) showCats() else drawer.openDrawer(GravityCompat.START)
        }
    }

    private fun setupDrawer() {
        tvDrawerPortal.text = "Portal: ${activePortal?.name ?: "—"}"
        tvDrawerExpiry.text = "Süre: —"

        rvPortals.layoutManager = LinearLayoutManager(this)
        val portalAdapter = PortalAdapter(
            prefs.getPortals().toMutableList(),
            activePortal?.id ?: -1,
            onSelect = { p ->
                prefs.setActivePortal(p.id); activePortal = p
                tvDrawerPortal.text = "Portal: ${p.name}"
                drawer.closeDrawer(GravityCompat.START)
                loadMode(currentMode)
            },
            onDelete = { p ->
                AlertDialog.Builder(this)
                    .setTitle("Portal Sil")
                    .setMessage("\"${p.name}\" silinsin mi?")
                    .setPositiveButton("Sil") { _, _ ->
                        prefs.deletePortal(p.id)
                        val next = prefs.getActivePortal()
                        if (next == null) { startActivity(Intent(this, LoginActivity::class.java)); finish() }
                        else { activePortal = next; (rvPortals.adapter as? PortalAdapter)?.update(prefs.getPortals(), next.id) }
                    }
                    .setNegativeButton("İptal", null).show()
            }
        )
        rvPortals.adapter = portalAdapter

        findViewById<View>(R.id.tvDrawerSettings).setOnClickListener {
            drawer.closeDrawer(GravityCompat.START)
            val cur = prefs.getSeekSec()
            val opts = arrayOf("5 sn","10 sn","15 sn","30 sn","60 sn")
            val vals = intArrayOf(5,10,15,30,60)
            val ci = vals.indexOfFirst { it == cur }.coerceAtLeast(0)
            AlertDialog.Builder(this)
                .setTitle("Seek Süresi (şu an: ${cur}sn)")
                .setSingleChoiceItems(opts, ci) { d, w -> prefs.setSeekSec(vals[w]); d.dismiss() }
                .setNegativeButton("İptal", null).show()
        }
        findViewById<View>(R.id.tvDrawerLogout).setOnClickListener {
            AlertDialog.Builder(this)
                .setTitle(getString(R.string.logout))
                .setMessage(getString(R.string.logout_confirm))
                .setPositiveButton("Çıkış Yap") { _, _ ->
                    prefs.clearActivePortal()
                    startActivity(Intent(this, LoginActivity::class.java).apply {
                        addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_NEW_TASK)
                    }); finish()
                }
                .setNegativeButton("İptal", null).show()
        }
    }

    private fun setupTabs() {
        fun activate(tab: String) {
            listOf(tabLive to "LIVE", tabMovies to "VOD", tabSeries to "SERIES").forEach { (tv, mode) ->
                val active = mode == tab
                tv.setBackgroundResource(if (active) R.drawable.bg_tab_active else R.drawable.bg_tab_inactive)
                tv.setTextColor(getColor(if (active) R.color.white else R.color.text_secondary))
            }
        }
        tabLive.setOnClickListener {
            if (activePortal?.type == "M3U" && currentMode == "LIVE") return@setOnClickListener
            activate("LIVE"); loadMode("LIVE")
        }
        tabMovies.setOnClickListener {
            if (activePortal?.type == "M3U") { toast(getString(R.string.m3u_not_available)); return@setOnClickListener }
            activate("VOD"); loadMode("VOD")
        }
        tabSeries.setOnClickListener {
            if (activePortal?.type == "M3U") { toast(getString(R.string.m3u_not_available)); return@setOnClickListener }
            activate("SERIES"); loadMode("SERIES")
        }
    }

    private fun setupSearch() {
        etSearch.addTextChangedListener(object : TextWatcher {
            override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
            override fun afterTextChanged(s: Editable?) {}
            override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {
                val q = s?.toString() ?: ""
                if (q.length > 2 && screen == Screen.CATS && allItems.isNotEmpty()) globalSearch(q)
                else applyFilter(q)
            }
        })
    }

    // ─── Yükleme ─────────────────────────────────────────────────────
    private fun loadMode(mode: String) {
        val portal = activePortal ?: return
        currentMode = mode
        screen = Screen.CATS
        selectedCat = null
        allCats = emptyList(); allItems = emptyList()
        etSearch.setText("")
        llChips.removeAllViews()
        updateTitle()

        setLoading(true)
        Thread {
            try {
                val cats: List<Category>
                val items: List<MediaItem>
                var expiry = "—"

                if (portal.type == "M3U") {
                    val (c, i) = XtreamApi.parseM3u(portal.m3uUrl ?: "")
                    cats = c; items = i
                } else {
                    val srv = portal.server ?: ""; val u = portal.username ?: ""; val p = portal.password ?: ""
                    try {
                        val info = XtreamApi.auth(srv, u, p)
                        val exp = info.optJSONObject("user_info")?.optString("exp_date")
                        expiry = formatExpiry(exp)
                    } catch (_: Exception) {}
                    cats = when (mode) {
                        "VOD"    -> XtreamApi.vodCategories(srv, u, p)
                        "SERIES" -> XtreamApi.seriesCategories(srv, u, p)
                        else     -> XtreamApi.liveCategories(srv, u, p)
                    }
                    items = when (mode) {
                        "VOD"    -> XtreamApi.vodStreams(srv, u, p)
                        "SERIES" -> XtreamApi.seriesList(srv, u, p)
                        else     -> XtreamApi.liveStreams(srv, u, p)
                    }
                }

                val finalExp = expiry
                runOnUiThread {
                    setLoading(false)
                    allCats = cats; allItems = items
                    tvDrawerExpiry.text = "Süre: $finalExp"
                    buildChips(cats)
                    showCats()
                }
            } catch (e: Exception) {
                runOnUiThread { setLoading(false); showError(e.message ?: "Veri alınamadı") }
                RemoteLogger.send(this, "fetch_error", mapOf("mode" to mode, "err" to (e.message ?: "")))
            }
        }.start()
    }

    // ─── Chip kategoriler ─────────────────────────────────────────────
    private fun buildChips(cats: List<Category>) {
        llChips.removeAllViews()
        val allChip = makeChip(getString(R.string.all_categories), null)
        llChips.addView(allChip)
        cats.forEach { llChips.addView(makeChip(it.name, it.id)) }
    }

    private fun makeChip(label: String, catId: String?): TextView {
        val tv = TextView(this)
        tv.text = label
        tv.textSize = 12f
        tv.setTextColor(getColor(R.color.text_secondary))
        tv.isFocusable = true; tv.isClickable = true
        tv.setPadding(28, 0, 28, 0)
        tv.minHeight = 32
        tv.gravity = android.view.Gravity.CENTER
        tv.setBackgroundResource(R.drawable.bg_tab_inactive)
        val lp = LinearLayout.LayoutParams(
            LinearLayout.LayoutParams.WRAP_CONTENT,
            LinearLayout.LayoutParams.MATCH_PARENT)
        lp.marginEnd = 8
        tv.layoutParams = lp
        tv.setOnClickListener {
            if (catId == null) {
                selectedCat = null; showCats()
            } else {
                val cat = allCats.find { it.id == catId } ?: return@setOnClickListener
                selectedCat = cat; screen = Screen.ITEMS; applyFilter(etSearch.text.toString())
                updateTitle()
            }
        }
        return tv
    }

    // ─── Ekranlar ─────────────────────────────────────────────────────
    private fun showCats() {
        screen = Screen.CATS; selectedCat = null; updateTitle()
        applyFilter(etSearch.text?.toString() ?: "")
    }

    private fun applyFilter(q: String) {
        val query = q.trim().lowercase()
        val rows = mutableListOf<Row>()
        val titles = mutableListOf<String>()
        val subs = mutableListOf<String>()
        val thumbs = mutableListOf<String?>()
        val lives = mutableListOf<Boolean>()
        val rats = mutableListOf<Float?>()

        if (screen == Screen.CATS) {
            val filtered = if (query.isEmpty()) allCats
                else allCats.filter { it.name.lowercase().contains(query) }
            filteredCatIds = filtered.map { it.id }
            filtered.forEachIndexed { i, cat ->
                rows.add(Row(i, false))
                titles.add(cat.name)
                subs.add("${allItems.count { it.categoryId == cat.id }} içerik")
                thumbs.add(null); lives.add(false); rats.add(null)
                if ((i + 1) % AD_INTERVAL == 0) {
                    rows.add(Row(-1, true)); titles.add("###AD###")
                    subs.add(""); thumbs.add(null); lives.add(false); rats.add(null)
                }
            }
        } else {
            val catId = selectedCat?.id
            val source = if (catId.isNullOrEmpty()) allItems
                else allItems.filter { it.categoryId == catId }
            val filtered = if (query.isEmpty()) source
                else source.filter { it.name.lowercase().contains(query) }
            filteredItemIdx = filtered.map { allItems.indexOf(it) }
            filtered.forEachIndexed { i, item ->
                rows.add(Row(i, false))
                titles.add(item.name)
                subs.add(if (currentMode == "LIVE") item.epgId?.let { "EPG: $it" } ?: "" else "")
                thumbs.add(item.thumbnailUrl)
                lives.add(currentMode == "LIVE")
                rats.add(item.rating)
                if ((i + 1) % AD_INTERVAL == 0) {
                    rows.add(Row(-1, true)); titles.add("###AD###")
                    subs.add(""); thumbs.add(null); lives.add(false); rats.add(null)
                }
            }
        }

        rowMap = rows
        adapter.update(titles, subs, thumbs, lives, rats)
    }

    private fun globalSearch(q: String) {
        val query = q.trim().lowercase()
        val filtered = allItems.filter { it.name.lowercase().contains(query) }
        filteredItemIdx = filtered.map { allItems.indexOf(it) }
        screen = Screen.ITEMS

        val rows = mutableListOf<Row>(); val titles = mutableListOf<String>()
        val subs = mutableListOf<String>(); val thumbs = mutableListOf<String?>()
        val lives = mutableListOf<Boolean>(); val rats = mutableListOf<Float?>()

        filtered.forEachIndexed { i, item ->
            rows.add(Row(i, false)); titles.add(item.name)
            val catName = allCats.find { it.id == item.categoryId }?.name ?: ""
            subs.add(catName); thumbs.add(item.thumbnailUrl)
            lives.add(currentMode == "LIVE"); rats.add(item.rating)
        }
        rowMap = rows
        adapter.update(titles, subs, thumbs, lives, rats)
        updateTitle()
    }

    // ─── Tıklama ─────────────────────────────────────────────────────
    private fun onItemClick(pos: Int) {
        val row = rowMap.getOrNull(pos) ?: return
        if (row.isAd) return
        val portal = activePortal ?: return

        if (screen == Screen.CATS) {
            val catId = filteredCatIds.getOrNull(row.realIndex) ?: return
            val cat = allCats.find { it.id == catId } ?: return
            selectedCat = cat; screen = Screen.ITEMS
            etSearch.setText("")
            applyFilter(""); updateTitle()
            return
        }

        val globalIdx = filteredItemIdx.getOrNull(row.realIndex) ?: return
        val item = allItems.getOrNull(globalIdx) ?: return

        // Dizi → detay ekranı
        if (currentMode == "SERIES" && !item.seriesId.isNullOrEmpty()) {
            startActivity(Intent(this, SeriesDetailActivity::class.java).apply {
                putExtra("SERIES_ID", item.seriesId)
                putExtra("SERIES_NAME", item.name)
                putExtra("SERVER",   portal.server ?: "")
                putExtra("USERNAME", portal.username ?: "")
                putExtra("PASSWORD", portal.password ?: "")
            }); return
        }

        // Oynat
        val playUrl = buildPlayUrl(item, portal) ?: run {
            toast("Geçersiz URL"); return
        }
        AdsHelper.maybeShow(this) {
            RemoteLogger.send(this, "play", mapOf("mode" to currentMode, "name" to item.name))
            startActivity(Intent(this, PlayerActivity::class.java).apply {
                putExtra("URL",      playUrl)
                putExtra("TITLE",    item.name)
                putExtra("TYPE",     currentMode)
                putExtra("THUMB",    item.thumbnailUrl ?: "")
                putExtra("REF",      item.referer ?: "")
                putExtra("ORIGIN",   item.origin ?: "")
                putExtra("ITEM_ID",  item.streamId ?: "")
            })
        }
    }

    private fun buildPlayUrl(item: MediaItem, portal: Portal): String? {
        if (portal.type == "M3U") return item.streamUrl
        if (!item.streamUrl.isNullOrEmpty()) return item.streamUrl
        val srv  = (portal.server ?: "").trimEnd('/')
        val user = portal.username ?: ""; val pass = portal.password ?: ""
        val id   = item.streamId ?: return null
        return when (currentMode) {
            "LIVE" -> "$srv/live/$user/$pass/$id.ts"
            "VOD"  -> "$srv/movie/$user/$pass/$id.${item.containerExtension ?: "mp4"}"
            else   -> null
        }
    }

    // ─── Yardımcılar ─────────────────────────────────────────────────
    private fun updateTitle() {
        tvTitle.text = when {
            screen == Screen.ITEMS && selectedCat != null ->
                "${modeLabel()} • ${selectedCat!!.name}"
            else -> modeLabel()
        }
    }

    private fun modeLabel() = when (currentMode) {
        "VOD"    -> getString(R.string.tab_movies)
        "SERIES" -> getString(R.string.tab_series)
        else     -> getString(R.string.tab_live)
    }

    private fun setLoading(show: Boolean) {
        pb.visibility = if (show) View.VISIBLE else View.GONE
        if (show) tvStatus.visibility = View.GONE
    }

    private fun showError(msg: String) {
        tvStatus.text = msg; tvStatus.visibility = View.VISIBLE
    }

    private fun formatExpiry(exp: String?): String {
        if (exp.isNullOrEmpty() || exp == "0" || exp == "null") return "Sınırsız"
        return try {
            val d = Date(exp.toLong() * 1000L)
            SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(d)
        } catch (_: Exception) { exp }
    }

    private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

    override fun onBackPressed() {
        when {
            drawer.isDrawerOpen(GravityCompat.START) -> drawer.closeDrawer(GravityCompat.START)
            screen == Screen.ITEMS -> { etSearch.setText(""); showCats() }
            else -> super.onBackPressed()
        }
    }
}
