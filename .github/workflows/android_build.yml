package com.emin.xtream.player.utils

import android.content.Context
import com.emin.xtream.player.models.AccountProfile
import org.json.JSONArray
import org.json.JSONObject

class Prefs(ctx: Context) {
    private val p = ctx.applicationContext.getSharedPreferences("EMIN_XTREAM_PREFS", 0)

    // ===== HESAP YÖNETİMİ =====
    private fun loadArray(): JSONArray {
        return JSONArray(p.getString("accounts_json", "[]") ?: "[]")
    }

    private fun saveArray(arr: JSONArray) {
        p.edit().putString("accounts_json", arr.toString()).apply()
    }

    fun createXtreamAccount(name: String, dns: String, port: String, user: String, pass: String): Int {
        val id = p.getInt("next_id", 1)
        val obj = JSONObject().apply {
            put("id", id); put("name", name); put("type", "XTREAM")
            put("dns", dns); put("port", port)
            put("user", user); put("pass", pass); put("m3u", "")
        }
        val arr = loadArray(); arr.put(obj); saveArray(arr)
        p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
        return id
    }

    fun createM3uAccount(name: String, m3u: String): Int {
        val id = p.getInt("next_id", 1)
        val obj = JSONObject().apply {
            put("id", id); put("name", name); put("type", "M3U")
            put("dns", ""); put("port", ""); put("user", ""); put("pass", ""); put("m3u", m3u)
        }
        val arr = loadArray(); arr.put(obj); saveArray(arr)
        p.edit().putInt("next_id", id + 1).putInt("active_id", id).apply()
        return id
    }

    fun getAccounts(): List<AccountProfile> {
        val arr = loadArray()
        val activeId = p.getInt("active_id", -1)
        return (0 until arr.length()).mapNotNull { i ->
            val o = arr.optJSONObject(i) ?: return@mapNotNull null
            AccountProfile(
                id = o.optInt("id", 0),
                name = o.optString("name", "Hesap"),
                type = o.optString("type", "XTREAM"),
                dns = o.optString("dns").takeIf { it.isNotEmpty() },
                port = o.optString("port").takeIf { it.isNotEmpty() },
                user = o.optString("user").takeIf { it.isNotEmpty() },
                pass = o.optString("pass").takeIf { it.isNotEmpty() },
                m3u = o.optString("m3u").takeIf { it.isNotEmpty() },
                isActive = o.optInt("id", 0) == activeId
            )
        }
    }

    fun deleteAccount(id: Int) {
        val arr = loadArray()
        val newArr = JSONArray()
        for (i in 0 until arr.length()) {
            val o = arr.optJSONObject(i) ?: continue
            if (o.optInt("id", 0) != id) newArr.put(o)
        }
        saveArray(newArr)
        if (p.getInt("active_id", -1) == id) p.edit().putInt("active_id", -1).apply()
    }

    fun setActive(id: Int) { p.edit().putInt("active_id", id).apply() }
    fun clearActive() { p.edit().putInt("active_id", -1).apply() }

    fun getActive(): AccountProfile? {
        val activeId = p.getInt("active_id", -1)
        if (activeId <= 0) return null
        return getAccounts().find { it.id == activeId }
    }

    // DNS'e port ekle
    fun buildBaseUrl(acc: AccountProfile): String {
        val dns = acc.dns?.trim()?.trimEnd('/') ?: return ""
        val port = acc.port?.trim()
        return if (!port.isNullOrEmpty() && !dns.contains(":${port}")) {
            // Port zaten DNS'de yoksa ekle
            val proto = if (dns.startsWith("https")) "https" else "http"
            val host = dns.removePrefix("https://").removePrefix("http://").split(":")[0]
            "$proto://$host:$port"
        } else dns
    }

    // ===== AYARLAR =====
    fun setLastMode(mode: String) { p.edit().putString("last_mode", mode).apply() }
    fun getLastMode(): String = p.getString("last_mode", "LIVE") ?: "LIVE"
    fun setPlayerFitMode(mode: Int) { p.edit().putInt("player_fit", mode).apply() }
    fun getPlayerFitMode(): Int = p.getInt("player_fit", 0)
    fun setSeekSeconds(sec: Int) { p.edit().putInt("seek_seconds", sec).apply() }
    fun getSeekSeconds(): Int = p.getInt("seek_seconds", 15)
    fun setPlayerVolume(vol: Float) { p.edit().putFloat("player_vol", vol).apply() }
    fun getPlayerVolume(): Float = p.getFloat("player_vol", 1.0f)
    fun setDarkMode(dark: Boolean) { p.edit().putBoolean("dark_mode", dark).apply() }
    fun getDarkMode(): Boolean = p.getBoolean("dark_mode", true)
}
