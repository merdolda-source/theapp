name: Build ErdinPlayer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Generate App Full Source
        run: chmod +x generate_app.sh && ./generate_app.sh
        
      - name: Build APK with Gradle
        # gradlew dosyası PROJECT_ROOT (theapp) içinde oluşturulduğu için oraya gitmeliyiz
        working-directory: ./theapp
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-Pro-Signed
          path: theapp/app/build/outputs/apk/release/app-release.apk
