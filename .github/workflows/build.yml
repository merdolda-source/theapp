name: Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # Scripti çalıştır ve dosyaları yarat
      - name: Generate App
        run: chmod +x generate_app.sh && ./generate_app.sh
        
      # Gradle ile APK derle (Stacktrace ile hata detayını gör)
      - name: Build APK
        working-directory: ./theapp
        run: gradle assembleRelease --stacktrace --no-daemon
        
      - uses: actions/upload-artifact@v4
        with:
          name: MerdoldaApp
          path: theapp/app/build/outputs/apk/release/app-release-unsigned.apk
