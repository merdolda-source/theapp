name: Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Generate App
        run: chmod +x generate_app.sh && ./generate_app.sh
        
      - name: Build APK
        working-directory: ./theapp
        run: chmod +x gradlew && ./gradlew assembleRelease
        
      - uses: actions/upload-artifact@v3
        with:
          name: MerdoldaApp
          path: theapp/app/build/outputs/apk/release/app-release-unsigned.apk
