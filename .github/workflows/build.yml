name: Build ErdinPlayer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Generate App Files
        run: chmod +x generate_app.sh && ./generate_app.sh
        
      - name: Build APK with Wrapper
        working-directory: ./theapp
        run: |
          # generate_app.sh içinde oluşturduğumuz gradlew'i kullanıyoruz
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-Final
          path: theapp/app/build/outputs/apk/release/app-release.apk
