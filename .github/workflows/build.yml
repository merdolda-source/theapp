name: Build ErdinPlayer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 8.4 sürümünü sunucuya kuruyoruz (gradlew hatasını çözer)
      - name: Setup Gradle 8.4
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4
          
      - name: Generate Mega Project
        run: chmod +x generate_app.sh && ./generate_app.sh
        
      - name: Build APK
        # Direkt 'gradle' komutunu kullanıyoruz, './gradlew' değil!
        working-directory: ./theapp
        run: gradle assembleRelease --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-Pro
          path: theapp/app/build/outputs/apk/release/app-release.apk
