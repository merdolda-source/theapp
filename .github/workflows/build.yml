name: Build Titan APK (repository_dispatch)

on:
  repository_dispatch:
    types: [build-app-request]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick curl

      # Eğer repo’da gradlew yoksa wrapper üret
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

      - name: Generate Android Project (V6000)
        env:
          PKG:  ${{ github.event.client_payload.package_name }}
          APP:  ${{ github.event.client_payload.app_name }}
          CFG:  ${{ github.event.client_payload.config_url }}
          ICO:  ${{ github.event.client_payload.icon_url }}
          VC:   ${{ github.event.client_payload.version_code }}
          VN:   ${{ github.event.client_payload.version_name }}
        run: |
          chmod +x generate_app.sh
          ./generate_app.sh "$PKG" "$APP" "$CFG" "$ICO" "$VC" "$VN"

      - name: Create keystore (for signing)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # keystore app/build.gradle storeFile file("keystore.jks") dediği için app/ içine koyuyoruz
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            -keypass "$SIGNING_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Titan,O=Titan,L=TR,S=TR,C=TR"

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS:      ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Titan-${{ github.event.client_payload.package_name }}-apk
          path: app/build/outputs/apk/release/app-release.apk

