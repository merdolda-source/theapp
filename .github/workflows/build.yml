name: Build ErdinPlayer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. ÖNCE DOSYALARI OLUŞTUR (Java gerekmez, Bash yeterli)
      - name: Generate App Files
        run: chmod +x generate_app.sh && ./generate_app.sh

      # 2. SONRA JAVA VE CACHE KUR (Artık build.gradle var, hata vermez)
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Dosyaları bulup cache yapacak

      # 3. APK DERLE
      - name: Build APK
        working-directory: ./theapp
        run: gradle clean assembleRelease --stacktrace --no-daemon
        
      # 4. APK YÜKLE
      - uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-APK
          path: theapp/app/build/outputs/apk/release/app-release-unsigned.apk
