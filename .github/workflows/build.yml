name: Build ErdinPlayer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate App Files
        run: chmod +x generate_app.sh && ./generate_app.sh

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build APK
        working-directory: ./theapp
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace --no-daemon
        
      - uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-APK
          # İmzalı olduğu için artık '-unsigned' eki kalktı!
          path: theapp/app/build/outputs/apk/release/app-release.apk
