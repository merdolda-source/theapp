name: Build ErdinPlayer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create Projct Files
        run: chmod +x generate_app.sh && ./generate_app.sh
        
      - name: Build APK with System Gradle
        # gradlew olmadığı için direkt 'gradle' komutunu kullanıyoruz!
        working-directory: ./theapp
        run: gradle assembleRelease --no-daemon
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-Signed-APK
          path: theapp/app/build/outputs/apk/release/app-release.apk
