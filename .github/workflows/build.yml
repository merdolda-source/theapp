name: Build ErdinPlayer

on:
  workflow_dispatch:   # panelden veya GitHub arayüzünden tetikleme

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Generate Android Project
        run: |
          chmod +x generate_app.sh
          ./generate_app.sh

      - name: Build APK
        working-directory: ./theapp
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-Pro
          path: theapp/app/build/outputs/apk/release/app-release.apk
