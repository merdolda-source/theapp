name: Build ERDINXTREAM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 1) Repo root'taki SH çalışsın (proje burada üretilecek)
      - name: Run generator (repo root)
        run: |
          chmod +x ./generate_app.sh
          ./generate_app.sh

      # 2) Üretilen klasör gerçekten oluştu mu?
      - name: Check generated project
        run: |
          ls -la
          test -d "./theapp" || (echo "❌ theapp klasörü oluşmadı!" && exit 1)
          test -f "./theapp/gradlew" || (echo "❌ gradlew yok! generator gradle wrapper üretmiyor." && exit 1)
          test -f "./theapp/app/build.gradle" || (echo "❌ app modülü yok! generator app/ üretmiyor." && exit 1)

      # 3) Build (theapp içinden)
      - name: Build Release APK
        run: |
          chmod +x ./theapp/gradlew
          ./theapp/gradlew -p ./theapp :app:assembleRelease --no-daemon

      # 4) Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: theapp/app/build/outputs/apk/release/*.apk
