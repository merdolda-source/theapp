name: Build ErdinPlayer

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Android Project
        run: |
          chmod +x ./generate_app.sh
          ./generate_app.sh

      - name: Verify generated project
        run: |
          ls -ლა
          test -d "./theapp" || (echo "❌ theapp klasörü oluşmadı" && exit 1)
          test -f "./theapp/gradlew" || (echo "❌ theapp/gradlew yok" && exit 1)
          test -f "./theapp/app/build.gradle" || (echo "❌ theapp/app/build.gradle yok" && exit 1)

      - name: Build APK (Release)
        run: |
          chmod +x ./theapp/gradlew
          ./theapp/gradlew -p ./theapp :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ErdinPlayer-Pro
          path: theapp/app/build/outputs/apk/release/*.apk
