name: Build XTREAM Player APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Uygulama Adı'
        required: true
        default: 'XTREAM Player'
        type: string
      package_name:
        description: 'Paket Adı (com.example.app)'
        required: true
        default: 'com.example.xtrreamplayer'
        type: string
      app_icon_url:
        description: 'Uygulama İkon URL (PNG)'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Versiyon Kodu (Sayı)'
        required: true
        default: '1'
        type: string
      version_name:
        description: 'Versiyon Adı (1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      admob_app_id:
        description: 'AdMob Uygulama ID'
        required: false
        default: 'ca-app-pub-3940256099942544~3347511713'
        type: string
      banner_ad_unit_id:
        description: 'Banner Reklam Unit ID'
        required: false
        default: 'ca-app-pub-3940256099942544/6300978111'
        type: string
      interstitial_ad_unit_id:
        description: 'Interstitial Reklam Unit ID'
        required: false
        default: 'ca-app-pub-3940256099942544/1033173712'
        type: string
      ad_frequency:
        description: 'Reklam Gösterim Sıklığı'
        required: false
        default: '3'
        type: choice
        options:
        - '1'
        - '2'
        - '3'
        - '5'

jobs:
  build:
    name: 🚀 Build XTREAM Player APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: ☕ Setup JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools: 33.0.2
        
    - name: 📦 Install ImageMagick (Icon Processing)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick wget curl
        echo "ImageMagick installed successfully"
        
    - name: 🔧 Make Build Script Executable
      run: |
        chmod +x ./build.sh
        ls -la build.sh
        
    - name: 📝 Show Build Parameters
      run: |
        echo "🏗️ Building with parameters:"
        echo "App Name: ${{ github.event.inputs.app_name }}"
        echo "Package: ${{ github.event.inputs.package_name }}"
        echo "Version: ${{ github.event.inputs.version_name }} (Code: ${{ github.event.inputs.version_code }})"
        echo "AdMob App ID: ${{ github.event.inputs.admob_app_id }}"
        echo "Banner Ad ID: ${{ github.event.inputs.banner_ad_unit_id }}"
        echo "Interstitial Ad ID: ${{ github.event.inputs.interstitial_ad_unit_id }}"
        echo "Ad Frequency: ${{ github.event.inputs.ad_frequency }}"
        echo "Icon URL: ${{ github.event.inputs.app_icon_url }}"

    - name: 🏗️ Run Build Script
      run: |
        ./build.sh \
          "${{ github.event.inputs.app_name }}" \
          "${{ github.event.inputs.package_name }}" \
          "${{ github.event.inputs.app_icon_url }}" \
          "${{ github.event.inputs.version_code }}" \
          "${{ github.event.inputs.version_name }}" \
          "${{ github.event.inputs.admob_app_id }}" \
          "${{ github.event.inputs.banner_ad_unit_id }}" \
          "${{ github.event.inputs.interstitial_ad_unit_id }}" \
          "${{ github.event.inputs.ad_frequency }}"
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        
    - name: 🎯 Locate Generated APK
      id: locate_apk
      run: |
        echo "Looking for generated APK files..."
        find . -name "*.apk" -type f
        
        # Ana APK dosyasını bul
        APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
        if [ -z "$APK_PATH" ]; then
          APK_PATH=$(find . -name "*.apk" | head -1)
        fi
        
        if [ -n "$APK_PATH" ]; then
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          # APK info
          ls -lh "$APK_PATH"
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "APK Size: $APK_SIZE"
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          
          # APK'yı daha iyi isimle kopyala
          NEW_NAME="${{ github.event.inputs.app_name// /_}}_v${{ github.event.inputs.version_name }}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "renamed_apk=$NEW_NAME" >> $GITHUB_OUTPUT
        else
          echo "❌ No APK found!"
          exit 1
        fi

    - name: 📦 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.app_name }}_v${{ github.event.inputs.version_name }}
        path: |
          ${{ steps.locate_apk.outputs.renamed_apk }}
          ${{ steps.locate_apk.outputs.apk_path }}
        if-no-files-found: error
        retention-days: 30

    - name: 📋 Create Release Summary
      run: |
        echo "## 🎉 Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 App Details:" >> $GITHUB_STEP_SUMMARY
        echo "- **App Name:** ${{ github.event.inputs.app_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Package:** \`${{ github.event.inputs.package_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** ${{ github.event.inputs.version_name }} (Code: ${{ github.event.inputs.version_code }})" >> $GITHUB_STEP_SUMMARY
        echo "- **APK Size:** ${{ steps.locate_apk.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 💰 Ad Configuration:" >> $GITHUB_STEP_SUMMARY
        echo "- **AdMob App ID:** \`${{ github.event.inputs.admob_app_id }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Banner Ad ID:** \`${{ github.event.inputs.banner_ad_unit_id }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Interstitial Ad ID:** \`${{ github.event.inputs.interstitial_ad_unit_id }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Ad Frequency:** Every ${{ github.event.inputs.ad_frequency }} screen transitions" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download:" >> $GITHUB_STEP_SUMMARY
        echo "APK dosyasını **Artifacts** bölümünden indirebilirsiniz." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Build completed at $(date)*" >> $GITHUB_STEP_SUMMARY

    - name: 🚨 Notify on Failure
      if: failure()
      run: |
        echo "## ❌ Build Failed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Build işlemi başarısız oldu. Lütfen logları kontrol edin." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Olası Sebepler:" >> $GITHUB_STEP_SUMMARY
        echo "- Paket adı formatı yanlış (örn: com.company.appname)" >> $GITHUB_STEP_SUMMARY
        echo "- Reklam ID'leri geçersiz" >> $GITHUB_STEP_SUMMARY
        echo "- İkon URL'si erişilebilir değil" >> $GITHUB_STEP_SUMMARY
        echo "- Gradle build hatası" >> $GITHUB_STEP_SUMMARY

  # İsteğe bağlı: Build sonrası bildirim işi
  notify:
    name: 📢 Send Notification
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📱 Build Success Notification
      if: needs.build.result == 'success'
      run: |
        echo "✅ APK Build başarıyla tamamlandı!"
        echo "Uygulama: ${{ github.event.inputs.app_name }}"
        echo "Versiyon: ${{ github.event.inputs.version_name }}"
        
    - name: ❌ Build Failure Notification  
      if: needs.build.result == 'failure'
      run: |
        echo "❌ APK Build başarısız oldu!"
        echo "Hata detayları için build loglarını kontrol edin."

# Workflow için environment variables
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
  ANDROID_COMPILE_SDK: "33"
  ANDROID_BUILD_TOOLS: "33.0.2"
  ANDROID_SDK_TOOLS: "8512546"
