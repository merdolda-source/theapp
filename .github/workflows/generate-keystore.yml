name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest

    steps:
      - name: Keystore üret ve Base64 yazdır
        run: |
          set -e

          mkdir -p keystore

          # 🔐 Keystore bilgileri (istersen şifreyi değiştirirsin)
          STORE_PASS="Erdin123!"
          KEY_ALIAS="erdin_alias"
          KEY_PASS="Erdin123!"

          echo "🔐 Keystore üretiliyor..."
          keytool -genkeypair -v \
            -keystore keystore/erdin-upload.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Erdin, O=ErdinMedia, C=TR"

          echo ""
          echo "================= BİLGİ ================="
          echo "ALIAS         : $KEY_ALIAS"
          echo "STORE_PASS    : $STORE_PASS"
          echo "KEY_PASS      : $KEY_PASS"
          echo "=========================================="
          echo ""
          echo "ŞİMDİ BASE64 ÇIKIYOR (BAŞTAN SONA KOPYALA):"
          echo "============= BASE64_START ============="
          base64 -w0 keystore/erdin-upload.jks
          echo ""
          echo "============= BASE64_END ============="
