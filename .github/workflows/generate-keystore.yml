name: Generate Android Upload Key

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest

    steps:
      - name: Keystore üret ve Base64 çıktı ver
        run: |
          set -e

          # Şifreler her çalıştırmada rastgele üretilir; sabit/zayıf bir parola repoda tutulmaz.
          STORE_PASS="$(openssl rand -base64 24)"
          KEY_ALIAS="erdin_alias"
          KEY_PASS="$(openssl rand -base64 24)"

          # GitHub Actions log maskeleme: bu değerler ham logda *** olarak görünür.
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          mkdir -p keystore

          echo "🔐 Keystore üretiliyor..."
          keytool -genkeypair -v \
            -keystore keystore/erdin-upload.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Erdin, O=ErdinMedia, C=TR"

          echo ""
          echo "================= İMZA BİLGİLERİ ================="
          echo "ALIAS       : $KEY_ALIAS"
          echo "STORE_PASS  : $STORE_PASS"
          echo "KEY_PASS    : $KEY_PASS"
          echo "==================================================="
          echo ""
          echo "AŞAĞIDAKİ BASE64 BLOĞUNU TAMAMEN KOPYALA (START ve END arası):"
          echo "============= BASE64_START ============="
          base64 -w0 keystore/erdin-upload.jks
          echo ""
          echo "============= BASE64_END ============="
